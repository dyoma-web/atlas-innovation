ital Public Infrastructure (DPI) principles that emphasize clarity, transparency, inclusion and trust. Its interoperable architecture enables integration with existing government systems and registries, ensuring institutional ownership and accountability.\nThrough this model, Chat Nation functions as a bridge between public institutions and the people they serve, enabling public communication that supports effective policy delivery\"","es":"Chat Nation reinventa la comunicación pública al permitir que los gobiernos se relacionen con la ciudadanía mediante interacciones conversacionales sencillas en canales de mensajería de uso masivo como WhatsApp y USSD. La iniciativa transforma políticas públicas complejas, procedimientos administrativos y requisitos de servicios en conversaciones bidireccionales simplificadas y accesibles, que las personas pueden comprender y sobre las cuales pueden actuar, sin necesidad de teléfonos inteligentes, portales con alto consumo de datos o alfabetización digital.\nEl objetivo central de Chat Nation es fortalecer la inclusión, la confianza y la participación en la prestación de servicios públicos, encontrando a las personas donde ya están y comunicándose de maneras que reflejen sus realidades cotidianas. Al convertir el lenguaje técnico gubernamental en orientaciones claras y conversacionales, la iniciativa reduce la fricción entre la ciudadanía y las instituciones, al tiempo que mejora el cumplimiento, el acceso y la capacidad de respuesta.\nChat Nation se dirige principalmente a poblaciones que suelen quedar excluidas de los sistemas digitales gubernamentales tradicionales, incluidos los trabajadores del sector informal, las pequeñas empresas, las mujeres, la juventud, las comunidades rurales y los usuarios con baja conectividad. Al mismo tiempo, apoya a las instituciones públicas, como las administraciones tributarias y los equipos gubernamentales de servicios digitales, proporcionando una interfaz escalable e interoperable que complementa los sistemas existentes en lugar de reemplazarlos.\nLa iniciativa se desarrolló en 2024 en respuesta a las brechas persistentes observadas en la comunicación pública y el acceso a los servicios, particularmente en contextos donde la transformación digital se ha apoyado en gran medida en portales y formularios que, de manera involuntaria, excluyen a amplios segmentos de la sociedad. Desde su desarrollo, Chat Nation se ha desplegado en colaboración con autoridades públicas y socios del ecosistema para apoyar la implementación de políticas en áreas como el registro, el cumplimiento y el acceso a servicios públicos.\nEntre los actores clave figuran las instituciones públicas responsables de la implementación de políticas, los equipos de tecnología y gobierno digital, la sociedad civil y los socios de innovación, así como los usuarios finales que interactúan directamente con la plataforma a través de los canales de mensajería. La iniciativa está diseñada para alinearse con las estrategias nacionales de transformación digital y con los principios de la Infraestructura Pública Digital (DPI), garantizando la interoperabilidad, la apropiación institucional, la protección de datos y la sostenibilidad.\nLo que hace innovadora a Chat Nation es su giro desde una comunicación pública basada en la difusión unidireccional hacia un involucramiento impulsado por el diálogo a gran escala. En lugar de exigir a la ciudadanía navegar por sistemas complejos, el sistema escucha, responde y guía a los usuarios paso a paso en tiempo real. Al combinar el diseño centrado en las personas, las interfaces conversacionales y la tecnología de bajo ancho de banda, Chat Nation demuestra cómo la comunicación pública puede volverse más inclusiva, ética y eficaz, fortaleciendo la gobernanza y asegurando que nadie se quede atrás.\nChat Nation es una organización de innovación social que trabaja en estrecha alianza con instituciones públicas para fortalecer la forma en que los gobiernos se comunican con la ciudadanía y le prestan servicios. La iniciativa está directamente vinculada a la implementación de políticas públicas, al traducir requisitos legales, procedimientos administrativos y obligaciones de servicio público en interacciones conversacionales bidireccionales y accesibles, entregadas a través de canales de mensajería de uso masivo como WhatsApp y USSD.\nLa plataforma se despliega en colaboración con autoridades públicas, incluidas administraciones tributarias y equipos gubernamentales de servicios digitales, para apoyar la ejecución de políticas nacionales relacionadas con la tributación, el registro, el cumplimiento y el acceso a servicios públicos. Al incorporar las normas públicas, las orientaciones y la lógica de los servicios en flujos conversacionales, Chat Nation operacionaliza las políticas de maneras comprensibles, inclusivas y accionables para la ciudadanía, particularmente para quienes se encuentran en contextos informales, de baja conectividad o desatendidos.\nChat Nation se alinea con las estrategias gubernamentales de transformación digital y con los principios de la Infraestructura Pública Digital (DPI), que enfatizan la claridad, la transparencia, la inclusión y la confianza. Su arquitectura interoperable permite la integración con los sistemas y registros gubernamentales existentes, garantizando la apropiación y la rendición de cuentas institucionales.\nA través de este modelo, Chat Nation funciona como un puente entre las instituciones públicas y las personas a las que sirven, posibilitando una comunicación pública que respalda la implementación eficaz de las políticas."},"links":["https://chatnation.co.ke/"],"hasPhotos":true,"drive":"Check to see if both photos can be uploaded: https://drive.google.com/file/d/1HDIUEh8B3KegeN31CLkt2jNMNo1nalul/view?usp=sharing ,  https://drive.google.com/file/d/17p6zH4rKpnNYgJkX-n-BdAruTdRPqZLS/view?usp=sharing","prod":{"material":"PARCIAL","files":"• 1736410224986.jpg — 3 KB · 200x200 px · Resolución MUY BAJA (avatar/miniatura)","pieces":"1) 1736410224986.jpg — SOLO como avatar/logo pequeño; NO sirve como imagen principal (200x200 px).","gap":"Según hoja de contactos se usaron screenshots (el sitio no funciona). Sugerencia: usar 2 de esos screenshots de la plataforma de mensajería como piezas principales."}},{"id":"c009","tier":"Spotlight","category":"Clarity in Action","categorySource":"official","iso":"NL","lang":"English","region":{"en":"Europe","es":"Europa"},"country":{"en":"Netherlands","es":"Países Bajos"},"type":{"en":"University or research centre","es":"Universidad o centro de investigación"},"name":"ECoVR","org":"University of Amsterdam, ASCoR","desc":{"en":"ECoVR is an immersive virtual reality environmental education application developed by the University of Amsterdam, funded by the Dutch Research Council. Targeting high school students aged 15–18, the VR experience makes climate change, biodiversity loss, and environmental impacts tangible through interactive scenarios where students' food choices visibly alter virtual ecosystems. A randomized longitudinal study with 226 students across nine schools found that VR participants showed significantly higher environmental knowledge scores—sustained gains one week after the intervention—and made more climate-friendly food choices compared to controls. ECoVR demonstrates how immersive technology can be a powerful public communication medium for translating abstract environmental challenges into personally meaningful understanding.","es":"ECoVR es una aplicación inmersiva de realidad virtual para la educación ambiental, desarrollada por la Universidad de Ámsterdam y financiada por el Consejo de Investigación de los Países Bajos. Dirigida a estudiantes de secundaria de 15 a 18 años, la experiencia de VR hace tangibles el cambio climático, la pérdida de biodiversidad y los impactos ambientales mediante escenarios interactivos en los que las elecciones alimentarias de los estudiantes alteran visiblemente ecosistemas virtuales. Un estudio longitudinal aleatorizado con 226 estudiantes de nueve escuelas encontró que los participantes en VR obtuvieron puntajes significativamente más altos de conocimiento ambiental —con avances sostenidos una semana después de la intervención— y tomaron decisiones alimentarias más favorables al clima en comparación con los grupos de control. ECoVR demuestra cómo la tecnología inmersiva puede ser un poderoso medio de comunicación pública para traducir desafíos ambientales abstractos en una comprensión personalmente significativa."},"details":{"en":"ECoVR is an innovative virtual reality (VR) application designed to engage high school students in environmental education and pro-environmental behavior. Developed between 2023-2025 by ECoLab and the Visualisation Lab at the University of Amsterdam, and funded by the Dutch Research Council (NWO), the initiative targets students in upper secondary education (ages 15-18) and aims to increase knowledge about climate change, biodiversity loss, and the environmental impact of food choices, while also stimulating sustainable actions. Through an immersive VR experience, students learn how individual decisions affect the environment.\nThe experience has three core components: (1) a lecture delivered by a scientist avatar within a lush digital rainforest and other ecosystems, presenting complex environmental concepts in an accessible, engaging manner; (2) an interactive choice game in which students’ food decisions dynamically alter the virtual environment—unsustainable choices degrade the ecosystem, while sustainable choices restore it; and (3) actionable guidance on environmentally friendly behaviors, emphasizing achievable steps such as reducing meat portions or engaging peers in sustainability discussions.\nECoVR was developed by an interdisciplinary team combining expertise in environmental communication and educational design (ECoLab) and immersive technologies (Visualisation Lab). In close collaboration with high schools and teachers, we validated the experience to ensure the content fit students’ everyday world, aligning with their interests, language, and level of understanding.\nThe innovative character of the experience lies in the experiential logic it implements. Through the deliberate combination of immersion, interactivity, and behavioral guidance, the experience reduces psychological distance to climate change, makes the causal impact of individual food choices immediately perceptible, and facilitates the translation of experiential insight into concrete, achievable actions. This approach moves beyond traditional classroom teaching, where concepts remain abstract and distant, by enabling students to “experience” the consequences of their choices within a dynamic, multi-sensory environment.\nECoVR follows the tangibility-proximity-action framework, which functions as a transferable design principle for sustainability communication beyond this specific VR application, where consequences are first rendered tangible (via interactive game feedback), then connected to users’ immediate contexts (immersive VR ecosystems), and finally linked to actionable alternatives (sustainable behaviors). As a concrete instantiation of this framework, ECoVR demonstrates how immersive, classroom-ready technologies can enhance understanding, engagement, and motivation to act. By offering schools a scalable, ready-to-use tool, it exemplifies the next frontier in sustainability education. \"ECoVR is directly connected to Dutch public education and environmental policy goals, particularly the integration of sustainability education in secondary schools. The initiative supports the implementation of educational programs aligned with national curricula on climate literacy, responsible consumption, and environmental awareness. By targeting high school students—future citizens whose behaviors and attitudes are still forming—ECoVR contributes to public objectives of fostering informed, responsible, and active participation in sustainability initiatives.\nFurthermore, ECoVR aligns with broader policy frameworks, including the UN Sustainable Development Goals (SDG 12: Responsible Consumption and Production, and SDG 13: Climate Action), translating abstract policy priorities into actionable experiences for adolescents. The project has engaged schools as institutional partners and collaborated with educators and educational authorities to ensure the VR experience complements existing teaching practices, reinforcing public commitments to youth engagement and environmental education.\n\"","es":"ECoVR es una innovadora aplicación de realidad virtual (VR) diseñada para involucrar a estudiantes de secundaria en la educación ambiental y el comportamiento proambiental. Desarrollada entre 2023 y 2025 por ECoLab y el Visualisation Lab de la Universidad de Ámsterdam, y financiada por el Consejo de Investigación de los Países Bajos (NWO), la iniciativa está dirigida a estudiantes de educación secundaria superior (de 15 a 18 años) y busca aumentar el conocimiento sobre el cambio climático, la pérdida de biodiversidad y el impacto ambiental de las elecciones alimentarias, al tiempo que estimula acciones sostenibles. A través de una experiencia inmersiva de VR, los estudiantes aprenden cómo las decisiones individuales afectan al medio ambiente.\nLa experiencia tiene tres componentes centrales: (1) una clase impartida por el avatar de un científico dentro de una exuberante selva tropical digital y otros ecosistemas, que presenta conceptos ambientales complejos de manera accesible y atractiva; (2) un juego interactivo de elecciones en el que las decisiones alimentarias de los estudiantes alteran dinámicamente el entorno virtual: las elecciones no sostenibles degradan el ecosistema, mientras que las sostenibles lo restauran; y (3) orientaciones prácticas sobre comportamientos amigables con el medio ambiente, con énfasis en pasos alcanzables como reducir las porciones de carne o involucrar a los pares en conversaciones sobre sostenibilidad.\nECoVR fue desarrollada por un equipo interdisciplinario que combina experiencia en comunicación ambiental y diseño educativo (ECoLab) y en tecnologías inmersivas (Visualisation Lab). En estrecha colaboración con escuelas secundarias y docentes, validamos la experiencia para asegurar que el contenido se ajustara al mundo cotidiano de los estudiantes, en sintonía con sus intereses, su lenguaje y su nivel de comprensión.\nEl carácter innovador de la experiencia radica en la lógica experiencial que implementa. Mediante la combinación deliberada de inmersión, interactividad y orientación conductual, la experiencia reduce la distancia psicológica frente al cambio climático, hace inmediatamente perceptible el impacto causal de las elecciones alimentarias individuales y facilita la traducción de la comprensión vivencial en acciones concretas y alcanzables. Este enfoque va más allá de la enseñanza tradicional en el aula, donde los conceptos permanecen abstractos y distantes, al permitir que los estudiantes \"experimenten\" las consecuencias de sus decisiones dentro de un entorno dinámico y multisensorial.\nECoVR sigue el marco de tangibilidad-proximidad-acción, que funciona como un principio de diseño transferible para la comunicación en sostenibilidad más allá de esta aplicación específica de VR, en el cual las consecuencias primero se hacen tangibles (mediante la retroalimentación interactiva del juego), luego se conectan con los contextos inmediatos de los usuarios (ecosistemas inmersivos de VR) y, finalmente, se vinculan con alternativas accionables (comportamientos sostenibles). Como concreción de este marco, ECoVR demuestra cómo las tecnologías inmersivas y listas para el aula pueden potenciar la comprensión, el involucramiento y la motivación para actuar. Al ofrecer a las escuelas una herramienta escalable y lista para usar, ejemplifica la próxima frontera de la educación en sostenibilidad. ECoVR está directamente conectada con la educación pública neerlandesa y con los objetivos de la política ambiental, en particular la integración de la educación en sostenibilidad en las escuelas secundarias. La iniciativa apoya la implementación de programas educativos alineados con los currículos nacionales sobre alfabetización climática, consumo responsable y conciencia ambiental. Al dirigirse a estudiantes de secundaria —futuros ciudadanos cuyos comportamientos y actitudes aún se están formando—, ECoVR contribuye a los objetivos públicos de fomentar una participación informada, responsable y activa en las iniciativas de sostenibilidad.\nAsimismo, ECoVR se alinea con marcos de política más amplios, incluidos los Objetivos de Desarrollo Sostenible de las Naciones Unidas (ODS 12: Producción y Consumo Responsables, y ODS 13: Acción por el Clima), traduciendo prioridades de política abstractas en experiencias accionables para adolescentes. El proyecto ha involucrado a las escuelas como socias institucionales y ha colaborado con docentes y autoridades educativas para asegurar que la experiencia de VR complemente las prácticas de enseñanza existentes, reforzando los compromisos públicos con la participación juvenil y la educación ambiental."},"links":["https://www.environmentalcommunicationlab.nl/ecovr/"],"hasPhotos":true,"drive":"Check to see if both photos can be uploaded: https://drive.google.com/drive/folders/17pduGpp27W9NJYkuh2c1_BZgd2cC4Zzp?usp=sharing","prod":{"material":"NO","files":"CARPETA VACÍA — no llegó ningún archivo","pieces":"Ninguno por ahora.","gap":"Carpeta vacía. Sugerencia: capturas del entorno VR desde environmentalcommunicationlab.nl/ecovr (imagen del headset en uso + captura del entorno virtual); el contacto ya respondió."}},{"id":"c010","tier":"Spotlight","category":"Exploring New Frontiers","categorySource":"official","iso":"VN","lang":"English","region":{"en":"Asia & the Pacific","es":"Asia y el Pacífico"},"country":{"en":"Viet Nam","es":"Vietnam"},"type":{"en":"Media","es":"Medio de comunicación"},"name":"\"Not Alone\" - Anti-Cyber-Kidnaping Campaign","org":"The Metub Company (VN)","desc":{"en":"The 'Not Alone' (Khong Mot Minh) campaign is a Vietnam-wide anti-cybercrime initiative by the Digital Trust Alliance and the Cyber Security Department (A05), distributed via METUB Network's 5,000+ creator network. Responding to a surge in sophisticated online kidnapping and coercive manipulation scams targeting university students, the campaign used youth-friendly digital formats—music, video, influencer content—to reach Generation Z where administrative warnings had failed. The campaign generated over 1.5 billion views, reaching more than 40 million citizens—nearly 40% of Vietnam's population. Hashtags consistently ranked among national trending topics, demonstrating a creator-led, youth-centered model for public safety communication in digital-native populations.","es":"La campaña 'Khong Mot Minh' (No Estás Solo) es una iniciativa contra el cibercrimen de alcance nacional en Vietnam, impulsada por la Digital Trust Alliance y el Departamento de Ciberseguridad (A05), y difundida a través de la red de más de 5.000 creadores de METUB Network. En respuesta al aumento de sofisticadas estafas en línea de secuestro virtual y manipulación coercitiva dirigidas a estudiantes universitarios, la campaña empleó formatos digitales cercanos a la juventud —música, video, contenido de influencers— para llegar a la Generación Z allí donde las advertencias administrativas habían fracasado. La campaña generó más de 1.500 millones de visualizaciones y alcanzó a más de 40 millones de ciudadanos, casi el 40% de la población de Vietnam. Sus hashtags se ubicaron de manera constante entre las tendencias nacionales, demostrando un modelo de comunicación en seguridad pública liderado por creadores y centrado en la juventud para poblaciones nativas digitales."},"details":{"en":"\"Summary of the Initiative\n1. Urgent Context\nIn 2024, Viet Nam faced a rapidly escalating yet largely invisible wave of cybercrime, with estimated economic losses reaching VND 18.9 trillion nationwide. By 2025, this threat evolved into more psychologically sophisticated forms, commonly referred to as “online kidnapping” and coercive manipulation, disproportionately targeting university students aged 18–22 living away from home.\nIn this context, conventional top-down public communication—often framed as administrative warnings—proved increasingly ineffective in reaching Generation Z. Addressing these risks required a fundamentally different model of public engagement, capable of resonating with young people’s lived digital realities and rebuilding trust in public safety messaging.\n2. The Initiative and Partnership Model\nThe “Khong Mot Minh” (Not Alone) campaign was initiated by the Digital Trust Alliance (DTA) and the Cyber Security and High-Tech Crime Prevention Department (A05), Ministry of Public Security, with institutional support from UNODC and UNICEF. METUB Network joined as the Official Social Communication Partner, responsible for translating legal and policy-based messages into culturally relevant formats and mobilizing social resources to amplify outreach.\nThe initiative aimed to build a multi-layered digital protection framework for approximately 12 million young people by strengthening awareness, resilience, and self-protection skills in the online environment.\n3. Innovation Lens: Why This Initiative Is Transformative\nThe campaign marked a deliberate shift from one-way information dissemination to a participatory communication ecosystem, anchored in three mutually reinforcing pillars:\na. Policy Translation – Clarity in Action: METUB translated complex law enforcement warnings into popular culture formats, embedding digital safety principles into the campaign’s theme song “Clicking”, short scenario-based videos, and TikTok dance challenges, transforming regulatory knowledge into accessible and shareable content.\nb. Youth Inclusion and Empowerment: Rather than positioning young people as passive victims, the campaign empowered them as active contributors, with thousands of students creating original content, artwork, and personal stories, strengthening ownership, dignity, and trust.\nc. Proactive Digital Prevention: Through edutainment-based learning, the initiative delivered a “digital vaccine,” enabling young people to recognize manipulation and fraud before harm occurs, shifting the focus from reactive enforcement to active prevention.\nBeyond its national scope, “Khong Mot Minh” also served as a flagship satellite initiative welcoming the signing of the United Nations Convention against Cybercrime (“Hanoi Convention”), reaffirming Viet Nam’s commitment to global digital governance and child protection.\nConnection with Public Institutions and Public Policy\nThis initiative represents a practical and scalable model of Public–Private Partnership designed to bridge the gap between public institutions and digital citizens.\n1. Public Sector Leadership\nThe Cyber Security and High-Tech Crime Prevention Department (A05), Ministry of Public Security, provided technical leadership, legal authority, and policy alignment, ensuring institutional legitimacy and consistency with national cybersecurity priorities.\n2. METUB’s Role as a Trust Catalyst\nBeyond execution, METUB functioned as a trust catalyst. Leveraging its network of over 5,000 content creators, METUB translated public policies into relatable, dialogue-driven interactions. This approach helped soften the perceived distance between law enforcement agencies and young citizens, repositioning A05 from a distant regulator to a credible and approachable protector in the digital space.\n3. Policy Alignment and Global Relevance\nThe campaign directly operationalized Viet Nam’s National Cybersecurity Strategy while simultaneously supporting high-level diplomatic objectives associated with the signing of the UN Convention on Cybercrime in October 2025. The screening of the campaign’s summary video at an official United Nations session demonstrated the role of the private sector as an essential partner in addressing global governance challenges.\n\"","es":"Resumen de la iniciativa\n1. Contexto urgente\nEn 2024, Vietnam enfrentó una ola de cibercrimen en rápida escalada y en gran medida invisible, con pérdidas económicas estimadas en 18,9 billones de VND a nivel nacional. Para 2025, esta amenaza evolucionó hacia formas psicológicamente más sofisticadas, comúnmente denominadas \"secuestro en línea\" y manipulación coercitiva, dirigidas de manera desproporcionada a estudiantes universitarios de 18 a 22 años que viven lejos de su hogar.\nEn este contexto, la comunicación pública convencional de arriba hacia abajo —a menudo formulada como advertencias administrativas— resultó cada vez más ineficaz para llegar a la Generación Z. Abordar estos riesgos exigía un modelo de participación pública fundamentalmente diferente, capaz de sintonizar con las realidades digitales vividas por los jóvenes y de reconstruir la confianza en los mensajes de seguridad pública.\n2. La iniciativa y el modelo de alianza\nLa campaña \"Khong Mot Minh\" (No Estás Solo) fue iniciada por la Digital Trust Alliance (DTA) y el Departamento de Ciberseguridad y Prevención del Delito de Alta Tecnología (A05) del Ministerio de Seguridad Pública, con el apoyo institucional de la UNODC y UNICEF. METUB Network se sumó como Socio Oficial de Comunicación Social, responsable de traducir los mensajes jurídicos y de política en formatos culturalmente pertinentes y de movilizar recursos sociales para amplificar el alcance.\nLa iniciativa buscó construir un marco de protección digital multicapa para aproximadamente 12 millones de jóvenes, fortaleciendo la conciencia, la resiliencia y las habilidades de autoprotección en el entorno en línea.\n3. Mirada de innovación: por qué esta iniciativa es transformadora\nLa campaña marcó un giro deliberado desde la difusión unidireccional de información hacia un ecosistema de comunicación participativa, anclado en tres pilares que se refuerzan mutuamente:\na. Traducción de políticas – claridad en acción: METUB tradujo las complejas advertencias de las fuerzas del orden a formatos de la cultura popular, incorporando los principios de seguridad digital en la canción principal de la campaña, \"Clicking\", en videos cortos basados en escenarios y en retos de baile en TikTok, transformando el conocimiento normativo en contenido accesible y compartible.\nb. Inclusión y empoderamiento juvenil: en lugar de posicionar a los jóvenes como víctimas pasivas, la campaña los empoderó como contribuyentes activos: miles de estudiantes crearon contenido original, obras artísticas e historias personales, fortaleciendo la apropiación, la dignidad y la confianza.\nc. Prevención digital proactiva: mediante el aprendizaje basado en el eduentretenimiento, la iniciativa proporcionó una \"vacuna digital\" que permite a los jóvenes reconocer la manipulación y el fraude antes de que ocurra el daño, desplazando el foco de la aplicación reactiva de la ley hacia la prevención activa.\nMás allá de su alcance nacional, \"Khong Mot Minh\" sirvió también como iniciativa satélite emblemática en el marco de la firma de la Convención de las Naciones Unidas contra el Cibercrimen (\"Convención de Hanói\"), reafirmando el compromiso de Vietnam con la gobernanza digital global y la protección de la infancia.\nConexión con las instituciones públicas y las políticas públicas\nEsta iniciativa representa un modelo práctico y escalable de alianza público-privada diseñado para cerrar la brecha entre las instituciones públicas y la ciudadanía digital.\n1. Liderazgo del sector público\nEl Departamento de Ciberseguridad y Prevención del Delito de Alta Tecnología (A05) del Ministerio de Seguridad Pública aportó liderazgo técnico, autoridad legal y alineación con las políticas, garantizando la legitimidad institucional y la coherencia con las prioridades nacionales de ciberseguridad.\n2. El papel de METUB como catalizador de confianza\nMás allá de la ejecución, METUB funcionó como catalizador de confianza. Aprovechando su red de más de 5.000 creadores de contenido, METUB tradujo las políticas públicas en interacciones cercanas y basadas en el diálogo. Este enfoque ayudó a suavizar la distancia percibida entre los organismos de seguridad y la ciudadanía joven, reposicionando al A05 de regulador distante a protector creíble y accesible en el espacio digital.\n3. Alineación de políticas y relevancia global\nLa campaña puso en práctica directamente la Estrategia Nacional de Ciberseguridad de Vietnam y, al mismo tiempo, apoyó los objetivos diplomáticos de alto nivel asociados a la firma de la Convención de las Naciones Unidas contra el Cibercrimen en octubre de 2025. La proyección del video resumen de la campaña en una sesión oficial de las Naciones Unidas demostró el papel del sector privado como socio esencial para enfrentar los desafíos de la gobernanza global."},"links":["https://themetub.com/"],"hasPhotos":true,"drive":"Check to see if both photos can be uploaded: https://drive.google.com/file/d/1h2zQRqhNqMHdY5Tz0EUvGJRXL5FXD7DN/view?usp=sharing , https://drive.google.com/file/d/1_20BJDg-kzGhP-Hzoh1x9VjKq_NahIeN/view?usp=sharing","prod":{"material":"PARCIAL","files":"• Not Alone School Tour 2.jpg — 5,2 MB · 8192x5464 px · Foto de evento en alta resolución","pieces":"1) Not Alone School Tour 2.jpg (imagen principal, excelente calidad).","gap":"Solo llegó 1 archivo. Sugerencia para 2ª pieza: key visual oficial de la campaña \"Không Một Mình\" o captura del video principal (pedir a The Metub Company, ya respondieron)."}},{"id":"c011","tier":"Spotlight","category":"Trust Catalysts","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Civil society organisation","es":"Organización de la sociedad civil"},"name":"Mulheres em Dialogo","org":"Instituto Update","desc":{"en":"Mulheres em Diálogo (Women in Dialogue) by Instituto Update in Brazil bridges progressive and conservative women around the polarizing topic of public security through research and facilitated dialogue. Using qualitative and quantitative methods, the project maps how different audiences perceive urban violence and gender-based violence, identifying convergence points across ideological lines. A central output is the Narrative Guide—systematizing findings into concrete recommendations for civil society actors, communicators, and educators on framing discussions about gender-based violence with reduced resistance. It is a practical tool for navigating polarized communication environments in Brazil.","es":"Mulheres em Diálogo (Mujeres en Diálogo), del Instituto Update en Brasil, tiende puentes entre mujeres progresistas y conservadoras en torno al polarizante tema de la seguridad pública mediante investigación y diálogo facilitado. Utilizando métodos cualitativos y cuantitativos, el proyecto mapea cómo distintas audiencias perciben la violencia urbana y la violencia de género, identificando puntos de convergencia entre líneas ideológicas. Un producto central es la Guía Narrativa, que sistematiza los hallazgos en recomendaciones concretas para actores de la sociedad civil, comunicadores y educadores sobre cómo enmarcar las discusiones sobre violencia de género con menor resistencia. Es una herramienta práctica para navegar entornos de comunicación polarizados en Brasil."},"details":{"en":"\"The project “Possible Convergences: Women Weaving Dialogues on Political Security” seeks to establish a dialogue process between progressive and conservative women around the theme of public security, one of the most mobilizing and polarizing issues in contemporary Brazil.\nOur approach is hybrid, addressing both urban violence (assaults, organized crime, police, weaponry) and gender based violence (domestic, sexual, femicide, harassment). The objective is to map how these different audiences perceive and elaborate on the issue of security, identifying points of convergence and building repertoires of dialogue that strengthen more democratic and inclusive policies.\nUsing qualitative and quantitative methods, the project will also seek to understand how public opinion is shaped by competing narratives, especially on social media and among young people, who today consume and reproduce political views through memes, videos, and simplified discourses. In the end, the results will be disseminated in reports, digital campaigns, opinion articles, and a national meeting with organizations and parliamentarians.\"\"Mulheres em Diálogo links to public institutions and policy processes through its engagement with elected officials, legislative spaces, and public debate on gender, democracy, and violence prevention in Brasilia, the nation’s capital. The initiative was designed in response to documented gaps in public policy discourse on GBV, political violence against women, and public security, particularly under conditions of political polarization.\nThe program engages members of parliament and public officials, primarily women legislators from diverse ideological and territorial contexts—including federal, state, and municipal levels—have publicly endorsed, participated in, or used the initiative’s research and narrative outputs to inform debates on women’s rights, political participation, and responses to violence. This engagement strengthens the connection between women’s lived experiences, research evidence, and legislative agendas.\nWe also contribute to public policy by informing narrative and communication strategies used by CSO's that interface directly with public systems addressing violence against women, including protection services, justice mechanisms, and prevention policies. The Narrative Guide translates research findings into policy-relevant framing tools that support public institutions and partners as well.\"","es":"\"El proyecto “Convergencias Posibles: Mujeres Tejiendo Diálogos sobre Seguridad” busca establecer un proceso de diálogo entre mujeres progresistas y conservadoras en torno al tema de la seguridad pública, uno de los asuntos más movilizadores y polarizantes del Brasil contemporáneo.\nNuestro enfoque es híbrido y aborda tanto la violencia urbana (asaltos, crimen organizado, policía, armamento) como la violencia de género (doméstica, sexual, feminicidio, acoso). El objetivo es mapear cómo estas distintas audiencias perciben y elaboran el tema de la seguridad, identificando puntos de convergencia y construyendo repertorios de diálogo que fortalezcan políticas más democráticas e inclusivas.\nMediante métodos cualitativos y cuantitativos, el proyecto también buscará comprender cómo la opinión pública es moldeada por narrativas en competencia, especialmente en las redes sociales y entre las personas jóvenes, quienes hoy consumen y reproducen visiones políticas a través de memes, videos y discursos simplificados. Al final, los resultados se difundirán en informes, campañas digitales, artículos de opinión y un encuentro nacional con organizaciones y parlamentarios.\"\"Mulheres em Diálogo se vincula con las instituciones públicas y los procesos de políticas mediante su trabajo con funcionarios electos, espacios legislativos y el debate público sobre género, democracia y prevención de la violencia en Brasilia, la capital del país. La iniciativa se diseñó en respuesta a brechas documentadas en el discurso de las políticas públicas sobre violencia de género, violencia política contra las mujeres y seguridad pública, particularmente en condiciones de polarización política.\nEl programa involucra a parlamentarios y funcionarios públicos: principalmente mujeres legisladoras de diversos contextos ideológicos y territoriales —incluidos los niveles federal, estatal y municipal— han respaldado públicamente la iniciativa, participado en ella o utilizado su investigación y sus productos narrativos para informar debates sobre los derechos de las mujeres, la participación política y las respuestas a la violencia. Este involucramiento fortalece la conexión entre las experiencias vividas de las mujeres, la evidencia de investigación y las agendas legislativas.\nTambién contribuimos a las políticas públicas al informar las estrategias narrativas y de comunicación utilizadas por organizaciones de la sociedad civil que interactúan directamente con los sistemas públicos que atienden la violencia contra las mujeres, incluidos los servicios de protección, los mecanismos de justicia y las políticas de prevención. La Guía Narrativa traduce los hallazgos de investigación en herramientas de encuadre relevantes para las políticas, que apoyan también a las instituciones públicas y a los socios.\""},"links":["https://www.institutoupdate.org.br/en/"],"hasPhotos":true,"drive":"Check to see if both photos can be uploaded: https://drive.google.com/file/d/1wJ_28aYkJcON5E3ElZYK2aRSVIM-n3hQ/view?usp=sharing , https://drive.google.com/file/d/1oyL4D7g9Qu5k0B_rAYZLvw6-xyinXG7i/view?usp=sharing","prod":{"material":"PARCIAL","files":"• _MG_9342.jpg — 5,2 MB · 3307x2205 px · Foto de evento en alta resolución","pieces":"1) _MG_9342.jpg (imagen principal, foto de encuentro en alta calidad).","gap":"Solo llegó 1 archivo. Sugerencia para 2ª pieza: gráfica oficial del programa en institutoupdate.org.br o foto adicional de los diálogos."}},{"id":"c012","tier":"Spotlight","category":"Exploring New Frontiers","categorySource":"official","iso":"IN","lang":"English","region":{"en":"Asia & the Pacific","es":"Asia y el Pacífico"},"country":{"en":"India","es":"India"},"type":{"en":"Public institution","es":"Institución pública"},"name":"BHASHINI: Powering Multilingual AI for Inclusive Public Communication in a Linguistically Diverse Democracy","org":"Digital Indian BHASHINI Division","desc":{"en":"BHASHINI is India's national AI language infrastructure initiative launched in 2022 by the Ministry of Electronics and Information Technology, positioning language as core digital infrastructure enabling citizens to access public information and services in their own languages. Delivering 18+ AI-powered services including machine translation, speech recognition, text-to-speech, OCR, and transliteration across 22 Indian languages, BHASHINI has achieved 5 billion+ AI inferences nationally. The My Aadhaar identity service alone recorded 1.2 billion+ inferences, while eGramSwaraj generated 455 million API calls supporting Panchayat-level governance. By making government services voice-first and multilingual, BHASHINI addresses deep linguistic barriers that previously excluded rural and regional populations from digital public communication.","es":"BHASHINI es la iniciativa nacional de infraestructura lingüística de IA de la India, lanzada en 2022 por el Ministerio de Electrónica y Tecnología de la Información, que posiciona el idioma como infraestructura digital esencial para que la ciudadanía acceda a la información y los servicios públicos en sus propias lenguas. Con más de 18 servicios impulsados por IA —incluidos traducción automática, reconocimiento de voz, conversión de texto a voz, OCR y transliteración— en 22 lenguas de la India, BHASHINI ha alcanzado más de 5.000 millones de inferencias de IA a nivel nacional. Solo el servicio de identidad My Aadhaar registró más de 1.200 millones de inferencias, mientras que eGramSwaraj generó 455 millones de llamadas a API en apoyo a la gobernanza a nivel de Panchayat. Al hacer que los servicios gubernamentales sean multilingües y con prioridad de voz, BHASHINI aborda profundas barreras lingüísticas que antes excluían a las poblaciones rurales y regionales de la comunicación pública digital."},"details":{"en":"The Digital India BHASHINI Division (DIBD) is a national initiative of the Ministry of Electronics and Information Technology (MeitY), Government of India, implemented under the National Language Translation Mission. Launched in 2022 as part of the Digital India programme, BHASHINI (Bhasha Interface for India) positions language as core digital infrastructure, enabling citizens to access public information and services in the languages they speak and understand.\nBHASHINI functions as a voice-first, multimodal AI ecosystem, offering shared language infrastructure for governance and public communication. It provides 18+ AI-powered services including Machine Translation, Speech-to-Speech Translation, Automatic Speech Recognition (ASR), Text-to-Speech (TTS), Optical Character Recognition (OCR), Transliteration, and advanced pre- and post-processing tools such as language detection, denoising, punctuation and voice activity detection. These capabilities are delivered through open, interoperable APIs and support 36+ Indian languages for text and 22+ Indian languages for voice, enabling real-time multilingual interaction across text, voice, image and video.\nBHASHINI’s target audience includes citizens with limited literacy or English proficiency, public institutions, developers, startups, and academic partners. The BHASHINI Mobile App extends these services directly to citizens, supporting real-world language access beyond institutional platforms. Community-driven initiatives such as BhashaDaan and BHASHINI Samudaye ensure that datasets, glossaries and language models are shaped by diverse linguistic communities.\nAs of 2025, BHASHINI has delivered over 5 billion AI inferences, enabled 1.1 million+ mobile app downloads, translated 400+ government websites, supported 100+ use cases across sectors, and facilitated access for over 100 crore Indians, including farmers, students, women, elderly citizens and low-literacy populations. The World Economic Forum has highlighted BHASHINI as a global example of inclusive, open digital public infrastructure. Its innovation lies in institutionalising multilingual AI as shared national infrastructure, rather than isolated tools, ensuring clarity, inclusion and trust in public communication at scale.\"BHASHINI is embedded within India’s public policy architecture through the National Language Translation Mission, aligned with the Digital India and IndiaAI missions. It operationalises constitutional commitments to linguistic inclusion by integrating multilingual and voice-enabled communication directly into public digital systems.\nThe platform is formally adopted by multiple Central Ministries, State Governments and public institutions across governance, identity, transport, health, education, finance, skilling and grievance redressal. Key integrations include My Aadhaar, eGramSwaraj, Indian Railways (Rail Madad), CPGRAMS, PM-Kisan, POSHAN Tracker, DIKSHA, Janaushadhi, MGNREGA systems, and Panchayat platforms.\nA flagship governance innovation is SabhaSaar, which uses BHASHINI to automatically generate multilingual Gram Sabha minutes, strengthening transparency and participation in local democracy. BHASHINI’s institutional design enables ministries to adopt a common language layer, ensuring consistency, scalability and interoperability across public services while reducing duplication of effort.\"","es":"La División Digital India BHASHINI (DIBD) es una iniciativa nacional del Ministerio de Electrónica y Tecnología de la Información (MeitY) del Gobierno de la India, implementada en el marco de la Misión Nacional de Traducción de Lenguas (National Language Translation Mission). Lanzada en 2022 como parte del programa Digital India, BHASHINI (Bhasha Interface for India) posiciona el idioma como infraestructura digital esencial, permitiendo a la ciudadanía acceder a la información y los servicios públicos en las lenguas que habla y comprende.\nBHASHINI funciona como un ecosistema de IA multimodal con prioridad de voz, que ofrece infraestructura lingüística compartida para la gobernanza y la comunicación pública. Proporciona más de 18 servicios impulsados por IA, incluidos traducción automática, traducción de voz a voz, reconocimiento automático del habla (ASR), conversión de texto a voz (TTS), reconocimiento óptico de caracteres (OCR), transliteración y herramientas avanzadas de pre y posprocesamiento, como detección de idioma, reducción de ruido, puntuación y detección de actividad de voz. Estas capacidades se ofrecen a través de API abiertas e interoperables y admiten más de 36 lenguas de la India para texto y más de 22 lenguas de la India para voz, lo que posibilita la interacción multilingüe en tiempo real en texto, voz, imagen y video.\nEl público objetivo de BHASHINI incluye a ciudadanos con alfabetización limitada o escaso dominio del inglés, instituciones públicas, desarrolladores, startups y socios académicos. La aplicación móvil de BHASHINI extiende estos servicios directamente a la ciudadanía, apoyando el acceso lingüístico en contextos reales más allá de las plataformas institucionales. Iniciativas impulsadas por la comunidad, como BhashaDaan y BHASHINI Samudaye, garantizan que los conjuntos de datos, los glosarios y los modelos lingüísticos sean moldeados por comunidades lingüísticas diversas.\nA 2025, BHASHINI ha realizado más de 5.000 millones de inferencias de IA, alcanzado más de 1,1 millones de descargas de su aplicación móvil, traducido más de 400 sitios web gubernamentales, apoyado más de 100 casos de uso en distintos sectores y facilitado el acceso a más de 100 crore de personas en la India (más de 1.000 millones), incluidos agricultores, estudiantes, mujeres, personas mayores y poblaciones con baja alfabetización. El Foro Económico Mundial ha destacado a BHASHINI como ejemplo global de infraestructura pública digital abierta e inclusiva. Su innovación radica en institucionalizar la IA multilingüe como infraestructura nacional compartida, en lugar de herramientas aisladas, garantizando claridad, inclusión y confianza en la comunicación pública a gran escala.\"BHASHINI está integrada en la arquitectura de políticas públicas de la India a través de la Misión Nacional de Traducción de Lenguas, alineada con las misiones Digital India e IndiaAI. Operacionaliza los compromisos constitucionales con la inclusión lingüística al integrar la comunicación multilingüe y habilitada por voz directamente en los sistemas públicos digitales.\nLa plataforma ha sido adoptada formalmente por múltiples ministerios centrales, gobiernos estatales e instituciones públicas en los ámbitos de gobernanza, identidad, transporte, salud, educación, finanzas, formación de capacidades y atención de quejas. Entre sus integraciones clave se encuentran My Aadhaar, eGramSwaraj, Indian Railways (Rail Madad), CPGRAMS, PM-Kisan, POSHAN Tracker, DIKSHA, Janaushadhi, los sistemas de MGNREGA y las plataformas de los Panchayats.\nUna innovación emblemática en materia de gobernanza es SabhaSaar, que utiliza BHASHINI para generar automáticamente actas multilingües de las Gram Sabhas, fortaleciendo la transparencia y la participación en la democracia local. El diseño institucional de BHASHINI permite a los ministerios adoptar una capa lingüística común, garantizando coherencia, escalabilidad e interoperabilidad en los servicios públicos y reduciendo la duplicación de esfuerzos.\""},"links":["https://bhashini.gov.in/"],"hasPhotos":true,"drive":"Check to see if both photos can be uploaded: https://drive.google.com/file/d/1Opb91-Zy7SN8_sssvd68db_10PBMtcxL/view?usp=sharing , https://drive.google.com/file/d/1a1e1vCGd26uhJApm0zQM8SgxZdPiKIsR/view?usp=sharing","prod":{"material":"PARCIAL","files":"• amitabh sir photo.png — 1,7 MB · 1200x1200 px · Retrato institucional (CEO)","pieces":"1) amitabh sir photo.png — retrato del CEO; útil como secundaria, no como principal.","gap":"Sugerencia para imagen principal: captura de la plataforma bhashini.gov.in o gráfica oficial de BHASHINI (identidad muy reconocible). El retrato solo como apoyo."}},{"id":"c013","tier":"Spotlight","category":"Dialogue Builders","categorySource":"official","iso":"MW","lang":"English","region":{"en":"Africa","es":"África"},"country":{"en":"Malawi","es":"Malaui"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Weaving the Web of Truth: MEC’s Multi-Platform Campaign on Voter Education and Countering  Disinformation","org":"Malawi Electoral Commission","desc":{"en":"Weaving the Web of Truth was Malawi Electoral Commission's multi-platform voter education campaign during the 2025 General Election. Responding to growing disinformation and political polarization, MEC integrated community engagement, mass media, digital platforms, and assistive technologies into a unified communication model. At grassroots level, 229 Constituency Civic Education Assistants conducted village meetings and dialogues. The campaign generated 9,450+ radio and TV broadcast slots and 15.8 million online interactions. Voter turnout rose from 64.8% in 2020 to 76.4% in 2025—one of the largest increases in recent Malawian elections—demonstrating that coordinated, inclusive public communication directly strengthens democratic participation.","es":"Weaving the Web of Truth (Tejiendo la Red de la Verdad) fue la campaña multiplataforma de educación electoral de la Comisión Electoral de Malawi (MEC) durante las elecciones generales de 2025. En respuesta a la creciente desinformación y polarización política, la MEC integró la participación comunitaria, los medios masivos, las plataformas digitales y las tecnologías de asistencia en un modelo de comunicación unificado. A nivel de base, 229 Asistentes de Educación Cívica de Circunscripción realizaron reuniones y diálogos en las aldeas. La campaña generó más de 9.450 espacios de difusión en radio y televisión y 15,8 millones de interacciones en línea. La participación electoral aumentó del 64,8% en 2020 al 76,4% en 2025 —uno de los mayores incrementos en las elecciones recientes de Malawi—, lo que demuestra que una comunicación pública coordinada e inclusiva fortalece directamente la participación democrática."},"details":{"en":"\"During 2025 General Election, MEC implemented a communication campaign aimed at increasing voter turnout, countering disinformation, & strengthening trust in elections. This initiative responded to a challenging context marked by rapid growth of online disinformation, political polarization, skepticism toward new electoral technologies, and absence of CSO in voter education.\nMEC adopted a communication model that integrated community engagement, mass media, digital platforms, assistive technologies, and direct stakeholder networks into a single “web of truth.” The campaign targeted all eligible voters: youth, women, persons with disabilities, rural communities, political actors, media, traditional & faith leaders with messages tailored to their specific information needs.\nAt grassroots level,  229 Constituency Civic and Voter Education Assistants conducted village meetings, door-to-door outreach, market sensitization, youth and women dialogues, and engagements with religious institutions. They also practiced active listening, feeding community concerns back to MEC to inform real-time message adjustment. CCVEAs acted as frontline defenders against rumor-based, word-of-mouth disinformation.\nTo reach populations with limited access to digital or broadcast media, MEC deployed loudhailers and mobile public address systems broadcasting messages in local languages.\nMEC rolled out an extensive radio and television campaign using PSAs, jingles, dramas, talk shows, phone-ins, and live interviews. All major TV appearances included sign language interpretation, institutionalizing accessibility.\nMEC expanded its social media presence with daily updates, infographics, explainer videos, live-streamed briefings, and a structured 300-day countdown to polling day. MEC established WhatsApp groups for political parties and candidates and maintained an email mailing list of over 6,000 active addresses to ensure direct, consistent information flow to stakeholders.\nMEC invested in social media monitoring. Detected false or misleading content triggered immediate verification and rapid release of corrective messages across all channels. This functioned as an “information iron dome,” enabling MEC’s truthful messages to outpace, intercept, and often reverse fake news.\nPartnerships with influencers acted as information multipliers by amplifying MEC content and as sentinels by cross-checking rumors before sharing and alerting MEC to emerging narratives.\nMEC implemented Open National Tally Centre with live-streamed tallying and unrestricted access.\nThe impact was tangible: recorded a voter turnout of 76.4%, the highest in recent history. Stakeholders commended MEC’s transparency, responsiveness, inclusivity, and professionalism. The initiative is innovative because it redefines public communication as an integrated ecosystem that floods the information environment with credible, accessible truth from many directions, making disinformation difficult to survive.\" \"This initiative is grounded in MEC's constitutional mandate and its 2023–2028 Strategic Plan, which recognizes communication and voter education as central pillars of credible elections. The Commission is legally required to provide voter education, disseminate electoral information, strengthen stakeholder engagement, promote transparency, and build public confidence in electoral processes. The multi-channel communication campaign directly operationalized these statutory obligations at national scale.\nThe 2025 communication model also advances Malawi 2063, particularly Enabler 2: Effective Governance Systems and Institutions. By prioritizing transparency, accessibility, inclusion, digital engagement, and two-way communication, the initiative strengthened governance practices, reinforced the rule of law, and expanded meaningful citizen participation. Citizens were empowered to access information, exercise their rights, articulate concerns, and engage constructively with the electoral process, thereby contributing to accountable and responsive institutions.\nIn addition, the initiative aligns with electoral laws, the Access to Information Act, and regional and continental democratic frameworks of SADC and AU. Components such as constituency-based field educators, mass media programming, livestreamed electoral processes, disability-inclusive communication, and direct stakeholder communication networks translate public policy commitments into daily institutional practice.\n\"","es":"\"Durante las elecciones generales de 2025, la MEC implementó una campaña de comunicación orientada a aumentar la participación electoral, contrarrestar la desinformación y fortalecer la confianza en las elecciones. Esta iniciativa respondió a un contexto desafiante marcado por el rápido crecimiento de la desinformación en línea, la polarización política, el escepticismo frente a las nuevas tecnologías electorales y la ausencia de organizaciones de la sociedad civil en la educación electoral.\nLa MEC adoptó un modelo de comunicación que integró la participación comunitaria, los medios masivos, las plataformas digitales, las tecnologías de asistencia y las redes directas de actores interesados en una única “red de la verdad”. La campaña se dirigió a todo el electorado: jóvenes, mujeres, personas con discapacidad, comunidades rurales, actores políticos, medios de comunicación y líderes tradicionales y religiosos, con mensajes adaptados a sus necesidades específicas de información.\nA nivel de base, 229 Asistentes de Educación Cívica y Electoral de Circunscripción (CCVEA) realizaron reuniones en aldeas, visitas puerta a puerta, sensibilización en mercados, diálogos con jóvenes y mujeres, y encuentros con instituciones religiosas. También practicaron la escucha activa, transmitiendo las inquietudes de las comunidades a la MEC para ajustar los mensajes en tiempo real. Los CCVEA actuaron como defensores de primera línea contra la desinformación basada en rumores y transmitida de boca en boca.\nPara llegar a las poblaciones con acceso limitado a medios digitales o de radiodifusión, la MEC desplegó altavoces y sistemas móviles de megafonía que difundían mensajes en lenguas locales.\nLa MEC puso en marcha una amplia campaña de radio y televisión con anuncios de servicio público, jingles, dramatizaciones, programas de debate, llamadas al aire y entrevistas en vivo. Todas las principales apariciones televisivas incluyeron interpretación en lengua de señas, institucionalizando la accesibilidad.\nLa MEC amplió su presencia en redes sociales con actualizaciones diarias, infografías, videos explicativos, transmisiones en vivo de sus sesiones informativas y una cuenta regresiva estructurada de 300 días hasta la jornada electoral. La MEC estableció grupos de WhatsApp para partidos políticos y candidaturas, y mantuvo una lista de correo electrónico con más de 6.000 direcciones activas para asegurar un flujo de información directo y constante hacia los actores interesados.\nLa MEC invirtió en el monitoreo de redes sociales. La detección de contenido falso o engañoso activaba una verificación inmediata y la difusión rápida de mensajes correctivos en todos los canales. Esto funcionó como una “cúpula de hierro informativa”, que permitió que los mensajes veraces de la MEC superaran, interceptaran y, a menudo, revirtieran las noticias falsas.\nLas alianzas con influencers actuaron como multiplicadores de información, al amplificar el contenido de la MEC, y como centinelas, al verificar los rumores antes de compartirlos y alertar a la MEC sobre narrativas emergentes.\nLa MEC implementó el Centro Nacional Abierto de Cómputo (Open National Tally Centre), con transmisión en vivo del escrutinio y acceso irrestricto.\nEl impacto fue tangible: se registró una participación electoral del 76,4%, la más alta de la historia reciente. Los actores interesados elogiaron la transparencia, la capacidad de respuesta, la inclusividad y el profesionalismo de la MEC. La iniciativa es innovadora porque redefine la comunicación pública como un ecosistema integrado que inunda el entorno informativo con verdad creíble y accesible desde múltiples direcciones, haciendo difícil que la desinformación sobreviva.\" \"Esta iniciativa se fundamenta en el mandato constitucional de la MEC y en su Plan Estratégico 2023–2028, que reconoce la comunicación y la educación electoral como pilares centrales de unas elecciones creíbles. La Comisión está legalmente obligada a proporcionar educación electoral, difundir información electoral, fortalecer la participación de los actores interesados, promover la transparencia y generar confianza pública en los procesos electorales. La campaña de comunicación multicanal materializó directamente estas obligaciones legales a escala nacional.\nEl modelo de comunicación de 2025 también contribuye a la visión Malawi 2063, en particular a su Habilitador 2: Sistemas e Instituciones de Gobernanza Eficaces. Al priorizar la transparencia, la accesibilidad, la inclusión, la participación digital y la comunicación bidireccional, la iniciativa fortaleció las prácticas de gobernanza, reforzó el estado de derecho y amplió la participación ciudadana significativa. La ciudadanía fue empoderada para acceder a la información, ejercer sus derechos, expresar sus inquietudes y participar constructivamente en el proceso electoral, contribuyendo así a instituciones responsables y receptivas.\nAdemás, la iniciativa se alinea con las leyes electorales, la Ley de Acceso a la Información y los marcos democráticos regionales y continentales de la SADC y la UA. Componentes como los educadores de campo por circunscripción, la programación en medios masivos, la transmisión en vivo de los procesos electorales, la comunicación inclusiva para personas con discapacidad y las redes directas de comunicación con actores interesados traducen los compromisos de política pública en práctica institucional cotidiana.\n\""},"links":["@electionsmalawi"],"hasPhotos":true,"drive":"Check to see if both photos can be uploaded:  https://drive.google.com/file/d/1HLhyAqNvdkuKQWNIhc-c2XFSXVpiS1sq/view?usp=sharing , https://drive.google.com/file/d/1OobquZPj1P16zoXBnBFORf2aKKFR4H3l/view?usp=sharing","prod":{"material":"NO","files":"CARPETA VACÍA — no llegó ningún archivo","pieces":"Ninguno por ahora.","gap":"Carpeta vacía. Contacto sin email (vía Malawi CO). Sugerencia: piezas de la campaña en las redes @electionsmalawi (2 publicaciones de educación al votante)."}},{"id":"c014","tier":"Spotlight","category":"Inclusive Voices","categorySource":"official","iso":"CF","lang":"French","region":{"en":"Africa","es":"África"},"country":{"en":"Central African Republic","es":"República Centroafricana"},"type":{"en":"University or research centre","es":"Universidad o centro de investigación"},"name":"Les ondes de la parole publique","org":"Université de Bangui / Faculté des sciences juridique et politique","desc":{"en":"Les Ondes de la Parole Publique (The Waves of Public Speech) by the Faculty of Legal and Political Sciences at the University of Bangui in the Central African Republic aims to transform public communication into a living, comprehensible, inclusive flow that restores trust between institutions and citizens. Recognizing that public messages often remain opaque—generating incomprehension, disengagement, and rumors—the initiative creates resonance spaces where citizens can ask questions and share reactions, and establishes feedback loops enabling institutions to improve their communication. Currently in conceptual and pilot design phase, it establishes a methodologically rigorous framework for participatory public communication in the Central African Republic.","es":"Les Ondes de la Parole Publique (Las Ondas de la Palabra Pública), de la Facultad de Ciencias Jurídicas y Políticas de la Universidad de Bangui, en la República Centroafricana, busca transformar la comunicación pública en un flujo vivo, comprensible e inclusivo que restablezca la confianza entre las instituciones y la ciudadanía. Reconociendo que los mensajes públicos suelen permanecer opacos —generando incomprensión, desapego y rumores—, la iniciativa crea espacios de resonancia donde la ciudadanía puede plantear preguntas y compartir reacciones, y establece circuitos de retroalimentación que permiten a las instituciones mejorar su comunicación. Actualmente en fase de diseño conceptual y piloto, establece un marco metodológicamente riguroso para la comunicación pública participativa en la República Centroafricana."},"details":{"en":"\"The Waves of Public Speech is an initiative aimed at transforming public communication into a vibrant, understandable, and inclusive flow, capable of restoring trust between institutions and citizens. In many contexts, public messages remain opaque: decisions, programs, and policies circulate without being truly understood, generating misunderstanding, disengagement, and rumors.\nThis initiative stems from this observation and places clarity, listening, and participation at the heart of public communication.\nThe main objective is to make every message accessible and appropriable by everyone, especially young people and traditionally underrepresented groups. The initiative creates spaces for dialogue, where citizens can ask questions and share their reactions, and establishes feedback loops that allow institutions to reformulate and improve their communication. The stakeholders involved include national and local public institutions, civil society organizations, and media partners, working together to strengthen participation and inclusion.\nThe innovation of this initiative lies in its systemic vision of communication: it is not limited to the dissemination of messages, but follows their journeys.\" The initiative tracks the actual trajectory, identifies where misunderstandings occur, and continuously adjusts the flow. This approach transforms public communication into an active and ethical dialogue, where discourse doesn't tower over citizens but circulates with them. It illustrates how governance can become tangible, experienced, and understandable to all, without relying on sophisticated technological tools. By fostering clarity, inclusion, and dialogue, the initiative contributes to a more participatory democracy and a lasting relationship of trust between institutions and the public.The \"Waves of Public Discourse\" initiative is directly aligned with the missions of public communication and governance institutions, particularly those responsible for disseminating decisions, programs, and public policies. The initiative collaborates with national and local administrations to improve how their messages are received and understood by citizens. It complements existing public policies on transparency, citizen participation, and inclusion by creating mechanisms for concrete and continuous feedback between institutions and the public. By establishing spaces for dialogue and feedback loops, it strengthens the reach and effectiveness of public policies, especially those concerning young people, marginalized communities, and areas often overlooked by official channels.\nThe initiative's innovation lies in viewing communication not as a one-off institutional obligation, but as a strategic governance tool capable of strengthening trust and citizen participation, and of making public decisions tangible, understandable, and accessible to all.","es":"\"Las Ondas de la Palabra Pública es una iniciativa orientada a transformar la comunicación pública en un flujo vivo, comprensible e inclusivo, capaz de restablecer la confianza entre las instituciones y la ciudadanía. En muchos contextos, los mensajes públicos permanecen opacos: las decisiones, los programas y las políticas circulan sin ser verdaderamente comprendidos, generando incomprensión, desapego y rumores.\nEsta iniciativa parte de esa constatación y coloca la claridad, la escucha y la participación en el centro de la comunicación pública.\nEl objetivo principal es hacer que cada mensaje sea accesible y apropiable por todas las personas, especialmente por la juventud y los grupos tradicionalmente subrepresentados. La iniciativa crea espacios de diálogo, donde la ciudadanía puede plantear preguntas y compartir sus reacciones, y establece circuitos de retroalimentación que permiten a las instituciones reformular y mejorar su comunicación. Los actores involucrados incluyen instituciones públicas nacionales y locales, organizaciones de la sociedad civil y medios de comunicación asociados, que trabajan conjuntamente para fortalecer la participación y la inclusión.\nLa innovación de esta iniciativa radica en su visión sistémica de la comunicación: no se limita a la difusión de mensajes, sino que sigue sus recorridos.\" La iniciativa rastrea la trayectoria real de los mensajes, identifica dónde se producen los malentendidos y ajusta continuamente el flujo. Este enfoque transforma la comunicación pública en un diálogo activo y ético, en el que el discurso no se impone desde arriba a la ciudadanía, sino que circula con ella. Ilustra cómo la gobernanza puede volverse tangible, vivida y comprensible para todos, sin depender de herramientas tecnológicas sofisticadas. Al fomentar la claridad, la inclusión y el diálogo, la iniciativa contribuye a una democracia más participativa y a una relación duradera de confianza entre las instituciones y el público. La iniciativa \"Las Ondas del Discurso Público\" está directamente alineada con las misiones de las instituciones de comunicación pública y gobernanza, en particular las responsables de difundir decisiones, programas y políticas públicas. La iniciativa colabora con las administraciones nacionales y locales para mejorar la manera en que sus mensajes son recibidos y comprendidos por la ciudadanía. Complementa las políticas públicas existentes en materia de transparencia, participación ciudadana e inclusión mediante la creación de mecanismos de retroalimentación concreta y continua entre las instituciones y el público. Al establecer espacios de diálogo y circuitos de retroalimentación, fortalece el alcance y la eficacia de las políticas públicas, especialmente las dirigidas a la juventud, las comunidades marginadas y las zonas a menudo desatendidas por los canales oficiales.\nLa innovación de la iniciativa radica en concebir la comunicación no como una obligación institucional puntual, sino como una herramienta estratégica de gobernanza capaz de fortalecer la confianza y la participación ciudadana, y de hacer que las decisiones públicas sean tangibles, comprensibles y accesibles para todos."},"links":["https://univ-bangui.cf/"],"hasPhotos":true,"drive":"Check to see if both photos can be uploaded:","prod":{"material":"NO","files":"CARPETA VACÍA — no llegó ningún archivo","pieces":"Ninguno por ahora.","gap":"Carpeta vacía; en seguimiento (follow up al email universitario). Sugerencia: foto del programa radial/estudio y logo de la Université de Bangui (univ-bangui.cf)."}},{"id":"c015","tier":"Spotlight","category":"Inclusive Voices","categorySource":"official","iso":"CD","lang":"French","region":{"en":"Africa","es":"África"},"country":{"en":"DR Congo","es":"RD Congo"},"type":{"en":"Civil society organisation","es":"Organización de la sociedad civil"},"name":"Voix des Survivants","org":"UNION DES JURISTES ENGAGES POUR LES OPPRIMES, LA PAIX ET LE DEVELOPPEMENT « UJEOPAD-RDC »","desc":{"en":"Voix des Survivants is a participatory public communication initiative by UJEOPAD-RDC in the conflict-affected eastern Democratic Republic of Congo. In a context marked by armed violence and institutional distrust, the initiative creates safe spaces where survivors, youth, and women can understand their rights, express needs, and engage with public authorities. Through community dialogues, accessible public hearings, multilingual information capsules, and intergenerational workshops, it translates complex concepts—transitional justice, DDRR, human trafficking, human rights—into accessible formats. Since launching, over 100 victims received free legal assistance at mobile hearings, and 83 trafficking survivors were supported with IOM—demonstrating participatory communication's power to rebuild trust in post-conflict contexts.","es":"Voix des Survivants es una iniciativa de comunicación pública participativa de UJEOPAD-RDC en el este de la República Democrática del Congo, región afectada por el conflicto. En un contexto marcado por la violencia armada y la desconfianza institucional, la iniciativa crea espacios seguros donde sobrevivientes, jóvenes y mujeres pueden comprender sus derechos, expresar sus necesidades e interactuar con las autoridades públicas. A través de diálogos comunitarios, audiencias públicas accesibles, cápsulas informativas multilingües y talleres intergeneracionales, traduce conceptos complejos —justicia transicional, DDRR, trata de personas, derechos humanos— a formatos accesibles. Desde su lanzamiento, más de 100 víctimas recibieron asistencia jurídica gratuita en audiencias móviles y 83 sobrevivientes de trata fueron apoyadas junto con la OIM, demostrando el poder de la comunicación participativa para reconstruir la confianza en contextos posconflicto."},"details":{"en":"“Voices of Survivors” is a participatory public communication initiative led by UJEOPAD-DRC to strengthen justice, institutional trust, and social cohesion in conflict zones in eastern Democratic Republic of Congo. In a context marked by armed violence, mistrust of institutions, and the historical exclusion of citizens, the initiative creates safe spaces where survivors, young people, and women can understand their rights, express their needs, and engage directly with public authorities.\nThe main objective is to make justice and public policies understandable, accessible, and inclusive by translating complex concepts (transitional justice, DDRR, combating human trafficking, human rights) into simple and accessible formats: community dialogues, accessible mobile court hearings, multilingual information sessions, intergenerational workshops, and active listening mechanisms. The initiative also aims to restore trust between institutions and citizens by promoting ethical, transparent, and two-way communication.\nThe target audience includes:\nvictims of grave violations (torture, human trafficking, sexual violence, modern slavery);\nyouth and women community leaders;\nlocal authorities (administrative, customary, judicial);\ncommunities affected by conflict;\ncivil society organizations.\nKey stakeholders include: IOM, Elman Peace, judicial and administrative authorities, customary chiefs, youth networks, human rights organizations, and the international platforms to which UJEOPAD is affiliated.\nThe initiative's innovation lies in its hybrid approach, which combines:\nparticipatory legal education, adapted to local linguistic and cultural realities;\ncommunity mediation integrated into DDRR;\ncitizen co-production of information, where survivors become agents of change;\nstructured active listening, enabling institutions to respond to community concerns;\nintergenerational dialogue, mobilizing youth, elders, traditional leaders, and public authorities.\nBy giving a voice to survivors and By bringing institutions and citizens closer together, “Voices of Survivors” transforms public communication into a tool for justice, peace and inclusive governance, offering a model that can be replicated in other fragile contexts of the Global South. The “Voices of Survivors” initiative is directly linked to public institutions and is part of the implementation of essential public policies in the Democratic Republic of Congo. It is conducted in collaboration with judicial authorities (Juvenile Court, Prosecutor's Offices, Local Courts) through mobile court hearings, access to justice, and the fight against impunity. It also works with territorial and municipal administrations, traditional leaders, and state security services to facilitate community dialogue, local mediation, and conflict prevention.\nThe initiative contributes to the implementation of several national public policies, including: the national transitional justice policy;\nthe national DDRR strategy;\nthe State's commitments to combat human trafficking; and\npolicies for child protection and the prevention of gender-based violence.\nBy making these policies understandable and accessible to citizens, and by creating mechanisms for two-way communication between institutions and communities, the initiative strengthens the legitimacy of public action and improves citizen participation in areas where the state is often absent or weakened.\"","es":"“Voix des Survivants” (Voces de los Sobrevivientes) es una iniciativa de comunicación pública participativa liderada por UJEOPAD-RDC para fortalecer la justicia, la confianza institucional y la cohesión social en las zonas de conflicto del este de la República Democrática del Congo. En un contexto marcado por la violencia armada, la desconfianza hacia las instituciones y la exclusión histórica de la ciudadanía, la iniciativa crea espacios seguros donde sobrevivientes, jóvenes y mujeres pueden comprender sus derechos, expresar sus necesidades e interactuar directamente con las autoridades públicas.\nEl objetivo principal es hacer que la justicia y las políticas públicas sean comprensibles, accesibles e inclusivas mediante la traducción de conceptos complejos (justicia transicional, DDRR, lucha contra la trata de personas, derechos humanos) a formatos simples y accesibles: diálogos comunitarios, audiencias judiciales móviles accesibles, sesiones informativas multilingües, talleres intergeneracionales y mecanismos de escucha activa. La iniciativa también busca restablecer la confianza entre las instituciones y la ciudadanía promoviendo una comunicación ética, transparente y bidireccional.\nEl público objetivo incluye:\nvíctimas de violaciones graves (tortura, trata de personas, violencia sexual, esclavitud moderna);\nlíderes y lideresas comunitarios jóvenes y mujeres;\nautoridades locales (administrativas, consuetudinarias, judiciales);\ncomunidades afectadas por el conflicto;\norganizaciones de la sociedad civil.\nEntre los actores clave se encuentran: la OIM, Elman Peace, las autoridades judiciales y administrativas, los jefes consuetudinarios, las redes juveniles, las organizaciones de derechos humanos y las plataformas internacionales a las que está afiliada UJEOPAD.\nLa innovación de la iniciativa radica en su enfoque híbrido, que combina:\neducación jurídica participativa, adaptada a las realidades lingüísticas y culturales locales;\nmediación comunitaria integrada en el DDRR;\ncoproducción ciudadana de la información, donde los sobrevivientes se convierten en agentes de cambio;\nescucha activa estructurada, que permite a las instituciones responder a las inquietudes de las comunidades;\ndiálogo intergeneracional, que moviliza a jóvenes, personas mayores, líderes tradicionales y autoridades públicas.\nAl dar voz a los sobrevivientes y al acercar a las instituciones y a la ciudadanía, “Voces de los Sobrevivientes” transforma la comunicación pública en una herramienta de justicia, paz y gobernanza inclusiva, ofreciendo un modelo replicable en otros contextos frágiles del Sur Global. La iniciativa “Voces de los Sobrevivientes” está directamente vinculada a las instituciones públicas y se inscribe en la implementación de políticas públicas esenciales en la República Democrática del Congo. Se lleva a cabo en colaboración con las autoridades judiciales (Tribunal de Menores, Fiscalías, Tribunales Locales) mediante audiencias judiciales móviles, el acceso a la justicia y la lucha contra la impunidad. También trabaja con las administraciones territoriales y municipales, los líderes tradicionales y los servicios estatales de seguridad para facilitar el diálogo comunitario, la mediación local y la prevención de conflictos.\nLa iniciativa contribuye a la implementación de varias políticas públicas nacionales, entre ellas: la política nacional de justicia transicional;\nla estrategia nacional de DDRR;\nlos compromisos del Estado en la lucha contra la trata de personas; y\nlas políticas de protección de la infancia y de prevención de la violencia de género.\nAl hacer que estas políticas sean comprensibles y accesibles para la ciudadanía, y al crear mecanismos de comunicación bidireccional entre las instituciones y las comunidades, la iniciativa fortalece la legitimidad de la acción pública y mejora la participación ciudadana en zonas donde el Estado suele estar ausente o debilitado.\""},"links":["www.ujeopad.org"],"hasPhotos":true,"drive":"Check to see if both photos can be uploaded: https://drive.google.com/file/d/18I_ou7PDa8j-f7TZx5NDsKPtsi_MB_oU/view?usp=sharing , https://drive.google.com/file/d/1bov1E0He3y-HVQiELzr4Nwl-5SLHJQz7/view?usp=sharing","prod":{"material":"PARCIAL","files":"• Danny_photoPass.jpeg — 3,1 MB · 1870x1883 px · Retrato (foto tipo credencial)","pieces":"1) Danny_photoPass.jpeg — retrato del responsable; útil como secundaria.","gap":"Sugerencia para imagen principal: foto de las actividades participativas con sobrevivientes (pedir a UJEOPAD-RDC, ya respondieron) o material de www.ujeopad.org."}},{"id":"c016","tier":"Spotlight","category":"Trust Catalysts","categorySource":"official","iso":"AR","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Argentina","es":"Argentina"},"type":{"en":"Private sector","es":"Sector privado"},"name":"Sistema Mendocino de Comunicación Pública Basada en Evidencia (SIMECPE)","org":"RZ Consultora","desc":{"en":"SIMECPE (Mendoza Evidence-Based Public Communication System) by RZ Consultora in Argentina integrates aca
