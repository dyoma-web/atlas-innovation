ons working with innovation in the public sector, the network brings together more than 13,000 members from federal, state, and municipal agencies, as well as universities, partner organizations, and independent collectives.\nIts objective is to facilitate the circulation of knowledge, support capacity building, and strengthen collaboration between institutions through a horizontal communication architecture. The network operates through 22 communities of practice, more than 40 thematic groups on WhatsApp, an open digital platform, a collaborative library, newsletters, and a collectively built monthly agenda. This structure allows anyone—regardless of their originating agency—to participate, propose content, and co-curate practices, expanding access to government innovation.\nOne of the most innovative elements of the initiative is the InovaGov Experience, the network's official space during Enap's Innovation Week. The curation is entirely horizontal: community leaders and network members propose...\" The activities and programming are built in an open and participatory way. This transforms Innovation Week into an annual showcase of distributed public communication, revealing projects, narratives, and learnings produced collectively throughout the year.\nAnother distinguishing feature is the autonomy of the communities. Several initiatives emerge spontaneously — events, methodologies, discussion groups, shared materials — without direct intervention from Enap. Starting in 2026, the network will begin a mentoring cycle to support leaders in the design, communication, and sustainability of these projects, consolidating new capabilities and strengthening the continuity of the ecosystem.\nThe InovaGov Network is innovative because it breaks with the traditional model of public communication based on centralized broadcasts. By combining low-cost social technologies, distributed channels, and collaborative practices, it transforms communication into articulation, articulation into dialogue, and dialogue into collective action. The result is a living network that amplifies the voice of public servants, accelerates the circulation of good practices, and strengthens public innovation in the country.","es":"\"La Red InovaGov es un ecosistema colaborativo coordinado por la Escuela Nacional de Administración Pública (Enap) que transforma la comunicación pública en una práctica distribuida, participativa y orientada a la innovación gubernamental. Creada para conectar a personas e instituciones que trabajan con innovación en el sector público, la red reúne a más de 13.000 miembros de organismos federales, estatales y municipales, así como universidades, organizaciones aliadas y colectivos independientes.\nSu objetivo es facilitar la circulación del conocimiento, apoyar el desarrollo de capacidades y fortalecer la colaboración entre instituciones a través de una arquitectura de comunicación horizontal. La red opera mediante 22 comunidades de práctica, más de 40 grupos temáticos en WhatsApp, una plataforma digital abierta, una biblioteca colaborativa, boletines informativos y una agenda mensual construida colectivamente. Esta estructura permite que cualquier persona —independientemente de su organismo de origen— participe, proponga contenidos y realice curaduría conjunta de prácticas, ampliando el acceso a la innovación gubernamental.\nUno de los elementos más innovadores de la iniciativa es la InovaGov Experience, el espacio oficial de la red durante la Semana de Innovación de la Enap. La curaduría es completamente horizontal: los líderes de las comunidades y los miembros de la red proponen...\" Las actividades y la programación se construyen de manera abierta y participativa. Esto transforma la Semana de Innovación en una vitrina anual de comunicación pública distribuida, revelando proyectos, narrativas y aprendizajes producidos colectivamente a lo largo del año.\nOtro rasgo distintivo es la autonomía de las comunidades. Varias iniciativas surgen espontáneamente —eventos, metodologías, grupos de discusión, materiales compartidos— sin intervención directa de la Enap. A partir de 2026, la red iniciará un ciclo de mentorías para apoyar a los líderes en el diseño, la comunicación y la sostenibilidad de estos proyectos, consolidando nuevas capacidades y fortaleciendo la continuidad del ecosistema.\nLa Red InovaGov es innovadora porque rompe con el modelo tradicional de comunicación pública basado en difusiones centralizadas. Al combinar tecnologías sociales de bajo costo, canales distribuidos y prácticas colaborativas, transforma la comunicación en articulación, la articulación en diálogo y el diálogo en acción colectiva. El resultado es una red viva que amplifica la voz de los servidores públicos, acelera la circulación de buenas prácticas y fortalece la innovación pública en el país.\""},"links":["https://inovagov.enap.gov.br/","https://www.instagram.com/rede_inovagov/","https://www.linkedin.com/company/rede-inovagov"],"hasPhotos":false,"drive":null},{"id":"c026","tier":"High visibility","category":"Inclusive Voices","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"A Câmara do Rio na Rua","org":"Câmara Municipal do Rio de Janeiro","desc":{"en":"A Câmara do Rio na Rua (Rio Council in the Streets) is a civic engagement initiative of Rio de Janeiro's Municipal Chamber comprising three projects: O Povo Pergunta, Extra Favelas, and Praça da Cidadania. The initiative's innovation lies in decentralization—bringing legislative activity to public spaces for direct, face-to-face citizen dialogue. O Povo Pergunta combines in-person encounters in high-traffic areas with radio broadcasts; Extra Favelas brings community debates inside favelas; Praça da Cidadania holds civic events in public squares. Together, they reframe transparency and participation as concrete tools for building fairer public policies, generating broad media coverage and positive testimonials from diverse participant groups.","es":"A Câmara do Rio na Rua (La Cámara de Río en la Calle) es una iniciativa de participación cívica de la Cámara Municipal de Río de Janeiro compuesta por tres proyectos: O Povo Pergunta, Extra Favelas y Praça da Cidadania. La innovación de la iniciativa radica en la descentralización: llevar la actividad legislativa a los espacios públicos para un diálogo directo y presencial con la ciudadanía. O Povo Pergunta combina encuentros presenciales en zonas de alto tránsito con transmisiones radiales; Extra Favelas lleva debates comunitarios al interior de las favelas; Praça da Cidadania realiza eventos cívicos en plazas públicas. En conjunto, replantean la transparencia y la participación como herramientas concretas para construir políticas públicas más justas, generando amplia cobertura mediática y testimonios positivos de diversos grupos de participantes."},"details":{"en":"\"The initiative of the Rio de Janeiro City Council, comprised of the projects “The People Ask,” “Extra Favelas,” and “Citizenship Square,” constitutes an innovative and replicable model of civic engagement. Its main innovative strength lies in the decentralization and horizontality of the relationship between the Public Power and the population, taking the City Council to the streets to promote active listening and face-to-face dialogue. This approach redefines transparency and participation, transforming them into concrete tools for building fairer and more effective state policies.\nThe innovation is detailed in each component:\nThe “The People Ask” project innovates through its multi-channel approach, integrating face-to-face dialogue in high-traffic locations (such as terminals and pedestrian walkways) with the broad visibility of radio (traditional media). This combination decentralizes legislative activity and creates a forum for direct and immediate contact with citizens, reinforcing the commitment to the city and making the work of the City Council more transparent.\nThe action consistently promotes a direct, transparent, and responsive relationship between the Public Power and the population.\" Legislative branch and the population. By bringing council members to speak face-to-face with citizens in different neighborhoods of the city, the project breaks down institutional barriers and creates an environment of open dialogue, where criticisms, demands, and suggestions are received directly. This format demonstrates a willingness to listen, learn, and adjust priorities based on the reality of the residents, strengthening the credibility of the City Council.\nThe “Extra Favelas” debate cycle represents a powerful form of social and methodological innovation. The project establishes a direct and structured channel with favela communities in all regions of the city, giving voice to historically marginalized groups. The central innovation is to use a hybrid model (face-to-face thematic debates combined with research) to ensure that public policies are built from the “peripheral perspective” of those who live in the territories.\nThe “Citizenship Square” innovates by overcoming the physical and psychological barrier of the Legislative Palace. It condenses the entire structure of the Legislative branch (councilors, staff, and the 28 Permanent Committees) in a single external location.\nThe initiative also It innovated by integrating in-person service with digital civic education, introducing an interactive panel to educate citizens on how to use the Chamber's website to suggest laws online.\nEach project was developed in partnership with a different media outlet, which ensured the reach of diverse audiences and significantly expanded the population's knowledge of the Chamber's actions, enhancing the impact of listening and citizen participation activities.\nIn short, the projects transform the Chamber from a distant institution into an active and itinerant presence, using communication to strengthen cooperation and expand the empowerment of the population.","es":"\"La iniciativa de la Cámara Municipal de Río de Janeiro, compuesta por los proyectos «El Pueblo Pregunta», «Extra Favelas» y «Plaza de la Ciudadanía», constituye un modelo innovador y replicable de participación cívica. Su principal fortaleza innovadora radica en la descentralización y la horizontalidad de la relación entre el Poder Público y la población, llevando la Cámara Municipal a las calles para promover la escucha activa y el diálogo presencial. Este enfoque redefine la transparencia y la participación, transformándolas en herramientas concretas para construir políticas estatales más justas y efectivas.\nLa innovación se detalla en cada componente:\nEl proyecto «El Pueblo Pregunta» innova a través de su enfoque multicanal, integrando el diálogo presencial en lugares de alto tránsito (como terminales y pasarelas peatonales) con la amplia visibilidad de la radio (medio tradicional). Esta combinación descentraliza la actividad legislativa y crea un foro de contacto directo e inmediato con la ciudadanía, reforzando el compromiso con la ciudad y haciendo más transparente el trabajo de la Cámara Municipal.\nLa acción promueve de manera consistente una relación directa, transparente y receptiva entre el Poder Público y la población.\" Entre el Poder Legislativo y la población. Al llevar a los concejales a hablar cara a cara con los ciudadanos en distintos barrios de la ciudad, el proyecto derriba barreras institucionales y crea un ambiente de diálogo abierto, donde las críticas, demandas y sugerencias se reciben directamente. Este formato demuestra una disposición a escuchar, aprender y ajustar prioridades a partir de la realidad de los residentes, fortaleciendo la credibilidad de la Cámara Municipal.\nEl ciclo de debates «Extra Favelas» representa una poderosa forma de innovación social y metodológica. El proyecto establece un canal directo y estructurado con las comunidades de las favelas de todas las regiones de la ciudad, dando voz a grupos históricamente marginados. La innovación central consiste en utilizar un modelo híbrido (debates temáticos presenciales combinados con investigación) para garantizar que las políticas públicas se construyan desde la «perspectiva periférica» de quienes viven en los territorios.\nLa «Plaza de la Ciudadanía» innova al superar la barrera física y psicológica del Palacio Legislativo. Condensa toda la estructura del Poder Legislativo (concejales, personal y las 28 Comisiones Permanentes) en un único espacio externo.\nLa iniciativa también innovó al integrar la atención presencial con la educación cívica digital, introduciendo un panel interactivo para enseñar a la ciudadanía a utilizar el sitio web de la Cámara para proponer leyes en línea.\nCada proyecto se desarrolló en alianza con un medio de comunicación diferente, lo que garantizó el alcance a públicos diversos y amplió significativamente el conocimiento de la población sobre las acciones de la Cámara, potenciando el impacto de las actividades de escucha y participación ciudadana.\nEn síntesis, los proyectos transforman a la Cámara de una institución distante en una presencia activa e itinerante, utilizando la comunicación para fortalecer la cooperación y ampliar el empoderamiento de la población.\""},"links":["https://www.camara.rio/"],"hasPhotos":false,"drive":null},{"id":"c027","tier":"High visibility","category":"Inclusive Voices","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Ouvidoria Ativa: Dados que Viram Ação Antirracista","org":"Ouvidoria do Ministério da Igualdade Racial","desc":{"en":"Ouvidoria Ativa: Dados que Viram Ação Antirracista is a pioneering initiative by Brazil's Ministry of Racial Equality that partnered with ride-hailing and delivery platforms—Uber, 99, iFood, Lalamove, and InDrive—to embed anti-racist educational messages directly into their apps. Building on racism complaints received—including cases targeting Afro-Brazilian religious practitioners—the Ombudsman designed segmented messages for each user profile (customers, drivers, delivery workers). Since January 2025, over a hundred awareness messages have reached millions of Brazilians through platforms they use daily, establishing a new model for integrating ombudsman functions with institutional anti-racism communication at scale.","es":"Ouvidoria Ativa: Dados que Viram Ação Antirracista es una iniciativa pionera del Ministerio de Igualdad Racial de Brasil que se asoció con plataformas de transporte y reparto —Uber, 99, iFood, Lalamove e InDrive— para incorporar mensajes educativos antirracistas directamente en sus aplicaciones. A partir de las denuncias de racismo recibidas —incluidos casos dirigidos contra practicantes de religiones de matriz africana—, la Defensoría diseñó mensajes segmentados para cada perfil de usuario (clientes, conductores, repartidores). Desde enero de 2025, más de un centenar de mensajes de sensibilización han llegado a millones de brasileños a través de plataformas que utilizan a diario, estableciendo un nuevo modelo para integrar las funciones de defensoría con la comunicación institucional antirracista a gran escala."},"details":{"en":"\"The Racial Equality Ombudsman of the Ministry of Racial Equality (MIR) has the mission of acting as a direct bridge between the State and the population, especially historically marginalized groups. Its role goes beyond receiving complaints or reports, functioning as a strategic space for listening, articulation, and political advocacy. Within these responsibilities, the initiative we highlight here is the unprecedented integration between the functions of ombudsman and institutional communication which, through an institutional partnership, has promoted the fight against racism and the promotion of racial equality on digital platforms through the dissemination of anti-racist educational messages.\nBased on receiving complaints of racism (many with religious motivation, such as against people of African-based religions in traditional clothing), perpetrated by app drivers against passengers or by customers against delivery drivers, the MIR Ombudsman established a Technical Cooperation Agreement with AMOBITEC - the Brazilian Association of Mobility and Technology (which includes companies such as Uber, 99, iFood, and Lalamove) and with the company InDrive. Through this agreement...\" Based on communication guidelines from the MIR's Special Communication Advisory Office, these platforms began disseminating segmented anti-racist educational messages to drivers, delivery workers, and customers.\nSince January 2025, the initiative has been active and has already published over a hundred pieces of content targeted at the audiences registered on the platforms. This is an innovative experience that combines the use of data from ombudsman offices with initiatives from the Ministry of Racial Equality to support mass communication actions, promoting behavioral change and collective awareness.\nThe initiative articulates listening, strategic analysis, and institutional mobilization, representing a new approach for public ombudsman offices as actors of inclusive communication with transformative potential.","es":"\"La Defensoría de Igualdad Racial del Ministerio de Igualdad Racial (MIR) tiene la misión de actuar como puente directo entre el Estado y la población, especialmente los grupos históricamente marginados. Su papel va más allá de recibir quejas o denuncias, funcionando como un espacio estratégico de escucha, articulación e incidencia política. Dentro de estas responsabilidades, la iniciativa que destacamos aquí es la integración inédita entre las funciones de defensoría y la comunicación institucional que, a través de una alianza institucional, ha promovido la lucha contra el racismo y la promoción de la igualdad racial en plataformas digitales mediante la difusión de mensajes educativos antirracistas.\nA partir de la recepción de denuncias de racismo (muchas con motivación religiosa, como contra personas de religiones de matriz africana con vestimenta tradicional), perpetradas por conductores de aplicaciones contra pasajeros o por clientes contra repartidores, la Defensoría del MIR estableció un Acuerdo de Cooperación Técnica con AMOBITEC, la Asociación Brasileña de Movilidad y Tecnología (que incluye empresas como Uber, 99, iFood y Lalamove), y con la empresa InDrive. A través de este acuerdo...\" Con base en las directrices de comunicación de la Asesoría Especial de Comunicación del MIR, estas plataformas comenzaron a difundir mensajes educativos antirracistas segmentados dirigidos a conductores, repartidores y clientes.\nDesde enero de 2025, la iniciativa está activa y ya ha publicado más de un centenar de contenidos dirigidos a los públicos registrados en las plataformas. Se trata de una experiencia innovadora que combina el uso de datos de las defensorías con iniciativas del Ministerio de Igualdad Racial para apoyar acciones de comunicación masiva, promoviendo el cambio de comportamiento y la concientización colectiva.\nLa iniciativa articula escucha, análisis estratégico y movilización institucional, representando un nuevo enfoque para las defensorías públicas como actores de una comunicación inclusiva con potencial transformador.\""},"links":["https://www.gov.br/igualdaderacial/pt-br/canais_atendimento/ouvidoria"],"hasPhotos":false,"drive":null},{"id":"c028","tier":"High visibility","category":"Clarity in Action","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Programa de Inovação do Tesouro do Estado","org":"Subsecretraia Tesouro do Estado do Rio Grane do Sul","desc":{"en":"The Treasury Innovation Program (PIT), launched in 2019 by Rio Grande do Sul’s Finance Secretariat, promotes a more efficient, transparent, and data-driven public administration through collaboration with citizens, academia, and technology partners. The program has introduced innovative tools such as the RS Servidor App for 340,000 public employees, the Climate Crisis Transparency Panel to track disaster-related public spending, and the Debt Portal to provide accessible and up-to-date information on state debt and finances. It also strengthens public understanding and participation through initiatives like the \"Simpler LDO\" booklet, which uses plain language to explain the state budget planning process.","es":"El Treasury Innovation Program (PIT), lanzado en 2019 por la Secretaría de Hacienda de Rio Grande do Sul, promueve una administración pública más eficiente, transparente y basada en datos mediante la colaboración con la ciudadanía, la academia y socios tecnológicos. El programa ha introducido herramientas innovadoras como la aplicación RS Servidor para 340.000 empleados públicos, el Panel de Transparencia de la Crisis Climática para monitorear el gasto público relacionado con desastres, y el Portal de la Deuda, que ofrece información accesible y actualizada sobre la deuda y las finanzas estatales. También fortalece la comprensión y la participación públicas mediante iniciativas como la cartilla \"LDO Más Simple\", que utiliza lenguaje claro para explicar el proceso de planificación presupuestaria del estado."},"details":{"en":"\"The Treasury Innovation Program (PIT) was established in 2019 by the Finance Secretariat of Rio Grande do Sul to make public administration more efficient, transparent, and data-driven. It promotes innovation through co-creation and collaboration with various social, academic, and technological actors. The program is organized into seven strategic axes, including the relationship with citizens to promote greater participation, transparency in public processes, and improved spending to enhance services. There are different tools, platforms, practices, and devices that facilitate access to information. Three examples are highlighted here that are anchored in public communication practices to promote transparency, accountability, broad access to public services, participation in decisions, and dialogue between the State, government, and society.\nAPP Servidor: The Treasury had a high number of requests from employees for clarifications, services, and guidance on their professional lives. The demands were met by email, telephone, and in-person service. The first step was to carefully listen to the employees and pensioners, detect dissatisfactions, and gather information and suggestions to improve the quality of dialogue and speed in...\" Services and prompt information exchange between the State and its employees. This dialogue was the genesis of the RS Server App, which serves 340,000 employees online, via cell phone.\nThe RS Climate Crisis Transparency Panel consists of data visualization for the management of budgetary resources. In May 2024, RS was hit by the country's biggest climate catastrophe. Excessive rainfall caused floods and destruction that directly affected 478 of the 497 municipalities in Rio Grande do Sul. Faced with the collapse of technological systems, the creation of the Panel became an institutional response of digital resilience, to offer society, the press and government agencies a transparent, accessible and reliable tool for analyzing the impacts of the climate crisis in the State.\nThe Debt Portal informs the public debate on debt with data updated monthly. It provides the values ​​of liabilities, the evolution of the outstanding balance, information on debt service – which is the amount actually paid by the State to honor debts – with data from the last 12 months and projections for the coming years. The platform presents a timeline with the main historical milestones.\nThe \"Simpler LDO\" booklet explains the budget cycle and summarizes the content of chapters and annexes of the Budget Guidelines Law Project. In 2025, its content was improved and new technical revisions were made, using Simple Language to explain the terms used in the public budget planning cycle.","es":"\"El Programa de Innovación del Tesoro (PIT) fue establecido en 2019 por la Secretaría de Hacienda de Rio Grande do Sul para hacer que la administración pública sea más eficiente, transparente y basada en datos. Promueve la innovación a través de la cocreación y la colaboración con diversos actores sociales, académicos y tecnológicos. El programa se organiza en siete ejes estratégicos, entre ellos la relación con la ciudadanía para promover una mayor participación, la transparencia en los procesos públicos y la mejora del gasto para optimizar los servicios. Existen distintas herramientas, plataformas, prácticas y dispositivos que facilitan el acceso a la información. Aquí se destacan tres ejemplos anclados en prácticas de comunicación pública para promover la transparencia, la rendición de cuentas, el amplio acceso a los servicios públicos, la participación en las decisiones y el diálogo entre el Estado, el gobierno y la sociedad.\nAPP Servidor: El Tesoro recibía un alto número de solicitudes de los empleados para aclaraciones, servicios y orientación sobre su vida profesional. Las demandas se atendían por correo electrónico, teléfono y atención presencial. El primer paso fue escuchar atentamente a los empleados y pensionados, detectar insatisfacciones y recopilar información y sugerencias para mejorar la calidad del diálogo y la rapidez en...\" los servicios y el intercambio ágil de información entre el Estado y sus empleados. Este diálogo fue la génesis de la aplicación RS Servidor, que atiende a 340.000 empleados en línea, a través del teléfono celular.\nEl Panel de Transparencia de la Crisis Climática de RS consiste en la visualización de datos para la gestión de los recursos presupuestarios. En mayo de 2024, RS fue golpeado por la mayor catástrofe climática del país. Las lluvias excesivas causaron inundaciones y destrucción que afectaron directamente a 478 de los 497 municipios de Rio Grande do Sul. Ante el colapso de los sistemas tecnológicos, la creación del Panel se convirtió en una respuesta institucional de resiliencia digital, para ofrecer a la sociedad, la prensa y los organismos gubernamentales una herramienta transparente, accesible y confiable para analizar los impactos de la crisis climática en el estado.\nEl Portal de la Deuda informa el debate público sobre la deuda con datos actualizados mensualmente. Proporciona los valores de los pasivos, la evolución del saldo pendiente, información sobre el servicio de la deuda —que es el monto efectivamente pagado por el estado para honrar las deudas— con datos de los últimos 12 meses y proyecciones para los próximos años. La plataforma presenta una línea de tiempo con los principales hitos históricos.\nLa cartilla \"LDO Más Simple\" explica el ciclo presupuestario y resume el contenido de los capítulos y anexos del Proyecto de Ley de Directrices Presupuestarias. En 2025, su contenido fue mejorado y se realizaron nuevas revisiones técnicas, utilizando Lenguaje Sencillo para explicar los términos empleados en el ciclo de planificación del presupuesto público.\""},"links":["https://tesouro.fazenda.rs.gov.br"],"hasPhotos":false,"drive":null},{"id":"c029","tier":"High visibility","category":"Clarity in Action","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"A linguagem reduzindo a regressão penal","org":"Tribunal de Justiça do Estado do Ceará","desc":{"en":"A Linguagem Reduzindo a Regressão Penal (Language Reducing Penal Regression) is a plain language communication initiative by the Ceará Court of Justice Innovation Lab in the Criminal Enforcement Court of Icó. Identifying a recurring problem—inmates in semi-open regimes returning to closed prisons not due to re-offending but to inadvertent non-compliance with incomprehensible conditions—the team redesigned all prisoner communications using plain language: short sentences, direct vocabulary, practical examples, and visual support. A physical reference card was also distributed at hearings. Implementation data showed the complete elimination of involuntary regime regressions—a low-cost, high-impact intervention demonstrating how linguistic accessibility in judicial communication directly protects fundamental rights.","es":"A Linguagem Reduzindo a Regressão Penal (El lenguaje reduciendo la regresión penal) es una iniciativa de comunicación en lenguaje claro del Laboratorio de Innovación del Tribunal de Justicia de Ceará en el Juzgado de Ejecución Penal de Icó. Al identificar un problema recurrente —personas privadas de libertad en régimen semiabierto que regresaban a prisiones cerradas no por reincidencia, sino por el incumplimiento involuntario de condiciones incomprensibles—, el equipo rediseñó todas las comunicaciones dirigidas a los reclusos utilizando lenguaje claro: frases cortas, vocabulario directo, ejemplos prácticos y apoyo visual. También se distribuyó una tarjeta física de referencia en las audiencias. Los datos de implementación mostraron la eliminación completa de las regresiones involuntarias de régimen: una intervención de bajo costo y alto impacto que demuestra cómo la accesibilidad lingüística en la comunicación judicial protege directamente los derechos fundamentales."},"details":{"en":"\"The initiative was developed within the Innovation Laboratory of the Court of Justice of the State of Ceará (Tribunal de Justiça do Estado do Ceará), in the Criminal Execution Court of the Icó District, with the objective of reducing regressions of regime motivated by involuntary non-compliance with the conditions imposed on people in semi-open regime. The identified problem was recurrent: many convicts returned to a different regime not due to criminal recidivism, but because they did not fully understand complex rules, transmitted in technical and inaccessible language during hearings.\nThe initiative consisted of a complete reorganization of public communication directed at this audience. The guidelines began to be transmitted in simple language, with short sentences, direct vocabulary, practical examples, and visual support. In addition to the oral explanation, a physical reference material was created, delivered exclusively at the admonitory hearing, allowing convicts to revisit the information whenever necessary. The focus was not on increasing control or supervision, but on ensuring a real understanding of the obligations and consequences.\nThe direct target audience is people serving sentences in the semi-open regime.\" The semi-open prison system, a group historically marked by low legal literacy and frequent exclusion from state communication processes, was developed and implemented as a controlled experiment, comparing historical data from the judicial unit. The results indicated the elimination of regressions due to negligence, maintaining only those resulting from new crimes, in addition to consistent reports of greater understanding, reduced doubts, and active use of the delivered material. The overall reduction in re-incarceration was approximately 31.54%.\nThe innovative nature of the initiative lies in treating language as an instrument of public policy and a variable with measurable impact, not merely as an aesthetic resource. By applying principles of plain language, information design, and behavioral science in a sensitive context such as the prison system, the project demonstrates that clear communication can produce concrete effects: harm reduction, greater institutional efficiency, and inclusion of groups traditionally left on the margins of public debate.","es":"\"La iniciativa fue desarrollada en el Laboratorio de Innovación del Tribunal de Justicia del Estado de Ceará (Tribunal de Justiça do Estado do Ceará), en el Juzgado de Ejecución Penal de la Comarca de Icó, con el objetivo de reducir las regresiones de régimen motivadas por el incumplimiento involuntario de las condiciones impuestas a las personas en régimen semiabierto. El problema identificado era recurrente: muchos condenados regresaban a un régimen distinto no por reincidencia delictiva, sino porque no comprendían plenamente reglas complejas, transmitidas en un lenguaje técnico e inaccesible durante las audiencias.\nLa iniciativa consistió en una reorganización completa de la comunicación pública dirigida a este público. Las orientaciones comenzaron a transmitirse en lenguaje sencillo, con frases cortas, vocabulario directo, ejemplos prácticos y apoyo visual. Además de la explicación oral, se creó un material físico de referencia, entregado exclusivamente en la audiencia admonitoria, que permite a los condenados repasar la información cuando lo necesiten. El enfoque no consistió en aumentar el control o la supervisión, sino en garantizar una comprensión real de las obligaciones y consecuencias.\nEl público objetivo directo son las personas que cumplen condena en régimen semiabierto.\" El sistema penitenciario semiabierto, un grupo históricamente marcado por la baja alfabetización jurídica y la exclusión frecuente de los procesos de comunicación estatal, fue objeto de un desarrollo e implementación como experimento controlado, comparando datos históricos de la unidad judicial. Los resultados indicaron la eliminación de las regresiones por negligencia, manteniéndose únicamente las derivadas de nuevos delitos, además de reportes consistentes de mayor comprensión, reducción de dudas y uso activo del material entregado. La reducción general del reencarcelamiento fue de aproximadamente el 31,54 %.\nEl carácter innovador de la iniciativa radica en tratar el lenguaje como un instrumento de política pública y una variable de impacto medible, no solo como un recurso estético. Al aplicar principios de lenguaje claro, diseño de la información y ciencias del comportamiento en un contexto sensible como el sistema penitenciario, el proyecto demuestra que la comunicación clara puede producir efectos concretos: reducción de daños, mayor eficiencia institucional e inclusión de grupos tradicionalmente dejados al margen del debate público.\""},"links":["www.tjce.jus.br"],"hasPhotos":false,"drive":null},{"id":"c030","tier":"High visibility","category":"Exploring New Frontiers","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Busca ativa no Sistema Nacional de Adoção e Acolhimento: uma campanha de comunicação com histórias de famílias reunidas pela tecnologia do Programa Justiça 4.0","org":"Programa das Nações Unidas para o Desenvolvimento (PNUD) e Conselho Nacional de Justiça (CNJ)","desc":{"en":"The Justice 4.0 Program used compelling storytelling to highlight the National Adoption and Foster Care System’s (SNA) active search functionality, which helps connect children and adolescents—especially those facing greater barriers to adoption—with qualified families. Through real-life family stories shared in reports, mini-documentaries, and an interactive e-book, the campaign demonstrated how technology and communication can humanize adoption and strengthen every child's right to a safe and loving family environment. Developed through cooperation between Brazil’s National Council of Justice (CNJ) and UNDP, the initiative increased public awareness of adoption while providing a replicable model for engaging citizens with complex public policies.","es":"El Programa Justicia 4.0 utilizó una narrativa cautivadora para destacar la funcionalidad de búsqueda activa del Sistema Nacional de Adopción y Acogimiento (SNA), que ayuda a conectar a niños, niñas y adolescentes —especialmente aquellos que enfrentan mayores barreras para la adopción— con familias habilitadas. A través de historias reales de familias compartidas en reportajes, minidocumentales y un libro electrónico interactivo, la campaña demostró cómo la tecnología y la comunicación pueden humanizar la adopción y fortalecer el derecho de cada niño y niña a un entorno familiar seguro y afectuoso. Desarrollada mediante la cooperación entre el Consejo Nacional de Justicia de Brasil (CNJ) y el PNUD, la iniciativa aumentó la conciencia pública sobre la adopción y ofreció un modelo replicable para acercar a la ciudadanía a políticas públicas complejas."},"details":{"en":"\"The integrated campaign of the Justice 4.0 Program translated the complexity of adoption into understandable and moving stories, highlighting the active search functionality of the National Adoption and Foster Care System (SNA). Using multi-format storytelling, the initiative showed how technology and communication can connect institutionalized children and adolescents with qualified families, strengthening the fundamental right of every child to grow up in a welcoming, safe, and affectionate environment.\nLaunched in 2019 by the National Council of Justice (CNJ), the SNA unified national registries on a digital platform that centralizes data from all Brazilian courts on children and adolescents in foster care and people eligible to adopt.\nSince 2024, the system has been improved by the Justice 4.0 Program. A result of cooperation between the CNJ and the UNDP, the initiative is dedicated to developing technological solutions that make the Brazilian justice system more efficient, accessible, and closer to society.\nThe active search is one of the most innovative functionalities of the SNA. It connects qualified prospective adoptive parents.\" The tool focuses on profiles of children and adolescents who face greater barriers to adoption, such as sibling groups, children who are past early childhood, or those living with disabilities. Through photos, videos, and information, the tool humanizes the process and expands the possibilities of finding families.\nTo give visibility to this functionality, Justiça 4.0 developed, between 2024 and 2025, an integrated communication campaign that offered Brazilian society an experience of affective immersion. To this end, the Communication team mapped, in the courts of the North, Central-West, and South regions of Brazil, real stories of families formed thanks to the SNA's active search resource.\nAs a result, five original narratives were published in the form of reports and mini-documentaries on the CNJ and UNDP websites and social media. The productions also gained translated versions in English and Spanish, taking the initiative to an international audience.\nStories like that of Nathalia and Peter, who welcomed four siblings from Rio de Janeiro; that of Tamiris and Natane, who found Natan after two years of waiting; The stories of Vanessa and Gustavo, who embraced late adoption, illustrate the concrete impact of the system's functionality. Each account reinforces that the SNA (National Adoption System) is more than just technology: it's a sensitive bridge between worlds, capable of transforming lives.\nSubsequently, these stories were compiled into an interactive e-book, launched in May 2025 during Adoption Month in Brazil. The campaign thus completed an eight-month cycle of activation around the technological solution.\nThe campaign also demonstrated potential for replicability in other contexts and initiatives that seek to bring citizens closer to complex public policies, by promoting inclusive dialogue and active listening, and giving voice to the families and children involved.","es":"\"La campaña integrada del Programa Justicia 4.0 tradujo la complejidad de la adopción en historias comprensibles y conmovedoras, destacando la funcionalidad de búsqueda activa del Sistema Nacional de Adopción y Acogimiento (SNA). Mediante una narrativa multiformato, la iniciativa mostró cómo la tecnología y la comunicación pueden conectar a niños, niñas y adolescentes institucionalizados con familias habilitadas, fortaleciendo el derecho fundamental de cada niño y niña a crecer en un entorno acogedor, seguro y afectuoso.\nLanzado en 2019 por el Consejo Nacional de Justicia (CNJ), el SNA unificó los registros nacionales en una plataforma digital que centraliza los datos de todos los tribunales brasileños sobre niños, niñas y adolescentes en acogimiento y personas habilitadas para adoptar.\nDesde 2024, el sistema ha sido mejorado por el Programa Justicia 4.0. Resultado de la cooperación entre el CNJ y el PNUD, la iniciativa se dedica a desarrollar soluciones tecnológicas que hagan al sistema de justicia brasileño más eficiente, accesible y cercano a la sociedad.\nLa búsqueda activa es una de las funcionalidades más innovadoras del SNA. Conecta a futuros padres adoptivos habilitados.\" La herramienta se centra en los perfiles de niños, niñas y adolescentes que enfrentan mayores barreras para la adopción, como grupos de hermanos, niños que ya superaron la primera infancia o aquellos que viven con discapacidades. A través de fotos, videos e información, la herramienta humaniza el proceso y amplía las posibilidades de encontrar familias.\nPara dar visibilidad a esta funcionalidad, Justiça 4.0 desarrolló, entre 2024 y 2025, una campaña de comunicación integrada que ofreció a la sociedad brasileña una experiencia de inmersión afectiva. Con este fin, el equipo de Comunicación mapeó, en los tribunales de las regiones Norte, Centro-Oeste y Sur de Brasil, historias reales de familias formadas gracias al recurso de búsqueda activa del SNA.\nComo resultado, se publicaron cinco narrativas originales en forma de reportajes y minidocumentales en los sitios web y redes sociales del CNJ y el PNUD. Las producciones también contaron con versiones traducidas al inglés y al español, llevando la iniciativa a una audiencia internacional.\nHistorias como la de Nathalia y Peter, que acogieron a cuatro hermanos de Río de Janeiro; la de Tamiris y Natane, que encontraron a Natan tras dos años de espera; y las de Vanessa y Gustavo, que abrazaron la adopción tardía, ilustran el impacto concreto de la funcionalidad del sistema. Cada relato refuerza que el SNA (Sistema Nacional de Adopción) es más que tecnología: es un puente sensible entre mundos, capaz de transformar vidas.\nPosteriormente, estas historias fueron compiladas en un libro electrónico interactivo, lanzado en mayo de 2025 durante el Mes de la Adopción en Brasil. La campaña completó así un ciclo de ocho meses de activación en torno a la solución tecnológica.\nLa campaña también demostró potencial de replicabilidad en otros contextos e iniciativas que buscan acercar a la ciudadanía a políticas públicas complejas, al promover el diálogo inclusivo y la escucha activa, y dar voz a las familias y a los niños y niñas involucrados.\""},"links":["https://www.cnj.jus.br/tecnologia-da-informacao-e-comunicacao/justica-4-0/"],"hasPhotos":false,"drive":null},{"id":"c031","tier":"High visibility","category":"Trust Catalysts","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Transparência que Conecta: Inovação, Acesso e Participação","org":"Secretaria Municipal de Integridade e Transparência da Prefeitura do Rio de Janeiro","desc":{"en":"Transparência que Conecta (Transparency that Connects) is a Rio de Janeiro City Hall initiative integrating public transparency, institutional communication, civic education, and innovation. It continuously improves the Transparency Portal using plain language and user-centered design guided by Google Analytics data, while promoting civic education through educational games ('Fato ou Fake: Transparência'), interactive workshops, and territorial outreach. In 2025, the portal registered 825,000+ accesses and received 2,382 information requests with 96% answered within legal deadlines. Nationally recognized for technical quality, the initiative demonstrates how institutional transparency can be transformed from a compliance exercise into a meaningful civic engagement strategy.","es":"Transparência que Conecta (Transparencia que Conecta) es una iniciativa de la Alcaldía de Río de Janeiro que integra transparencia pública, comunicación institucional, educación cívica e innovación. Mejora continuamente el Portal de Transparencia mediante lenguaje claro y un diseño centrado en el usuario, guiado por datos de Google Analytics, al tiempo que promueve la educación cívica a través de juegos educativos ('Fato ou Fake: Transparência'), talleres interactivos y acciones territoriales. En 2025, el portal registró más de 825.000 accesos y recibió 2.382 solicitudes de información, con un 96 % respondidas dentro de los plazos legales. Reconocida a nivel nacional por su calidad técnica, la iniciativa demuestra cómo la transparencia institucional puede transformarse de un ejercicio de cumplimiento en una estrategia significativa de participación cívica."},"details":{"en":"\"Transparency that Connects: Innovation, Access, and Participation\" is an initiative that integrates public transparency, institutional communication, civic education, and innovation to bring the population closer to government data and processes. It is based on the principle that transparency only generates impact when it is understandable, accessible, and capable of promoting dialogue, combining digital and territorial actions that make public management clearer and closer to the people.\nThe program brings together continuous improvements to the Transparency Portal, guided by simple language and reorganization of content to facilitate navigation, always respecting the complexity of public information. Decisions are guided by Google Analytics, which identifies navigation patterns and most searched content, allowing for constant adjustments based on evidence.\nThe initiative also promotes civic education through innovative strategies. Educational games were developed: \"Fact or Fake: Transparency,\" \"In Search of the Perfect Diamond,\" and \"Operation Transparency: The Mystery 404,\" which address integrity, the right of access to information, and governance in a playful way. Soon, the children's book Clara and the Guardians of Transparency will be launched, and The podcast \"Café com TransparêncIA\" (Coffee with Transparency), which deals with public transparency issues and uses artificial intelligence to generate mind maps that facilitate the understanding of the content, strengthening the culture of transparency among different audiences and age groups.\nIn the territory, the program materializes through the Itinerant Transparency program, which will bring services, guidance, and educational activities to schools, public facilities, communities, and events. The exhibition \"Transparency in Everyday Life: Informed Society\" brought citizens closer to the municipal administration with visual explanations and simple language. Workshops and discussion groups also expand these spaces for listening and dialogue. The initiative also strengthens public debate by participating in events such as Rio Innovation Week, in the \"Transparency in Context 5.0\" panel, and the Carioca Congress of Public Integrity, in the \"Transparency and Citizenship in Times of Transformation\" panel.\nWith the direct involvement of the Transparency Coordination Office of the Rio de Janeiro City Hall, the initiative mobilizes secretariats as partners in disseminating a culture of transparency, encouraging good internal practices and strengthening processes that contribute to the sustainability of the municipal policy on access to information. The audience reached includes citizens in general, students, civil servants, researchers, communicators, and groups historically less represented by digital public communication.\nThe innovation in \"Transparency that Connects\" lies in the combination of evidence, simple language, educational resources, emerging technologies, and territorial presence. By uniting information, dialogue, and participation, it transforms transparency into a living process, contributing to a more open democracy that is closer to the people.\"","es":"\"Transparencia que Conecta: Innovación, Acceso y Participación\" es una iniciativa que integra transparencia pública, comunicación institucional, educación cívica e innovación para acercar a la población a los datos y procesos gubernamentales. Se basa en el principio de que la transparencia solo genera impacto cuando es comprensible, accesible y capaz de promover el diálogo, combinando acciones digitales y territoriales que hacen que la gestión pública sea más clara y cercana a las personas.\nEl programa reúne mejoras continuas al Portal de Transparencia, guiadas por el lenguaje sencillo y la reorganización de contenidos para facilitar la navegación, respetando siempre la complejidad de la información pública. Las decisiones se orientan con Google Analytics, que identifica patrones de navegación y los contenidos más buscados, permitiendo ajustes constantes basados en evidencia.\nLa iniciativa también promueve la educación cívica mediante estrategias innovadoras. Se desarrollaron juegos educativos: \"Fato ou Fake: Transparência\" (Hecho o Falso: Transparencia), \"En Busca del Diamante Perfecto\" y \"Operación Transparencia: El Misterio 404\", que abordan de manera lúdica la integridad, el derecho de acceso a la información y la gobernanza. Próximamente se lanzará el libro infantil Clara y los Guardianes de la Transparencia, y el pódcast \"Café com TransparêncIA\" (Café con Transparencia), que trata temas de transparencia pública y utiliza inteligencia artificial para generar mapas mentales que facilitan la comprensión de los contenidos, fortaleciendo la cultura de la transparencia entre distintos públicos y grupos etarios.\nEn el territorio, el programa se materializa a través del programa Transparencia Itinerante, que llevará servicios, orientación y actividades educativas a escuelas, equipamientos públicos, comunidades y eventos. La exposición \"La Transparencia en la Vida Cotidiana: Sociedad Informada\" acercó a la ciudadanía a la administración municipal con explicaciones visuales y lenguaje sencillo. Talleres y grupos de discusión también amplían estos espacios de escucha y diálogo. La iniciativa fortalece además el debate público mediante la participación en eventos como la Rio Innovation Week, en el panel \"Transparencia en Contexto 5.0\", y el Congreso Carioca de Integridad Pública, en el panel \"Transparencia y Ciudadanía en Tiempos de Transformación\".\nCon la participación directa de la Coordinación de Transparencia de la Alcaldía de Río de Janeiro, la iniciativa moviliza a las secretarías como aliadas en la difusión de una cultura de transparencia, incentivando las buenas prácticas internas y fortaleciendo los procesos que contribuyen a la sostenibilidad de la política municipal de acceso a la información. El público alcanzado incluye a la ciudadanía en general, estudiantes, servidores públicos, investigadores, comunicadores y grupos históricamente menos representados por la comunicación pública digital.\nLa innovación de \"Transparencia que Conecta\" radica en la combinación de evidencia, lenguaje sencillo, recursos educativos, tecnologías emergentes y presencia territorial. Al unir información, diálogo y participación, transforma la transparencia en un proceso vivo, contribuyendo a una democracia más abierta y cercana a las personas.\""},"links":["https://transparencia.prefeitura.rio/transparencia-que-conecta/  https://www.instagram.com/p/DSGCghyEQ5y/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==  https://www.instagram.com/reel/DT0TYr0kZ9r/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA=="],"hasPhotos":false,"drive":null},{"id":"c032","tier":"High visibility","category":"Inclusive Voices","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Dignidade 60+: Comunicação e Proteção Integral à Pessoa Idosa","org":"Tribunal de Justiça do Estado do Ceará (TJCE)","desc":{"en":"Dignidade 60+ is a public communication and social justice ecosystem by the Ceará State Court of Justice securing rights and recognition for elderly people in Ceará, Brazil. The initiative brings essential services—free legal consultations and DNA tests via the Cejusc 60+—to shopping centers and university campuses, breaking the judiciary's institutional walls. It combines direct service delivery with academic production through an International Seminar on Elder Abuse and awareness workshops. In 2025, the initiative received first place in the Gandhi Communication Award for its video celebrating active aging—establishing a model for how courts can use public communication as a vehicle for social justice and elderly rights promotion.","es":"Dignidade 60+ es un ecosistema de comunicación pública y justicia social del Tribunal de Justicia del Estado de Ceará que garantiza derechos y reconocimiento a las personas mayores en Ceará, Brasil. La iniciativa lleva servicios esenciales —consultas jurídicas gratuitas y pruebas de ADN a través del Cejusc 60+— a centros comerciales y campus universitarios, rompiendo los muros institucionales del poder judicial. Combina la prestación directa de servicios con la producción académica mediante un Seminario Internacional sobre el Maltrato a las Personas Mayores y talleres de sensibilización. En 2025, la iniciativa recibió el primer lugar en el Premio Gandhi de Comunicación por su video que celebra el envejecimiento activo, estableciendo un modelo de cómo los tribunales pueden utilizar la comunicación pública como vehículo de justicia social y promoción de los derechos de las personas mayores."},"details":{"en":"\"The Dignity 60+ initiative is a public communication and social justice ecosystem that aims to ensure the protagonism, protection, and access to rights of the elderly population in Ceará. The project unifies a series of strategic actions developed by the Commission for the Defense of the Elderly of the TJCE (Court of Justice of Ceará) in partnership with the University of Fortaleza (UNIFOR) and the State Government.\nThe initiative breaks down the walls of the Judiciary by bringing essential services to high-traffic spaces, such as shopping malls and university campuses, providing legal assistance, free DNA testing via Cejusc 60+ (Special Civil Court for the Elderly) and cultural activities that celebrate aging as a privilege. In addition to direct assistance, the project promotes academic production and global debate through the International Seminar on Combating Violence against the Elderly, which mobilizes national and international voices to confront physical, psychological, and patrimonial abuse. Another fundamental pillar is the 60+ Empowerment Workshops, which offer training and active listening, transforming the elderly from spectators into subjects of rights.\nThe project is innovative.\" By integrating public communication into swift judicial practice, as demonstrated by the General Inspectorate's recommendation for concentrated efforts to expedite cases involving the elderly and by the hearing task forces that prioritize dignity and listening. By combining awareness campaigns on social media, high-level scientific events, and mobile justice services, the \"60+ Living with Dignity\" program creates a multi-sectoral protection network that combats isolation and ageism, establishing a new standard of institutional care for the elderly.","es":"\"La iniciativa Dignidad 60+ es un ecosistema de comunicación pública y justicia social que busca garantizar el protagonismo, la protección y el acceso a los derechos de la población adulta mayor en Ceará. El proyecto unifica una serie de acciones estratégicas desarrolladas por la Comisión de Defensa de las Personas Mayores del TJCE (Tribunal de Justicia de Ceará) en alianza con la Universidad de Fortaleza (UNIFOR) y el Gobierno del Estado.\nLa iniciativa derriba los muros del Poder Judicial al llevar servicios esenciales a espacios de alto tránsito, como centros comerciales y campus universitarios, brindando asistencia jurídica, pruebas de ADN gratuitas a través del Cejusc 60+ (Juzgado Civil Especial para las Personas Mayores) y actividades culturales que celebran el envejecimiento como un privilegio. Además de la asistencia directa, el proyecto promueve la producción académica y el debate global a través del Seminario Internacional de Combate a la Violencia contra las Personas Mayores, que moviliza voces nacionales e internacionales para enfrentar el abuso físico, psicológico y patrimonial. Otro pilar fundamental son los Talleres de Empoderamiento 60+, que ofrecen formación y escucha activa, transformando a las personas mayores de espectadoras en sujetos de derechos.\nEl proyecto es innovador.\" Al integrar la comunicación pública en una práctica judicial ágil, como lo demuestran la recomendación de la Inspectoría General de esfuerzos concentrados para agilizar los casos que involucran a personas mayores y las jornadas de audiencias que priorizan la dignidad y la escucha. Al combinar campañas de sensibilización en redes sociales, eventos científicos de alto nivel y servicios de justicia itinerante, el programa \"60+ Vivir con Dignidad\" crea una red de protección multisectorial que combate el aislamiento y el edadismo, estableciendo un nuevo estándar de atención institucional para las personas mayores.\""},"links":["https://www.tjce.jus.br/"],"hasPhotos":false,"drive":null},{"id":"c033","tier":"High visibility","category":"Trust Catalysts","categorySource":"official","iso":"DE","lang":"English","region":{"en":"Europe","es":"Europa"},"country":{"en":"Germany","es":"Alemania"},"type":{"en":"Media","es":"Medio de comunicación"},"name":"Diplomacy Berlin and PlusFortyNine","org":"Novalis Medienhaus","desc":{"en":"Diplomacy Berlin and PlusFortyNine are two interconnected editorial platforms by Novalis Medienhaus in Berlin combining journalism, storytelling, and collaboration with embassies and EU institutions to make international affairs accessible to broad audiences. Diplomacy Berlin fills a gap in diplomatic communication through long-form interviews, newsletters, press briefings, and the Diplo-Talk podcast. PlusFortyNine focuses on migration and cultural understanding for multilingual communities. Together, they have featured ambassadors, senior EU officials, and multilateral representatives, and are recognized as trusted communication bridges within Berlin's diplomatic ecosystem—demonstrating how specialized media can serve as public communication infrastructure for complex institutional audiences.","es":"Diplomacy Berlin y PlusFortyNine son dos plataformas editoriales interconectadas de Novalis Medienhaus en Berlín que combinan periodismo, narrativa y colaboración con embajadas e instituciones de la UE para hacer accesibles los asuntos internacionales a públicos amplios. Diplomacy Berlin llena un vacío en la comunicación diplomática mediante entrevistas de formato largo, boletines, ruedas de prensa y el pódcast Diplo-Talk. PlusFortyNine se centra en la migración y el entendimiento cultural para comunidades multilingües. En conjunto, han presentado a embajadores, altos funcionarios de la UE y representantes multilaterales, y son reconocidas como puentes de comunicación confiables dentro del ecosistema diplomático de Berlín, lo que demuestra cómo los medios especializados pueden servir como infraestructura de comunicación pública para audiencias institucionales complejas."},"details":{"en":"\"Diplomacy Berlin and PlusFortyNine are two interconnected editorial platforms developed by Novalis Medienhaus in Berlin to improve public communication around diplomacy, migration, and cultural understanding. Together, they form a new model for how media can strengthen transparency, dialogue, and trust between institutions and the public.\nDiplomacy Berlin was launched to fill a growing gap in how international affairs are communicated to broad audiences. Although Berlin is one of Europe’s most active diplomatic hubs, much of its diplomatic life remains inaccessible to the public. The platform responds to this by combining journalism, storytelling, and direct collaboration with embassies, EU institutions, and international organizations. Through long-form interviews, newsletters, press briefings, and the Diplo-Talk podcast, Diplomacy Berlin humanizes global affairs and explains policy shifts, negotiations, and cultural diplomacy in formats that are accessible, rigorous, and multilingual.\nPlusFortyNine complements this work by focusing on cultural integration and the lived experiences of migrants and newcomers in Germany. Built by a team that has made Germany their chosen home, it offers resources, insights, and narratives that help people understand the country’s social norms, political values, and everyday culture. Its aim is simple: reduce the friction that often accompanies migration by providing clear, empathetic communication that helps people feel oriented, informed, and included.\nThe two platforms were developed between 2023 and 2025 and operate with a growing network of diplomats, civil society organizations, local authorities, researchers, journalists, and Berlin-based cultural actors. Their audiences range from diplomats, policymakers, and international professionals to migrants, students, and globally curious readers looking for credible analysis and practical guidance.\nThe innovation lies in how the initiative bridges two often-separated domains: high-level diplomacy and everyday integration. Instead of treating them as isolated conversations, Diplomacy Berlin and PlusFortyNine bring them into the same ecosystem. International relations become more relatable when paired with human stories of identity, belonging, and cultural understanding. Migration becomes easier to navigate when contextualized within Germany’s diplomatic landscape, global debates, and policy frameworks.\nThe platforms also experiment with new formats for public communication combining podcasts, newsletters, community engagement, hybrid press events, and co-created content with diplomatic missions. This approach challenges traditional, top-down communication from state actors by creating a participatory space where institutions and the public engage through storytelling, dialogue, and shared learning.\n\"","es":"Diplomacy Berlin y PlusFortyNine son dos plataformas editoriales interconectadas desarrolladas por Novalis Medienhaus en Berlín para mejorar la comunicación pública en torno a la diplomacia, la migración y el entendimiento cultural. Juntas, conforman un nuevo modelo de cómo los medios pueden fortalecer la transparencia, el diálogo y la confianza entre las instituciones y el público.\nDiplomacy Berlin se lanzó para llenar un vacío creciente en la forma en que los asuntos internacionales se comunican a públicos amplios. Aunque Berlín es uno de los centros diplomáticos más activos de Europa, gran parte de su vida diplomática permanece inaccesible para el público. La plataforma responde a esto combinando periodismo, narrativa y colaboración directa con embajadas, instituciones de la UE y organizaciones internacionales. A través de entrevistas de formato largo, boletines, ruedas de prensa y el pódcast Diplo-Talk, Diplomacy Berlin humaniza los asuntos globales y explica los cambios de política, las negociaciones y la diplomacia cultural en formatos accesibles, rigurosos y multilingües.\nPlusFortyNine complementa esta labor centrándose en la integración cultural y las experiencias vividas de las personas migrantes y recién llegadas a Alemania. Creada por un equipo que ha hecho de Alemania su hogar por elección, ofrece recursos, análisis y narrativas que ayudan a las personas a comprender las normas sociales, los valores políticos y la cultura cotidiana del país. Su objetivo es simple: reducir las fricciones que suelen acompañar a la migración mediante una comunicación clara y empática que ayude a las personas a sentirse orientadas, informadas e incluidas.\nLas dos plataformas se desarrollaron entre 2023 y 2025 y operan con una red creciente de diplomáticos, organizaciones de la sociedad civil, autoridades locales, investigadores, periodistas y actores culturales radicados en Berlín. Sus audiencias abarcan desde diplomáticos, responsables de políticas públicas y profesionales internacionales hasta migrantes, estudiantes y lectores con curiosidad global que buscan análisis creíbles y orientación práctica.\nLa innovación radica en cómo la iniciativa tiende puentes entre dos ámbitos a menudo separados: la diplomacia de alto nivel y la integración cotidiana. En lugar de tratarlos como conversaciones aisladas, Diplomacy Berlin y PlusFortyNine los reúnen en un mismo ecosistema. Las relaciones internacionales se vuelven más cercanas cuando se acompañan de historias humanas de identidad, pertenencia y entendimiento cultural. La migración resulta más fácil de transitar cuando se contextualiza dentro del panorama diplomático de Alemania, los debates globales y los marcos de políticas públicas.\nLas plataformas también experimentan con nuevos formatos de comunicación pública, combinando pódcasts, boletines, participación comunitaria, eventos de prensa híbridos y contenidos cocreados con misiones diplomáticas. Este enfoque desafía la comunicación tradicional y vertical de los actores estatales al crear un espacio participativo donde las instituciones y el público interactúan a través de la narrativa, el diálogo y el aprendizaje compartido."},"links":["https://diplomacy.berlin/ https://plusfortynine.de/"],"hasPhotos":false,"drive":null},{"id":"c034","tier":"High visibility","category":"Inclusive Voices","categorySource":"official","iso":"AO","lang":"Portuguese","region":{"en":"Africa","es":"África"},"country":{"en":"Angola","es":"Angola"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Digital Justice and Human Rights in Angola","org":"Provedoria da Justiça – Ombudsperson’s Office","desc":{"en":"Digital Justice and Human Rights in Angola strengthens Angola's Ombudsperson's Office—the constitutional body mandated to protect citizens' rights—through digital infrastructure supported by UNDP. Since 2017, UNDP improved policies, staff competencies, and public awareness of available justice services. In 2022, IT equipment established 44 virtual hearing sites across all 18 provinces, enabling citizens to report rights violations remotely. The first virtual hearing room was inaugurated in June 2025 in Luanda. Citizen complaints grew from 4,424 in 2022 to 7,386 in 2023, reflecting increased access and public trust. The initiative models how digital infrastructure can expand ombudsman services in countries where geography limits access to institutional justice mechanisms.","es":"Justicia Digital y Derechos Humanos en Angola fortalece a la Defensoría del Pueblo de Angola —el órgano constitucional con el mandato de proteger los derechos de la ciudadanía— mediante infraestructura digital con el apoyo del PNUD. Desde 2017, el PNUD ha mejorado las políticas, las competencias del personal y el conocimiento público de los servicios de justicia disponibles. En 2022, la dotación de equipos informáticos permitió establecer 44 sedes de audiencias virtuales en las 18 provincias, lo que posibilita que la ciudadanía denuncie violaciones de derechos de forma remota. La primera sala de audiencias virtuales se inauguró en junio de 2025 en Luanda. Las quejas ciudadanas aumentaron de 4.424 en 2022 a 7.386 en 2023, lo que refleja un mayor acceso y confianza pública. La iniciativa constituye un modelo de cómo la infraestructura digital puede ampliar los servicios de defensoría en países donde la geografía limita el acceso a los mecanismos institucionales de justicia."},"details":{"en":"\"The “Digital Justice and Human Rights in Angola” initiative strengthens the Ombudsperson’s Office an independent institution mandated by the 2010 Constitution to promote and protect citizens’ rights and ensure the legality of public administration. Since 2017, UNDP has supported the institution by improving policies, procedures, regulations, staff competencies, and public awareness of available justice and human rights services.\nIn 2022, UNDP procured IT equipment to establish 44 municipal virtual sites across all 18 provinces. This investment created conditions for citizens nationwide to access Virtual Hearing Rooms, allowing them to report human rights violations and civic injustices without needing to travel long distances. These digital platforms expand access to justice, strengthen oversight of public services, and empower citizens particularly vulnerable groups to make their voices heard.\nThe current phase focuses on mobilizing additional resources to expand and operationalize the Virtual Hearing Rooms, enhance technical capacity, and scale community outreach and behavioral change interventions. While the project is currently operational in Luanda (Viana and Talatona), equipment is already installed for expansion in other provinces.\nThe initiative is innovative because it integrates digital transformation with human rights protection, reducing structural and geographic barriers to justice. By enabling remote interaction with the Ombudsperson’s Office, it promotes institutional transparency, accountability, and more inclusive public service delivery.\nStakeholders include the Ombudsperson’s Office, the Ministry of Justice and Human Rights, local authorities, civil society organizations, and community-level Human Rights Committees. UNDP provides technical leadership and coordination, drawing on its global experience and strong partnerships to strengthen governance and expand the reach of justice services in Angola.\n\"","es":"La iniciativa \"Justicia Digital y Derechos Humanos en Angola\" fortalece a la Defensoría del Pueblo, una institución independiente con el mandato, establecido en la Constitución de 2010, de promover y proteger los derechos de la ciudadanía y garantizar la legalidad de la administración pública. Desde 2017, el PNUD ha apoyado a la institución mediante la mejora de políticas, procedimientos, reglamentos y competencias del personal, así como del conocimiento público de los servicios de justicia y derechos humanos disponibles.\nEn 2022, el PNUD adquirió equipos informáticos para establecer 44 sedes municipales virtuales en las 18 provincias. Esta inversión creó las condiciones para que la ciudadanía de todo el país acceda a las Salas de Audiencias Virtuales, que le permiten denunciar violaciones de derechos humanos e injusticias cívicas sin necesidad de desplazarse largas distancias. Estas plataformas digitales amplían el acceso a la justicia, fortalecen la supervisión de los servicios públicos y empoderan a la ciudadanía, en particular a los grupos vulnerables, para hacer oír su voz.\nLa fase actual se centra en movilizar recursos adicionales para ampliar y poner en funcionamiento las Salas de Audiencias Virtuales, mejorar la capacidad técnica y escalar las intervenciones de divulgación comunitaria y cambio de comportamiento. Si bien el proyecto opera actualmente en Luanda (Viana y Talatona), el equipamiento ya está instalado para su expansión en otras provincias.\nLa iniciativa es innovadora porque integra la transformación digital con la protección de los derechos humanos, reduciendo las barreras estructurales y geográficas de acceso a la justicia. Al posibilitar la interacción remota con la Defensoría del Pueblo, promueve la transparencia institucional, la rendición de cuentas y una prestación de servicios públicos más inclusiva.\nEntre las partes interesadas se encuentran la Defensoría del Pueblo, el Ministerio de Justicia y Derechos Humanos, las autoridades locales, organizaciones de la sociedad civil y los Comités de Derechos Humanos de nivel comunitario. El PNUD aporta liderazgo técnico y coordinación, aprovechando su experiencia global y sus sólidas alianzas para fortalecer la gobernanza y ampliar el alcance de los servicios de justicia en Angola."},"links":[],"hasPhotos":false,"drive":"Website/redes"},{"id":"c035","tier":"High visibility","category":"Trust Catalysts","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Bora Entender","org":"TV Câmara/ Câmara dos Deputados","desc":{"en":"Bora Entender (Let's Understand) is a weekly live programme on TV Câmara—Brazil's parliamentary television channel—that simplifies complex legislative topics in plain language. Anchored by a journalist with legislative consultants as guests, the programme accepts live audience questions via social media and phone. Broadcast nationally via Broadcast system (1,600+ municipalities), YouTube, and social networks, an episode on Tax Reform alone received 12,000+ YouTube views. Bora Entender exemplifies how legislative institutions can use public broadcasting to close the gap between lawmaking and citizen understanding—making parliamentary work genuinely accessible.","es":"Bora Entender (Vamos a Entender) es un programa semanal en vivo de TV Câmara —el canal de televisión parlamentaria de Brasil— que simplifica temas legislativos complejos en un lenguaje sencillo. Conducido por un periodista y con consultores legislativos como invitados, el programa recibe preguntas del público en vivo a través de redes sociales y teléfono. Transmitido a nivel nacional mediante el sistema Broadcast (más de 1.600 municipios), YouTube y redes sociales, un solo episodio sobre la Reforma Tributaria alcanzó más de 12.000 visualizaciones en YouTube. Bora Entender ejemplifica cómo las instituciones legislativas pueden utilizar la radiodifusión pública para cerrar la brecha entre la elaboración de leyes y la comprensión ciudadana, haciendo el trabajo parlamentario genuinamente accesible."},"details":{"en":"\"The Bora Entender program was created from the interest of TV Câmara and the Legislative Consultancy of the Chamber of Deputies in facilitating the understanding of the projects and legislative processes that are discussed and voted on in Parliament. The idea of the program is to simplify and detail, with simple language, topics often difficult to understand with the aim of reducing the distance between the citizen and the laws that guide their citizenship.\nBora Entender is an interview program anchored by a journalist and presented live from the TV Câmara studio, with the participation of legislative consultants. The topics are always chosen among those with the greatest repercussion in society and the public can ask questions that are answered during the program. The Chamber's consultants are specialists in various areas of knowledge who technically advise the deputies in the formulation of laws. And, in some cases, technical specialists linked to the Executive Branch also participate in the debate.\"","es":"El programa Bora Entender nació del interés de TV Câmara y de la Consultoría Legislativa de la Cámara de Diputados en facilitar la comprensión de los proyectos y procesos legislativos que se discuten y votan en el Parlamento. La idea del programa es simplificar y detallar, con un lenguaje sencillo, temas a menudo difíciles de comprender, con el objetivo de reducir la distancia entre la ciudadanía y las leyes que rigen su ciudadanía.\nBora Entender es un programa de entrevistas conducido por un periodista y presentado en vivo desde el estudio de TV Câmara, con la participación de consultores legislativos. Los temas se eligen siempre entre aquellos de mayor repercusión en la sociedad y el público puede formular preguntas que se responden durante el programa. Los consultores de la Cámara son especialistas en diversas áreas del conocimiento que asesoran técnicamente a los diputados en la formulación de las leyes. Y, en algunos casos, también participan en el debate especialistas técnicos vinculados al Poder Ejecutivo."},"links":["\"https://www.camara.leg.br/tv\nhttps://www.youtube.com/channel/UC-ZkSRh-7UEuwXJQ9UMCFJA\""],"hasPhotos":false,"drive":null},{"id":"c036","tier":"High visibility","category":"Inclusive Voices","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Socio-educational Reporters","org":"Making Justice Programme (Programa Fazendo Justiça) – United Nations Development Programme (UNDP) and National Council of Justice (CNJ Brazil)","desc":{"en":"Socio-educational Reporters is a journalism workshop created by UNDP's Making Justice Programme (in partnership with Brazil's National Council of Justice) for adolescents serving socio-educational measures in Brazil's juvenile justice system. The initiative trained young people to cover the 2025 Literary Pathways event—an annual cultural program for youth in socio-educational facilities—shifting their role from news subjects to authors. In the 4th edition, 84 facilities across all 27 Brazilian states participated. The adolescents' journalism ensured decentralized, regionally diverse coverage, and the approach received strong CNJ backing as a model for youth-centered communication in justice contexts.","es":"Reporteros Socioeducativos es un taller de periodismo creado por el Programa Haciendo Justicia del PNUD (en alianza con el Consejo Nacional de Justicia de Brasil) para adolescentes que cumplen medidas socioeducativas en el sistema de justicia juvenil de Brasil. La iniciativa capacitó a jóvenes para cubrir la edición 2025 del evento Caminos Literarios —un programa cultural anual para jóvenes en centros socioeducativos—, transformando su papel de sujetos de las noticias a autores. En la 4.ª edición participaron 84 centros de los 27 estados brasileños. El periodismo realizado por los adolescentes garantizó una cobertura descentralizada y regionalmente diversa, y el enfoque recibió un firme respaldo del CNJ como modelo de comunicación centrada en la juventud en contextos de justicia."},"details":{"en":"\"Through the Making Justice Programme, the United Nations Development Programme (UNDP) partners with the National Council of Justice (CNJ) to deliver transformative actions within Brazil’s criminal and socio-educational (juvenile justice) systems.\nSince 2022, the Programme organises annually the  Literary Pathways in the Socio-educational System (Caminhos Literários no Socioeducativo), an event that brings together hundreds of adolescents serving socio-educational measures in virtual and in-person activities focused on culture and artistic expression, including lectures, workshops, and musical and audiovisual performances prepared by the young participants themselves. In its 4th edition (2025), the event engaged 84 participating facilities, with representatives from all 27 federative units of Brazil.\nThe project was developed by the Making Justice Progra
