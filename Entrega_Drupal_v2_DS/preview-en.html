e líderes y un Observatorio Ciudadano de Compromisos, el proyecto permite a las organizaciones locales monitorear los acuerdos multisectoriales, promover la participación cívica y reducir la conflictividad. Al integrar la comunicación intercultural, las herramientas digitales y la difusión en lengua quechua, empodera a la ciudadanía como auditores sociales activos y ofrece un modelo replicable de gobernanza democrática en territorios mineros de alta conflictividad."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":"Descripción corta"},{"id":"c093","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"AR","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Argentina","es":"Argentina"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Herramientas para modernizar la escritura en la Universidad Nacional de Córdoba: la experiencia de elaboración del manual Escribir textos administrativos en la UNC con perspectiva de género y lenguaje jurídico claro","org":"Universidad Nacional de Córdoba-Secretaría de Gestión Institucional","desc":{"en":"The writing modernization tools for the National University of Córdoba (UNC) consist of an inclusive institutional writing manual developed by UNC's Secretariat of Institutional Management, addressing communication habits inherited from the university's ecclesiastical and juridical origins. Formally adopted by Resolution 8/2022 and presented by the rector at the university's Supreme Governing Body, the manual has been applied in training sessions at UNC and other Argentine universities. Accessible through the University Digital Repository, it is a model for how higher education institutions can systematically reform administrative communication practices toward clarity, inclusion, and equity.","es":"Las herramientas de modernización de la escritura para la Universidad Nacional de Córdoba (UNC) consisten en un manual institucional de escritura inclusiva elaborado por la Secretaría de Gestión Institucional de la UNC, que aborda hábitos de comunicación heredados de los orígenes eclesiásticos y jurídicos de la universidad. Adoptado formalmente mediante la Resolución 8/2022 y presentado por el rector ante el máximo órgano de gobierno de la universidad, el manual se ha aplicado en sesiones de capacitación en la UNC y en otras universidades argentinas. Disponible a través del Repositorio Digital Universitario, constituye un modelo de cómo las instituciones de educación superior pueden reformar sistemáticamente sus prácticas de comunicación administrativa hacia la claridad, la inclusión y la equidad."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c094","tier":"Noteworthy","category":"Trust Catalysts","categorySource":"official","iso":"CO","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Colombia","es":"Colombia"},"type":{"en":"Public institution","es":"Institución pública"},"name":"CoLabora - Laboratorio de Innovación Pública de la Alcaldía de Bucaramanga","org":"Secretaría Jurídica - Alcaldía de Bucaramanga","desc":{"en":"CoLabora is Bucaramanga's first public innovation laboratory in northeastern Colombia, created through a co-design process that gave residents and stakeholders direct input into its identity and strategic direction. Uniquely originated as a university thesis project earning a laureate distinction before being formally adopted by the city as a transparency and anti-corruption platform, CoLabora strengthens citizen-government dialogue through co-creation and open innovation. A citizen workshop with 50+ participants and a technical focus group with 8+ university representatives shaped its design—establishing a model of bottom-up institutional public communication innovation.","es":"CoLabora es el primer laboratorio de innovación pública de Bucaramanga, en el nororiente de Colombia, creado mediante un proceso de codiseño que dio a residentes y actores interesados una participación directa en la definición de su identidad y su dirección estratégica. Con un origen singular como proyecto de tesis universitaria que obtuvo distinción laureada antes de ser adoptado formalmente por la ciudad como plataforma de transparencia y lucha contra la corrupción, CoLabora fortalece el diálogo entre la ciudadanía y el gobierno a través de la cocreación y la innovación abierta. Un taller ciudadano con más de 50 participantes y un grupo focal técnico con más de 8 representantes universitarios dieron forma a su diseño, estableciendo un modelo de innovación en comunicación pública institucional construido desde la base."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c095","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"PA","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Panama","es":"Panamá"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Plataforma de divulgación de ciencia “IMAGiNA”","org":"Secretaría Nacional de Ciencia, Tecnología e Innovación","desc":{"en":"IMAGiNA is SENACYT’s science communication platform in Panama, designed to make science, technology, and innovation accessible and engaging through radio, television, magazines, and digital channels. Created in 2016, it promotes scientific literacy, citizen participation, and evidence-based decision-making by sharing research, innovation, and human-interest stories with students, educators, families, researchers, journalists, and the wider public. Led by SENACYT and supported by media partners, IMAGiNA innovatively translates complex scientific knowledge into accessible content, strengthening transparency, public engagement, and the role of science in national development","es":"IMAGiNA es la plataforma de comunicación científica de la SENACYT en Panamá, diseñada para hacer que la ciencia, la tecnología y la innovación sean accesibles y atractivas a través de la radio, la televisión, revistas y canales digitales. Creada en 2016, promueve la alfabetización científica, la participación ciudadana y la toma de decisiones basada en evidencia al compartir investigaciones, innovaciones e historias de interés humano con estudiantes, educadores, familias, investigadores, periodistas y el público en general. Liderada por la SENACYT y con el apoyo de aliados de medios de comunicación, IMAGiNA traduce de manera innovadora el conocimiento científico complejo en contenidos accesibles, fortaleciendo la transparencia, la participación pública y el papel de la ciencia en el desarrollo nacional."},"details":{"en":null,"es":null},"links":["https://www.youtube.com/watch?v=pBN7dJs3ru4&list=PL-sFT3QktGzba5TWWuzP7-_ZfDQbvhfIX&index=8"],"hasPhotos":false,"drive":"Descripción corta"},{"id":"c096","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"EC","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Ecuador","es":"Ecuador"},"type":{"en":"Social innovation organization","es":"Organización de innovación social"},"name":"Florece: Comunicación Pública para la Sostenibilidad y la Acción Comunitaria","org":"Florece EC","desc":{"en":"Florece is a public communication initiative in Ecuador that translates complex sustainability, environmental management, and civic responsibility topics into clear, accessible, and actionable messages for urban communities—particularly youth and families with limited access to technical sustainability information. The initiative bridges the gap between environmental public policies and everyday community life through educational formats and community dialogue spaces. Using outreach content and communication activities, Florece has contributed to increased understanding of concepts like recycling, reuse, and environmental care, transforming them into concrete daily behaviors. Community testimonials document heightened environmental awareness—demonstrating how social innovation organizations can serve as accessible communication intermediaries for complex environmental governance themes.","es":"Florece es una iniciativa de comunicación pública en Ecuador que traduce temas complejos de sostenibilidad, gestión ambiental y responsabilidad cívica en mensajes claros, accesibles y accionables para las comunidades urbanas, en particular jóvenes y familias con acceso limitado a información técnica sobre sostenibilidad. La iniciativa tiende un puente entre las políticas públicas ambientales y la vida cotidiana de las comunidades mediante formatos educativos y espacios de diálogo comunitario. A través de contenidos de divulgación y actividades de comunicación, Florece ha contribuido a una mayor comprensión de conceptos como el reciclaje, la reutilización y el cuidado ambiental, transformándolos en conductas cotidianas concretas. Los testimonios comunitarios documentan una mayor conciencia ambiental, lo que demuestra cómo las organizaciones de innovación social pueden actuar como intermediarias de comunicación accesible para temas complejos de gobernanza ambiental."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c097","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"ES","lang":"Spanish","region":{"en":"Europe","es":"Europa"},"country":{"en":"Spain","es":"España"},"type":{"en":"Civil society organisation","es":"Organización de la sociedad civil"},"name":"NovaBurocracIA El podcast de la innovación en la Administración Pública","org":"Fundación NovaGob","desc":{"en":"NovaBurocracIA is a specialized podcast on public innovation, digital transformation, bureaucracy, and AI in the public sector, launched in June 2025 by Fundación NovaGob in collaboration with Valencia Innovation Capital. Building on NovaGob's 10+ year track record connecting public sector professionals, the podcast has accumulated 2,000+ YouTube views and 641 Spotify plays, reaching a national and international reference network for Spanish-speaking public innovators. NovaBurocracIA demonstrates how podcasting can serve as an accessible knowledge transfer vehicle for complex governance transformation topics across institutional boundaries.","es":"NovaBurocracIA es un pódcast especializado en innovación pública, transformación digital, burocracia e IA en el sector público, lanzado en junio de 2025 por la Fundación NovaGob en colaboración con Valencia Innovation Capital. Sobre la base de la trayectoria de más de 10 años de NovaGob conectando a profesionales del sector público, el pódcast ha acumulado más de 2,000 visualizaciones en YouTube y 641 reproducciones en Spotify, llegando a una red de referencia nacional e internacional de innovadores públicos de habla hispana. NovaBurocracIA demuestra cómo el pódcast puede servir como un vehículo accesible de transferencia de conocimiento sobre temas complejos de transformación de la gobernanza, más allá de las fronteras institucionales."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c098","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"PE","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Peru","es":"Perú"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Minisite ORH Informa: Conoce y comparte todas las actividades que la ORH desarrolla para ti","org":"Autoridad Nacional del Servicio Civil - SERVIR","desc":{"en":"ORH Informa is a strategic digital internal communication minisite developed by Peru's National Civil Service Authority (SERVIR) to serve civil servants with a centralized, modern information channel. Functioning as the official repository for Human Resources Office activities, campaigns, and institutional news, it promotes active participation, reduces information gaps, and strengthens organizational belonging. In 2025, ORH Informa consolidated as a digital ecosystem transforming how SERVIR manages internal communication—demonstrating high staff engagement through platform metrics and showing how structured digital platforms can create informed and connected civil service teams.","es":"ORH Informa es un minisitio estratégico de comunicación interna digital desarrollado por la Autoridad Nacional del Servicio Civil (SERVIR) del Perú para ofrecer a los servidores públicos un canal de información centralizado y moderno. Al funcionar como el repositorio oficial de las actividades, campañas y noticias institucionales de la Oficina de Recursos Humanos, promueve la participación activa, reduce las brechas de información y fortalece el sentido de pertenencia organizacional. En 2025, ORH Informa se consolidó como un ecosistema digital que transforma la manera en que SERVIR gestiona la comunicación interna, evidenciando un alto nivel de involucramiento del personal a través de las métricas de la plataforma y mostrando cómo las plataformas digitales estructuradas pueden crear equipos del servicio civil informados y conectados."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c099","tier":"Noteworthy","category":"Exploring New Frontiers","categorySource":"official","iso":"EC","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Ecuador","es":"Ecuador"},"type":{"en":"Private sector","es":"Sector privado"},"name":"Mangle inc.","org":"Cámra de Industrias de Guayaquil (CIG)","desc":{"en":"Mangle Inc. is a citizen security and peaceful coexistence initiative in Guayaquil, Ecuador, organized by the Chamber of Industries of Guayaquil (CIG). Coordinating multi-stakeholder prevention projects, it aims to build safer communities and promote a culture of peace. In 2025, Mangle Inc. participated in 4 major print media publications, was mentioned on 5 Guayaquil radio stations, and featured on civil society web pages. Social projects implemented during the year impacted 6,000+ people including children, youth, community leaders, neighborhood associations, and businesses—positioning it as a multi-sector civic communication model for urban peace-building.","es":"Mangle Inc. es una iniciativa de seguridad ciudadana y convivencia pacífica en Guayaquil, Ecuador, organizada por la Cámara de Industrias de Guayaquil (CIG). Mediante la coordinación de proyectos de prevención con múltiples actores, busca construir comunidades más seguras y promover una cultura de paz. En 2025, Mangle Inc. participó en 4 publicaciones importantes de medios impresos, fue mencionada en 5 emisoras de radio de Guayaquil y apareció en páginas web de la sociedad civil. Los proyectos sociales implementados durante el año impactaron a más de 6,000 personas, incluidos niños, jóvenes, líderes comunitarios, asociaciones barriales y empresas, posicionándola como un modelo de comunicación cívica multisectorial para la construcción de paz urbana."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c100","tier":"Noteworthy","category":"Inclusive Voices","categorySource":"official","iso":"AR","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Argentina","es":"Argentina"},"type":{"en":"University or research centre","es":"Universidad o centro de investigación"},"name":"Visible lo Invisible","org":"Universidad Nacional de Rosario","desc":{"en":"Visible lo Invisible is an institutional science and technology public communication policy by the National University of Rosario (UNR) in Argentina—an immersive interactive fair integrating sciences, arts, and technologies through the thematic narrative of 'Footprints' (Huellas). It includes experimentation labs, an educational escape room, and a baby library. Since 2022, the fair has held 4 editions, growing from approximately 2,500 to 4,000 attendees in 2025. Surveys show 40.7% of attendees are aged 9–12, positioning the public university as an accessible space for non-formal science learning and fostering early scientific vocations.","es":"Visible lo Invisible es una política institucional de comunicación pública de la ciencia y la tecnología de la Universidad Nacional de Rosario (UNR) en Argentina: una feria interactiva e inmersiva que integra las ciencias, las artes y las tecnologías a través de la narrativa temática de 'Huellas'. Incluye laboratorios de experimentación, una sala de escape educativa y una bebeteca. Desde 2022, la feria ha realizado 4 ediciones, pasando de aproximadamente 2,500 a 4,000 asistentes en 2025. Las encuestas muestran que el 40.7% de los asistentes tiene entre 9 y 12 años, lo que posiciona a la universidad pública como un espacio accesible para el aprendizaje no formal de las ciencias y fomenta vocaciones científicas tempranas."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c101","tier":"Noteworthy","category":"Trust Catalysts","categorySource":"official","iso":"PY","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Paraguay","es":"Paraguay"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Impulso de las Microfinanzas en Paraguay, mediante incentivos competitivos para mejorar las condiciones de acceso al crédito de Mypes","org":"AGENCIA FINANCIERA DE DESARROLLO (AFD)","desc":{"en":"Led by Paraguay’s Agencia Financiera de Desarrollo (AFD) with support from Taiwan’s ICDF, this initiative improves access to finance for micro and small enterprises (MSEs) through an innovative, competitive funding mechanism for savings and credit cooperatives. Participating cooperatives submit proposals offering enhanced lending conditions, such as lower interest rates, longer repayment periods, improved guarantees, and gender-focused approaches, with funding awarded to the strongest proposals. The program promotes transparency, efficiency, and innovation in microfinance, aiming to channel USD 9 million to cooperatives and benefit more than 4,000 MSEs, thereby strengthening financial inclusion and economic development in Paraguay.","es":"Liderada por la Agencia Financiera de Desarrollo (AFD) del Paraguay con el apoyo del ICDF de Taiwán, esta iniciativa mejora el acceso al financiamiento de las micro y pequeñas empresas (MYPE) mediante un mecanismo innovador de financiamiento competitivo para cooperativas de ahorro y crédito. Las cooperativas participantes presentan propuestas que ofrecen mejores condiciones de préstamo, como tasas de interés más bajas, plazos de pago más largos, mejores garantías y enfoques centrados en el género, y el financiamiento se adjudica a las propuestas más sólidas. El programa promueve la transparencia, la eficiencia y la innovación en las microfinanzas, con el objetivo de canalizar USD 9 millones hacia las cooperativas y beneficiar a más de 4,000 MYPE, fortaleciendo así la inclusión financiera y el desarrollo económico en el Paraguay."},"details":{"en":null,"es":null},"links":["https://www.afd.gov.py/"],"hasPhotos":false,"drive":"Descripción corta"},{"id":"c102","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"AR","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Argentina","es":"Argentina"},"type":{"en":"Public institution","es":"Institución pública"},"name":"\"Gobierno Digital\", innovación en comunicación pública para un Estado accesible y cercano","org":"Ministerio de Economía y Gestión Pública del Gobierno de la Provincia de Córdoba","desc":{"en":"Gobierno Digital is a public communication campaign by Córdoba province in Argentina, launched in 2021, to increase citizen awareness and uptake of digital services through the Ciudadano Digital (CiDi) platform—a single digital identity and service gateway. Using clear, useful content to inform citizens about available procedures, the campaign reached 1.79 million people on social networks with 810,000+ interactions and enabled 4,500+ citizen conversations. CiDi integrates digital identity, electronic notifications, and over 100 provincial and municipal services—making Gobierno Digital a cornerstone of Córdoba's digital governance transformation.","es":"Gobierno Digital es una campaña de comunicación pública de la provincia de Córdoba, en Argentina, lanzada en 2021 para aumentar el conocimiento ciudadano y la adopción de servicios digitales a través de la plataforma Ciudadano Digital (CiDi), una identidad digital única y puerta de acceso a servicios. Mediante contenidos claros y útiles para informar a la ciudadanía sobre los trámites disponibles, la campaña alcanzó a 1.79 millones de personas en redes sociales, con más de 810,000 interacciones, y facilitó más de 4,500 conversaciones ciudadanas. CiDi integra identidad digital, notificaciones electrónicas y más de 100 servicios provinciales y municipales, lo que convierte a Gobierno Digital en un pilar de la transformación de la gobernanza digital de Córdoba."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c103","tier":"Noteworthy","category":"Dialogue Builders","categorySource":"official","iso":"VE","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Venezuela","es":"Venezuela"},"type":{"en":"Civil society organisation","es":"Organización de la sociedad civil"},"name":"Libertades públicas","org":"Consultora Gerencial","desc":{"en":null,"es":null},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":"Descripción corta"},{"id":"c104","tier":"Noteworthy","category":"Clarity in Action","categorySource":"proposed","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Edital do Processo Eleitoral para Ouvidor Externo Geral da Defensoria Pública","org":"Defensoria Pública do Estado do Ceará – Laboratório de Inovação (CLIC)","desc":{"en":"This initiative by the Public Defender’s Office of Ceará strengthens citizen participation in the selection of its External Ombudsman by redesigning the application process using plain language and accessible communication. Aligned with Brazil’s National Plain Language Policy and the institution’s own Plain Language Policy, it promotes transparency, inclusiveness, and accessibility, making participatory processes easier to understand and engage with while reinforcing democratic governance and innovation in the public sector.","es":"Esta iniciativa de la Defensoría Pública de Ceará fortalece la participación ciudadana en la selección de su Ombudsman Externo mediante el rediseño del proceso de postulación con lenguaje claro y comunicación accesible. Alineada con la Política Nacional de Lenguaje Claro del Brasil y con la propia Política de Lenguaje Claro de la institución, promueve la transparencia, la inclusión y la accesibilidad, haciendo que los procesos participativos sean más fáciles de comprender y de involucrarse en ellos, al tiempo que refuerza la gobernanza democrática y la innovación en el sector público."},"details":{"en":null,"es":null},"links":["https://www.defensoria.ce.def.br/               https://www.instagram.com/defensoriaceara?igsh=MXY1dXMwY2p1NHI1aA=="],"hasPhotos":false,"drive":"Descripción corta"},{"id":"c105","tier":"Noteworthy","category":"Inclusive Voices","categorySource":"proposed","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Media","es":"Medio de comunicación"},"name":"Programa jornalístico Conexões","org":"TV UFG","desc":{"en":"Conexões (Connections) is a daily live journalism programme by TV UFG, University of Goiás, distinguished by presenting simultaneously a journalist and a Brazilian Sign Language (Libras) interpreter who share equal screen space. Every piece of content is simultaneously translated into Libras, ensuring full accessibility for deaf and hard-of-hearing audiences. Developed with research-grounded methodology by the Accessible Audiovisual Translation Lab (LabTavi), the programme addresses socially relevant topics underreported by commercial media. Its relevance extends beyond deaf audiences: hearing viewers also recognize the importance of inclusion and representation—establishing an ethical standard for accessible public broadcasting that transcends mere captioning.","es":"Conexões (Conexiones) es un programa periodístico diario en vivo de TV UFG, de la Universidad de Goiás, que se distingue por presentar simultáneamente a un periodista y a un intérprete de la Lengua Brasileña de Señas (Libras) que comparten el mismo espacio en pantalla. Todo el contenido se traduce simultáneamente a Libras, garantizando la plena accesibilidad para las audiencias sordas y con discapacidad auditiva. Desarrollado con una metodología fundamentada en la investigación por el Laboratorio de Traducción Audiovisual Accesible (LabTavi), el programa aborda temas socialmente relevantes poco cubiertos por los medios comerciales. Su relevancia trasciende a las audiencias sordas: los televidentes oyentes también reconocen la importancia de la inclusión y la representación, estableciendo un estándar ético para la radiodifusión pública accesible que va más allá de la simple subtitulación."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c106","tier":"Noteworthy","category":"Dialogue Builders","categorySource":"proposed","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Santo André pelo Clima - diálogos que transformam","org":"Secretaria de Meio Ambiente e Mudanças Climáticas/ Serviço Municipal de Saneamento Ambiental de Santo André - Semasa","desc":{"en":"The Santo André for Climate: Dialogues that Transform initiative advances Santo André’s climate agenda by developing the municipality’s first Climate Change Policy through an inclusive and participatory process that engages civil society, public institutions, the private sector, universities, and communities of all ages. Building on the Santo André for Climate Program, it establishes permanent dialogue mechanisms, prioritizes underrepresented groups such as children and youth, and promotes shared responsibility for climate action. By making public communication the foundation of policymaking, the initiative transforms citizen participation into concrete decision-making, creating a democratic, collaborative, and actionable model for local climate governance.","es":"La iniciativa Santo André por el Clima: Diálogos que Transforman impulsa la agenda climática de Santo André mediante el desarrollo de la primera Política de Cambio Climático del municipio, a través de un proceso inclusivo y participativo que involucra a la sociedad civil, las instituciones públicas, el sector privado, las universidades y las comunidades de todas las edades. Sobre la base del Programa Santo André por el Clima, establece mecanismos permanentes de diálogo, prioriza a grupos subrepresentados como los niños y los jóvenes, y promueve la responsabilidad compartida frente a la acción climática. Al hacer de la comunicación pública el fundamento de la formulación de políticas, la iniciativa transforma la participación ciudadana en decisiones concretas, creando un modelo democrático, colaborativo y accionable para la gobernanza climática local."},"details":{"en":null,"es":null},"links":["Site: www.semasa.sp.gov.br / Facebook: https://www.facebook.com/SemasaSantoAndre/   Instagram: https://www.instagram.com/semasasantoandre"],"hasPhotos":false,"drive":"Descripción corta"},{"id":"c107","tier":"Noteworthy","category":"Clarity in Action","categorySource":"proposed","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Community or collective","es":"Comunidad o colectivo"},"name":"Caixa de Ferramentas do Linguagem Simples Lab","org":"Linguagem Simples Lab","desc":{"en":"The Plain Language Lab Toolbox by the Linguagem Simples Lab (LS Lab) is a voluntary initiative supporting teams and institutions in improving public communication—making documents clearer, more accessible, and better aligned with users' needs. Developed between 2023 and 2025 by volunteer LS Lab members, the toolbox was incorporated into the InnovaGov Network Library. Featured in 4 national event workshops and producing 4 prototypes during LS Lab Simplification Journeys, it has inspired additional plain language tools—establishing it as a collaborative grassroots contribution to Brazil's growing plain language movement.","es":"La Caja de Herramientas del Laboratorio de Lenguaje Claro, del Linguagem Simples Lab (LS Lab), es una iniciativa voluntaria que apoya a equipos e instituciones en la mejora de la comunicación pública, haciendo que los documentos sean más claros, más accesibles y estén mejor alineados con las necesidades de los usuarios. Desarrollada entre 2023 y 2025 por miembros voluntarios del LS Lab, la caja de herramientas fue incorporada a la Biblioteca de la Red InnovaGov. Presentada en talleres de 4 eventos nacionales y con 4 prototipos producidos durante las Jornadas de Simplificación del LS Lab, ha inspirado herramientas adicionales de lenguaje claro, consolidándose como una contribución colaborativa de base al creciente movimiento de lenguaje claro en el Brasil."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c109","tier":"Noteworthy","category":"Dialogue Builders","categorySource":"proposed","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Expressão Nacional","org":"TV Câmara/Câmara dos Deputados","desc":{"en":"Expressão Nacional (National Expression) is a multi-platform debate programme on TV Câmara—Brazil's parliamentary channel—that brings together legislators, experts, government representatives, civil society organizations, and citizens to discuss legislation impacting Brazilians' daily lives. The programme receives live questions via social media, email, and phone from across all regions, creating a democratic interactive public space. Over the years, debates have been cited in press coverage and academic work, and the programme has influenced actual legislative deliberations—with viewers and legislators proposing amendments based on discussions. Expressão Nacional exemplifies how parliamentary television can function as genuine civic communication infrastructure.","es":"Expressão Nacional (Expresión Nacional) es un programa de debate multiplataforma de TV Câmara, el canal parlamentario del Brasil, que reúne a legisladores, expertos, representantes del gobierno, organizaciones de la sociedad civil y ciudadanos para discutir la legislación que impacta la vida cotidiana de los brasileños. El programa recibe preguntas en vivo a través de redes sociales, correo electrónico y teléfono desde todas las regiones, creando un espacio público interactivo y democrático. A lo largo de los años, los debates han sido citados en la cobertura de prensa y en trabajos académicos, y el programa ha influido en deliberaciones legislativas reales, con televidentes y legisladores que han propuesto enmiendas a partir de las discusiones. Expressão Nacional ejemplifica cómo la televisión parlamentaria puede funcionar como una verdadera infraestructura de comunicación cívica."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c110","tier":"Noteworthy","category":"Exploring New Frontiers","categorySource":"proposed","iso":"","lang":"English","region":{"en":"Asia & the Pacific","es":"Asia y el Pacífico"},"country":{"en":"Regional — Asia & the Pacific","es":"Regional — Asia y el Pacífico"},"type":{"en":"Public institution","es":"Institución pública"},"name":"U=U Dance Challenge","org":"UNAIDS","desc":{"en":"The U=U Dance Challenge is a youth-led social media initiative by UNAIDS Asia Pacific communicating the scientific consensus that HIV is Undetectable = Untransmittable (U=U). Launched around World AIDS Day 2024, the initiative uses an original song and a simple hand dance to make the U=U message shareable for young audiences across the Asia Pacific region. Five organizations joined the challenge, generating 120,000+ organic views across X, Instagram, and Facebook. Qualitative feedback indicated the format made U=U more approachable and supported more normalized HIV discussions. The initiative received recognition at the UNAIDS Programme Coordinating Board meeting—demonstrating how creative social media formats can effectively communicate complex public health evidence.","es":"El U=U Dance Challenge es una iniciativa de redes sociales liderada por jóvenes de ONUSIDA Asia Pacífico que comunica el consenso científico de que el VIH Indetectable = Intransmisible (U=U). Lanzada en torno al Día Mundial del Sida de 2024, la iniciativa utiliza una canción original y una sencilla coreografía de manos para hacer que el mensaje U=U sea fácil de compartir entre las audiencias jóvenes de la región de Asia y el Pacífico. Cinco organizaciones se sumaron al reto, generando más de 120,000 visualizaciones orgánicas en X, Instagram y Facebook. La retroalimentación cualitativa indicó que el formato hizo que el mensaje U=U resultara más cercano y contribuyó a normalizar las conversaciones sobre el VIH. La iniciativa recibió un reconocimiento en la reunión de la Junta Coordinadora del Programa de ONUSIDA, lo que demuestra cómo los formatos creativos en redes sociales pueden comunicar eficazmente evidencia compleja de salud pública."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c111","tier":"Noteworthy","category":"Dialogue Builders","categorySource":"proposed","iso":"DE","lang":"English","region":{"en":"Europe","es":"Europa"},"country":{"en":"Germany / United Kingdom","es":"Alemania / Reino Unido"},"type":{"en":"Private sector","es":"Sector privado"},"name":"From dialogue to decisions: AI-supported participatory social planning (Siegen‑Wittgenstein District, Germany, 2024)","org":"deliberAIde","desc":{"en":"deliberAIde is an AI-assisted public participation tool piloted in 2024 by Germany's District of Siegen-Wittgenstein during ten participatory social planning conferences across ten municipalities. The tool supported moderators with consent-based audio recording, real-time anonymized transcription visible to participants, and structured thematic summaries feeding directly into planning workflows—reducing documentation effort compared to fully manual methods. Approximately 500 participants engaged across the conferences. The pilot demonstrates a privacy-respecting model for AI-supported citizen participation documentation that turns dialogue into actionable policy inputs while maintaining community trust.","es":"deliberAIde es una herramienta de participación pública asistida por IA, puesta a prueba en 2024 por el distrito de Siegen-Wittgenstein, en Alemania, durante diez conferencias participativas de planificación social realizadas en diez municipios. La herramienta apoyó a los moderadores con grabación de audio basada en consentimiento, transcripción anonimizada en tiempo real visible para los participantes y resúmenes temáticos estructurados que alimentaban directamente los flujos de trabajo de planificación, reduciendo el esfuerzo de documentación en comparación con los métodos totalmente manuales. Aproximadamente 500 personas participaron en las conferencias. El piloto demuestra un modelo respetuoso de la privacidad para la documentación de la participación ciudadana con apoyo de IA, que convierte el diálogo en insumos de política accionables mientras preserva la confianza de la comunidad."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c112","tier":"Noteworthy","category":"Clarity in Action","categorySource":"proposed","iso":"AR","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Argentina","es":"Argentina"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Creación de micrositio web: redacta simple unc","org":"Universidad Nacional de Córdoba","desc":{"en":null,"es":null},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":"Descripción corta"},{"id":"c113","tier":"Noteworthy","category":"Inclusive Voices","categorySource":"proposed","iso":"AR","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Argentina","es":"Argentina"},"type":{"en":"Public institution","es":"Institución pública"},"name":"REE SI! Red de Empoderamiento y Educación Sexual Integral","org":"Consejo Provincial de Mujeres, la Igualdad de Género y el respeto a las Diversidades del Gobierno de Jujuy,","desc":{"en":"REE SI! (Comprehensive Sexual Education and Empowerment Network) is an initiative supported by UNFPA and UNAIDS, implemented by Jujuy Province's Council for Women and Gender Equality in Argentina. Using a Training of Trainers (TOT) peer-education model, it forms networks of youth promoters (ages 13–24) and adult references to address gender-based violence, mental health, bullying, and cyberbullying. In 2024, the network reached 37 youth promoters and 69 adult references in two Jujuy cities; by 2025, participation grew to 127 youth promoters and 113 adults—demonstrating strong scalability. The initiative creates intergenerational spaces for rights-based dialogue on sensitive topics, strengthening youth agency and promoting informed decision-making in communities with limited access to formal health and education services.","es":"REE SI! (Red de Educación Sexual Integral y Empoderamiento) es una iniciativa apoyada por el UNFPA y ONUSIDA, implementada por el Consejo de la Mujer e Igualdad de Género de la Provincia de Jujuy, en Argentina. Mediante un modelo de educación entre pares de Formación de Formadores (TOT), conforma redes de jóvenes promotores (de 13 a 24 años) y referentes adultos para abordar la violencia de género, la salud mental, el bullying y el ciberbullying. En 2024, la red alcanzó a 37 jóvenes promotores y 69 referentes adultos en dos ciudades de Jujuy; para 2025, la participación creció a 127 jóvenes promotores y 113 adultos, lo que demuestra una gran escalabilidad. La iniciativa crea espacios intergeneracionales de diálogo basado en derechos sobre temas sensibles, fortaleciendo la agencia juvenil y promoviendo la toma de decisiones informada en comunidades con acceso limitado a servicios formales de salud y educación."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null}];
