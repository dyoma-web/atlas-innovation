l practices at partner organizations, establishing it as a national reference for accessible public notice design.","es":"Editais para Todos (Convocatorias para Todos), de Fiocruz, aborda la incomprensibilidad de las convocatorias públicas de selección que regulan el acceso a políticas y programas. En un país donde la mayoría de la población tiene escolaridad limitada, las convocatorias tradicionales —técnicas y poco orientadas a las personas usuarias— generan exclusiones. Fiocruz rediseñó las convocatorias utilizando lenguaje claro, diseño centrado en las personas usuarias y accesibilidad en Libras. Las pruebas de usabilidad con residentes de la comunidad de Manguinhos mostraron una mejora de aproximadamente el 75 % en la comprensión entre las personas con educación primaria y secundaria. Desde entonces, la iniciativa ha influido en las prácticas institucionales de organizaciones aliadas, consolidándose como referente nacional en el diseño accesible de convocatorias públicas."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c055","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"ABCDEnergia","org":"EPE","desc":{"en":"ABCDEnergia is a website and podcast by Brazil's Energy Research Company (EPE) answering fundamental questions about electricity, climate change, and energy transition in simple, accessible language for all ages—from basic education students to journalism professionals. First in Google Search results for energy matrix queries in Portuguese, the website has accumulated 650,000+ page views, with three of the EPE site's most accessed pages belonging to ABCDEnergia. The initiative bridges the gap between technical energy planning expertise and public understanding—demonstrating how specialized government institutions can produce citizen-facing knowledge products that become public reference points.","es":"ABCDEnergia es un sitio web y pódcast de la Empresa de Investigación Energética (EPE) de Brasil que responde preguntas fundamentales sobre electricidad, cambio climático y transición energética en un lenguaje simple y accesible para todas las edades, desde estudiantes de educación básica hasta profesionales del periodismo. Primero en los resultados de búsqueda de Google para consultas sobre la matriz energética en portugués, el sitio ha acumulado más de 650.000 visitas de página, y tres de las páginas más visitadas del sitio de la EPE pertenecen a ABCDEnergia. La iniciativa tiende un puente entre la experticia técnica en planificación energética y la comprensión pública, demostrando cómo las instituciones gubernamentales especializadas pueden producir productos de conocimiento orientados a la ciudadanía que se convierten en referentes públicos."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c056","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"O Admirável Mundo do Teletrabalho no Setor Público","org":"LA-BORA!gov - Ministério da Gestão e da Inovação em Serviços Públicos - MGI","desc":{"en":"O Admirável Mundo do Teletrabalho no Setor Público is a series of 8 short videos produced by LA-BORA!gov addressing practical remote work challenges for Brazilian civil servants. Available free on YouTube with inclusive subtitles, episodes cover behavioral profiles, remote collaboration, asynchronous work, autonomy, and the government's Performance Management Programme. The series has accumulated 65,900+ YouTube views, with the introductory video exceeding 20,000 views—the most watched on the Ministry's channel. Featuring real civil servants from various agencies, the series demonstrates that evidence-based, human-centered short video content can effectively drive cultural change within large bureaucratic systems.","es":"O Admirável Mundo do Teletrabalho no Setor Público es una serie de 8 videos cortos producida por LA-BORA!gov que aborda los desafíos prácticos del trabajo remoto para el funcionariado público brasileño. Disponibles gratuitamente en YouTube con subtítulos inclusivos, los episodios cubren perfiles conductuales, colaboración remota, trabajo asincrónico, autonomía y el Programa de Gestión del Desempeño del gobierno. La serie ha acumulado más de 65.900 visualizaciones en YouTube, y el video introductorio supera las 20.000, siendo el más visto del canal del Ministerio. Protagonizada por servidores públicos reales de diversas agencias, la serie demuestra que los contenidos en video corto basados en evidencia y centrados en las personas pueden impulsar eficazmente el cambio cultural dentro de grandes sistemas burocráticos."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c057","tier":"Noteworthy","category":"Exploring New Frontiers","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Ondas de Inovação","org":"Ministério da Gestão e da Inovação em Serviços Públicos","desc":{"en":"Ondas de Inovação (Innovation Waves) is a podcast produced by LA-BORA!gov, Brazil's Ministry of Management and Innovation's innovation lab. The podcast amplifies public sector voices by transforming innovation knowledge into simple, practical narratives that civil servants can apply in their workplaces. Episodes feature real people sharing experiences and lessons, fostering inter-institutional cooperation. Produced at zero additional cost using existing organizational resources, the podcast grew to nearly 19,000 plays by December 2025 with 1,800 Spotify followers through entirely organic growth—demonstrating that accessible, human-centered storytelling can effectively build innovation culture within large bureaucratic systems.","es":"Ondas de Inovação (Olas de Innovación) es un pódcast producido por LA-BORA!gov, el laboratorio de innovación del Ministerio de Gestión e Innovación de Brasil. El pódcast amplifica las voces del sector público al transformar el conocimiento sobre innovación en narrativas simples y prácticas que el funcionariado puede aplicar en sus lugares de trabajo. Los episodios presentan a personas reales que comparten experiencias y aprendizajes, fomentando la cooperación interinstitucional. Producido sin costo adicional utilizando los recursos organizacionales existentes, el pódcast alcanzó casi 19.000 reproducciones a diciembre de 2025 y 1.800 seguidores en Spotify mediante un crecimiento totalmente orgánico, demostrando que la narración accesible y centrada en las personas puede construir eficazmente una cultura de innovación dentro de grandes sistemas burocráticos."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c058","tier":"Noteworthy","category":"Trust Catalysts","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Private sector","es":"Sector privado"},"name":"Social Media Gov","org":"SOCIAL MEDIA GOV","desc":{"en":"Social MedIA Gov is a Brazilian public communication intelligence platform using data analytics and artificial intelligence to provide integrated analysis of institutional government communication throughout a mandate. Developed to support public managers with evidence-based decision-making, the platform analyzes official social media channels, media coverage, and public officials' digital performance—identifying which themes, messages, and formats generate the highest public engagement. Rather than focusing on isolated metrics, Social MedIA Gov enables longitudinal comparative analysis, transforming communication assessment into a governance and transparency tool. It is implemented within government bodies at multiple levels of Brazilian public administration.","es":"Social MedIA Gov es una plataforma brasileña de inteligencia en comunicación pública que utiliza analítica de datos e inteligencia artificial para ofrecer un análisis integrado de la comunicación institucional gubernamental a lo largo de un mandato. Desarrollada para apoyar a los gestores públicos en la toma de decisiones basada en evidencia, la plataforma analiza los canales oficiales de redes sociales, la cobertura mediática y el desempeño digital de los funcionarios públicos, identificando qué temas, mensajes y formatos generan mayor interacción del público. En lugar de centrarse en métricas aisladas, Social MedIA Gov permite un análisis comparativo longitudinal, transformando la evaluación de la comunicación en una herramienta de gobernanza y transparencia. Está implementada en organismos gubernamentales de múltiples niveles de la administración pública brasileña."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c059","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Redes Estaduais de Serviços Públicos para Simplificação e Transformação Digital orientadas ao cidadão","org":"Secretaria de Estado de Transformação Digital","desc":{"en":"The State Networks of Public Services for Simplification and Citizen-Oriented Digital Transformation, established by the Government of Rio de Janeiro, improve public service delivery by making services more understandable, accessible, and user-friendly. Bringing together state and municipal public servants, the initiative promotes collaboration to identify barriers faced by citizens and develop solutions that enhance communication, simplify processes, and improve digital services. By focusing on the citizen experience, especially for those facing informational, cognitive, territorial, or digital challenges, the Networks strengthen public sector capacity, foster inclusive and sustainable digital transformation, reduce access barriers, and reinforce the role of clear communication as a key component of high-quality public services.","es":"Las Redes Estatales de Servicios Públicos para la Simplificación y la Transformación Digital Orientada a la Ciudadanía, establecidas por el Gobierno de Río de Janeiro, mejoran la prestación de servicios públicos haciéndolos más comprensibles, accesibles y fáciles de usar. Al reunir a servidores públicos estatales y municipales, la iniciativa promueve la colaboración para identificar las barreras que enfrenta la ciudadanía y desarrollar soluciones que mejoren la comunicación, simplifiquen los procesos y perfeccionen los servicios digitales. Al centrarse en la experiencia ciudadana, especialmente de quienes enfrentan desafíos informacionales, cognitivos, territoriales o digitales, las Redes fortalecen la capacidad del sector público, fomentan una transformación digital inclusiva y sostenible, reducen las barreras de acceso y refuerzan el papel de la comunicación clara como componente clave de servicios públicos de alta calidad."},"details":{"en":null,"es":null},"links":["https://www.rj.gov.br/digital/redequalidadedigital e https://www.rj.gov.br/digital/rjdigitalmunicipios"],"hasPhotos":false,"drive":"Descripción corta"},{"id":"c060","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"University or research centre","es":"Universidad o centro de investigación"},"name":"Decodificando Direitos e Deveres: um protótipo digital simplificando a linguagem do Código de Ética e Conduta da EBSERH","org":"UFGD - Universidade Federal da Grande Dourados","desc":{"en":"Decodificando Direitos e Deveres is a digital prototype being developed at the Federal University of Grande Dourados (UFGD) through the Ebserh Technological Initiation Programme with CNPq support. The project creates an interactive, simplified digital version of Ebserh's Code of Ethics using plain language, legal design, visual law principles, and an AI response system. It addresses a fundamental communication gap—PNAD 2023 data show only 19.7% of Brazilian adults have completed higher education, meaning complex legal language bars most hospital employees from accessing institutional norms. While still in development, the prototype establishes a precedent for accessibility in internal compliance communication within public health organizations.","es":"Decodificando Direitos e Deveres es un prototipo digital en desarrollo en la Universidad Federal de Grande Dourados (UFGD) a través del Programa de Iniciación Tecnológica de Ebserh con apoyo del CNPq. El proyecto crea una versión digital interactiva y simplificada del Código de Ética de Ebserh utilizando lenguaje claro, diseño legal (legal design), principios de derecho visual y un sistema de respuestas basado en IA. Aborda una brecha de comunicación fundamental: los datos de la PNAD 2023 muestran que solo el 19,7 % de los adultos brasileños ha completado la educación superior, lo que significa que el lenguaje jurídico complejo impide a la mayoría del personal hospitalario acceder a las normas institucionales. Aunque aún está en desarrollo, el prototipo sienta un precedente de accesibilidad en la comunicación interna de cumplimiento dentro de las organizaciones públicas de salud."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c061","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Adoção é vínculo: comunicação pública para desmistificar a adoção e ampliar o acesso à Justiça","org":"Assessoria de Comunicação do Tribunal de Justiça do Ceará","desc":{"en":"Adoção é Vínculo (Adoption is a Bond) is a public communication campaign by the Ceará State Court of Justice that demystifies adoption and promotes children's right to family life. Using educational content, real-life narratives, and plain language on social media, the campaign combats stigmas and guides interested families through the legal process. The first campaign video reached 5,175 accounts, with 45% non-followers—demonstrating the judiciary's capacity to reach audiences beyond its typical institutional base. The initiative transforms a legally complex and emotionally sensitive topic into a clear, inclusive public dialogue, strengthening institutional trust in the judiciary's role in protecting child rights.","es":"Adoção é Vínculo (La adopción es un vínculo) es una campaña de comunicación pública del Tribunal de Justicia del Estado de Ceará que desmitifica la adopción y promueve el derecho de la niñez a la vida familiar. Mediante contenidos educativos, narrativas de la vida real y lenguaje claro en redes sociales, la campaña combate estigmas y orienta a las familias interesadas a lo largo del proceso legal. El primer video de la campaña alcanzó 5.175 cuentas, de las cuales el 45 % no eran seguidoras, lo que demuestra la capacidad del poder judicial para llegar a audiencias más allá de su base institucional habitual. La iniciativa transforma un tema jurídicamente complejo y emocionalmente sensible en un diálogo público claro e inclusivo, fortaleciendo la confianza institucional en el papel del poder judicial en la protección de los derechos de la niñez."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c062","tier":"Noteworthy","category":"Inclusive Voices","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Meu nome, Minha história: comunicação pública para garantir o direito à identidade e à dignidade de pessoas trans","org":"Assessoria de Comunicação do Tribunal de Justiça do Ceará","desc":{"en":"Meu Nome, Minha História (My Name, My Story) is a Ceará State Court of Justice initiative guaranteeing trans people's right to name and gender rectification in civil records, communicated through informative carousels and videos featuring real participants on social media. By explaining a fundamental right clearly and humanely—using real participants' stories—the campaign combats stigma and guides trans people through legal processes. The main carousel reached 37,242 accounts, with 80.3% being non-followers—demonstrating exceptional organic reach beyond typical judicial communication audiences, transforming judicial procedures into concrete inclusion actions.","es":"Meu Nome, Minha História (Mi nombre, mi historia) es una iniciativa del Tribunal de Justicia del Estado de Ceará que garantiza el derecho de las personas trans a la rectificación de nombre y género en los registros civiles, comunicada a través de carruseles informativos y videos con participantes reales en redes sociales. Al explicar un derecho fundamental de manera clara y humana —a partir de las historias de participantes reales—, la campaña combate el estigma y orienta a las personas trans en los procesos legales. El carrusel principal alcanzó 37.242 cuentas, de las cuales el 80,3 % no eran seguidoras, lo que demuestra un alcance orgánico excepcional más allá de las audiencias habituales de la comunicación judicial, transformando los procedimientos judiciales en acciones concretas de inclusión."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c063","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Projeto Foca no Direito 1ª Edição","org":"Tribunal de Justiça do Estado do Ceará - Assessoria de Comunicação Social do TJCE","desc":{"en":"Projeto Foca no Direito (Focus on Rights Project) is a Ceará State Court of Justice initiative training journalism students to cover the judiciary responsibly and accurately. In its first edition (September–October 2025), 174 students from four Ceará universities attended lectures by a judge on the justice system and legal language, then participated in a practical challenge producing their own journalism on TJCE activities. The project addresses a gap in journalism education on legal matters while building bridges between the judiciary and future media professionals, with participants producing applied reportages as direct outputs.","es":"Projeto Foca no Direito (Proyecto Enfoque en el Derecho) es una iniciativa del Tribunal de Justicia del Estado de Ceará que capacita a estudiantes de periodismo para cubrir el poder judicial de manera responsable y precisa. En su primera edición (septiembre-octubre de 2025), 174 estudiantes de cuatro universidades de Ceará asistieron a conferencias impartidas por un juez sobre el sistema de justicia y el lenguaje jurídico, y luego participaron en un desafío práctico produciendo sus propios trabajos periodísticos sobre las actividades del TJCE. El proyecto aborda un vacío en la formación periodística en materia jurídica, al tiempo que tiende puentes entre el poder judicial y los futuros profesionales de los medios, con reportajes aplicados producidos por los participantes como resultados directos."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c064","tier":"Noteworthy","category":"Trust Catalysts","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Judiciário em Evidência","org":"TRIBUNAL DE JUSTIÇA DO CEARÁ","desc":{"en":"Judiciário em Evidência (Judiciary in Evidence) is a Ceará State Court of Justice television programme broadcast for 13 years on five educational TV channels, with approximately 300 editions and 13,000+ YouTube subscribers. Continuously reformulating to stay contemporary, the programme features plain language and highlights TJCE social initiatives and actions with emphasis on humanization and technology. Embedded in the TJCE's 2021–2030 Strategic Plan, it represents a sustained institutional commitment to accessible public communication about judicial activity—bringing the judiciary's work to audiences who might not otherwise engage with it.","es":"Judiciário em Evidência (Poder Judicial en Evidencia) es un programa de televisión del Tribunal de Justicia del Estado de Ceará transmitido durante 13 años en cinco canales de televisión educativa, con aproximadamente 300 ediciones y más de 13.000 suscriptores en YouTube. En continua reformulación para mantenerse actual, el programa emplea lenguaje claro y destaca las iniciativas y acciones sociales del TJCE, con énfasis en la humanización y la tecnología. Integrado en el Plan Estratégico 2021-2030 del TJCE, representa un compromiso institucional sostenido con la comunicación pública accesible sobre la actividad judicial, acercando el trabajo del poder judicial a audiencias que de otro modo no se involucrarían con él."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c065","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"FCB Indoor","org":"TRIBUNAL DE JUSTIÇA DO CEARÁ","desc":{"en":"FCB Indoor is an internal digital communication system at the Clóvis Beviláqua Courthouse of the Ceará State Court of Justice. With the courthouse receiving nearly 5,000 visitors daily—an average of 28,000 per month—waiting room TVs display periodic updates on judicial services, curiosities, and institutional information in direct, accessible language. The system reaches all visitors while they await service, transforming waiting time into an opportunity for civic information delivery—covering services available at the Fortaleza courthouse and other justice units across Ceará. FCB Indoor demonstrates how physical institutional spaces can be leveraged as channels of continuous, accessible public communication.","es":"FCB Indoor es un sistema de comunicación digital interna del Fórum Clóvis Beviláqua, del Tribunal de Justicia del Estado de Ceará. Dado que la sede judicial recibe cerca de 5.000 visitantes diarios —un promedio de 28.000 al mes—, los televisores de las salas de espera muestran actualizaciones periódicas sobre servicios judiciales, curiosidades e información institucional en un lenguaje directo y accesible. El sistema llega a todos los visitantes mientras esperan ser atendidos, transformando el tiempo de espera en una oportunidad para entregar información cívica sobre los servicios disponibles en la sede judicial de Fortaleza y en otras unidades de justicia de Ceará. FCB Indoor demuestra cómo los espacios institucionales físicos pueden aprovecharse como canales de comunicación pública continua y accesible."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c066","tier":"Noteworthy","category":"Inclusive Voices","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Projeto Justiça de Olhos Abertos","org":"Tribunal de Justiça do Ceará","desc":{"en":"Projeto Justiça de Olhos Abertos (Eyes Wide Open Justice Project) is a TJCE initiative providing blind and visually impaired students access to the judiciary. The project included lectures, a guided courthouse visit to observe an actual jury trial, 330 Braille booklets on the justice system, and a simulated jury trial with student participation. At the Hélio Góes Institute for blind youth in Fortaleza, the initiative directly benefited 218 children and adolescents and approximately 400 total participants. Its success exceeded expectations—sighted students from other schools also requested the materials—demonstrating the broader appeal of accessible institutional communication for all audiences.","es":"Projeto Justiça de Olhos Abertos (Proyecto Justicia con los Ojos Abiertos) es una iniciativa del TJCE que brinda a estudiantes ciegos y con discapacidad visual acceso al poder judicial. El proyecto incluyó conferencias, una visita guiada a la sede judicial para observar un juicio con jurado real, 330 cartillas en braille sobre el sistema de justicia y un juicio con jurado simulado con participación estudiantil. En el Instituto Hélio Góes para jóvenes ciegos de Fortaleza, la iniciativa benefició directamente a 218 niños, niñas y adolescentes y a aproximadamente 400 participantes en total. Su éxito superó las expectativas: estudiantes videntes de otras escuelas también solicitaron los materiales, lo que demuestra el atractivo más amplio de la comunicación institucional accesible para todas las audiencias."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c067","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Inovação preservando direitos: um caso real no sistema de justiça","org":"Tribunal de Justiça do Estado do Ceará","desc":{"en":"In 2025, Brazil implemented a public communication initiative to reduce the indiscriminate use of guardianship and promote Supported Decision-Making (SDM) as a legally appropriate and autonomy-respecting alternative for people with disabilities. Although SDM was already established in law, its use remained limited due to technical uncertainty, lack of practical knowledge, and an institutional tendency to favor guardianship. The initiative, primarily aimed at Public Defenders' Offices, used social media, guidance materials, and a practical booklet to highlight the risks of unnecessary guardianship, explain SDM, and provide decision-making criteria in accessible technical language. Targeting public defenders and indirectly influencing judges, technical teams, and justice system users, the campaign demonstrated how strategic communication can serve as a low-cost public policy tool. Monitoring data showed strong engagement among relevant decision-makers, and the intervention was followed by an estimated 20% reduction in guardianship requests and the emergence of the first SDM cases in judicial proceedings. The experience illustrates how communication can address institutional biases, reshape legal practices, strengthen fundamental rights, and offer a replicable model for other contexts and countries.","es":"En 2025, Brasil implementó una iniciativa de comunicación pública para reducir el uso indiscriminado de la curatela y promover la Toma de Decisiones con Apoyo (TDA) como una alternativa jurídicamente apropiada y respetuosa de la autonomía de las personas con discapacidad. Aunque la TDA ya estaba establecida en la ley, su uso seguía siendo limitado debido a la incertidumbre técnica, la falta de conocimiento práctico y una tendencia institucional a favorecer la curatela. La iniciativa, dirigida principalmente a las Defensorías Públicas, utilizó redes sociales, materiales de orientación y una cartilla práctica para destacar los riesgos de la curatela innecesaria, explicar la TDA y proporcionar criterios de decisión en un lenguaje técnico accesible. Orientada a los defensores públicos e influyendo indirectamente en jueces, equipos técnicos y personas usuarias del sistema de justicia, la campaña demostró cómo la comunicación estratégica puede servir como herramienta de política pública de bajo costo. Los datos de monitoreo mostraron una fuerte participación entre los tomadores de decisiones relevantes, y la intervención fue seguida por una reducción estimada del 20 % en las solicitudes de curatela y la aparición de los primeros casos de TDA en procesos judiciales. La experiencia ilustra cómo la comunicación puede abordar sesgos institucionales, redefinir prácticas jurídicas, fortalecer derechos fundamentales y ofrecer un modelo replicable para otros contextos y países."},"details":{"en":null,"es":null},"links":["https://www.tjce.jus.br/noticias/apos-cartilha-produzida-pelo-tjce-pedidos-de-curatela-caem-e-tomada-de-decisao-apoiada-cresce-no-ceara/"],"hasPhotos":false,"drive":"Descripción corta"},{"id":"c068","tier":"Noteworthy","category":"Inclusive Voices","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Projeto Justiça em Libras","org":"Tribunal de Justiça do Ceará","desc":{"en":"Projeto Justiça em Libras (Justice in Brazilian Sign Language) is a TJCE accessibility initiative providing legal education for deaf students and adults. The project delivers seven video lessons in Libras on topics including legal glossary and how to file judicial proceedings, followed by a real courtroom visit with simultaneous Libras interpretation and a mock jury trial. Since its April 2025 launch, the initiative directly benefited 255 people with hearing disabilities. It is the first initiative of its kind in Ceará—marking a historical milestone for deaf access to judicial education and public communication.","es":"Projeto Justiça em Libras (Proyecto Justicia en Lengua de Señas Brasileña) es una iniciativa de accesibilidad del TJCE que brinda educación jurídica a estudiantes y personas adultas sordas. El proyecto ofrece siete videolecciones en Libras sobre temas que incluyen un glosario jurídico y cómo presentar procesos judiciales, seguidas de una visita real a una sala de audiencias con interpretación simultánea en Libras y un juicio con jurado simulado. Desde su lanzamiento en abril de 2025, la iniciativa ha beneficiado directamente a 255 personas con discapacidad auditiva. Es la primera iniciativa de este tipo en Ceará, y marca un hito histórico para el acceso de las personas sordas a la educación judicial y la comunicación pública."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c069","tier":"Noteworthy","category":"Exploring New Frontiers","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"TJCE Mobile","org":"Tribunal de Justiça do Estado do Ceará","desc":{"en":"TJCE Mobile is the Ceará State Court of Justice's institutional mobile app developed since 2018, with the mission of bringing the judiciary closer to the public and democratizing access to justice—especially for socially vulnerable populations. The app offers process consultation, the PJe electronic court system, a legal dictionary, news, and institutional services. In 2025, the app registered 3,627,378 activations, with Process Consultation and PJe features alone accounting for 1.38 million accesses and the Legal Dictionary reaching 106,000 accesses—demonstrating how mobile platforms can be effective channels for inclusive judicial public communication.","es":"TJCE Mobile es la aplicación móvil institucional del Tribunal de Justicia del Estado de Ceará, desarrollada desde 2018 con la misión de acercar el poder judicial a la ciudadanía y democratizar el acceso a la justicia, especialmente para las poblaciones en situación de vulnerabilidad social. La aplicación ofrece consulta de procesos, el sistema judicial electrónico PJe, un diccionario jurídico, noticias y servicios institucionales. En 2025, la aplicación registró 3.627.378 activaciones; las funciones de Consulta de Procesos y PJe concentraron por sí solas 1,38 millones de accesos y el Diccionario Jurídico alcanzó 106.000 accesos, lo que demuestra cómo las plataformas móviles pueden ser canales eficaces para una comunicación pública judicial inclusiva."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c070","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Rio Conectado","org":"Prefeitura do Rio","desc":{"en":"Rio Conectado is Rio de Janeiro City Hall's digital communication ecosystem combining proactive message broadcasts and an automated chatbot to support public policies and services. The system sends active notifications—including CadÚnico scheduling reminders, satisfaction surveys, and IPTU payment alerts—and provides automated citizen guidance. Since implementation, the initiative has delivered 130,000+ active messages, serves 61,000+ citizens via chatbot with 3,000 weekly active users on average, and operates 8 active use cases across multiple city departments. The initiative demonstrates how municipal governments can make public communication proactive, personalized, and scalable using conversational platforms.","es":"Rio Conectado es el ecosistema de comunicación digital de la Alcaldía de Río de Janeiro, que combina el envío proactivo de mensajes y un chatbot automatizado para apoyar políticas y servicios públicos. El sistema envía notificaciones activas —incluidos recordatorios de citas del CadÚnico, encuestas de satisfacción y alertas de pago del IPTU— y brinda orientación automatizada a la ciudadanía. Desde su implementación, la iniciativa ha entregado más de 130.000 mensajes activos, atiende a más de 61.000 ciudadanos a través del chatbot, con un promedio de 3.000 usuarios activos semanales, y opera 8 casos de uso activos en múltiples dependencias municipales. La iniciativa demuestra cómo los gobiernos municipales pueden hacer que la comunicación pública sea proactiva, personalizada y escalable mediante plataformas conversacionales."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c071","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Nudepinho e Nudepinha","org":"Assessoria de Comunicação do Tribunal de Justiça do Ceará (TJCE)","desc":{"en":"Nudepinho e Nudepinha is a communication project-series by the Ceará State Court of Justice developed in partnership between the Special Testimony Unit (Nudepe) and the Communication Office. The series targets children and adolescents who are victims or witnesses of violence and must participate in the Special Testimony judicial procedure—a protective interview format. Through an illustrated booklet, animated video, and accessible audiovisual material, the project prepares young people for court hearings ethically and protectively, reducing anxiety and re-victimization risk. In August 2025, the booklet won the best special printed publication award at the National Justice Communication Award (Conbrascom).","es":"Nudepinho e Nudepinha es una serie-proyecto de comunicación del Tribunal de Justicia del Estado de Ceará, desarrollada en alianza entre la Unidad de Testimonio Especial (Nudepe) y la Oficina de Comunicación. La serie está dirigida a niños, niñas y adolescentes víctimas o testigos de violencia que deben participar en el procedimiento judicial de Testimonio Especial, un formato de entrevista protegida. A través de una cartilla ilustrada, un video animado y material audiovisual accesible, el proyecto prepara a las personas jóvenes para las audiencias judiciales de manera ética y protectora, reduciendo la ansiedad y el riesgo de revictimización. En agosto de 2025, la cartilla ganó el premio a la mejor publicación impresa especial en el Premio Nacional de Comunicación de la Justicia (Conbrascom)."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c072","tier":"Noteworthy","category":"Inclusive Voices","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"CAPACITISMO OBSTÉTRICO: uma contracartilha para celebrar os direitos à maternidade das mulheres com deficiência","org":"Instituto Nacional de Saúde da Mulher, da Criança e do Adolescente Fernandes Figueira - IFF/Fiocruz","desc":{"en":"The Obstetric Ableism Counter-Guide by Brazil's National Institute for Women's, Children's and Adolescents' Health (Fiocruz) is produced in three fully accessible formats: PDF, audiobook, and video with audio description and Brazilian Sign Language (Libras). The 'counter-guide' concept deliberately marks a rupture with traditional instructional materials—instead of teaching rules, it reaffirms that all women, including those with disabilities, are entitled to health, maternity, and a full life free from barriers. Grounded in doctoral research on women with disabilities and maternity using inclusive participatory methods, the guide was launched on the International Day of Persons with Disabilities 2025 and received coverage from Fiocruz News Agency—positioning it as a national reference for disability-inclusive maternal communication.","es":"La Contraguía sobre Capacitismo Obstétrico del Instituto Nacional de Salud de la Mujer, la Niñez y la Adolescencia de Brasil (Fiocruz) se produce en tres formatos plenamente accesibles: PDF, audiolibro y video con audiodescripción y Lengua de Señas Brasileña (Libras). El concepto de \"contraguía\" marca deliberadamente una ruptura con los materiales instructivos tradicionales: en lugar de enseñar reglas, reafirma que todas las mujeres, incluidas aquellas con discapacidad, tienen derecho a la salud, la maternidad y una vida plena y libre de barreras. Fundamentada en una investigación doctoral sobre mujeres con discapacidad y maternidad que empleó métodos participativos inclusivos, la guía se lanzó en el Día Internacional de las Personas con Discapacidad de 2025 y recibió cobertura de la Agencia de Noticias de Fiocruz, posicionándose como referente nacional de comunicación materna inclusiva en materia de discapacidad."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c073","tier":"Noteworthy","category":"Inclusive Voices","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Justiça por Elas: Ações de Inovação, Comunicação e Proteção à Mulher Cearense","org":"Tribunal de Justiça do Estado do Ceará (TJCE)","desc":{"en":"Justiça por Elas (Justice for Them) is a public communication and network governance ecosystem by the Ceará State Court of Justice for gender violence prevention and equity promotion. The initiative integrates campaigns and protocols across multiple spaces—Carnival, school vacations, condominiums, stadiums, gyms, schools, and corporations—through coordinated campaigns and institutional seals. In 2025–2026, the two main campaigns generated 50,000+ social media views and 4,700 informational materials distributed at airports, bus terminals, and cultural venues. Twenty-eight sports institutions joined a protection protocol—exemplifying how courts can use multi-sector public communication to transform institutional spaces into gender-safe environments.","es":"Justiça por Elas (Justicia por Ellas) es un ecosistema de comunicación pública y gobernanza en red del Tribunal de Justicia del Estado de Ceará para la prevención de la violencia de género y la promoción de la equidad. La iniciativa integra campañas y protocolos en múltiples espacios —el Carnaval, las vacaciones escolares, los condominios, los estadios, los gimnasios, las escuelas y las empresas— mediante campañas coordinadas y sellos institucionales. En 2025–2026, las dos campañas principales generaron más de 50.000 visualizaciones en redes sociales y 4.700 materiales informativos distribuidos en aeropuertos, terminales de autobuses y espacios culturales. Veintiocho instituciones deportivas se adhirieron a un protocolo de protección, ejemplificando cómo los tribunales pueden utilizar la comunicación pública multisectorial para transformar los espacios institucionales en entornos seguros en materia de género."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c074","tier":"Noteworthy","category":"Exploring New Frontiers","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Private sector","es":"Sector privado"},"name":"Influciência","org":"Indica Serviços de Mídia, Comunicação e Produções","desc":{"en":"Influciência is a strategic digital public communication methodology by Agência INDICA in partnership with Rio de Janeiro City Hall's Secretariat of Science, Technology, and Innovation. The initiative transforms institutional dissemination into engagement structures using digital influencers as mediators—validated through the Jovens Cientistas Cariocas project. The campaign achieved 7,713,801 total content views and 779,315 interactions, maintaining an engagement rate of 10–15%—considered excellent for organic content. This approach represents an emerging model for municipal government communication that combines reach with authentic community connection.","es":"Influciência es una metodología estratégica de comunicación pública digital de la Agência INDICA en alianza con la Secretaría de Ciencia, Tecnología e Innovación de la Alcaldía de Río de Janeiro. La iniciativa transforma la difusión institucional en estructuras de participación utilizando a influenciadores digitales como mediadores, y fue validada a través del proyecto Jovens Cientistas Cariocas. La campaña alcanzó 7.713.801 visualizaciones totales de contenido y 779.315 interacciones, manteniendo una tasa de participación del 10–15 %, considerada excelente para contenido orgánico. Este enfoque representa un modelo emergente de comunicación gubernamental municipal que combina alcance con una conexión comunitaria auténtica."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c075","tier":"Noteworthy","category":"Exploring New Frontiers","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Guia Fique Logada (Guide “Stay Linked up”)","org":"Instituto Oswaldo Cruz/Fiocruz","desc":{"en":"The Fique Logada Guide (Stay Linked Up Guide) by Fiocruz's Logadas Project is a collaboratively built plain-language educational resource expanding digital literacy among girls and women in vulnerable territories—especially in Rio de Janeiro's Maré favela complex. The guide explains computer use, digital security, user rights, and public digital services with visual, accessible content built collectively with course facilitators and students, enabling trained girls to act as explainers for other community women—multiplying knowledge. Evaluations showed high satisfaction, with participants reporting mastery of government apps, greater digital security awareness, understanding of user rights, and increased autonomy—validating peer-to-peer digital literacy as an inclusive public communication approach.","es":"La Guía Fique Logada (Guía \"Mantente Conectada\") del Proyecto Logadas de Fiocruz es un recurso educativo en lenguaje claro, construido de manera colaborativa, que amplía la alfabetización digital de niñas y mujeres en territorios vulnerables, especialmente en el complejo de favelas de Maré, en Río de Janeiro. La guía explica el uso de computadoras, la seguridad digital, los derechos de las personas usuarias y los servicios públicos digitales con contenido visual y accesible, elaborado colectivamente con facilitadoras y estudiantes de los cursos, lo que permite que las niñas capacitadas actúen como explicadoras para otras mujeres de la comunidad, multiplicando el conocimiento. Las evaluaciones mostraron una alta satisfacción: las participantes reportaron dominio de las aplicaciones gubernamentales, mayor conciencia sobre seguridad digital, comprensión de sus derechos como usuarias y mayor autonomía, lo que valida la alfabetización digital entre pares como un enfoque inclusivo de comunicación pública."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c076","tier":"Noteworthy","category":"Trust Catalysts","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Postagem Automática de Vídeos - Canal da Câmara no YouTube","org":"Câmara dos Deputados","desc":{"en":"The Câmara dos Deputados (Brazilian Chamber of Deputies) developed WebCâmara—an automatic video upload system capturing and live-streaming all plenary sessions and committee meetings directly to YouTube in high definition, making it the platform's channel with the most simultaneous live events. This guarantees full compliance with the constitutional principle of publicity for legislative acts and eliminates geographic barriers to citizen access. The channel has published 50,000+ videos and grown from 100,000 subscribers (YouTube Silver Award, 2018) to 1.5 million subscribers (YouTube Gold Award, 2023), accumulating 220 million views and 42 million viewing hours—making it one of the world's most watched institutional parliamentary channels.","es":"La Câmara dos Deputados (Cámara de Diputados de Brasil) desarrolló WebCâmara, un sistema de carga automática de video que capta y transmite en vivo todas las sesiones plenarias y reuniones de comisiones directamente en YouTube en alta definición, lo que lo convierte en el canal de la plataforma con más eventos en vivo simultáneos. Esto garantiza el pleno cumplimiento del principio constitucional de publicidad de los actos legislativos y elimina las barreras geográficas para el acceso ciudadano. El canal ha publicado más de 50.000 videos y pasó de 100.000 suscriptores (Premio de Plata de YouTube, 2018) a 1,5 millones de suscriptores (Premio de Oro de YouTube, 2023), acumulando 220 millones de visualizaciones y 42 millones de horas de reproducción, lo que lo posiciona como uno de los canales parlamentarios institucionales más vistos del mundo."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c077","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Guia Prático de Projetos","org":"Ministério da Gestão e Inovação em Serviços Públicos (MGI)","desc":{"en":"The Guia Prático de Projetos (Practical Project Management Guide) by Brazil's Ministry of Management and Innovation (MGI) and UNDP, finalized in July 2025, provides federal public sector teams with a uniform, accessible methodology for project management. It translates technical frameworks like PMBOK and agile methods into plain language grounded in behavioral sciences, focusing on how—not just what—to do. On LinkedIn, its publication received the highest likes and comments in the Ministry's history, with adoption spreading spontaneously beyond the initially planned 13 Ministries. It exemplifies how government knowledge products can drive cultural change when designed with communication and accessibility principles.","es":"La Guia Prático de Projetos (Guía Práctica de Gestión de Proyectos) del Ministerio de Gestión e Innovación de Brasil (MGI) y el PNUD, finalizada en julio de 2025, ofrece a los equipos del sector público federal una metodología uniforme y accesible para la gestión de proyectos. Traduce marcos técnicos como el PMBOK y los métodos ágiles a un lenguaje claro fundamentado en las ciencias del comportamiento, con énfasis en el cómo hacer, no solo en el qué. En LinkedIn, su publicación recibió la mayor cantidad de reacciones y comentarios en la historia del Ministerio, y su adopción se extendió de manera espontánea más allá de los 13 Ministerios previstos inicialmente. Ejemplifica cómo los productos de conocimiento gubernamentales pueden impulsar el cambio cultural cuando se diseñan con principios de comunicación y accesibilidad."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c078","tier":"Noteworthy","category":"Trust Catalysts","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Participação Popular","org":"TV Câmara / Câmara dos Deputados","desc":{"en":"Participação Popular (Popular Participation) is a live television programme by TV Câmara—Brazil's parliamentary channel—bringing together ordinary citizens, politicians, and specialists to discuss legislative topics in plain language. Broadcast live with in-person guests and street interviews, the programme receives citizen questions via WhatsApp, YouTube, and social media from across Brazil. Over the years, viewer suggestions have directly influenced bill amendments and debates in the Chamber of Deputies—with some discussions leading to the discovery of legislative gaps. The programme is a model for how parliamentary media can generate genuine civic participation in lawmaking.","es":"Participação Popular (Participación Popular) es un programa de televisión en vivo de TV Câmara —el canal parlamentario de Brasil— que reúne a ciudadanos comunes, políticos y especialistas para debatir temas legislativos en lenguaje claro. Transmitido en vivo con invitados presenciales y entrevistas en la calle, el programa recibe preguntas de la ciudadanía a través de WhatsApp, YouTube y redes sociales desde todo Brasil. A lo largo de los años, las sugerencias de los televidentes han influido directamente en enmiendas a proyectos de ley y en debates de la Cámara de Diputados, y algunas discusiones han llevado al descubrimiento de vacíos legislativos. El programa es un modelo de cómo los medios parlamentarios pueden generar una participación cívica genuina en la elaboración de leyes."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c079","tier":"Noteworthy","category":"Inclusive Voices","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Elas Pautam","org":"TV Câmara / Câmara dos Deputados","desc":{"en":"Elas Pautam (Women's Agenda) is a TV Câmara programme discussing gender issues and legislative agendas affecting women in Brazil—particularly Black and mixed-race women who face low wages, multiple forms of violence, and underrepresentation despite leading most families and having the highest educational attainment. The programme features women legislators and specialists using clear language, addressing inequality, violence, reproductive health, and economic autonomy. An episode on teachers' working conditions received 27,000 Instagram likes and 1,700 comments—confirming its role as public communication infrastructure for Brazil's gender equity agenda.","es":"Elas Pautam (Ellas Marcan la Agenda) es un programa de TV Câmara que aborda cuestiones de género y agendas legislativas que afectan a las mujeres en Brasil, en particular a las mujeres negras y mestizas, quienes enfrentan bajos salarios, múltiples formas de violencia y subrepresentación, a pesar de encabezar la mayoría de las familias y de tener el mayor nivel educativo. El programa presenta a legisladoras y especialistas que utilizan un lenguaje claro para tratar la desigualdad, la violencia, la salud reproductiva y la autonomía económica. Un episodio sobre las condiciones laborales del magisterio recibió 27.000 me gusta y 1.700 comentarios en Instagram, lo que confirma su papel como infraestructura de comunicación pública para la agenda de equidad de género de Brasil."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c080","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"YE","lang":"English","region":{"en":"Arab States","es":"Estados Árabes"},"country":{"en":"Yemen","es":"Yemen"},"type":{"en":"University or research centre","es":"Universidad o centro de investigación"},"name":"Research","org":"Sana'a Universty","desc":{"en":null,"es":null},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":"Descripción corta"},{"id":"c081","tier":"Noteworthy","category":"Trust Catalysts","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Juizado do Torcedor: o Judiciário presente no estádio para garantir direitos, prevenir conflitos e promover cidadania","org":"Assessoria de Comunicação do Tribunal de Justiça do Ceará","desc":{"en":"The Juizado do Torcedor (Fan Court) by the Ceará State Court of Justice brings the judiciary physically inside football stadiums during major sporting events, offering immediate access to justice, conflict prevention, and consumer rights promotion for fans. The TJCE complemented this with a social media communication strategy using short videos to explain fan rights and court procedures. On Instagram, fan court content reached 5,681 accounts with 14.4% non-followers—exceeding typical institutional reach. TikTok videos reached younger audiences typically disconnected from judicial content. The initiative repositions the judiciary as a citizen-facing institution in spaces traditionally marked by tension, creating new audiences for rights-based public communication.","es":"El Juizado do Torcedor (Juzgado del Hincha) del Tribunal de Justicia del Estado de Ceará lleva físicamente al poder judicial al interior de los estadios de fútbol durante los grandes eventos deportivos, ofreciendo a los aficionados acceso inmediato a la justicia, prevención de conflictos y promoción de los derechos del consumidor. El TJCE complementó esta labor con una estrategia de comunicación en redes sociales basada en videos cortos para explicar los derechos de los hinchas y los procedimientos judiciales. En Instagram, el contenido del juzgado del hincha llegó a 5.681 cuentas, con un 14,4 % de no seguidores, superando el alcance institucional habitual. Los videos de TikTok llegaron a audiencias más jóvenes, tradicionalmente desconectadas del contenido judicial. La iniciativa reposiciona al poder judicial como una institución orientada a la ciudadanía en espacios tradicionalmente marcados por la tensión, creando nuevas audiencias para una comunicación pública basada en derechos."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c082","tier":"Noteworthy","category":"Exploring New Frontiers","categorySource":"official","iso":"LR","lang":"English","region":{"en":"Africa","es":"África"},"country":{"en":"Liberia","es":"Liberia"},"type":{"en":"Social innovation organization","es":"Organización de innovación social"},"name":"Innovating for Impact: Digital Innovation for Media Sustainability in Fragile Democracies","org":"New Narratives","desc":{"en":"New Narratives embedded audience engagement and product development experts for six months at Front Page Africa (FPA), Liberia's leading independent newsroom, to help it break from political funding dependency. The project addresses the structural crisis of independent media in fragile democracies: a corrosive business model where journalists go unpaid while politicians pay for favorable coverage. By helping FPA understand its audiences and design products to serve them, New Narratives facilitated a transformation into Liberia's dominant digital media player for young and underserved audiences. Between May and October 2025, FPA recorded a 60% increase in Facebook post views and a 238% increase in online engagement—demonstrating how audience-centered journalism reform builds both editorial independence and financial sustainability.","es":"New Narratives integró durante seis meses a especialistas en participación de audiencias y desarrollo de productos en Front Page Africa (FPA), la principal sala de redacción independiente de Liberia, para ayudarla a romper con la dependencia del financiamiento político. El proyecto aborda la crisis estructural de los medios independientes en democracias frágiles: un modelo de negocio corrosivo en el que los periodistas no reciben salario mientras los políticos pagan por una cobertura favorable. Al ayudar a FPA a comprender a sus audiencias y a diseñar productos para servirlas, New Narratives facilitó su transformación en el actor dominante de los medios digitales de Liberia para audiencias jóvenes y desatendidas. Entre mayo y octubre de 2025, FPA registró un aumento del 60 % en las visualizaciones de publicaciones en Facebook y un incremento del 238 % en la participación en línea, lo que demuestra cómo una reforma del periodismo centrada en las audiencias fortalece tanto la independencia editorial como la sostenibilidad financiera."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c083","tier":"Noteworthy","category":"Exploring New Frontiers","categorySource":"official","iso":"US","lang":"English","region":{"en":"North America","es":"América del Norte"},"country":{"en":"United States","es":"Estados Unidos"},"type":{"en":"Media","es":"Medio de comunicación"},"name":"Open Journalism Network","org":"In Old News LLC","desc":{"en":"Open Journalism Network by In Old News LLC is a free footage library empowering journalists, communicators, creators, and artists worldwide to access inclusive and representative footage produced by local journalists in 40+ countries. Focused on climate change and democracy, footage has been used by independent journalists in India and uploaded to Wikipedia for topics like the 2024 Canadian wildfires. Recognized by Internews, SIDA, and the Brown Institute for Media Innovation at Columbia, the initiative addresses a structural gap in visual media representation by making locally produced, globally relevant footage accessible to independent journalists worldwide.","es":"Open Journalism Network, de In Old News LLC, es una biblioteca gratuita de material audiovisual que permite a periodistas, comunicadores, creadores y artistas de todo el mundo acceder a imágenes inclusivas y representativas producidas por periodistas locales en más de 40 países. Con un enfoque en el cambio climático y la democracia, el material ha sido utilizado por periodistas independientes en la India y subido a Wikipedia para temas como los incendios forestales de Canadá de 2024. Reconocida por Internews, SIDA y el Brown Institute for Media Innovation de Columbia, la iniciativa aborda una brecha estructural en la representación de los medios visuales al poner material producido localmente y de relevancia global a disposición de periodistas independientes de todo el mundo."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c084","tier":"Noteworthy","category":"Exploring New Frontiers","categorySource":"official","iso":"CA","lang":"English","region":{"en":"North America","es":"América del Norte"},"country":{"en":"Canada","es":"Canadá"},"type":{"en":"Private sector","es":"Sector privado"},"name":"GenZ(AI)","org":"Make.org (responsible for Digital Participation)","desc":{"en":"Gen(Z)AI is a national participatory process in Canada bringing 100 young people aged 17–23 together in four regional Youth Forums—Toronto, Montréal, Vancouver, and Halifax—to deliberate on AI policy. Participants learn from AI experts, debate issues like data privacy and online safety, and craft youth-driven policy recommendations. The project combines in-person deliberation with a large-scale online engagement platform enabling thousands of additional young Canadians and AI experts to engage with and refine proposals. The first Toronto forum successfully engaged diverse participants in substantive dialogue with AI researchers, producing draft policy proposals on AI governance—modeling how participatory processes can amplify youth voice in high-stakes technology governance.","es":"Gen(Z)AI es un proceso participativo nacional en Canadá que reúne a 100 jóvenes de entre 17 y 23 años en cuatro Foros Juveniles regionales —Toronto, Montreal, Vancouver y Halifax— para deliberar sobre políticas de IA. Los participantes aprenden de expertos en IA, debaten temas como la privacidad de los datos y la seguridad en línea, y elaboran recomendaciones de política impulsadas por la juventud. El proyecto combina la deliberación presencial con una plataforma de participación en línea a gran escala que permite a miles de jóvenes canadienses y expertos en IA adicionales involucrarse con las propuestas y perfeccionarlas. El primer foro de Toronto logró involucrar a participantes diversos en un diálogo sustantivo con investigadores de IA, produciendo borradores de propuestas de política sobre gobernanza de la IA, y modela cómo los procesos participativos pueden amplificar la voz de la juventud en la gobernanza de tecnologías de alto impacto."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c085","tier":"Noteworthy","category":"Trust Catalysts","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Hotsite Curió","org":"Tribunal de Justiça do Estado do Ceará - Assessoria de Comunicação Social","desc":{"en":"The Curió Hotsite is a transparency platform by the Ceará State Court of Justice for the state's largest trial: the jury proceeding of 29 military police officers responsible for the 2015 Curió massacre in which 11 young people were killed. Using plain language, infographics, photos, videos, and live streaming of jury sessions, the hotsite provided organized, accessible information about a complex judicial proceeding. It served as a strategic resource for journalists by centralizing official data, and became a model for judicial transparency communication in sensitive cases involving state violence—combining institutional accountability with community memory preservation.","es":"El Hotsite Curió es una plataforma de transparencia del Tribunal de Justicia del Estado de Ceará para el juicio más grande del estado: el proceso ante jurado de 29 policías militares responsables de la masacre del Curió de 2015, en la que 11 jóvenes fueron asesinados. Utilizando lenguaje claro, infografías, fotos, videos y transmisión en vivo de las sesiones del jurado, el hotsite brindó información organizada y accesible sobre un proceso judicial complejo. Sirvió como recurso estratégico para los periodistas al centralizar los datos oficiales, y se convirtió en un modelo de comunicación de transparencia judicial en casos sensibles de violencia estatal, combinando la rendición de cuentas institucional con la preservación de la memoria comunitaria."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c086","tier":"Noteworthy","category":"Dialogue Builders","categorySource":"official","iso":"GB","lang":"English","region":{"en":"Europe","es":"Europa"},"country":{"en":"United Kingdom","es":"Reino Unido"},"type":{"en":"University or research centre","es":"Universidad o centro de investigación"},"name":"The International Parliament Engagement Network (IPEN)","org":"University of Leeds (UK), UK House of Commons Service and University of Adelaide (Australia)","desc":{"en":"The International Parliament Engagement Network (IPEN) is a global network connecting academics, parliamentary officials, and third-sector practitioners working on public engagement in parliaments, founded online in April 2020. With 400+ members, IPEN has partnered with the Inter-Parliamentary Union, Westminster Foundation for Democracy, and Inter-Pares. A £90,000 grant funded eight Guides on Citizen Engagement for Parliaments, viewed 20,000 times and adopted by parliaments in Argentina and the Welsh Senedd. IPEN demonstrates how cross-national knowledge-sharing networks can raise the quality and consistency of public engagement practices in legislative institutions globally.","es":"La International Parliament Engagement Network (IPEN) es una red global que conecta a académicos, funcionarios parlamentarios y profesionales del tercer sector que trabajan en la participación pública en los parlamentos, fundada en línea en abril de 2020. Con más de 400 miembros, IPEN ha establecido alianzas con la Unión Interparlamentaria, la Westminster Foundation for Democracy e Inter-Pares. Una subvención de £90.000 financió ocho Guías sobre Participación Ciudadana para Parlamentos, que registraron 20.000 visualizaciones y fueron adoptadas por parlamentos de Argentina y por el Senedd de Gales. IPEN demuestra cómo las redes transnacionales de intercambio de conocimientos pueden elevar la calidad y la consistencia de las prácticas de participación pública en las instituciones legislativas a nivel mundial."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c087","tier":"Noteworthy","category":"Dialogue Builders","categorySource":"official","iso":"ID","lang":"English","region":{"en":"Asia & the Pacific","es":"Asia y el Pacífico"},"country":{"en":"Indonesia","es":"Indonesia"},"type":{"en":"Public institution","es":"Institución pública"},"name":"From Kitchens to Citizens: Indonesia's Nutrition Communication at Scale","org":"The Ministry of State Secretariat of Indonesia","desc":{"en":"Indonesia's Makan Bergizi Gratis (Free Nutritious Meals) Communication Framework is an innovative approach to building public trust and participatory governance for a national nutrition program. The framework centers on transparency through real-time data sharing, inclusive dialogue with parents, educators, and local governments, and empowering citizens as active program monitors. From 190 kitchens serving 570,000 meals on January 6, 2025 to 21,102 kitchens serving 59.8 million meals daily within one year—approaching McDonald's global scale—the program's growth has been communicated with unprecedented openness via a live dashboard at bgn.go.id. With 600,000+ direct kitchen jobs, the program demonstrates how participatory communication can build public ownership of transformative social policy.","es":"El Marco de Comunicación del programa Makan Bergizi Gratis (Comidas Nutritivas Gratuitas) de Indonesia es un enfoque innovador para construir confianza pública y gobernanza participativa en torno a un programa nacional de nutrición. El marco se centra en la transparencia mediante el intercambio de datos en tiempo real, el diálogo inclusivo con padres y madres de familia, docentes y gobiernos locales, y el empoderamiento de la ciudadanía como veedora activa del programa. De 190 cocinas que servían 570.000 comidas el 6 de enero de 2025 se pasó a 21.102 cocinas que sirven 59,8 millones de comidas diarias en el plazo de un año —una escala cercana a la de McDonald's a nivel global—, y el crecimiento del programa se ha comunicado con una apertura sin precedentes a través de un tablero en vivo en bgn.go.id. Con más de 600.000 empleos directos en las cocinas, el programa demuestra cómo la comunicación participativa puede generar apropiación pública de políticas sociales transformadoras."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c088","tier":"Noteworthy","category":"Dialogue Builders","categorySource":"official","iso":"UG","lang":"English","region":{"en":"Africa","es":"África"},"country":{"en":"Uganda","es":"Uganda"},"type":{"en":"Civil society organisation","es":"Organización de la sociedad civil"},"name":"The MDD, good governance and climate change project","org":"Might Foundation","desc":{"en":"The Music, Dance and Drama (MDD), Good Governance and Climate Change Project by Might Foundation in Uganda trains children and youth in artistic advocacy and legislative theatre to protect swamps from destruction. In Masajja B village, swamp loss has led to community deaths and climate impacts. The project trains young people (ages 7–30) in MDD, environmental advocacy, and legislative theatre to raise awareness and hold government officials accountable through community performances. To date, it has trained 65+ performers, raised awareness among 200,000+ people about swamp destruction, and held 18 government officials accountable—demonstrating how arts-based communication can enable communities to influence environmental governance.","es":"El proyecto Music, Dance and Drama (MDD), Good Governance and Climate Change, de la Might Foundation en Uganda, capacita a niños, niñas y jóvenes en incidencia artística y teatro legislativo para proteger los humedales de la destrucción. En la aldea de Masajja B, la pérdida de humedales ha provocado muertes en la comunidad e impactos climáticos. El proyecto capacita a jóvenes (de 7 a 30 años) en MDD, incidencia ambiental y teatro legislativo para sensibilizar y exigir cuentas a los funcionarios gubernamentales mediante presentaciones comunitarias. Hasta la fecha, ha capacitado a más de 65 artistas, sensibilizado a más de 200.000 personas sobre la destrucción de los humedales y logrado que 18 funcionarios gubernamentales rindan cuentas, lo que demuestra cómo la comunicación basada en las artes puede permitir a las comunidades influir en la gobernanza ambiental."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c089","tier":"Noteworthy","category":"Inclusive Voices","categorySource":"official","iso":"KH","lang":"English","region":{"en":"Asia & the Pacific","es":"Asia y el Pacífico"},"country":{"en":"Cambodia","es":"Camboya"},"type":{"en":"Social innovation organization","es":"Organización de innovación social"},"name":"Green Growth Along the River (Tam Tonle)","org":"media4impact-Prosob at Impact Hub Phnom Penh","desc":{"en":"Green Growth Along the River (Tam Tonle) by media4impact-Prosob at Impact Hub Phnom Penh raised awareness among Cambodian youth about climate change and sustainability challenges in the Tonle Sap Biosphere Region. Running from August 2024 to February 2025, the project combined a digital campaign, youth ideation workshop, and a Project Idea Competition. The digital campaign exceeded expectations with 786,870 views, 611,801 reach, and 23,913 engagements (3% rate). By combining storytelling, digital engagement, and participatory problem-solving, the initiative demonstrates how multi-platform communication can mobilize youth environmental action in Southeast Asia.","es":"Green Growth Along the River (Tam Tonle), de media4impact-Prosob en Impact Hub Phnom Penh, sensibilizó a la juventud camboyana sobre el cambio climático y los desafíos de sostenibilidad en la Región de la Biosfera del Tonle Sap. Desarrollado entre agosto de 2024 y febrero de 2025, el proyecto combinó una campaña digital, un taller de ideación juvenil y un Concurso de Ideas de Proyecto. La campaña digital superó las expectativas con 786.870 visualizaciones, un alcance de 611.801 personas y 23.913 interacciones (tasa del 3 %). Al combinar narrativa, participación digital y resolución participativa de problemas, la iniciativa demuestra cómo la comunicación multiplataforma puede movilizar la acción ambiental juvenil en el Sudeste Asiático."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c090","tier":"Noteworthy","category":"Inclusive Voices","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Information on Custody Hearings in Brazilian Indigenous Languages","org":"Making Justice Programme – United Nations Development Programme (UNDP) and National Council of Justice (CNJ - Brazil)","desc":{"en":"Socio-educational Reporters is a journalism workshop created by UNDP's Making Justice Programme (in partnership with Brazil's National Council of Justice) for adolescents serving socio-educational measures in Brazil's juvenile justice system. The initiative trained young people to cover the 2025 Literary Pathways event—an annual cultural program for youth in socio-educational facilities—shifting their role from news subjects to authors. In the 4th edition, 84 facilities across all 27 Brazilian states participated. The adolescents' journalism ensured decentralized, regionally diverse coverage, and the approach received strong CNJ backing as a model for youth-centered communication in justice contexts.","es":"Reporteros Socioeducativos es un taller de periodismo creado por el Programa Haciendo Justicia del PNUD (en alianza con el Consejo Nacional de Justicia de Brasil) para adolescentes que cumplen medidas socioeducativas en el sistema de justicia juvenil de Brasil. La iniciativa capacitó a jóvenes para cubrir la edición 2025 del evento Caminos Literarios, un programa cultural anual para jóvenes en centros socioeducativos, transformando su rol de sujetos de las noticias a autores. En la 4.ª edición participaron 84 centros de los 27 estados brasileños. El periodismo de los adolescentes garantizó una cobertura descentralizada y regionalmente diversa, y el enfoque recibió un firme respaldo del CNJ como modelo de comunicación centrada en la juventud en contextos de justicia."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c091","tier":"Noteworthy","category":"Inclusive Voices","categorySource":"official","iso":"IN","lang":"English","region":{"en":"Asia & the Pacific","es":"Asia y el Pacífico"},"country":{"en":"India","es":"India"},"type":{"en":"Social innovation organization","es":"Organización de innovación social"},"name":"Co-Creating Change with Educators: Inclusive Public Communication in India’s Public Education System","org":"Khan Academy India","desc":{"en":"Co-Creating Change with Educators by Khan Academy India reimagines how large-scale education reforms and digital learning are communicated to government school educators across Indian state systems. Rather than top-down information dissemination, the initiative positions teachers, principals, and nodal officers as active co-creators and ambassadors of change. Communication efforts are dialogic, accessible, and grounded in classroom realities—enabling educators to understand and adopt new approaches with genuine ownership. Teacher and student testimonials documenting adoption of AI-supported learning tools in government schools provide direct evidence that inclusive, participatory communication is essential for large-scale public education reform to move beyond policy documents into actual practice.","es":"Co-Creating Change with Educators, de Khan Academy India, reinventa la forma en que las reformas educativas a gran escala y el aprendizaje digital se comunican a los educadores de escuelas públicas en los sistemas estatales de la India. En lugar de una difusión de información vertical, la iniciativa posiciona a docentes, directores y funcionarios de enlace como cocreadores activos y embajadores del cambio. Los esfuerzos de comunicación son dialógicos, accesibles y anclados en las realidades del aula, lo que permite a los educadores comprender y adoptar nuevos enfoques con verdadera apropiación. Los testimonios de docentes y estudiantes que documentan la adopción de herramientas de aprendizaje apoyadas en IA en escuelas públicas ofrecen evidencia directa de que la comunicación inclusiva y participativa es esencial para que las reformas de la educación pública a gran escala trasciendan los documentos de política y se conviertan en práctica real."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c092","tier":"Noteworthy","category":"Dialogue Builders","categorySource":"official","iso":"PE","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Peru","es":"Perú"},"type":{"en":"Civil society organisation","es":"Organización de la sociedad civil"},"name":"Gobernanza participativa en zonas mineras","org":"Centro Internacional de Comunicación y Desarrollo - CICD","desc":{"en":"The Participatory Governance in Mining Areas of Peru initiative strengthens participatory governance in Challhuahuacho, a mining-affected district in Peru, by improving transparency, accountability, and trust between communities, public institutions, and the Las Bambas mining company. Through accessible communication channels, leader training, and a Citizen Observatory of Commitments, the project enables local organizations to monitor multisectoral agreements, promote civic participation, and reduce conflict. By integrating intercultural communication, digital tools, and Quechua-language outreach, it empowers citizens as active social auditors and offers a replicable model for democratic governance in high-conflict mining territories.","es":"La iniciativa de Gobernanza Participativa en Zonas Mineras del Perú fortalece la gobernanza participativa en Challhuahuacho, un distrito afectado por la minería en el Perú, mediante la mejora de la transparencia, la rendición de cuentas y la confianza entre las comunidades, las instituciones públicas y la empresa minera Las Bambas. A través de canales de comunicación accesibles, la formación d
