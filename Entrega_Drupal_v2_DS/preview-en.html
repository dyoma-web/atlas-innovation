demic research, public opinion surveys, and strategic analysis to improve institutional communication in polarized contexts. Born in Mendoza province, it combines a master's research study on leadership in fragmented party systems, citizen surveys on political sentiment, and tools for understanding collective social emotions. Its surveys—'Post-Electoral Sentiment' and 'Power and Leadership in Mendoza'—were disseminated across regional television, radio, and digital media, generating public debates grounded in verifiable data. SIMECPE offers institutions a methodology for evidence-based communication that builds credibility in polarized democratic environments.","es":"SIMECPE (Sistema Mendocino de Comunicación Pública Basada en Evidencia), de RZ Consultora en Argentina, integra investigación académica, encuestas de opinión pública y análisis estratégico para mejorar la comunicación institucional en contextos polarizados. Nacido en la provincia de Mendoza, combina una investigación de maestría sobre liderazgos en sistemas de partidos fragmentados, encuestas ciudadanas sobre el sentimiento político y herramientas para comprender las emociones sociales colectivas. Sus encuestas —'Sentimiento Postelectoral' y 'Poder y Liderazgo en Mendoza'— se difundieron en televisión, radio y medios digitales regionales, generando debates públicos fundamentados en datos verificables. SIMECPE ofrece a las instituciones una metodología de comunicación basada en evidencia que construye credibilidad en entornos democráticos polarizados."},"details":{"en":"The Mendoza System of Evidence-Based Public Communication (SIMECPE) is an initiative that integrates academic research, opinion polls, and strategic analysis to improve public communication in contexts of polarization and crisis of representation. It originated in the province of Mendoza, Argentina, with the goal of strengthening the relationship between institutions and citizens through clear information, evidence-based dialogue, and a deep understanding of contemporary social emotions.\nThe initiative comprises three core components.\nThe first is a master's thesis on dominant leadership in broken party systems (2022–2025), which analyzes how political discourses construct legitimacy, crisis narratives, and affective bonds with society. This study offers a solid conceptual framework for understanding how emotions, political myth, and the politics of risk influence public perception and institutional decision-making.\nThe second and third components consist of two public opinion polls conducted in Mendoza: “Post-Electoral Sentiment” and “Power and Leadership in Mendoza.” The first measures social emotions. (hope, anger, uncertainty), institutional trust, and citizen expectations after electoral processes. The second analyzes leadership preferences, demands for political leadership, the evaluation of social actors (universities, civil society, the private sector), and perceptions of political renewal.\nThese three inputs are combined in a system that produces accessible reports, clear narratives, and practical recommendations for public institutions, government communicators, open government agencies, journalists, and technical teams. The goal is to translate complex phenomena—polarization, crisis of representation, social emotions, and perceptions of leadership—into understandable and actionable information.\nThe initiative is innovative because it integrates quantitative evidence, qualitative analysis, and narrative construction into a single tool applied to public communication. It does not simply describe data: it interprets it, translates it into communicational terms, and proposes strategies to improve social dialogue and reduce symbolic confrontation. Furthermore, it addresses the gap between politics, citizenship, and communication management through an interdisciplinary approach that combines political science, discourse analysis, the sociology of emotions, and government communication.\nSIMECPE identifies polarization risks, emerging patterns of distrust, leadership preferences, and social demands. Based on this, it generates recommendations for ethical, empathetic public communication oriented towards the collective interest. The initiative is replicable in any province or municipality in Latin America facing similar challenges.\" The SIMECPE initiative is directly linked to public institutions and decision-making processes in the province of Mendoza. First, the project provides strategic support to government departments within the Mendoza government, particularly in areas such as institutional communication, public perception, security, health, water, and public services. Opinion polls and discourse analysis have been used by technical teams to refine messaging, improve communication of public policies, and guide local interventions.","es":"El Sistema Mendocino de Comunicación Pública Basada en Evidencia (SIMECPE) es una iniciativa que integra investigación académica, encuestas de opinión y análisis estratégico para mejorar la comunicación pública en contextos de polarización y crisis de representación. Se originó en la provincia de Mendoza, Argentina, con el objetivo de fortalecer la relación entre las instituciones y la ciudadanía a través de información clara, diálogo basado en evidencia y una comprensión profunda de las emociones sociales contemporáneas.\nLa iniciativa comprende tres componentes centrales.\nEl primero es una tesis de maestría sobre liderazgos dominantes en sistemas de partidos quebrados (2022–2025), que analiza cómo los discursos políticos construyen legitimidad, narrativas de crisis y vínculos afectivos con la sociedad. Este estudio ofrece un marco conceptual sólido para comprender cómo las emociones, el mito político y la política del riesgo influyen en la percepción pública y en la toma de decisiones institucionales.\nEl segundo y el tercer componente consisten en dos encuestas de opinión pública realizadas en Mendoza: “Sentimiento Postelectoral” y “Poder y Liderazgo en Mendoza”. La primera mide las emociones sociales (esperanza, enojo, incertidumbre), la confianza institucional y las expectativas ciudadanas tras los procesos electorales. La segunda analiza las preferencias de liderazgo, las demandas de conducción política, la evaluación de los actores sociales (universidades, sociedad civil, sector privado) y las percepciones sobre la renovación política.\nEstos tres insumos se combinan en un sistema que produce informes accesibles, narrativas claras y recomendaciones prácticas para instituciones públicas, comunicadores gubernamentales, agencias de gobierno abierto, periodistas y equipos técnicos. El objetivo es traducir fenómenos complejos —polarización, crisis de representación, emociones sociales y percepciones de liderazgo— en información comprensible y accionable.\nLa iniciativa es innovadora porque integra evidencia cuantitativa, análisis cualitativo y construcción narrativa en una única herramienta aplicada a la comunicación pública. No se limita a describir los datos: los interpreta, los traduce a términos comunicacionales y propone estrategias para mejorar el diálogo social y reducir la confrontación simbólica. Además, aborda la brecha entre la política, la ciudadanía y la gestión de la comunicación mediante un enfoque interdisciplinario que combina ciencia política, análisis del discurso, sociología de las emociones y comunicación gubernamental.\nSIMECPE identifica riesgos de polarización, patrones emergentes de desconfianza, preferencias de liderazgo y demandas sociales. Sobre esta base, genera recomendaciones para una comunicación pública ética, empática y orientada al interés colectivo. La iniciativa es replicable en cualquier provincia o municipio de América Latina que enfrente desafíos similares.\" La iniciativa SIMECPE está directamente vinculada a las instituciones públicas y a los procesos de toma de decisiones de la provincia de Mendoza. En primer lugar, el proyecto brinda apoyo estratégico a dependencias del gobierno de Mendoza, particularmente en áreas como comunicación institucional, percepción pública, seguridad, salud, agua y servicios públicos. Las encuestas de opinión y el análisis del discurso han sido utilizados por equipos técnicos para afinar los mensajes, mejorar la comunicación de las políticas públicas y orientar las intervenciones locales."},"links":["https://rmzavi.wixsite.com/rzconsultora  @rzconsultora"],"hasPhotos":true,"drive":"Check to see if both photos can be uploaded: https://drive.google.com/file/d/1RshgbrdAOJduRk72YnXJ6S8tMvKeTStx/view?usp=sharing , Oscar check the pdf please: https://drive.google.com/file/d/1ldrls41JuPGrOFpA_caGTJYkuFzKefGp/view?usp=sharing","prod":{"material":"PARCIAL","files":"• 652111745_17957116860078375_....jpg — 10 KB · 320x320 px · Resolución MUY BAJA (descarga de Instagram)","pieces":"1) 652111745….jpg — NO usar como principal (320x320 px, muy baja).","gap":"Según hoja de contactos se usaron imágenes de la postulación. Sugerencia: recuperar 2 de esas imágenes originales en alta o pedir versión original de la pieza de Instagram @rzconsultora."}},{"id":"c017","tier":"Spotlight","category":"Clarity in Action","categorySource":"official","iso":"CO","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Colombia","es":"Colombia"},"type":{"en":"Civil society organisation","es":"Organización de la sociedad civil"},"name":"Ancla de Voces de Chinú","org":"Asociacion Comunitaria de Comunicacion Social Municipio de Chinu","desc":{"en":"Ancla de Voces de Chinú is a community communication model led by Caribe Stereo community radio in Chinú, Córdoba, Colombia. The initiative addresses communication gaps and low digital literacy by transforming complex public information into active dialogue through three phases: radio micro-podcasts simplifying public policies, a network of trained community 'anchors' distributing information door-to-door offline, and WhatsApp channels collecting citizen feedback. This hybrid of traditional radio, human networks, and accessible mobile technology creates a closed-loop information system particularly effective in rural and low-connectivity communities where digital platforms alone fail to reach residents.","es":"Ancla de Voces de Chinú es un modelo de comunicación comunitaria liderado por la emisora comunitaria Caribe Stereo en Chinú, Córdoba, Colombia. La iniciativa aborda las brechas de comunicación y la baja alfabetización digital transformando información pública compleja en diálogo activo a través de tres fases: micropódcasts radiales que simplifican las políticas públicas, una red de 'anclas' comunitarias capacitadas que distribuyen la información puerta a puerta sin conexión, y canales de WhatsApp que recogen la retroalimentación ciudadana. Este híbrido de radio tradicional, redes humanas y tecnología móvil accesible crea un sistema de información de circuito cerrado particularmente eficaz en comunidades rurales y de baja conectividad, donde las plataformas digitales por sí solas no logran llegar a los habitantes."},"details":{"en":"Summary: Chinú Voices Anchor (AVC) - Innovation in Community Communication\nThe Chinú Voices Anchor (AVC) initiative, led by the community radio station Caribe Stereo, is a disruptive model that addresses the communication gap and low digital literacy in Chinú, Córdoba, by transforming complex information into active dialogue. Its innovation lies in the strategic combination of traditional media, human participation, and user-friendly mobile technology.\nThe Innovative Mechanism: From Radio to the Field\nAVC operates as a closed-loop information and listening system in three key phases:\n1. Caribe Capsules (Clarity in Action): The station simplifies public policies (e.g., agricultural subsidies, requirements for formalizing footwear production) into 2-3 minute micro-podcasts. This content is designed to be concise and educational.\n2. The Community Anchors Network (Inclusive Voices / Offline Distribution): This is the cornerstone of innovation. Caribe Stereo trains a network of \"Community Anchors\" (young people and neighborhood leaders) who act as emissaries. Equipped with portable speakers, they distribute the capsules offline in rural areas, farms, and groups of shoe producers where radio or internet signal is nonexistent (\"last mile\"). This ensures that vital information reaches senior citizens and rural communities.\n3. Active Listening with WhatsApp (Exploring New Frontiers): The Anchors use Caribe Stereo's WhatsApp number, 3016269022, to capture citizens' questions, doubts, and complaints in voice message format. This method preserves the authentic tone of the citizen's voice and facilitates the participation of people who cannot write.\nClosing the Cycle and Transparency: The station uses these captured voices to generate new weekly Caribe Capsules, dedicated exclusively to providing direct and institutional answers to questions. This transforms Caribe Stereo into a mechanism for institutional active listening that generates a cycle of trust and transparency. demonstrating that the local government is responding to the genuine needs of the community.\" \"Linkage with Public Policies or Institutions\nKey Implementer: Caribe Stereo Community Radio Station (Public Media Outlet).\nInstitutional Collaborators:\nChinú Municipality (Social Development Office): Provides technical information on programs (e.g., subsidies for agricultural inputs, vaccination campaigns) to be translated into Caribe Capsules.\nFootwear Artisans Guild (ASOCALCE): The radio station is directly linked to local economic development policies, creating specific capsules on trade regulations, combating smuggling, and design trends (such as the AI ​​mentioned by artisan Jurado).\nTransparency and Participation Policies: The RVA serves as the inclusive communication arm of transparency policies, providing evidence that information is disseminated even to the most vulnerable groups, and that their voices are heard and responded to by the local government.\"","es":"Resumen: Ancla de Voces de Chinú (AVC) - Innovación en Comunicación Comunitaria\nLa iniciativa Ancla de Voces de Chinú (AVC), liderada por la emisora comunitaria Caribe Stereo, es un modelo disruptivo que aborda la brecha de comunicación y la baja alfabetización digital en Chinú, Córdoba, transformando la información compleja en diálogo activo. Su innovación radica en la combinación estratégica de medios tradicionales, participación humana y tecnología móvil de fácil uso.\nEl mecanismo innovador: de la radio al territorio\nAVC opera como un sistema de información y escucha de circuito cerrado en tres fases clave:\n1. Cápsulas Caribe (Claridad en Acción): la emisora simplifica las políticas públicas (por ejemplo, subsidios agrícolas, requisitos para la formalización de la producción de calzado) en micropódcasts de 2 a 3 minutos. Este contenido está diseñado para ser conciso y educativo.\n2. La Red de Anclas Comunitarias (Voces Inclusivas / Distribución sin conexión): esta es la piedra angular de la innovación. Caribe Stereo capacita a una red de \"Anclas Comunitarias\" (jóvenes y líderes barriales) que actúan como emisarios. Equipados con altavoces portátiles, distribuyen las cápsulas sin conexión en zonas rurales, fincas y grupos de productores de calzado donde la señal de radio o de internet es inexistente (\"la última milla\"). Esto garantiza que la información vital llegue a las personas mayores y a las comunidades rurales.\n3. Escucha activa con WhatsApp (Explorando nuevas fronteras): las Anclas utilizan el número de WhatsApp de Caribe Stereo, 3016269022, para captar las preguntas, dudas y quejas de la ciudadanía en formato de mensaje de voz. Este método preserva el tono auténtico de la voz ciudadana y facilita la participación de las personas que no pueden escribir.\nCierre del ciclo y transparencia: la emisora utiliza estas voces captadas para generar nuevas Cápsulas Caribe semanales, dedicadas exclusivamente a brindar respuestas directas e institucionales a las preguntas. Esto convierte a Caribe Stereo en un mecanismo de escucha activa institucional que genera un ciclo de confianza y transparencia, demostrando que el gobierno local responde a las necesidades genuinas de la comunidad.\" \"Vinculación con políticas públicas o instituciones\nImplementador clave: emisora comunitaria Caribe Stereo (medio de comunicación público).\nColaboradores institucionales:\nAlcaldía de Chinú (Oficina de Desarrollo Social): proporciona información técnica sobre programas (por ejemplo, subsidios a insumos agrícolas, campañas de vacunación) para su traducción en Cápsulas Caribe.\nGremio de Artesanos del Calzado (ASOCALCE): la emisora está directamente vinculada a las políticas de desarrollo económico local, creando cápsulas específicas sobre regulaciones comerciales, la lucha contra el contrabando y las tendencias de diseño (como la IA mencionada por el artesano Jurado).\nPolíticas de transparencia y participación: la AVC actúa como el brazo de comunicación inclusiva de las políticas de transparencia, aportando evidencia de que la información se difunde incluso entre los grupos más vulnerables, y de que sus voces son escuchadas y respondidas por el gobierno local.\""},"links":["www.Caribestereo.com.co"],"hasPhotos":true,"drive":"We'll leave this PDF here to see if we can upload it to the atlas: https://drive.google.com/file/d/1fxBW-iD_DrDiG-3uXmglAug-OPps4lCu/view?usp=sharing","prod":{"material":"PARCIAL","files":"• metricas_facebook_caribe_stereo_ultimo_trimestre_-_joalmo.pdf (recibido suelto, fuera de la carpeta) — 2,1 MB · PDF de métricas de Facebook de Caribe Stereo","pieces":"1) PDF de métricas de Facebook de Caribe Stereo — sirve como evidencia/anexo, no como foto.","gap":"La postulación no traía imágenes (se hizo follow up). Sugerencia: 2 fotos de la emisora Caribe Stereo / actividades comunitarias en Chinú (pedir a Rafael S. Álvarez) o capturas de www.caribestereo.com.co. IMPORTANTE: guardar el PDF dentro de la carpeta del caso."}},{"id":"c018","tier":"Spotlight","category":"Clarity in Action","categorySource":"official","iso":"ES","lang":"Spanish","region":{"en":"Europe","es":"Europa"},"country":{"en":"Spain","es":"España"},"type":{"en":"University or research centre","es":"Universidad o centro de investigación"},"name":"VALUEbot","org":"Universidad Santiago de Compostela . Facultad de Ciencias de la  Comunicación","desc":{"en":"VALUEbot is an AI-powered chatbot generation platform developed by the University of Santiago de Compostela since 2023, transforming complex institutional documents, strategies, and materials into accessible conversations. Its modular architecture supports both cloud-based and local AI models, offering technological independence and privacy protection. The platform has accumulated approximately 1,000 conversation records through professional testing. Tested by Galician public media (CRTVG, CMM) and used by the CIRCOM Chair at Universidad de Vigo to disseminate reports conversationally, VALUEbot offers a privacy-respecting institutional solution for transforming dense public information into citizen-friendly dialogue.","es":"VALUEbot es una plataforma de generación de chatbots impulsada por IA, desarrollada por la Universidad de Santiago de Compostela desde 2023, que transforma documentos institucionales, estrategias y materiales complejos en conversaciones accesibles. Su arquitectura modular admite tanto modelos de IA en la nube como locales, ofreciendo independencia tecnológica y protección de la privacidad. La plataforma ha acumulado aproximadamente 1.000 registros de conversación mediante pruebas profesionales. Probada por los medios públicos gallegos (CRTVG, CMM) y utilizada por la Cátedra CIRCOM de la Universidad de Vigo para difundir informes de manera conversacional, VALUEbot ofrece una solución institucional respetuosa de la privacidad para transformar información pública densa en un diálogo cercano a la ciudadanía."},"details":{"en":"VALUEbot is an initiative designed to transform complex documents, strategies, and materials into accessible conversations using an AI-powered chatbot platform. Since 2023, the project has been developing an infrastructure designed for contexts where information overload and fragmentation make it difficult for citizens to access clear and understandable information. Its design aims to transform institutional content into structured dialogue with stylistic consistency, traceability, and the ability to explain values, objectives, and decisions.\nThe initiative incorporates a modular architecture that allows working with both cloud-based AI models and pre-trained local engines, offering technological independence from large platforms, enhanced privacy, and control over data flows. This flexibility allows the tool to be adapted to different levels of technical requirements and ensures that organizations maintain sovereignty over the information they use. VALUEbot also integrates an operational ethics matrix that guides conversational behavior and ensures that each response aligns with social values ​​and criteria of clarity and respect.\nIts target audience includes communication professionals, educators, and community groups. Social groups and individuals who need direct and understandable access to complex information. The project has been explicitly opened to organizations and community groups through an open-source approach, allowing each group to adapt the tool to their needs and generate their own conversational assistants without depending on external providers. This openness seeks to foster technological ownership, reduce barriers to entry, and facilitate autonomous use in diverse contexts.\nThe system's development follows an iterative process based on Participatory Action Research and User-Centered Design, with the participation of public communication specialists, interaction designers, technical teams, and researchers who contribute to refining prototypes and ensuring coherence between usability, accessibility, and ethical principles. Its innovative nature lies in combining local AI, traceability, integrated values, and community openness to enable clear, responsible, and adaptable conversational communication.\nVALUEbot maintains a direct link with public institutions and with policies aimed at innovation, inclusion and modernization of public communication. Its development is articulated within the PSMresearchTeam of the Universidade de Santiago de Compostela, in a collaborative process that brings together multiple actors from the public audiovisual field, such as CRTVG, CMM, Canal Sur and the Finnish radio and television station YLE, together with professionals from the Dutch public television NPO. These entities participated in interviews, discussion groups and technical validations that made it possible to define functionalities, ethical criteria and real public communication needs in different European contexts. The project integrates the collaboration of universities with experience in media governance and innovation, such as the University of Tampere and the Media and Journalism Research Center (MJRC), whose contributions strengthen the academic and methodological fit in inclusive public communication policies. Thanks to these alliances, VALUEbot aligns itself with policies of responsible digitalization, transparency and improvement of communicative accessibility. VALUEbot uses local AI to ensure independence, protect privacy, integrating an ethical matrix. All of this coincides with the guidelines of the UNDP Atlas, which promotes innovations capable of amplifying voices, facilitating public understanding and connecting citizens and institutions through safe and socially responsible technologies.","es":"VALUEbot es una iniciativa diseñada para transformar documentos, estrategias y materiales complejos en conversaciones accesibles mediante una plataforma de chatbots impulsada por IA. Desde 2023, el proyecto ha venido desarrollando una infraestructura pensada para contextos donde la sobrecarga y la fragmentación de la información dificultan que la ciudadanía acceda a información clara y comprensible. Su diseño busca transformar el contenido institucional en un diálogo estructurado con coherencia estilística, trazabilidad y capacidad para explicar valores, objetivos y decisiones.\nLa iniciativa incorpora una arquitectura modular que permite trabajar tanto con modelos de IA en la nube como con motores locales preentrenados, ofreciendo independencia tecnológica frente a las grandes plataformas, mayor privacidad y control sobre los flujos de datos. Esta flexibilidad permite adaptar la herramienta a distintos niveles de exigencia técnica y garantiza que las organizaciones mantengan la soberanía sobre la información que utilizan. VALUEbot integra además una matriz ética operativa que orienta el comportamiento conversacional y asegura que cada respuesta se alinee con los valores sociales y con criterios de claridad y respeto.\nSu público objetivo incluye a profesionales de la comunicación, educadores y colectivos comunitarios, así como a grupos sociales y personas que necesitan un acceso directo y comprensible a información compleja. El proyecto se ha abierto explícitamente a organizaciones y colectivos comunitarios mediante un enfoque de código abierto, lo que permite a cada grupo adaptar la herramienta a sus necesidades y generar sus propios asistentes conversacionales sin depender de proveedores externos. Esta apertura busca fomentar la apropiación tecnológica, reducir las barreras de entrada y facilitar el uso autónomo en contextos diversos.\nEl desarrollo del sistema sigue un proceso iterativo basado en la Investigación-Acción Participativa y el Diseño Centrado en el Usuario, con la participación de especialistas en comunicación pública, diseñadores de interacción, equipos técnicos e investigadores que contribuyen a refinar los prototipos y a garantizar la coherencia entre usabilidad, accesibilidad y principios éticos. Su carácter innovador radica en combinar IA local, trazabilidad, valores integrados y apertura comunitaria para posibilitar una comunicación conversacional clara, responsable y adaptable.\nVALUEbot mantiene un vínculo directo con las instituciones públicas y con las políticas orientadas a la innovación, la inclusión y la modernización de la comunicación pública. Su desarrollo se articula dentro del PSMresearchTeam de la Universidade de Santiago de Compostela, en un proceso colaborativo que reúne a múltiples actores del ámbito audiovisual público, como CRTVG, CMM, Canal Sur y la radiotelevisión finlandesa YLE, junto con profesionales de la televisión pública neerlandesa NPO. Estas entidades participaron en entrevistas, grupos de discusión y validaciones técnicas que permitieron definir funcionalidades, criterios éticos y necesidades reales de comunicación pública en distintos contextos europeos. El proyecto integra la colaboración de universidades con experiencia en gobernanza e innovación de medios, como la Universidad de Tampere y el Media and Journalism Research Center (MJRC), cuyos aportes fortalecen el encaje académico y metodológico en las políticas de comunicación pública inclusiva. Gracias a estas alianzas, VALUEbot se alinea con las políticas de digitalización responsable, transparencia y mejora de la accesibilidad comunicativa. VALUEbot utiliza IA local para garantizar la independencia y proteger la privacidad, integrando una matriz ética. Todo ello coincide con los lineamientos del Atlas del PNUD, que promueve innovaciones capaces de amplificar voces, facilitar la comprensión pública y conectar a la ciudadanía con las instituciones mediante tecnologías seguras y socialmente responsables."},"links":["https://psmresearchteam.com/","https://www.instagram.com/psm_research_team/","https://www.linkedin.com/company/psm-research-team/posts/?feedView=all","https://valuebot.eu/login"],"hasPhotos":true,"drive":"Check to see if both photos can be uploaded: https://drive.google.com/file/d/1X_c88VfsN9E6zkE_DfBocrRP-XwLzQb7/view?usp=sharing , https://drive.google.com/file/d/1py8GvNqKOXzl1qcekEXYHTyErUhXaImB/view?usp=sharing","prod":{"material":"PARCIAL","files":"• openpsm_banda.pdf — 1,5 MB · PDF (banner/pieza gráfica del proyecto)","pieces":"1) openpsm_banda.pdf (pieza gráfica del proyecto; exportar a PNG/JPG para web).","gap":"Solo llegó 1 archivo. Sugerencia para 2ª pieza: captura de la plataforma VALUEbot o del sitio psmresearchteam.com / Instagram @psm_research_team."}},{"id":"c019","tier":"Spotlight","category":"Exploring New Frontiers","categorySource":"official","iso":"MX","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Mexico","es":"México"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Elvia Derechos","org":"Instituto Electoral y de Participación Ciudadana de Yucatán","desc":{"en":"Elvia Derechos is a digital AI-powered platform by the Electoral Institute of Yucatán, Mexico, facilitating access to political-electoral rights. Named after pioneer Elvia Carrillo Puerto, the platform uses an AI agent trained exclusively on electoral legislation, jurisdictional criteria, and official protocols to provide practical, actionable guidance on running for office, accessing candidacies, presenting complaints, and using legal challenge procedures. The platform stores no personal data, guaranteeing privacy. Following its launch, Elvia Derechos received national media coverage on Telesur, Canal 13, Teleplay, and major radio stations—demonstrating significant public interest in accessible electoral rights communication tools.","es":"Elvia Derechos es una plataforma digital impulsada por IA del Instituto Electoral y de Participación Ciudadana de Yucatán, México, que facilita el acceso a los derechos político-electorales. Nombrada en honor a la pionera Elvia Carrillo Puerto, la plataforma utiliza un agente de IA entrenado exclusivamente con legislación electoral, criterios jurisdiccionales y protocolos oficiales para brindar orientación práctica y accionable sobre cómo postularse a un cargo, acceder a candidaturas, presentar quejas y utilizar los medios de impugnación. La plataforma no almacena datos personales, garantizando la privacidad. Tras su lanzamiento, Elvia Derechos recibió cobertura mediática nacional en Telesur, Canal 13, Teleplay y las principales estaciones de radio, lo que demuestra un interés público significativo en herramientas accesibles de comunicación sobre derechos electorales."},"details":{"en":"“‘Elvia Derechos’ is an accessible digital platform that facilitates the exercise and defense of political and electoral rights in Yucatán. It uses artificial intelligence trained exclusively on local and federal legislation, jurisdictional criteria, official protocols, and documented best practices, reducing misinformation and bringing citizens closer to justice and democratic participation. Its name honors Elvia Carrillo Puerto, a pioneer in women’s political rights.\nThis conversational agent offers practical and actionable guidance on how to participate in public decisions, hold office without violence, access a candidacy, or file complaints, reports, and appeals. It explains deadlines and requirements, simplifies legal procedures, and provides verified contacts for the relevant authorities. The site does not store personal data, guaranteeing privacy and security.\nThe target audience includes women, youth, Indigenous people, the LGBTIQ+ community, people with disabilities, party members, and public officials. The tool operates 24/7 at elviaderechos.com and integrates WhatsApp and SMS channels, expanding its reach to people with Low connectivity.\nThe initiative was launched on November 25, 2025, the International Day for the Elimination of Violence against Women, and was developed by an interdisciplinary team from the IEPAC (Electoral and Citizen Participation Institute of Yucatán) with expertise in electoral law, communication, and technology. Civil society organizations and activists participated from the early stages, providing expert feedback.\n'Elvia Derechos' innovates by combining specialized AI, accessible language, and a rights-based approach to democratize public information and close gaps in access to electoral justice and citizen participation mechanisms. Its modular architecture allows the model to be replicated in other entities, strengthening the relationship between citizens and institutions through inclusive, verifiable, and transparent information.\nhttps://www.youtube.com/watch?v=u52mq33qFVM \"Elvia Derechos\" emerged within the Electoral and Citizen Participation Institute of Yucatán (IEPAC) in response to the lack of a public defender's office for political and electoral rights. Although the State Congress approved Decree 655/2023 to create one, it was never implemented due to budget constraints and internal resistance, leaving Yucatán as one of the few states in the country without a public mechanism for guidance on this matter.\nFaced with this void, the IEPAC identified the urgent need to provide citizens with clear information about their political and electoral rights, the available institutional channels, and the competent authority for each type of conflict. Based on its mandate in civic education, citizen participation, substantive equality, and the prevention of political violence, the Institute developed an immediate and accessible alternative: \"Elvia Derechos,\" a digital platform that translates the legal and electoral framework into understandable and actionable guidance.\nThe initiative is directly linked to public policies on access to justice, democratic strengthening, and the guarantee of political and electoral rights. Although it does not replace the ombudsman's office provided for by law, it temporarily fills the gap, providing a reliable, timely channel aligned with the institutional mandate to ensure that citizens can exercise their rights without barriers.\"","es":"“'Elvia Derechos' es una plataforma digital accesible que facilita el ejercicio y la defensa de los derechos político-electorales en Yucatán. Utiliza inteligencia artificial entrenada exclusivamente con legislación local y federal, criterios jurisdiccionales, protocolos oficiales y buenas prácticas documentadas, reduciendo la desinformación y acercando a la ciudadanía a la justicia y a la participación democrática. Su nombre rinde homenaje a Elvia Carrillo Puerto, pionera de los derechos políticos de las mujeres.\nEste agente conversacional ofrece orientación práctica y accionable sobre cómo participar en las decisiones públicas, ejercer un cargo sin violencia, acceder a una candidatura o presentar quejas, denuncias y medios de impugnación. Explica plazos y requisitos, simplifica los procedimientos legales y proporciona contactos verificados de las autoridades competentes. El sitio no almacena datos personales, garantizando la privacidad y la seguridad.\nEl público objetivo incluye a mujeres, jóvenes, personas indígenas, la comunidad LGBTIQ+, personas con discapacidad, militantes de partidos y personas servidoras públicas. La herramienta opera las 24 horas, los 7 días de la semana, en elviaderechos.com e integra canales de WhatsApp y SMS, ampliando su alcance a personas con baja conectividad.\nLa iniciativa se lanzó el 25 de noviembre de 2025, Día Internacional de la Eliminación de la Violencia contra la Mujer, y fue desarrollada por un equipo interdisciplinario del IEPAC (Instituto Electoral y de Participación Ciudadana de Yucatán) con experiencia en derecho electoral, comunicación y tecnología. Organizaciones de la sociedad civil y activistas participaron desde las primeras etapas, aportando retroalimentación experta.\n'Elvia Derechos' innova al combinar IA especializada, lenguaje accesible y un enfoque basado en derechos para democratizar la información pública y cerrar las brechas en el acceso a la justicia electoral y a los mecanismos de participación ciudadana. Su arquitectura modular permite replicar el modelo en otras entidades, fortaleciendo la relación entre la ciudadanía y las instituciones mediante información inclusiva, verificable y transparente.\nhttps://www.youtube.com/watch?v=u52mq33qFVM \"Elvia Derechos\" surgió en el seno del Instituto Electoral y de Participación Ciudadana de Yucatán (IEPAC) en respuesta a la falta de una defensoría pública de los derechos político-electorales. Aunque el Congreso del Estado aprobó el Decreto 655/2023 para crearla, esta nunca se implementó debido a restricciones presupuestarias y resistencias internas, dejando a Yucatán como una de las pocas entidades del país sin un mecanismo público de orientación en la materia.\nAnte este vacío, el IEPAC identificó la necesidad urgente de brindar a la ciudadanía información clara sobre sus derechos político-electorales, los canales institucionales disponibles y la autoridad competente para cada tipo de conflicto. Con base en su mandato en materia de educación cívica, participación ciudadana, igualdad sustantiva y prevención de la violencia política, el Instituto desarrolló una alternativa inmediata y accesible: \"Elvia Derechos\", una plataforma digital que traduce el marco jurídico y electoral en orientación comprensible y accionable.\nLa iniciativa está directamente vinculada a las políticas públicas de acceso a la justicia, fortalecimiento democrático y garantía de los derechos político-electorales. Aunque no sustituye a la defensoría prevista por la ley, cubre temporalmente ese vacío, ofreciendo un canal confiable y oportuno, alineado con el mandato institucional de asegurar que la ciudadanía pueda ejercer sus derechos sin barreras.\""},"links":["www.elviaderechos.com"],"hasPhotos":true,"drive":"Check to see if both photos can be uploaded: https://drive.google.com/file/d/13i_MT7FIBIdJJvimzUymbfrwTQjX-VJi/view?usp=sharing , https://drive.google.com/file/d/1s5HFvSQRyclwbPHU5ssAkLSSgo7leXod/view?usp=sharing","prod":{"material":"PARCIAL","files":"• Elvia Derechos.png — 1,3 MB · 2880x1614 px · Pieza gráfica/captura en buena resolución","pieces":"1) Elvia Derechos.png (imagen principal, buena resolución).","gap":"Solo llegó 1 archivo. Sugerencia para 2ª pieza: captura de la plataforma www.elviaderechos.com mostrando la conversación con la asistente."}},{"id":"c020","tier":"Spotlight","category":"Trust Catalysts","categorySource":"official","iso":"CO","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Colombia","es":"Colombia"},"type":{"en":"Media","es":"Medio de comunicación"},"name":"Ecos de Ciénaga de Oro","org":"EMISORA COMUNITARIA LATINA STEREO 89.0FM","desc":{"en":"Ecos de Ciénaga de Oro is a community radio and citizen dialogue initiative by Latina Stereo 89.0FM in Ciénaga de Oro, Colombia. Using radio gamification and Participatory Community Audio (ACP), it transforms complex topics—ecosystem protection, local history, cultural regulation—into accessible interactive experiences. Citizens send audio responses and historical data via chat tools, which are broadcast and distributed through WhatsApp, Facebook, and Telegram. This methodology validates oral memory as a primary knowledge source, fostering intergenerational active listening and strengthening community trust in cultural institutions. Since its 2024 launch, the initiative has maintained sustained multi-generational participation.","es":"Ecos de Ciénaga de Oro es una iniciativa de radio comunitaria y diálogo ciudadano de Latina Stereo 89.0FM en Ciénaga de Oro, Colombia. Mediante la gamificación radial y el Audio Comunitario Participativo (ACP), transforma temas complejos —protección de ecosistemas, historia local, normativa cultural— en experiencias interactivas accesibles. La ciudadanía envía respuestas en audio y datos históricos a través de herramientas de chat, que se difunden por radio y se distribuyen mediante WhatsApp, Facebook y Telegram. Esta metodología valida la memoria oral como fuente primaria de conocimiento, fomentando la escucha activa intergeneracional y fortaleciendo la confianza comunitaria en las instituciones culturales. Desde su lanzamiento en 2024, la iniciativa ha mantenido una participación multigeneracional sostenida."},"details":{"en":"\"Initiative Summary\nEcos de Ciénaga de Oro is a public communication and citizen dialogue initiative designed to transform complex topics (such as ecosystem protection, local history, and cultural regulations) into interactive and accessible experiences. The initiative is based on radio gamification through a weekly segment on Latina Stereo. It utilizes Participatory Community Audio (PCA), where citizens are invited to record short responses, anecdotes, or historical facts about Ciénaga de Oro using audio chat tools, disseminating all the material through the website (Facebook, WhatsApp). This method guarantees Active Listening and Intergenerational Dialogue by recovering and validating local Oral History as a primary source of knowledge, strengthening trust in the institutions that support this cultural recovery.\nInitiative Objectives\nTo translate complex topics (ecosystem protection, local history, cultural regulations) into accessible communicative experiences for everyone community.\nPromote citizen participation through the use of Participatory Community Audio (PCA), inviting people to contribute local knowledge, anecdotes, and memories.\nStrengthen active listening and intergenerational dialogue, recognizing and validating Oral History as a legitimate source of knowledge.\nIncrease community trust in the institutions involved in cultural preservation and public communication.\nExpand access to local information through multiplatform strategies (radio, Telegram, Facebook, WhatsApp, web).\nTarget audience\nResidents of Ciénaga de Oro, especially those with historical, cultural, or environmental knowledge.\nOlder adults who are bearers of oral history.\nYouth and adolescents, to foster generational renewal and the use of innovative formats.\nThe general community interested in local identity, culture, and heritage.\nKey community stakeholders (leaders, teachers, cultural managers).\nYear of development\nThe initiative was developed in 2024.\nThe initiative is innovative because It combines traditional radio with gamification and the use of Participatory Community Audio, allowing any citizen to generate content and become a primary source of knowledge. By integrating oral history, intergenerational participation, and accessible digital platforms such as WhatsApp, Telegram, and Facebook, it creates a unique communication ecosystem that transforms complex issues into relatable and collaborative experiences. This blend of simple technology, citizen dialogue, and cultural recovery makes “Ecos de Ciénaga de Oro” a novel model of public communication and local knowledge management. \"Ecos de Ciénaga de Oro is directly linked to the municipality's cultural and environmental public policies by contributing to the safeguarding of intangible heritage and community education. Its focus on recovering oral history strengthens the institutional objectives of preserving local identity, documenting traditional knowledge, and promoting citizen participation in knowledge building. Through its partnership with the community radio station Latina Stereo and coordinated work with local cultural and environmental agencies, the initiative offers an effective channel for institutions to disseminate information, gather citizen input, and connect their programs with the realities of the region.\nThe Participatory Community Audio methodology also aligns with transparency and governance policies by creating spaces where the community interacts horizontally with public actors. This active listening process informs institutional decisions and strengthens trust in the entities that support cultural recovery. Thus, the initiative acts as a bridge between citizens and institutions, facilitating the implementation and social appropriation of local public policies.\"","es":"\"Resumen de la iniciativa\nEcos de Ciénaga de Oro es una iniciativa de comunicación pública y diálogo ciudadano diseñada para transformar temas complejos (como la protección de los ecosistemas, la historia local y la normativa cultural) en experiencias interactivas y accesibles. La iniciativa se basa en la gamificación radial a través de un segmento semanal en Latina Stereo. Utiliza el Audio Comunitario Participativo (ACP), en el que se invita a la ciudadanía a grabar respuestas breves, anécdotas o datos históricos sobre Ciénaga de Oro utilizando herramientas de chat de audio, y todo el material se difunde a través del sitio web (Facebook, WhatsApp). Este método garantiza la escucha activa y el diálogo intergeneracional al recuperar y validar la historia oral local como fuente primaria de conocimiento, fortaleciendo la confianza en las instituciones que respaldan esta recuperación cultural.\nObjetivos de la iniciativa\nTraducir temas complejos (protección de ecosistemas, historia local, normativa cultural) en experiencias comunicativas accesibles para toda la comunidad.\nPromover la participación ciudadana mediante el uso del Audio Comunitario Participativo (ACP), invitando a las personas a aportar conocimientos locales, anécdotas y memorias.\nFortalecer la escucha activa y el diálogo intergeneracional, reconociendo y validando la historia oral como fuente legítima de conocimiento.\nAumentar la confianza comunitaria en las instituciones involucradas en la preservación cultural y la comunicación pública.\nAmpliar el acceso a la información local mediante estrategias multiplataforma (radio, Telegram, Facebook, WhatsApp, web).\nPúblico objetivo\nHabitantes de Ciénaga de Oro, especialmente quienes poseen conocimientos históricos, culturales o ambientales.\nPersonas adultas mayores portadoras de la historia oral.\nJóvenes y adolescentes, para fomentar el relevo generacional y el uso de formatos innovadores.\nLa comunidad en general interesada en la identidad, la cultura y el patrimonio locales.\nActores comunitarios clave (líderes, docentes, gestores culturales).\nAño de desarrollo\nLa iniciativa se desarrolló en 2024.\nLa iniciativa es innovadora porque combina la radio tradicional con la gamificación y el uso del Audio Comunitario Participativo, permitiendo que cualquier ciudadano genere contenido y se convierta en fuente primaria de conocimiento. Al integrar la historia oral, la participación intergeneracional y plataformas digitales accesibles como WhatsApp, Telegram y Facebook, crea un ecosistema de comunicación único que transforma temas complejos en experiencias cercanas y colaborativas. Esta combinación de tecnología sencilla, diálogo ciudadano y recuperación cultural convierte a “Ecos de Ciénaga de Oro” en un modelo novedoso de comunicación pública y gestión del conocimiento local. \"Ecos de Ciénaga de Oro está directamente vinculada a las políticas públicas culturales y ambientales del municipio al contribuir a la salvaguardia del patrimonio inmaterial y a la educación comunitaria. Su enfoque en la recuperación de la historia oral fortalece los objetivos institucionales de preservar la identidad local, documentar los saberes tradicionales y promover la participación ciudadana en la construcción de conocimiento. A través de su alianza con la emisora comunitaria Latina Stereo y del trabajo coordinado con las entidades culturales y ambientales locales, la iniciativa ofrece un canal eficaz para que las instituciones difundan información, recojan aportes ciudadanos y conecten sus programas con las realidades de la región.\nLa metodología del Audio Comunitario Participativo también se alinea con las políticas de transparencia y gobernanza al crear espacios donde la comunidad interactúa horizontalmente con los actores públicos. Este proceso de escucha activa informa las decisiones institucionales y fortalece la confianza en las entidades que respaldan la recuperación cultural. De este modo, la iniciativa actúa como puente entre la ciudadanía y las instituciones, facilitando la implementación y la apropiación social de las políticas públicas locales.\""},"links":["📲 Síguenos y conéctate: 👉 Facebook: https://www.facebook.com/share/1NCrnK74vJ/?mibextid=wwXIfr  👉 Instagram: https://www.instagram.com/latinastereo89.0fm?igsh=MXRmd3htazRpMnEyYQ==  👉 YouTube: https://youtube.com/@latinastereocienagadeoroco5412?si=grP-4j-IAdKXuMoD  🌐 Web: https://latinastereo.com.co/"],"hasPhotos":true,"drive":"Check to see if both photos can be uploaded: https://drive.google.com/file/d/1260moiNEvopv49ih6mGg5Q3xOxaOToFq/view?usp=sharing , https://drive.google.com/file/d/19u00eHEyd9E0MpmikySiNNCEJlsJew8e/view?usp=sharing","prod":{"material":"NO","files":"CARPETA VACÍA — no llegó ningún archivo","pieces":"Ninguno por ahora.","gap":"Carpeta vacía; según hoja de contactos se usaron imágenes de la postulación → recuperarlas (2 fotos de Latina Stereo 89.0 FM / diálogos ciudadanos) o tomar piezas del Facebook oficial."}},{"id":"c021","tier":"High visibility","category":"Clarity in Action","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Minha Escola Ensina Direitos","org":"Defensoria Pública do Estado do Ceará","desc":{"en":"Minha Escola Ensina Direitos is a project by Ceará's Public Defender's Office promoting children's and adolescents' rights in public schools using plain language materials. Now in its second consecutive year, the initiative brings rights-based discussions into classrooms through a monthly binder workbook, folders, and banners, with two public defenders visiting each school monthly. A creative competition at year's end reinforces learning. In 2025, the program reached 280 students across 5 cities and won first place in the popular vote at the 2nd Plain Language Marathon for Citizenship—organized by the Brazilian Chamber of Deputies' Hacker Lab—validating it as a national reference for accessible institutional communication.","es":"Minha Escola Ensina Direitos es un proyecto de la Defensoría Pública de Ceará que promueve los derechos de niños, niñas y adolescentes en escuelas públicas mediante materiales en lenguaje claro. En su segundo año consecutivo, la iniciativa lleva las discusiones sobre derechos a las aulas a través de un cuaderno de actividades tipo carpeta con temas mensuales, folletos y pancartas, con la visita mensual de dos defensores públicos a cada escuela. Un concurso creativo al final del año refuerza el aprendizaje. En 2025, el programa llegó a 280 estudiantes en 5 ciudades y obtuvo el primer lugar en la votación popular de la 2.ª Maratón de Lenguaje Claro para la Ciudadanía —organizada por el Laboratorio Hacker de la Cámara de Diputados de Brasil—, lo que lo valida como referencia nacional en comunicación institucional accesible."},"details":{"en":"My School Teaches Rights is a project to promote the rights of children and adolescents in 14 public schools across 3 cities. It's in its second consecutive year and aims to bring discussions that go beyond textbooks into the classroom, contributing to the full exercise of citizenship. Within this scope, the Communications Department (Secom) was tasked with developing all the didactic content and visual identity of the project, starting with the program's name. Our proposal was to create visually appealing and easily understandable material using simple language. A binder-style notebook was prepared, separating the themes by month, and printed in a thousand copies. In addition, brochures and banners were used to publicize the monthly activities at the school, where two advocates address the defined themes. At the end of the year, Secom organized a contest of activities for the students based on the content learned. The simple language approach was designed to ensure that young people understand the information and exercise their citizenship, without language being an obstacle to accessing their rights. In addition to democratizing knowledge about rights, the initiative fosters youth empowerment, encouraging debate and participation in practical activities.","es":"Mi Escuela Enseña Derechos es un proyecto para promover los derechos de niños, niñas y adolescentes en 14 escuelas públicas de 3 ciudades. Se encuentra en su segundo año consecutivo y busca llevar al aula discusiones que van más allá de los libros de texto, contribuyendo al pleno ejercicio de la ciudadanía. En este marco, el Departamento de Comunicación (Secom) tuvo a su cargo el desarrollo de todo el contenido didáctico y la identidad visual del proyecto, comenzando por el nombre del programa. Nuestra propuesta fue crear material visualmente atractivo y de fácil comprensión, utilizando un lenguaje sencillo. Se elaboró un cuaderno tipo carpeta, con los temas organizados por mes, del que se imprimieron mil ejemplares. Además, se utilizaron folletos y pancartas para difundir las actividades mensuales en la escuela, donde dos defensores abordan los temas definidos. Al final del año, la Secom organizó un concurso de actividades para los estudiantes basado en los contenidos aprendidos. El enfoque de lenguaje sencillo fue concebido para garantizar que los jóvenes comprendan la información y ejerzan su ciudadanía, sin que el lenguaje sea un obstáculo para acceder a sus derechos. Además de democratizar el conocimiento sobre los derechos, la iniciativa fomenta el empoderamiento juvenil, incentivando el debate y la participación en actividades prácticas."},"links":["www.defensoria.ce.def.br IG","YT e TK @defensoriaceara"],"hasPhotos":false,"drive":null},{"id":"c022","tier":"High visibility","category":"Exploring New Frontiers","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Personaliza.br","org":"Secretaria de Governo Digital - MGI","desc":{"en":"Personaliza.br is Brazil's new personalized public communication architecture led by the Secretariat of Digital Government. Its centerpiece is the Caixa Postal Digital—a free, protected official channel within the gov.br platform automatically available to over 164 million Brazilians. The ecosystem integrates notifications via Caixa Postal, app push notifications, and official messages through WhatsApp, SMS, RCS, and authenticated email—always linked to public services and citizen rights. Since 2025, the system has sent over 140 million messages, with the Caixa Postal achieving a 15% average read rate (exceeding traditional email/SMS benchmarks) and 95% satisfaction rate—making it Brazil's primary personalized government communication channel.","es":"Personaliza.br es la nueva arquitectura de comunicación pública personalizada de Brasil, liderada por la Secretaría de Gobierno Digital. Su pieza central es la Caixa Postal Digital, un canal oficial gratuito y protegido dentro de la plataforma gov.br, disponible automáticamente para más de 164 millones de brasileños. El ecosistema integra notificaciones a través de la Caixa Postal, notificaciones push en la aplicación y mensajes oficiales por WhatsApp, SMS, RCS y correo electrónico autenticado, siempre vinculados a servicios públicos y derechos ciudadanos. Desde 2025, el sistema ha enviado más de 140 millones de mensajes, y la Caixa Postal alcanza una tasa promedio de lectura del 15 % (superior a los referentes tradicionales de correo electrónico y SMS) y una tasa de satisfacción del 95 %, lo que la convierte en el principal canal de comunicación gubernamental personalizada de Brasil."},"details":{"en":"\"The Personaliza Gov initiative, including the Citizen's Digital Mailbox, led by the Secretariat of Digital Government (Ministry of Management and Innovation in Public Services), is the new architecture for personalized public communication of the Federal Government. Its objective is to make state communication more secure, useful, inclusive, and relevant, anticipating citizens' needs and reducing noise, fraud, and misinformation.\nLaunched in 2025, the Mailbox is an official, free, and protected channel within the gov.br platform, automatically available to more than 164 million people. The initiative consolidates an integrated public communication ecosystem that includes personalized notifications via Mailbox, push notifications in the gov.br app, and official messages via WhatsApp, SMS, RCS, and authenticated email – always linked to public services, public policies, and citizens' rights.\nThe central motivation is the contemporary challenge described by the UNDP Atlas: how to communicate clearly, reliably, and inclusively in an environment of information overload and increased fraud. While emails and SMS are widely exploited by spammers and...\" To combat fraud, the Mailbox creates a secure and noise-free environment, accessible through a validated digital identity (Silver and Gold levels).\nThe initiative involves public actors from across the Federal Government, including sectoral ministries (Education, Labor, Health, Justice, among others) and state agencies such as the Federal Revenue Service and INSS (National Institute of Social Security). These partners use Personaliza Gov to send reliable notifications about benefits, obligations, educational opportunities, document expirations, and security alerts.\nThe system uses segmentation based on data intelligence and simple language patterns, ensuring that each citizen receives only messages relevant to their profile and life stage. Simultaneously, educational campaigns reinforce good digital security practices, reducing phishing risks and increasing trust in official channels.\nThe innovation of the initiative lies in the unprecedented combination of personalization, security, multichannel integration, identity verification, and simple language, with metrics on readability, reach, and effectiveness.\nThe result is a new standard of active, preventive, and citizen-centered public communication, transforming gov.br from a passive portal into a proactive care system. Guidance and protection, aligned with the dimensions of trust, inclusion, and innovation highlighted by the UNDP Atlas.\"","es":"\"La iniciativa Personaliza Gov, que incluye la Caixa Postal Digital del Ciudadano, liderada por la Secretaría de Gobierno Digital (Ministerio de Gestión e Innovación en Servicios Públicos), es la nueva arquitectura de comunicación pública personalizada del Gobierno Federal. Su objetivo es hacer que la comunicación estatal sea más segura, útil, inclusiva y relevante, anticipándose a las necesidades de la ciudadanía y reduciendo el ruido, el fraude y la desinformación.\nLanzada en 2025, la Caixa Postal es un canal oficial, gratuito y protegido dentro de la plataforma gov.br, disponible automáticamente para más de 164 millones de personas. La iniciativa consolida un ecosistema integrado de comunicación pública que incluye notificaciones personalizadas a través de la Caixa Postal, notificaciones push en la aplicación gov.br y mensajes oficiales por WhatsApp, SMS, RCS y correo electrónico autenticado, siempre vinculados a servicios públicos, políticas públicas y derechos ciudadanos.\nLa motivación central es el desafío contemporáneo descrito por el Atlas del PNUD: cómo comunicar de manera clara, confiable e inclusiva en un entorno de sobrecarga informativa y aumento del fraude. Mientras los correos electrónicos y los SMS son ampliamente explotados por remitentes de spam y...\" Para combatir el fraude, la Caixa Postal crea un entorno seguro y libre de ruido, accesible mediante una identidad digital validada (niveles Plata y Oro).\nLa iniciativa involucra a actores públicos de todo el Gobierno Federal, incluidos ministerios sectoriales (Educación, Trabajo, Salud, Justicia, entre otros) y organismos estatales como la Receita Federal y el INSS (Instituto Nacional del Seguro Social). Estos socios utilizan Personaliza Gov para enviar notificaciones confiables sobre beneficios, obligaciones, oportunidades educativas, vencimientos de documentos y alertas de seguridad.\nEl sistema utiliza segmentación basada en inteligencia de datos y estándares de lenguaje sencillo, garantizando que cada ciudadano reciba únicamente los mensajes relevantes para su perfil y etapa de vida. Simultáneamente, campañas educativas refuerzan las buenas prácticas de seguridad digital, reduciendo los riesgos de phishing y aumentando la confianza en los canales oficiales.\nLa innovación de la iniciativa radica en la combinación inédita de personalización, seguridad, integración multicanal, verificación de identidad y lenguaje sencillo, con métricas de legibilidad, alcance y efectividad.\nEl resultado es un nuevo estándar de comunicación pública activa, preventiva y centrada en la ciudadanía, que transforma gov.br de un portal pasivo en un sistema proactivo de cuidado, orientación y protección, alineado con las dimensiones de confianza, inclusión e innovación destacadas por el Atlas del PNUD.\""},"links":["https://www.gov.br/governodigital/pt-br/infraestrutura-nacional-de-dados/decisao-baseada-em-dados/caixa-postal-digital-do-cidadao"],"hasPhotos":false,"drive":null},{"id":"c023","tier":"High visibility","category":"Exploring New Frontiers","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Campanha “O cuidado não pode ficar só no off” - Defesa dos Direitos de Crianças e Adolescentes no ambiente digital.","org":"Ministério Público do Estado da Bahia (MPBA).","desc":{"en":"The campaign 'O Cuidado Não Pode Ficar Só no Off' (Caring Can't Stay Offline) is an integrated communication initiative by Bahia's Public Ministry to mobilize parents and guardians on digital violence prevention for children and adolescents. The initiative combines a multi-channel advertising campaign with the Fala Filho platform—an AI-powered tool providing empathetic responses to parents' questions about online risks—plus a pedagogical manual and media partners across Bahia. Between October and November 2025, the Fala Filho platform recorded significant uptake from parents seeking guidance on children's internet safety, validating AI-assisted public communication as a scalable child protection outreach tool.","es":"La campaña 'O Cuidado Não Pode Ficar Só no Off' (El cuidado no puede quedarse solo fuera de línea) es una iniciativa de comunicación integrada del Ministerio Público de Bahía para movilizar a padres, madres y cuidadores en la prevención de la violencia digital contra niños, niñas y adolescentes. La iniciativa combina una campaña publicitaria multicanal con la plataforma Fala Filho —una herramienta impulsada por IA que ofrece respuestas empáticas a las preguntas de los padres sobre los riesgos en línea—, además de un manual pedagógico y aliados de medios en toda Bahía. Entre octubre y noviembre de 2025, la plataforma Fala Filho registró una adopción significativa por parte de padres que buscaban orientación sobre la seguridad de sus hijos en internet, validando la comunicación pública asistida por IA como una herramienta escalable de divulgación para la protección infantil."},"details":{"en":"\"The integrated communication action, an initiative of the Public Prosecutor's Office of Bahia's Center for Operational Support for Children and Adolescents (Caoca) and executed through the Social Communication Coordination of the MPBA, has as its central objective to sensitize, guide, and mobilize parents, guardians, and society in general for the prevention and confrontation of violence in the digital environment, disseminating qualified information, promoting the integral protection of children and adolescents, and strengthening the role of the MPBA as an agent for the promotion of rights and education for digital citizenship.\nThe initiative is composed of several fronts:\n- Advertising campaign with pieces, media, and partners from Bahia and even from outside the State, since it was replicated by other units of the Public Prosecutor's Office.\n- The Fala Filho digital platform: uses artificial intelligence to answer, in a simple and empathetic way, the main questions of parents and guardians about risks on the internet. The answers are presented by digital avatars that represent children and adolescents, promoting clarifying conversations and valuing the protagonism of children and youth. To access, simply visit the website.\" falafilho.com.br, specify the age range and choose the avatar that represents the child or adolescent you wish to protect. The platform, with youthful and accessible language, provides guidance on types of digital violence, warning signs, safe internet use, and also offers information on legislation, reporting channels, and forms of support and emotional assistance.\n- Press Office: responsible for disseminating the campaign among media outlets.\n- Guerrilla Action: carried out in schools with parents and guardians, generating videos for digital platforms and expanding the reach of the message.\nThe target audience of the campaign, developed between July and October 2025, includes parents and guardians of children and adolescents, education and health professionals, families, and society in general. Dissemination began on October 18, 2025.\nThe MPBA campaign constituted an innovative public communication action by strategically and uniquely integrating different fronts of social mobilization. The initiative articulated press relations, its own digital platform that offers continuous guidance to Parents and guardians (www.falafilho.com.br), in-person outreach activities with parents and guardians in schools, and the voluntary participation of the artist Lore Improta, expanding reach and engagement. This multi-channel approach, centered on the citizen and oriented towards prevention, consolidated a contemporary, integrated, accessible, effective public communication, focused on the citizen and oriented towards behavior change, capable of transforming information into protection and strengthening the institutional role of the MPBA (Public Prosecutor's Office of Bahia) in promoting rights. It combined digital communication, territorial presence, and social influence.\nPartners, among others: Morya Comunicação Agency\n\"","es":"\"La acción de comunicación integrada, iniciativa del Centro de Apoyo Operativo a la Niñez y la Adolescencia (Caoca) del Ministerio Público de Bahía y ejecutada a través de la Coordinación de Comunicación Social del MPBA, tiene como objetivo central sensibilizar, orientar y movilizar a padres, cuidadores y la sociedad en general para la prevención y el enfrentamiento de la violencia en el entorno digital, difundiendo información calificada, promoviendo la protección integral de niños, niñas y adolescentes y fortaleciendo el papel del MPBA como agente de promoción de derechos y de educación para la ciudadanía digital.\nLa iniciativa se compone de varios frentes:\n- Campaña publicitaria con piezas, medios y aliados de Bahía e incluso de fuera del estado, ya que fue replicada por otras unidades del Ministerio Público.\n- La plataforma digital Fala Filho: utiliza inteligencia artificial para responder, de manera sencilla y empática, las principales preguntas de padres y cuidadores sobre los riesgos en internet. Las respuestas son presentadas por avatares digitales que representan a niños, niñas y adolescentes, promoviendo conversaciones esclarecedoras y valorando el protagonismo de la niñez y la juventud. Para acceder, basta con visitar el sitio web\" falafilho.com.br, indicar el rango de edad y elegir el avatar que representa al niño, niña o adolescente que se desea proteger. La plataforma, con un lenguaje juvenil y accesible, ofrece orientación sobre los tipos de violencia digital, señales de alerta y uso seguro de internet, y también brinda información sobre legislación, canales de denuncia y formas de apoyo y asistencia emocional.\n- Oficina de Prensa: responsable de difundir la campaña entre los medios de comunicación.\n- Acción de Guerrilla: realizada en escuelas con padres y cuidadores, generando videos para plataformas digitales y ampliando el alcance del mensaje.\nEl público objetivo de la campaña, desarrollada entre julio y octubre de 2025, incluye a padres y cuidadores de niños, niñas y adolescentes, profesionales de la educación y la salud, familias y la sociedad en general. La difusión comenzó el 18 de octubre de 2025.\nLa campaña del MPBA constituyó una acción innovadora de comunicación pública al integrar de manera estratégica y singular diferentes frentes de movilización social. La iniciativa articuló las relaciones con la prensa, una plataforma digital propia que ofrece orientación continua a padres y cuidadores (www.falafilho.com.br), actividades presenciales de acercamiento con padres y cuidadores en escuelas, y la participación voluntaria de la artista Lore Improta, ampliando el alcance y el compromiso. Este enfoque multicanal, centrado en la ciudadanía y orientado a la prevención, consolidó una comunicación pública contemporánea, integrada, accesible y efectiva, enfocada en el ciudadano y orientada al cambio de comportamiento, capaz de transformar la información en protección y de fortalecer el papel institucional del MPBA (Ministerio Público de Bahía) en la promoción de derechos. Combinó comunicación digital, presencia territorial e influencia social.\nAliados, entre otros: Agencia Morya Comunicação\n\""},"links":["www.mpba.mb.br","@mpdabahia"],"hasPhotos":false,"drive":null},{"id":"c024","tier":"High visibility","category":"Clarity in Action","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Simplificação e acessibilidade em perguntas e respostas sobre esporotricose e covid-19","org":"Instituto de Comunicação e Informação Científica e Tecnológica em Saúde (Icict/Fiocruz)","desc":{"en":"The FAQ simplification initiative at Fiocruz's Portal reorganized and rewrote Q&A pages on health conditions including sporotrichosis and COVID-19 using plain language principles. Guided by analysis showing disease-related content was the most accessed on the portal, the team produced simplified, accessible answers co-developed with medical specialists. The 2022 rewrite of the sporotrichosis FAQ—a disease affecting vulnerable urban populations—demonstrated measurable comprehension improvement. Part of a broader Fiocruz plain language programme, this initiative establishes the institution as a national reference for accessible science communication in Brazilian public health.","es":"La iniciativa de simplificación de preguntas frecuentes del Portal de Fiocruz reorganizó y reescribió páginas de preguntas y respuestas sobre condiciones de salud, incluidas la esporotricosis y la COVID-19, aplicando principios de lenguaje claro. Guiado por un análisis que mostró que los contenidos relacionados con enfermedades eran los más consultados del portal, el equipo produjo respuestas simplificadas y accesibles, elaboradas en conjunto con especialistas médicos. La reescritura en 2022 de las preguntas frecuentes sobre esporotricosis —una enfermedad que afecta a poblaciones urbanas vulnerables— demostró una mejora medible en la comprensión. Como parte de un programa más amplio de lenguaje claro de Fiocruz, esta iniciativa consolida a la institución como referencia nacional en comunicación científica accesible en la salud pública brasileña."},"details":{"en":"\"The Oswaldo Cruz Foundation (Fiocruz) is one of Brazil's leading public health institutions. Its work encompasses the production, dissemination, and sharing of knowledge and technologies that strengthen the Unified Health System (SUS), promote health and quality of life, reduce social inequalities, and drive innovation in the country, with the defense of the right to health and citizenship as its central values. Among the institution's actions, the public communication of science on health topics stands out, seeking to present content in an accessible and understandable way.\nIn this context, the Fiocruz Portal, coordinated by the Institute of Scientific and Technological Communication and Information in Health (Icict/Fiocruz), is consolidated as an important channel for disseminating this information. Based on an analysis of historical data on portal access, we observed that articles dealing with diseases, their causes, and treatments were the most accessed by the public over the years. Therefore, we created Frequently Asked Questions (FAQ) pages on different diseases to facilitate access to this information.\" Through direct and simplified content.\nIn our work, the pages on sporotrichosis and COVID-19 stand out for several reasons. Sporotrichosis is a fungal disease that is quite common in Rio de Janeiro, both in rural and urban areas, transmitted through contaminated soil or contact with infected cats. In addition to creating the questions and answers to facilitate the flow of information, we simplified the text and translated it into Libras (Brazilian Sign Language) in 2022 to ensure comprehension by people with low literacy and/or who are deaf. The Q&A on COVID-19 was published on the portal in 2020 during the pandemic. Besides simplifying the text, we created an online poll alongside each published piece of content to assess citizen opinion, asking if they had found what they were looking for, if they had understood the information, and if they considered the content up-to-date. With this feedback, we were able to assess, in real time, whether any question was outdated or confusing for the citizen and needed further revision or simplification. Based on other Q&A pages, we verified that these solutions were innovative at the time of their implementation, as we did not identify similar alternatives. This experience demonstrated that simplifying language, promoting accessibility, and allowing citizen participation in content evaluation contribute significantly to democratizing access to health information.","es":"\"La Fundación Oswaldo Cruz (Fiocruz) es una de las principales instituciones de salud pública de Brasil. Su labor abarca la producción, difusión e intercambio de conocimientos y tecnologías que fortalecen el Sistema Único de Salud (SUS), promueven la salud y la calidad de vida, reducen las desigualdades sociales e impulsan la innovación en el país, con la defensa del derecho a la salud y la ciudadanía como valores centrales. Entre las acciones de la institución se destaca la comunicación pública de la ciencia sobre temas de salud, que busca presentar los contenidos de manera accesible y comprensible.\nEn este contexto, el Portal Fiocruz, coordinado por el Instituto de Comunicación e Información Científica y Tecnológica en Salud (Icict/Fiocruz), se consolida como un canal importante para difundir esta información. A partir de un análisis de datos históricos de acceso al portal, observamos que los artículos que abordaban enfermedades, sus causas y tratamientos eran los más consultados por el público a lo largo de los años. Por ello, creamos páginas de Preguntas Frecuentes (FAQ) sobre distintas enfermedades para facilitar el acceso a esta información\" mediante contenidos directos y simplificados.\nEn nuestro trabajo, las páginas sobre esporotricosis y COVID-19 se destacan por varias razones. La esporotricosis es una enfermedad fúngica bastante común en Río de Janeiro, tanto en zonas rurales como urbanas, transmitida a través de suelo contaminado o por contacto con gatos infectados. Además de crear las preguntas y respuestas para facilitar el flujo de información, simplificamos el texto y lo tradujimos a Libras (Lengua de Señas Brasileña) en 2022 para garantizar la comprensión de personas con baja alfabetización y/o personas sordas. Las preguntas y respuestas sobre COVID-19 se publicaron en el portal en 2020, durante la pandemia. Además de simplificar el texto, creamos una encuesta en línea junto a cada contenido publicado para conocer la opinión ciudadana, preguntando si habían encontrado lo que buscaban, si habían comprendido la información y si consideraban que el contenido estaba actualizado. Con esta retroalimentación pudimos evaluar, en tiempo real, si alguna pregunta estaba desactualizada o resultaba confusa para la ciudadanía y necesitaba una revisión o simplificación adicional. Con base en otras páginas de preguntas y respuestas, verificamos que estas soluciones eran innovadoras en el momento de su implementación, ya que no identificamos alternativas similares. Esta experiencia demostró que simplificar el lenguaje, promover la accesibilidad y permitir la participación ciudadana en la evaluación de los contenidos contribuye significativamente a democratizar el acceso a la información en salud.\""},"links":["https://fiocruz.br/"],"hasPhotos":false,"drive":null},{"id":"c025","tier":"High visibility","category":"Trust Catalysts","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Rede InovaGov","org":"Escola Nacional de Administração Pública (Enap)","desc":{"en":"Rede InovaGov (InnovaGov Network) by Brazil's National School of Public Administration (Enap) is a collaborative ecosystem transforming public communication into a distributed, participatory practice. Connecting 13,000+ members from federal, state, and municipal agencies, universities, and collectives, the network operates through 22 communities of practice, 40+ WhatsApp thematic groups, an open digital platform, and a collaborative library. Any member can participate and propose content regardless of their organization. By December 2025, the platform had 82 innovation units and 102 mapped initiatives—demonstrating how horizontal communication architecture can build innovation culture across fragmented public administration ecosystems.","es":"La Rede InovaGov (Red InovaGov), de la Escuela Nacional de Administración Pública de Brasil (Enap), es un ecosistema colaborativo que transforma la comunicación pública en una práctica distribuida y participativa. Al conectar a más de 13.000 miembros de organismos federales, estatales y municipales, universidades y colectivos, la red opera a través de 22 comunidades de práctica, más de 40 grupos temáticos de WhatsApp, una plataforma digital abierta y una biblioteca colaborativa. Cualquier miembro puede participar y proponer contenidos, independientemente de su organización. A diciembre de 2025, la plataforma contaba con 82 unidades de innovación y 102 iniciativas mapeadas, lo que demuestra cómo una arquitectura de comunicación horizontal puede construir cultura de innovación en ecosistemas fragmentados de administración pública."},"details":{"en":"\"The InovaGov Network is a collaborative ecosystem coordinated by the National School of Public Administration (Enap) that transforms public communication into a distributed, participatory practice oriented towards government innovation. Created to connect people and instituti
