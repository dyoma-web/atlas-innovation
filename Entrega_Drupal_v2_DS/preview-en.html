mme’s Communication team  and involved creating a journalism workshop for adolescents, aimed at training them to carry out journalistic coverage of the event.\nSixteen adolescents (including two girls and one transgender boy) from five socio‑educational facilities took part in the workshops. These facilities were selected from nearly 40 applications to represent Brazil’s five macro‑regions. Selection also considered existing communication infrastructure and previous projects in the field.\nThe project reaffirms communication as a human right, ensures protagonism for a historically marginalized group, and amplifies the voices of these adolescents. The youths’ final productions, including video reports, written articles, and photographs, were disseminated internally within each facility. A short video was also shared on UNDP Brazil’s social media channels, with due attention to privacy and the protection of participants’ identities.\nA survey conducted with socio-educational staff responsible for the participating adolescents indicated a positive impact of the initiative on both individual trajectories and daily life within the facilities. The professionals reported there was high engagement throughout the training and journalistic coverage, as well as strong comprehension and practical application of the content. Improvements were observed in skills such as active listening, organising ideas, teamwork, and oral and written communication, alongside strengthened self-esteem and a greater sense of belonging, as their narratives were recognized and disseminated.\nThe project is also noteworthy for its intersectoral nature, with impacts across the fields of Justice, Culture, Education, and Communication.\nThe initiative is expected to be expanded to additional facilities during the coverage of the 2026 edition of Literary Pathways. The project can be easily replicated in facilities with minimal recording infrastructure, as editing can be done using mobile devices.\"","es":"A través del Programa Haciendo Justicia, el Programa de las Naciones Unidas para el Desarrollo (PNUD) se asocia con el Consejo Nacional de Justicia (CNJ) para implementar acciones transformadoras dentro de los sistemas penal y socioeducativo (justicia juvenil) de Brasil.\nDesde 2022, el Programa organiza anualmente el evento Caminhos Literários no Socioeducativo (Caminos Literarios en el Sistema Socioeducativo), que reúne a cientos de adolescentes que cumplen medidas socioeducativas en actividades virtuales y presenciales centradas en la cultura y la expresión artística, incluidas conferencias, talleres y presentaciones musicales y audiovisuales preparadas por los propios jóvenes participantes. En su 4.ª edición (2025), el evento contó con 84 centros participantes, con representantes de las 27 unidades federativas de Brasil.\nEl proyecto fue desarrollado por el equipo de Comunicación del Programa Haciendo Justicia e implicó la creación de un taller de periodismo para adolescentes, orientado a capacitarlos para realizar la cobertura periodística del evento.\nDieciséis adolescentes (incluidas dos niñas y un niño transgénero) de cinco centros socioeducativos participaron en los talleres. Estos centros fueron seleccionados entre casi 40 postulaciones para representar las cinco macrorregiones de Brasil. La selección también consideró la infraestructura de comunicación existente y los proyectos previos en el área.\nEl proyecto reafirma la comunicación como un derecho humano, garantiza el protagonismo de un grupo históricamente marginado y amplifica las voces de estos adolescentes. Las producciones finales de los jóvenes, que incluyeron reportajes en video, artículos escritos y fotografías, se difundieron internamente en cada centro. También se compartió un video corto en las redes sociales del PNUD Brasil, con la debida atención a la privacidad y la protección de la identidad de los participantes.\nUna encuesta realizada al personal socioeducativo responsable de los adolescentes participantes indicó un impacto positivo de la iniciativa tanto en las trayectorias individuales como en la vida cotidiana dentro de los centros. Los profesionales reportaron un alto nivel de compromiso durante toda la capacitación y la cobertura periodística, así como una sólida comprensión y aplicación práctica de los contenidos. Se observaron mejoras en habilidades como la escucha activa, la organización de ideas, el trabajo en equipo y la comunicación oral y escrita, junto con el fortalecimiento de la autoestima y un mayor sentido de pertenencia, al ser sus narrativas reconocidas y difundidas.\nEl proyecto también se destaca por su carácter intersectorial, con impactos en los ámbitos de la Justicia, la Cultura, la Educación y la Comunicación.\nSe espera que la iniciativa se amplíe a más centros durante la cobertura de la edición 2026 de Caminos Literarios. El proyecto puede replicarse fácilmente en centros con una infraestructura mínima de grabación, ya que la edición puede realizarse con dispositivos móviles."},"links":["https://www.fazendojustica.org.br/"],"hasPhotos":false,"drive":null},{"id":"c037","tier":"High visibility","category":"Dialogue Builders","categorySource":"official","iso":"CD","lang":"French","region":{"en":"Africa","es":"África"},"country":{"en":"DR Congo","es":"RD Congo"},"type":{"en":"University or research centre","es":"Universidad o centro de investigación"},"name":"“TUJENGE AMANI PAMOYA” Programme de dialogue intergénérationnel pour la confiance, la collaboration et la cohésion sociale","org":"Laboratoire Interdisciplinaire du Développement Social LAIDES/Université de Goma","desc":{"en":"Tujenge Amani Pamoya ('Let's Build Peace Together') is an intergenerational dialogue programme by the LAIDES research laboratory at the University of Goma in eastern DRC. Responding to persistent distrust between youth and elders, the programme combines academic expertise with community anchoring to strengthen social cohesion through structured dialogue methodologies. At the November 2025 Pole Institute event, participants observed notable reductions in intergenerational tensions and emergence of joint peaceful coexistence commitments—with youth leaders, religious authorities, and elders expressing renewed trust. The programme validates dialogue-based communication as a peacebuilding tool in conflict-affected communities.","es":"Tujenge Amani Pamoya (\"Construyamos la Paz Juntos\") es un programa de diálogo intergeneracional del laboratorio de investigación LAIDES de la Universidad de Goma, en el este de la RDC. En respuesta a la desconfianza persistente entre jóvenes y mayores, el programa combina la experiencia académica con el arraigo comunitario para fortalecer la cohesión social mediante metodologías estructuradas de diálogo. En el evento del Pole Institute de noviembre de 2025, los participantes observaron reducciones notables de las tensiones intergeneracionales y el surgimiento de compromisos conjuntos de convivencia pacífica, con líderes juveniles, autoridades religiosas y personas mayores expresando una confianza renovada. El programa valida la comunicación basada en el diálogo como herramienta de consolidación de la paz en comunidades afectadas por conflictos."},"details":{"en":"“Tujenge Amani Pamoya,” meaning “Let’s Build Peace Together,” is a public communication and intergenerational dialogue program led by the Interdisciplinary Laboratory for Social Development (LAIDES), a research center affiliated with the University of Goma. It combines academic expertise with the community roots of participants and local leaders to strengthen social cohesion and intergenerational trust in eastern DRC.\nThe initiative addresses a major challenge: the persistent mistrust between young and old, exacerbated by gerontocracy and a lack of inclusive dialogue. It aims to:\n• Reduce intergenerational mistrust and misunderstandings.\n• Foster constructive and inclusive dialogue, based on active listening and respect for pluralism.\n• Develop a structured public communication methodology adaptable to other contexts.\n• Create sustainable spaces for exchange between young leaders, community leaders, religious leaders, and elders, generating shared commitments to peaceful coexistence.\nTarget audience and stakeholders: Young community and religious leaders, influencers, elders and traditional leaders, community and religious leaders, and citizens participating in the dialogues.\nInnovation: The program transforms public communication into a concrete tool for reducing tensions, building trust, and fostering cooperation. It is based on an intergenerational dialogue organized by Pole Institute on November 27, 2025, in Goma, the provincial capital of North Kivu, which was then capitalized on and systematized by LAIDES to develop a replicable methodology. The emphasis is on active listening, respectful dialogue, and co-creation, offering strong potential for replication in other regions of the Global South and contributing to peaceful, inclusive, and sustainable local governance.\n\"","es":"\"Tujenge Amani Pamoya\", que significa \"Construyamos la Paz Juntos\", es un programa de comunicación pública y diálogo intergeneracional liderado por el Laboratorio Interdisciplinario para el Desarrollo Social (LAIDES), un centro de investigación afiliado a la Universidad de Goma. Combina la experiencia académica con el arraigo comunitario de los participantes y líderes locales para fortalecer la cohesión social y la confianza intergeneracional en el este de la RDC.\nLa iniciativa aborda un desafío mayor: la desconfianza persistente entre jóvenes y mayores, exacerbada por la gerontocracia y la falta de un diálogo inclusivo. Sus objetivos son:\n• Reducir la desconfianza y los malentendidos intergeneracionales.\n• Fomentar un diálogo constructivo e inclusivo, basado en la escucha activa y el respeto al pluralismo.\n• Desarrollar una metodología estructurada de comunicación pública adaptable a otros contextos.\n• Crear espacios sostenibles de intercambio entre líderes jóvenes, líderes comunitarios, líderes religiosos y personas mayores, generando compromisos compartidos de convivencia pacífica.\nPúblico objetivo y partes interesadas: jóvenes líderes comunitarios y religiosos, personas influyentes, personas mayores y líderes tradicionales, líderes comunitarios y religiosos, y la ciudadanía que participa en los diálogos.\nInnovación: el programa transforma la comunicación pública en una herramienta concreta para reducir tensiones, generar confianza y fomentar la cooperación. Se basa en un diálogo intergeneracional organizado por el Pole Institute el 27 de noviembre de 2025 en Goma, capital provincial de Kivu del Norte, que luego fue capitalizado y sistematizado por LAIDES para desarrollar una metodología replicable. El énfasis está puesto en la escucha activa, el diálogo respetuoso y la cocreación, con un fuerte potencial de replicación en otras regiones del Sur Global y una contribución a una gobernanza local pacífica, inclusiva y sostenible."},"links":["https://www.unigom.ac.cd/"],"hasPhotos":false,"drive":null},{"id":"c038","tier":"High visibility","category":"Clarity in Action","categorySource":"official","iso":"BJ","lang":"French","region":{"en":"Africa","es":"África"},"country":{"en":"Benin","es":"Benín"},"type":{"en":"Social innovation organization","es":"Organización de innovación social"},"name":"Terre et Femme – Communication publique inclusive pour les droits des femmes et l’environnement","org":"Terre et Femme","desc":{"en":"Terre et Femme is a social innovation and inclusive public communication initiative in Benin that makes public policies on women's rights, environment, and sustainable development more accessible and appropriable for local populations. Using citizen journalism, educational outreach, and social storytelling, the initiative translates technical public commitments into clear, culturally relevant messages for women, youth, and local communities. Stakeholders include civil society actors, media, public institutions, and community leaders. Since its creation, Terre et Femme has strengthened public access to gender and environmental rights information and increased visibility of underreported topics—building a more informed and engaged citizenry in West Africa.","es":"Terre et Femme es una iniciativa de innovación social y comunicación pública inclusiva en Benín que hace que las políticas públicas sobre derechos de las mujeres, medio ambiente y desarrollo sostenible sean más accesibles y apropiables para las poblaciones locales. Mediante el periodismo ciudadano, la divulgación educativa y la narrativa social, la iniciativa traduce compromisos públicos técnicos en mensajes claros y culturalmente pertinentes para mujeres, jóvenes y comunidades locales. Entre las partes interesadas se incluyen actores de la sociedad civil, medios de comunicación, instituciones públicas y líderes comunitarios. Desde su creación, Terre et Femme ha fortalecido el acceso público a la información sobre derechos de género y ambientales y ha aumentado la visibilidad de temas poco cubiertos, contribuyendo a una ciudadanía más informada y comprometida en África Occidental."},"details":{"en":"\"Terre et Femme is a social innovation and inclusive public communication initiative in Benin that aims to make public policies related to women's rights, the environment, and sustainable development more accessible, understandable, and embraced by the population.\nThe initiative uses a citizen journalism, educational outreach, and social storytelling approach to translate often technical public texts, programs, and commitments into clear, contextualized, and culturally relevant messages.\nTerre et Femme primarily targets women, youth, and local communities, while also involving civil society actors, the media, public institutions, and community leaders as stakeholders.\nActivities include producing informational and awareness-raising content, disseminating information digitally on social media, covering public and community initiatives, and highlighting citizen testimonies.\nTerre et Femme's innovative nature lies in its ability to integrate public communication, human rights, and citizen participation within a local context, prioritizing accessible and inclusive formats. The initiative thus contributes to strengthening understanding of public policies.\" \"Transparency in public action and civic engagement, particularly in developing countries.\"","es":"Terre et Femme es una iniciativa de innovación social y comunicación pública inclusiva en Benín que tiene como objetivo hacer que las políticas públicas relacionadas con los derechos de las mujeres, el medio ambiente y el desarrollo sostenible sean más accesibles, comprensibles y apropiadas por la población.\nLa iniciativa utiliza un enfoque de periodismo ciudadano, divulgación educativa y narrativa social para traducir textos, programas y compromisos públicos, a menudo técnicos, en mensajes claros, contextualizados y culturalmente pertinentes.\nTerre et Femme se dirige principalmente a las mujeres, los jóvenes y las comunidades locales, e involucra también como partes interesadas a actores de la sociedad civil, los medios de comunicación, las instituciones públicas y los líderes comunitarios.\nLas actividades incluyen la producción de contenidos informativos y de sensibilización, la difusión digital de información en redes sociales, la cobertura de iniciativas públicas y comunitarias, y la puesta en valor de testimonios ciudadanos.\nEl carácter innovador de Terre et Femme radica en su capacidad para integrar la comunicación pública, los derechos humanos y la participación ciudadana en un contexto local, priorizando formatos accesibles e inclusivos. De este modo, la iniciativa contribuye a fortalecer la comprensión de las políticas públicas, la transparencia de la acción pública y el compromiso cívico, en particular en los países en desarrollo."},"links":["Nos coordonnées : ‎1️⃣ Facebook :https://www.facebook.com/terreetfemmebenin ‎2️⃣ Twitter (X) : https://x.com/FemmeetTerre?t=kRdailTOI1TYtzTh1DchUw&s=09 ‎3️⃣ Instagram : https://www.instagram.com/terreetfemme?igsh=MTN4ZXhnaGl5ZDd4cw== ‎4️⃣ Bluesky : https://bsky.app/profile/terreetfemme.bsky.social ‎5️⃣ LinkedIn : https://www.linkedin.com/in/terre-femme-a15898366?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=android_app ‎6️⃣ WhatsApp : https://whatsapp.com/channel/0029VbAZtegEgGfDer4tTp1U"],"hasPhotos":false,"drive":null},{"id":"c039","tier":"High visibility","category":"Clarity in Action","categorySource":"official","iso":"MX","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Mexico","es":"México"},"type":{"en":"Civil society organisation","es":"Organización de la sociedad civil"},"name":"Denuncia.org","org":"Impunidad Cero","desc":{"en":"Denuncia.org is a digital platform by Impunidad Cero launched in 2020 to help crime victims in Mexico understand how to file complaints. In a country where over 93% of crimes go unreported largely due to bureaucratic complexity, the platform uses technology to translate dense legal language into accessible guidance—offering a court agency locator, specialized reporting guides, and simplified procedural information. Since launch, it has registered 1,834,802 unique users and 2,194,378 sessions, and received the 2022 Latin American Digital Democracy Award. Originally focused on ordinary citizens, it became a key resource for legal professionals and civil society organizations—demonstrating how civic technology can reduce barriers to justice.","es":"Denuncia.org es una plataforma digital de Impunidad Cero lanzada en 2020 para ayudar a las víctimas de delitos en México a entender cómo presentar denuncias. En un país donde más del 93% de los delitos no se denuncian, en gran medida por la complejidad burocrática, la plataforma utiliza la tecnología para traducir un lenguaje jurídico denso en orientación accesible: ofrece un localizador de agencias del Ministerio Público, guías especializadas de denuncia e información procesal simplificada. Desde su lanzamiento, ha registrado 1.834.802 usuarios únicos y 2.194.378 sesiones, y recibió el Premio Latinoamericano de Democracia Digital 2022. Concebida originalmente para la ciudadanía en general, se convirtió en un recurso clave para profesionales del derecho y organizaciones de la sociedad civil, demostrando cómo la tecnología cívica puede reducir las barreras de acceso a la justicia."},"details":{"en":"Denuncia.org is an initiative of Impunidad Cero (Zero Impunity), launched in September 2020 with the support of the Friedrich Naumann Foundation. Its purpose is to offer simple and accessible information so that any victim of a crime in Mexico can understand what they need, where to go, and how to file a complaint. The platform is designed to combat the dark figure of crime in Mexico, where more than 93% of crimes are neither reported nor investigated, largely due to bureaucratic complexity and a lack of understanding of the criminal process. Although the focus is on the average citizen, the tool has become a vital resource for justice system operators, law students, and civil society organizations in Mexico.\nDenuncia.org's innovation lies in its use of technology to translate the technical and legal language of criminal procedure into accessible language. The platform offers a set of practical tools, including a locator for Public Prosecutor's offices, a directory of digital complaint platforms available to state prosecutors for filing online complaints, downloadable forms, and a directory of more than 400 legal support organizations. Psychological. By bringing everything necessary together in one place, it makes it easier for victims of crime to reach the nearest agency to file a report, prepared, informed, and with realistic expectations about their process.\"","es":"Denuncia.org es una iniciativa de Impunidad Cero, lanzada en septiembre de 2020 con el apoyo de la Fundación Friedrich Naumann. Su propósito es ofrecer información sencilla y accesible para que cualquier víctima de un delito en México pueda entender qué necesita, a dónde acudir y cómo presentar una denuncia. La plataforma está diseñada para combatir la cifra negra del delito en México, donde más del 93% de los delitos no se denuncian ni se investigan, en gran medida debido a la complejidad burocrática y a la falta de comprensión del proceso penal. Aunque el enfoque está puesto en la ciudadanía en general, la herramienta se ha convertido en un recurso vital para operadores del sistema de justicia, estudiantes de derecho y organizaciones de la sociedad civil en México.\nLa innovación de Denuncia.org radica en su uso de la tecnología para traducir el lenguaje técnico y jurídico del procedimiento penal a un lenguaje accesible. La plataforma ofrece un conjunto de herramientas prácticas, que incluyen un localizador de agencias del Ministerio Público, un directorio de plataformas digitales de denuncia disponibles en las fiscalías estatales para presentar denuncias en línea, formularios descargables y un directorio de más de 400 organizaciones de apoyo legal y psicológico. Al reunir en un solo lugar todo lo necesario, facilita que las víctimas de delitos lleguen a la agencia más cercana para presentar su denuncia preparadas, informadas y con expectativas realistas sobre su proceso."},"links":["https://efe.com/ y Link en X: https://x.com/EFEnoticias"],"hasPhotos":false,"drive":null},{"id":"c040","tier":"High visibility","category":"Dialogue Builders","categorySource":"official","iso":"AR","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Argentina","es":"Argentina"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Participación y Construcción Comunitaria de la Seguridad Ciudadana – “Modelo de Abordaje en Prevención Comunitaria de la Secretaria de Estado de Participación Ciudadana Tucumán – Argentina”","org":"Secretaria de Estado de Participación Ciudadana del Gobierno de Tucuman - Argentina","desc":{"en":"The Community Participation and Public Safety model by Tucumán's State Secretariat for Citizen Participation in Argentina is an integrated strategy articulating democratic security, community prevention, digital citizenship, open government, and strategic public communication. Over eight years, four complementary programs—Smart Security, School of Citizenship, Organizing Communities, and Weaving Networks—reached more than 100,000 people through training sessions, innovation labs, and public outreach. The model's strength is its systemic approach: building community capacity through participatory communication rather than top-down messaging, fostering institutional trust while addressing security challenges from a rights-based perspective.","es":"El modelo de Participación Comunitaria y Seguridad Pública de la Secretaría de Estado de Participación Ciudadana de Tucumán, Argentina, es una estrategia integrada que articula seguridad democrática, prevención comunitaria, ciudadanía digital, gobierno abierto y comunicación pública estratégica. A lo largo de ocho años, cuatro programas complementarios —Seguridad Inteligente, Escuela de Ciudadanía, Comunidades que se Organizan y Tejiendo Redes— llegaron a más de 100.000 personas mediante sesiones de capacitación, laboratorios de innovación y actividades de divulgación pública. La fortaleza del modelo es su enfoque sistémico: construir capacidades comunitarias mediante la comunicación participativa en lugar de mensajes verticales, fomentando la confianza institucional al tiempo que aborda los desafíos de seguridad desde una perspectiva de derechos."},"details":{"en":"The model developed by the State Secretariat for Citizen Participation (SEPC) of the Ministry of Security of Tucumán constitutes a strategy that integrates democratic security, community prevention, digital citizenship, open government, and strategic public communication. Its objective is to transform the relationship between the State and the community by strengthening capacities to manage conflicts, prevent violence, and promote participation. It stems from the diagnosis that a significant portion of the citizenry lacks access to key conceptual frameworks (ecological model, risk and protective factors, primary/secondary/tertiary prevention, co-design, risk approach, democratic security), which limits their involvement in public decisions. In response, the SEPC created an ecosystem of complementary programs—Smart Security, School of Citizenship, Organizing Communities, and Weaving Networks—that function as flexible mechanisms for training, prevention, and participation in both physical and digital environments. The approach integrates four core dimensions:\n1. Community prevention, based on territorial networks, strengthening social capital, neighborhood cohesion, and State-community collaboration, promoting co-responsibility in prevention and coexistence. democratic.\n2. Digital Citizenship, focused on cybercrime prevention through the Smart Security program, which works with students, teachers, and families on digital risks, exposure behaviors, and technological vulnerabilities, positioning the Secretariat as a provincial leader in prevention in hybrid (digital and in-person) environments.\n3. Popular Education and Co-design, through the School of Citizenship, which operates as a collaborative learning space where complex conceptual frameworks are translated into accessible knowledge. Residents, young people, social organizations, territorial teams, and state agents analyze problems, co-design interventions, and evaluate policies from a horizontal perspective. In this way, technical and community knowledge are articulated, building bidirectional processes that adapt policies to the context and promote active citizen participation in public management.\n4. Strategic Public Communication, which translates technical concepts into clear messages, combats disinformation, and promotes informed participation. Through discussions with journalists and assertive communication methodologies, capacities are strengthened to disseminate preventive practices throughout the province. territory. Communication thus becomes a tool for building social trust, expanding territorial reach, and promoting an informed, democratic, and engaged citizenry. The innovation of the model lies in integrating, into a single strategy, evidence-based community prevention, digital citizenship, popular education, public innovation, and strategic communication.","es":"El modelo desarrollado por la Secretaría de Estado de Participación Ciudadana (SEPC) del Ministerio de Seguridad de Tucumán constituye una estrategia que integra seguridad democrática, prevención comunitaria, ciudadanía digital, gobierno abierto y comunicación pública estratégica. Su objetivo es transformar la relación entre el Estado y la comunidad mediante el fortalecimiento de capacidades para gestionar conflictos, prevenir violencias y promover la participación. Parte del diagnóstico de que una porción significativa de la ciudadanía carece de acceso a marcos conceptuales clave (modelo ecológico, factores de riesgo y protección, prevención primaria/secundaria/terciaria, codiseño, enfoque de riesgo, seguridad democrática), lo que limita su involucramiento en las decisiones públicas. En respuesta, la SEPC creó un ecosistema de programas complementarios —Seguridad Inteligente, Escuela de Ciudadanía, Comunidades que se Organizan y Tejiendo Redes— que funcionan como mecanismos flexibles de formación, prevención y participación tanto en entornos físicos como digitales. El enfoque integra cuatro dimensiones centrales:\n1. Prevención comunitaria, basada en redes territoriales, el fortalecimiento del capital social, la cohesión barrial y la colaboración Estado-comunidad, promoviendo la corresponsabilidad en la prevención y la convivencia democrática.\n2. Ciudadanía Digital, centrada en la prevención del cibercrimen a través del programa Seguridad Inteligente, que trabaja con estudiantes, docentes y familias sobre riesgos digitales, conductas de exposición y vulnerabilidades tecnológicas, posicionando a la Secretaría como referente provincial en prevención en entornos híbridos (digitales y presenciales).\n3. Educación Popular y Codiseño, a través de la Escuela de Ciudadanía, que opera como un espacio de aprendizaje colaborativo donde los marcos conceptuales complejos se traducen en saberes accesibles. Vecinos, jóvenes, organizaciones sociales, equipos territoriales y agentes estatales analizan problemas, codiseñan intervenciones y evalúan políticas desde una perspectiva horizontal. De este modo, se articulan el conocimiento técnico y el comunitario, construyendo procesos bidireccionales que adaptan las políticas al contexto y promueven la participación ciudadana activa en la gestión pública.\n4. Comunicación Pública Estratégica, que traduce conceptos técnicos en mensajes claros, combate la desinformación y promueve la participación informada. Mediante conversatorios con periodistas y metodologías de comunicación asertiva, se fortalecen las capacidades para difundir prácticas preventivas en todo el territorio provincial. La comunicación se convierte así en una herramienta para construir confianza social, ampliar el alcance territorial y promover una ciudadanía informada, democrática y comprometida. La innovación del modelo radica en integrar, en una sola estrategia, prevención comunitaria basada en evidencia, ciudadanía digital, educación popular, innovación pública y comunicación estratégica."},"links":["Josefarhat.ok / @Sec.ParticipaciónCiudadana / @josefarhatok"],"hasPhotos":false,"drive":null},{"id":"c041","tier":"High visibility","category":"Inclusive Voices","categorySource":"official","iso":"CL","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Chile","es":"Chile"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Somos La Joya","org":"Ilustre Municipalidad de Valparaíso","desc":{"en":"Somos La Joya is a program developed by the Municipality of Valparaíso, Chile, during 2023–2024 to strengthen the autonomy, social recognition, and self-worth of women caregivers living in socioeconomic precarity. Beyond social support, it functioned as an innovative public communication strategy promoting a 'caregiver class' identity, reframing the historical role of caregiving women and making their social, economic, and community contributions visible. Using an affirmative and locally grounded narrative, the program fostered collective self-identification. Over two years, it attracted more than 10,000 applications, reaching approximately 4,000 women caregivers from diverse Valparaíso neighborhoods—demonstrating unprecedented demand and confirming an unmet public communication need.","es":"Somos La Joya es un programa desarrollado por la Municipalidad de Valparaíso, Chile, durante 2023–2024 para fortalecer la autonomía, el reconocimiento social y la autovaloración de las mujeres cuidadoras que viven en condiciones de precariedad socioeconómica. Más allá del apoyo social, funcionó como una estrategia innovadora de comunicación pública que promovió una identidad de \"clase cuidadora\", resignificando el rol histórico de las mujeres cuidadoras y visibilizando sus aportes sociales, económicos y comunitarios. Mediante una narrativa afirmativa y arraigada en lo local, el programa fomentó la autoidentificación colectiva. En dos años atrajo más de 10.000 postulaciones y llegó a aproximadamente 4.000 mujeres cuidadoras de diversos barrios de Valparaíso, lo que evidenció una demanda sin precedentes y confirmó una necesidad de comunicación pública no atendida."},"details":{"en":"\"The Somos la Joya (We Are the Jewel) program was an initiative developed by the Municipality of Valparaíso during 2023 and 2024, aimed at strengthening the autonomy, social recognition, and self-esteem of women and caregivers from the most precarious socioeconomic strata of the city. The initiative comprehensively addressed the care economy, recognizing it as a central pillar for collective well-being and local development.\nOne of the program's distinctive elements was its innovative approach to institutional public communication. Somos la Joya not only operated as a socioeconomic support program but also as a communication strategy aimed at promoting awareness of a \"caregiving class,\" redefining the historical role of women caregivers and highlighting their social, economic, and community contributions. Through an affirmative and contextualized narrative, the program fostered processes of recognition, pride, and collective self-identification among its participants.\nThe target audience consisted of women and people from diverse backgrounds.\" The program targeted gender-diverse women residing in Valparaíso who performed paid or unpaid care work and lived in conditions of high social and economic vulnerability. Throughout its various stages, the program successfully engaged and supported nearly 4,000 women caregivers from diverse hills and neighborhoods of the city.\nTo ensure the program's effectiveness, a laboratory space was established, serving as both the physical and symbolic headquarters of the initiative. This space—the Utopian Building—facilitated meetings, training, and collaboration among participants in thematic workshops focused on cooking, weaving, and digital civic engagement, fostering knowledge sharing, network building, and collective experimentation.\nThe program's design and implementation were developed in partnership with the Procomún Institute of Brazil, incorporating methodological lessons from the La Cuida laboratory, a leading initiative in social innovation and care economies in Latin America. This international collaboration allowed for the inclusion of experimental, participatory, and feminist approaches, strengthening the program's innovative nature.\nOverall, Somos la Joya was consolidated as a pioneering local public policy experience, which articulated economic support, institutional innovation, transformative public communication and citizen laboratory practices, positioning Valparaíso as a benchmark in the recognition and dignification of care economies.\"","es":"El programa Somos la Joya fue una iniciativa desarrollada por la Municipalidad de Valparaíso durante 2023 y 2024, orientada a fortalecer la autonomía, el reconocimiento social y la autoestima de las mujeres y personas cuidadoras de los estratos socioeconómicos más precarizados de la ciudad. La iniciativa abordó de manera integral la economía del cuidado, reconociéndola como un pilar central para el bienestar colectivo y el desarrollo local.\nUno de los elementos distintivos del programa fue su enfoque innovador de comunicación pública institucional. Somos la Joya no solo operó como un programa de apoyo socioeconómico, sino también como una estrategia comunicacional orientada a promover la conciencia de una \"clase cuidadora\", resignificando el rol histórico de las mujeres cuidadoras y poniendo en valor sus aportes sociales, económicos y comunitarios. A través de una narrativa afirmativa y contextualizada, el programa fomentó procesos de reconocimiento, orgullo y autoidentificación colectiva entre sus participantes.\nEl público objetivo estuvo compuesto por mujeres y diversidades de género residentes en Valparaíso que realizaban labores de cuidado remuneradas o no remuneradas y vivían en condiciones de alta vulnerabilidad social y económica. A lo largo de sus distintas etapas, el programa logró convocar y apoyar a cerca de 4.000 mujeres cuidadoras de diversos cerros y barrios de la ciudad.\nPara asegurar la efectividad del programa, se estableció un espacio de laboratorio que sirvió como sede física y simbólica de la iniciativa. Este espacio —el Edificio Utópico— facilitó encuentros, capacitaciones y colaboración entre las participantes en talleres temáticos centrados en cocina, tejido y participación cívica digital, fomentando el intercambio de saberes, la construcción de redes y la experimentación colectiva.\nEl diseño y la implementación del programa se desarrollaron en alianza con el Instituto Procomún de Brasil, incorporando aprendizajes metodológicos del laboratorio La Cuida, una iniciativa líder en innovación social y economías del cuidado en América Latina. Esta colaboración internacional permitió incluir enfoques experimentales, participativos y feministas, fortaleciendo el carácter innovador del programa.\nEn conjunto, Somos la Joya se consolidó como una experiencia pionera de política pública local, que articuló apoyo económico, innovación institucional, comunicación pública transformadora y prácticas de laboratorio ciudadano, posicionando a Valparaíso como referente en el reconocimiento y la dignificación de las economías del cuidado."},"links":["Ig: #somoslajoya"],"hasPhotos":false,"drive":null},{"id":"c042","tier":"High visibility","category":"Dialogue Builders","categorySource":"official","iso":"CO","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Colombia","es":"Colombia"},"type":{"en":"Civil society organisation","es":"Organización de la sociedad civil"},"name":"Más Voz Menos Ruido","org":"Fundación Mi Sangre","desc":{"en":"Más Voz Menos Ruido is a civic communication and mobilization campaign launched in 2025 by Fundación Mi Sangre in Colombia to reduce polarization and strengthen democratic dialogue. The campaign promoted respectful conversations across differences, active listening, and public understanding of key democratic concepts—polarization, authoritarianism, and checks and balances. Targeting youth (86% of participants), the initiative deployed 140 'Democratic Gatherings' (Parches Democráticos) in 30 municipalities across 12 departments, directly engaging 1,636 people. Pre- and post-evaluations with 542 participants at a 95% confidence level showed significant attitudinal shifts toward dialogue—validating this as a replicable model for bridging divides in polarized democratic contexts.","es":"Más Voz Menos Ruido es una campaña de comunicación y movilización cívica lanzada en 2025 por la Fundación Mi Sangre en Colombia para reducir la polarización y fortalecer el diálogo democrático. La campaña promovió conversaciones respetuosas a través de las diferencias, la escucha activa y la comprensión pública de conceptos democráticos clave: polarización, autoritarismo y pesos y contrapesos. Dirigida a la juventud (86% de los participantes), la iniciativa desplegó 140 Parches Democráticos en 30 municipios de 12 departamentos, involucrando directamente a 1.636 personas. Las evaluaciones pre y post realizadas con 542 participantes, con un nivel de confianza del 95%, mostraron cambios actitudinales significativos hacia el diálogo, lo que valida este modelo como replicable para tender puentes en contextos democráticos polarizados."},"details":{"en":"The +Voice – Noise initiative is a communication and citizen mobilization campaign developed in 2025 by the Mi Sangre Foundation, aimed at reducing polarization and strengthening democratic dialogue in Colombia. It stems from the recognition of a context marked by institutional distrust, hate speech, digital disinformation, and the weakening of public discourse, especially in electoral and political debate settings.\nIts main objective is to promote respectful conversations that embrace differences, strengthen active listening, and broaden citizens' understanding of key democratic concepts such as polarization, authoritarianism, populism, and the balance of power. The initiative primarily targets young people, who represented 86% of participants, although it also involved adults, social leaders, and community actors.\nThe campaign was implemented through a territorial and educational strategy that included 140 Democratic Patches held in 30 municipalities across 12 departments, with the direct participation of 1,636 people. The Democratic Patches are experiential spaces for dialogue. structured, designed to facilitate safe conversations on highly polarized topics, using participatory methodologies, role-playing, collective reflection, and emotional management.\nAdditionally, the initiative included the activation of 35 alliances, networking events, methodological transfers to organizations and leaders with the capacity to replicate the program, and the development of open-source communication content.\nThe innovation of +Voice – Noise lies in its combination of public communication, civic education, and measurement of changes in perceptions and attitudes. It does not simply disseminate messages, but rather creates in-person and community-based dialogue experiences, measures its impact using pre- and post-intervention instruments, and prioritizes respectful dissent as a democratic value, instead of avoiding conflict.\nThis campaign is one of the activities implemented by the Mi Sangre Foundation within the framework of an Alliance for Democracy promoted nationwide by 30 civil society organizations (such as MOE, Movilizatorio, Transparencia por Colombia, Dejusticia, Fundación Corona, Congreso Visible, among others) to reduce polarization and disinformation in the pre-election context, and at the same time promote citizen participation.","es":"La iniciativa Más Voz Menos Ruido es una campaña de comunicación y movilización ciudadana desarrollada en 2025 por la Fundación Mi Sangre, orientada a reducir la polarización y fortalecer el diálogo democrático en Colombia. Surge del reconocimiento de un contexto marcado por la desconfianza institucional, los discursos de odio, la desinformación digital y el debilitamiento del debate público, especialmente en escenarios electorales y de discusión política.\nSu objetivo principal es promover conversaciones respetuosas que acojan las diferencias, fortalezcan la escucha activa y amplíen la comprensión ciudadana de conceptos democráticos clave como la polarización, el autoritarismo, el populismo y el equilibrio de poderes. La iniciativa se dirige principalmente a los jóvenes, que representaron el 86% de los participantes, aunque también involucró a personas adultas, líderes sociales y actores comunitarios.\nLa campaña se implementó mediante una estrategia territorial y educativa que incluyó 140 Parches Democráticos realizados en 30 municipios de 12 departamentos, con la participación directa de 1.636 personas. Los Parches Democráticos son espacios vivenciales de diálogo estructurado, diseñados para facilitar conversaciones seguras sobre temas altamente polarizados, utilizando metodologías participativas, juegos de roles, reflexión colectiva y gestión emocional.\nAdicionalmente, la iniciativa incluyó la activación de 35 alianzas, eventos de articulación en red, transferencias metodológicas a organizaciones y líderes con capacidad de replicar el programa, y el desarrollo de contenidos de comunicación de código abierto.\nLa innovación de Más Voz Menos Ruido radica en su combinación de comunicación pública, educación cívica y medición de cambios en percepciones y actitudes. No se limita a difundir mensajes, sino que crea experiencias de diálogo presenciales y comunitarias, mide su impacto con instrumentos pre y post intervención, y prioriza el disenso respetuoso como valor democrático, en lugar de evitar el conflicto.\nEsta campaña es una de las actividades implementadas por la Fundación Mi Sangre en el marco de una Alianza por la Democracia impulsada a nivel nacional por 30 organizaciones de la sociedad civil (como la MOE, Movilizatorio, Transparencia por Colombia, Dejusticia, Fundación Corona y Congreso Visible, entre otras) para reducir la polarización y la desinformación en el contexto preelectoral y, al mismo tiempo, promover la participación ciudadana."},"links":["https://fundacionmisangre.org/"],"hasPhotos":false,"drive":null},{"id":"c043","tier":"High visibility","category":"Inclusive Voices","categorySource":"official","iso":"CL","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Chile","es":"Chile"},"type":{"en":"Civil society organisation","es":"Organización de la sociedad civil"},"name":"Multiplicar las Voces","org":"Fundación Momento Ciudadano","desc":{"en":"Multiplicar las Voces is a child participation project implemented by Fundación Momento Ciudadano in Chile during the 2025 electoral year. Responding to a sharp decline in children's civic engagement, the initiative positioned children aged 6–12 as legitimate political actors whose perspectives should inform public decisions. Through three complementary phases—a co-designing Children's Voices Committee, democratic workshops, and a national consultation—the project reached 1,306 children across all 16 Chilean regions, including indigenous communities, migrants, and children with disabilities. It certified 258 facilitators from 26 organizations in authentic child participation methodologies, creating a replication network. The initiative stands out for genuinely transferring decision-making power to children, breaking adult-centered logic that typically dominates participatory processes.","es":"Multiplicar las Voces es un proyecto de participación infantil implementado por la Fundación Momento Ciudadano en Chile durante el año electoral 2025. En respuesta a una fuerte disminución de la participación cívica de la niñez, la iniciativa posicionó a niños y niñas de 6 a 12 años como actores políticos legítimos cuyas perspectivas deben informar las decisiones públicas. A través de tres fases complementarias —un Comité de Voces infantil de codiseño, talleres democráticos y una consulta nacional—, el proyecto llegó a 1.306 niños y niñas de las 16 regiones de Chile, incluidas comunidades indígenas, personas migrantes y niñez con discapacidad. Certificó a 258 facilitadores de 26 organizaciones en metodologías de participación infantil auténtica, creando una red de replicación. La iniciativa se destaca por transferir genuinamente poder de decisión a la niñez, rompiendo la lógica adultocéntrica que suele dominar los procesos participativos."},"details":{"en":"\"Multiplying Voices\" is a children's participation project implemented by Fundación Momento Ciudadano in Chile during 2025, which radically transformed how children exercise their right to influence public decisions that affect their present and future. The project addressed a critical problem: in Chile, since 2019, children's social participation has steadily declined, and more than a third perceive that adults ignore or dismiss their opinions. When participatory spaces do exist, they are usually designed and controlled by adults, generating symbolic experiences with little real agency for children.\nThe project was implemented during the 2025 election year, when Chile was holding presidential and parliamentary elections, recognizing that electoral contexts typically render children invisible by focusing exclusively on adult voters. \"Multiplying Voices\" broke this adult-centric logic by positioning children aged 6 to 12 as legitimate political actors whose perspectives should inform the proposals of those seeking to govern the country. country.\nThe project's architecture was structured in three complementary phases. First, a Voices Committee was formed, comprised of 15 children and young people aged 6 to 17 from different regions of the country. This committee was a co-design body for the project with real decision-making power. Its members received training on children's rights, developed the project methodology, learned qualitative analysis techniques and effective communication, and validated all the materials used in subsequent phases.\nThe second phase consisted of large-scale territorial implementation. 258 facilitators from 26 civil society organizations, schools, museums, universities, and public institutions were trained, and 152 Creation and Dialogue Encounters were implemented in 59 municipalities across Chile's 16 regions, reaching 1,306 children. The \"draw-talk\" methodology, designed by the Voices Committee itself, recognizes that children express complex ideas through non-verbal means: first, they create Artistic representations (drawings, paintings, collages) of their concerns and proposals are then accompanied by explanatory narratives. This methodological approach respects children's own forms of knowledge and expression, avoiding the imposition of adult logocentric logic.\nThe third phase consisted of systematizing all the meetings, generating three reports: two interim reports during the election campaign and a final 176-page report formally submitted to presidential and parliamentary candidates. Simultaneously, a communication strategy was implemented that positioned children's voices in the public debate, resulting in 113 appearances in 51 national and regional media outlets, including television news programs, print media, and radio.","es":"\"Multiplicar las Voces\" es un proyecto de participación infantil implementado por la Fundación Momento Ciudadano en Chile durante 2025, que transformó radicalmente la forma en que niños y niñas ejercen su derecho a incidir en las decisiones públicas que afectan su presente y su futuro. El proyecto abordó un problema crítico: en Chile, desde 2019, la participación social de la niñez ha disminuido de manera sostenida, y más de un tercio percibe que las personas adultas ignoran o desestiman sus opiniones. Cuando existen espacios participativos, suelen estar diseñados y controlados por adultos, generando experiencias simbólicas con poca agencia real para niños y niñas.\nEl proyecto se implementó durante el año electoral 2025, cuando Chile celebraba elecciones presidenciales y parlamentarias, reconociendo que los contextos electorales suelen invisibilizar a la niñez al centrarse exclusivamente en el electorado adulto. \"Multiplicar las Voces\" rompió esta lógica adultocéntrica al posicionar a niños y niñas de 6 a 12 años como actores políticos legítimos cuyas perspectivas deben informar las propuestas de quienes aspiran a gobernar el país.\nLa arquitectura del proyecto se estructuró en tres fases complementarias. Primero, se conformó un Comité de Voces, integrado por 15 niños, niñas y jóvenes de 6 a 17 años de distintas regiones del país. Este comité fue una instancia de codiseño del proyecto con poder real de decisión. Sus integrantes recibieron formación en derechos de la niñez, desarrollaron la metodología del proyecto, aprendieron técnicas de análisis cualitativo y comunicación efectiva, y validaron todos los materiales utilizados en las fases posteriores.\nLa segunda fase consistió en la implementación territorial a gran escala. Se capacitó a 258 facilitadores de 26 organizaciones de la sociedad civil, escuelas, museos, universidades e instituciones públicas, y se implementaron 152 Encuentros de Creación y Diálogo en 59 municipios de las 16 regiones de Chile, llegando a 1.306 niños y niñas. La metodología \"dibujar-conversar\", diseñada por el propio Comité de Voces, reconoce que los niños y niñas expresan ideas complejas por medios no verbales: primero crean representaciones artísticas (dibujos, pinturas, collages) de sus preocupaciones y propuestas, que luego se acompañan de narrativas explicativas. Este enfoque metodológico respeta las formas propias de conocimiento y expresión de la niñez, evitando la imposición de la lógica logocéntrica adulta.\nLa tercera fase consistió en la sistematización de todos los encuentros, generando tres informes: dos informes intermedios durante la campaña electoral y un informe final de 176 páginas presentado formalmente a las candidaturas presidenciales y parlamentarias. Simultáneamente, se implementó una estrategia comunicacional que posicionó las voces de la niñez en el debate público, con 113 apariciones en 51 medios de comunicación nacionales y regionales, incluidos noticieros de televisión, prensa escrita y radio."},"links":["http://www.momentociudadano.cl y http://www.instagram.com/momento_ciudadano"],"hasPhotos":false,"drive":null},{"id":"c044","tier":"High visibility","category":"Clarity in Action","categorySource":"official","iso":"AR","lang":"Spanish","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Argentina","es":"Argentina"},"type":{"en":"Civil society organisation","es":"Organización de la sociedad civil"},"name":"\"Contraataque al dengue, ¡Unite a la misión!” Campaña educativa de prevención del dengue, zika y chikungunya.","org":"Fundación Centro de Estudios Infectológicos (FUNCEI).","desc":{"en":"Contraataque al Dengue is an educational prevention program implemented continuously since 2017 by the Center for Infectious Disease Studies Foundation (FUNCEI) in Argentina, targeting children aged 8–12, educators, health workers, and communities. It provides scientific information in accessible language and practical tools for preventing dengue, zika, and chikungunya, combining education, public communication, and community participation. In 2025, the initiative reached 37,107 children (+146% vs. 2024) across 185 schools and 25 health centers in 9 Argentine provinces. Its cumulative reach from 2017–2024 was 44,451 students, making it a benchmark for sustained health communication in schools and communities facing vector-borne disease challenges.","es":"Contraataque al Dengue es un programa educativo de prevención implementado de forma continua desde 2017 por la Fundación Centro de Estudios Infectológicos (FUNCEI) en Argentina, dirigido a niños y niñas de 8 a 12 años, educadores, personal de salud y comunidades. Brinda información científica en lenguaje accesible y herramientas prácticas para la prevención del dengue, el zika y el chikunguña, combinando educación, comunicación pública y participación comunitaria. En 2025, la iniciativa llegó a 37.107 niños y niñas (+146% respecto de 2024) en 185 escuelas y 25 centros de salud de 9 provincias argentinas. Su alcance acumulado entre 2017 y 2024 fue de 44.451 estudiantes, lo que la convierte en un referente de comunicación en salud sostenida en escuelas y comunidades que enfrentan desafíos de enfermedades transmitidas por vectores."},"details":{"en":"Overview: An educational program aimed at children aged 8 to 12, students, educators, families, healthcare teams, and communities. It provides accessible scientific information, teaching materials, and practical tools to prevent diseases transmitted by the Aedes aegypti mosquito. It has been implemented continuously since 2017, combining education, public communication, and community participation.\nProblem addressed: Dengue and other arboviruses are a growing challenge in Argentina due to climate change, rapid urbanization, population mobility, and socio-environmental conditions that favor the proliferation of the mosquito vector. Prevention depends largely on community actions (eliminating breeding sites and protecting against mosquito bites).\nObjectives. General: To educate and raise awareness among the target population about the impact of dengue and prevention strategies, promoting sustained mosquito control practices in homes, schools, and communities. Specific: To provide up-to-date, evidence-based information; to motivate children and adolescents to act as “Aedes mosquito detectives.” Through playful and educational activities, FUNCEI aims to strengthen the capacities of teachers and healthcare professionals and promote community-based actions for eliminating mosquito breeding sites and personal protection.\nTarget population: Direct beneficiaries: children aged 8 to 12, teachers, families, and healthcare professionals. Indirect beneficiaries: educational communities, extended families, and the general population reached through community outreach and dissemination activities.\nMethodology: FUNCEI establishes partnerships with public, private, and civil society institutions; provides medical talks and educational workshops (both in-person and virtual); creates and distributes printed and digital materials; and, through local coordinators, develops educational activities in schools and community centers. It also conducts community outreach in health centers and clinics, records and monitors progress using the collaborative platform Padlet, and disseminates information through social media.\nThis innovative approach redefines how to communicate complex public health issues, strengthening clarity, inclusion, participation, and trust. It transforms complex scientific information into community-based actions through a multi-format, playful, and community-based approach. It engages children as agents of change. It builds multi-sector partnerships, uses collaborative digital tools, and adapts messages to local contexts. Its ability to scale with proven impact makes it a replicable model of public communication for disease prevention.\n\"","es":"Descripción general: un programa educativo dirigido a niños y niñas de 8 a 12 años, estudiantes, educadores, familias, equipos de salud y comunidades. Brinda información científica accesible, materiales didácticos y herramientas prácticas para prevenir las enfermedades transmitidas por el mosquito Aedes aegypti. Se implementa de forma continua desde 2017, combinando educación, comunicación pública y participación comunitaria.\nProblema abordado: el dengue y otras arbovirosis constituyen un desafío creciente en Argentina debido al cambio climático, la urbanización acelerada, la movilidad de la población y las condiciones socioambientales que favorecen la proliferación del mosquito vector. La prevención depende en gran medida de acciones comunitarias (eliminación de criaderos y protección contra las picaduras de mosquitos).\nObjetivos. General: educar y sensibilizar a la población objetivo sobre el impacto del dengue y las estrategias de prevención, promoviendo prácticas sostenidas de control del mosquito en hogares, escuelas y comunidades. Específicos: brindar información actualizada y basada en evidencia; motivar a niños, niñas y adolescentes a actuar como \"detectives del mosquito Aedes\". A través de actividades lúdicas y educativas, FUNCEI busca fortalecer las capacidades de docentes y profesionales de la salud y promover acciones comunitarias de eliminación de criaderos de mosquitos y protección personal.\nPoblación objetivo: beneficiarios directos: niños y niñas de 8 a 12 años, docentes, familias y profesionales de la salud. Beneficiarios indirectos: comunidades educativas, familias ampliadas y la población general alcanzada mediante actividades de divulgación y difusión comunitaria.\nMetodología: FUNCEI establece alianzas con instituciones públicas, privadas y de la sociedad civil; ofrece charlas médicas y talleres educativos (presenciales y virtuales); crea y distribuye materiales impresos y digitales; y, a través de coordinadores locales, desarrolla actividades educativas en escuelas y centros comunitarios. También realiza actividades de divulgación comunitaria en centros de salud y clínicas, registra y monitorea los avances mediante la plataforma colaborativa Padlet, y difunde información a través de las redes sociales.\nEste enfoque innovador redefine la forma de comunicar temas complejos de salud pública, fortaleciendo la claridad, la inclusión, la participación y la confianza. Transforma información científica compleja en acciones comunitarias mediante un enfoque multiformato, lúdico y de base comunitaria. Involucra a los niños y niñas como agentes de cambio. Construye alianzas multisectoriales, utiliza herramientas digitales colaborativas y adapta los mensajes a los contextos locales. Su capacidad de escalar con impacto demostrado la convierte en un modelo replicable de comunicación pública para la prevención de enfermedades."},"links":["https://contraataquealdengue.info/","linkedin.com/company/funcei/","https://www.facebook.com/funcei/","https://www.instagram.com/funceistamboulian/"],"hasPhotos":false,"drive":null},{"id":"c045","tier":"Noteworthy","category":"Exploring New Frontiers","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Catarino, o estagiário sobrevivente","org":"Tribunal Regional do Trabalho de Santa Catarina","desc":{"en":"Catarino, o Estagiário Sobrevivente is a public communication initiative by Brazil's Labor Court of Santa Catarina featuring a hybrid avatar-human character who explains labor rights and court procedures in plain language with light humor and digital-native formats. Developed in 2025, Catarino targets youth, apprentices, and students who historically found the judiciary distant and inaccessible. The character has become one of the TRT-SC's most recognized products, achieving strong engagement rates and reaching audiences that typically do not follow judicial content. Catarino was invited to officially open the National Meeting of Labor Justice Ombudspersons—a significant institutional endorsement of accessible communication as a judicial strategy.","es":"Catarino, o Estagiário Sobrevivente es una iniciativa de comunicación pública del Tribunal Laboral de Santa Catarina, en Brasil, protagonizada por un personaje híbrido entre avatar y humano que explica los derechos laborales y los procedimientos judiciales en lenguaje claro, con humor ligero y formatos nativos digitales. Desarrollado en 2025, Catarino se dirige a jóvenes, aprendices y estudiantes que históricamente percibían al poder judicial como distante e inaccesible. El personaje se ha convertido en uno de los productos más reconocidos del TRT-SC, con altas tasas de interacción y llegando a audiencias que normalmente no siguen contenidos judiciales. Catarino fue invitado a inaugurar oficialmente el Encuentro Nacional de Defensorías del Pueblo de la Justicia Laboral, un respaldo institucional significativo a la comunicación accesible como estrategia judicial."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c046","tier":"Noteworthy","category":"Trust Catalysts","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Sagas Pernambucanas","org":"Assembleia Legislativa de Pernambuco","desc":{"en":"Sagas Pernambucanas is a historical narrative podcast by Pernambuco's Legislative Assembly (Alepe)—the first project of this format created by a Brazilian legislative institution's own team. Using storytelling, historian interviews, dramatized document readings, original soundtrack, and sound effects, the podcast makes complex historical episodes accessible and engaging, revealing characters and political events that shaped Pernambuco. The 1st season (2024) celebrated the Confederation of the Equator bicentennial; the 2nd season (2025) explores Alepe's 190-year history. In 2025, the podcast received 3rd place in the Best Brazilian Podcasts Award in Culture and Literature—confirming its status as a national reference for institutional narrative communication.","es":"Sagas Pernambucanas es un pódcast de narrativa histórica de la Asamblea Legislativa de Pernambuco (Alepe), el primer proyecto de este formato creado por el equipo propio de una institución legislativa brasileña. Mediante la narración de historias, entrevistas con historiadores, lecturas dramatizadas de documentos, banda sonora original y efectos de sonido, el pódcast hace accesibles y atractivos episodios históricos complejos, revelando personajes y acontecimientos políticos que marcaron a Pernambuco. La primera temporada (2024) conmemoró el bicentenario de la Confederación del Ecuador; la segunda (2025) explora los 190 años de historia de la Alepe. En 2025, el pódcast obtuvo el tercer lugar en el Premio a los Mejores Pódcast Brasileños en la categoría de Cultura y Literatura, lo que confirma su estatus como referente nacional de comunicación narrativa institucional."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c047","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"University or research centre","es":"Universidad o centro de investigación"},"name":"Além da Lista","org":"Universidade Estadual de Ponta Grossa","desc":{"en":"Além da Lista (Beyond the List) is a website by the State University of Ponta Grossa (UEPG) presenting sociodemographic data about university entrance exam candidates through interactive graphics and maps—information previously unavailable to the public. It also includes a tool allowing candidates to check course competition data, previously buried in dense PDFs. The project's primary goal is to foster a culture of active transparency at the university and demonstrate how public communication can exceed mandatory minimum reporting. The initiative received significant regional media coverage, validating public appetite for accessible institutional data visualization.","es":"Além da Lista (Más allá de la lista) es un sitio web de la Universidad Estatal de Ponta Grossa (UEPG) que presenta datos sociodemográficos sobre las personas aspirantes a los exámenes de ingreso universitario mediante gráficos y mapas interactivos, información antes no disponible para el público. Incluye además una herramienta que permite consultar los datos de competencia por carrera, antes ocultos en densos archivos PDF. El objetivo principal del proyecto es fomentar una cultura de transparencia activa en la universidad y demostrar cómo la comunicación pública puede ir más allá de los informes mínimos obligatorios. La iniciativa recibió una cobertura mediática regional significativa, lo que valida el interés del público por la visualización accesible de datos institucionales."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c048","tier":"Noteworthy","category":"Trust Catalysts","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Campanha “Onde tem selo de transparência, a prefeitura vira referência - Transparência nos festejos juninos”.","org":"Ministério Público do Estado da Bahia (MPBA).","desc":{"en":"The Transparência nos Festejos Juninos campaign by Bahia's Public Ministry promotes fiscal responsibility and public transparency in June festival spending, anchored in the June Festival Transparency Panel and the multi-institutional Transparency Seal (partnering with TCE, TCM, UPB, and media). In 2025, for the first time, all 417 Bahian municipalities received the Transparency Seal, guaranteeing publication of contracts and investments in the public panel. The campaign generated 219 positive press articles, demonstrating how public accountability communication can use transparency tools and institutional partnerships to transform complex fiscal data into accessible civic information.","es":"La campaña Transparência nos Festejos Juninos del Ministerio Público de Bahía promueve la responsabilidad fiscal y la transparencia pública en el gasto de las fiestas juninas, anclada en el Panel de Transparencia de las Fiestas de Junio y en el Sello de Transparencia multiinstitucional (en alianza con el TCE, el TCM, la UPB y medios de comunicación). En 2025, por primera vez, los 417 municipios bahianos recibieron el Sello de Transparencia, garantizando la publicación de contratos e inversiones en el panel público. La campaña generó 219 artículos de prensa positivos, demostrando cómo la comunicación sobre rendición de cuentas puede utilizar herramientas de transparencia y alianzas institucionales para transformar datos fiscales complejos en información cívica accesible."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c049","tier":"Noteworthy","category":"Inclusive Voices","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Website do Coletivo Autista da UFPB","org":"Universidade Federal da Paraíba","desc":{"en":"The Autistic Collective Website of UFPB (WCAU) is a university extension platform created by an autistic faculty member at the Federal University of Paraíba, inspired by 'Nothing about us without us.' The website promotes inclusion and visibility for autistic adults—a population historically excluded from public autism communication—by gathering legislation, rights information, plain-language summaries of scientific articles on adult autism, and inclusive content. Used by the 47-member Autistic Collective and beyond, the platform has been cited in legal circles, shared via WhatsApp networks, and promoted in university centers and podcasts—demonstrating how participatory digital communication can amplify marginalized community voices.","es":"El Sitio Web del Colectivo Autista de la UFPB (WCAU) es una plataforma de extensión universitaria creada por un docente autista de la Universidad Federal de Paraíba, inspirada en el principio «Nada sobre nosotros sin nosotros». El sitio promueve la inclusión y la visibilidad de las personas adultas autistas —una población históricamente excluida de la comunicación pública sobre el autismo— al reunir legislación, información sobre derechos, resúmenes en lenguaje claro de artículos científicos sobre autismo en la adultez y contenidos inclusivos. Utilizada por el Colectivo Autista, integrado por 47 miembros, y más allá de él, la plataforma ha sido citada en círculos jurídicos, compartida a través de redes de WhatsApp y difundida en centros universitarios y pódcast, demostrando cómo la comunicación digital participativa puede amplificar las voces de comunidades marginadas."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c050","tier":"Noteworthy","category":"Exploring New Frontiers","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Visual, Humano e Acessível: O Novo Modelo de Comunicação","org":"Fundação Instituto de Educação de Barueri (FIEBTECH)","desc":{"en":"FIEBTECH's Visual, Human, and Accessible Communication initiative intensified the production of explanatory videos featuring real members of the school community—students, employees, and volunteers—to make institutional processes genuinely accessible to students, families, and the community. Between April and November 2025, FIEBTECH's Instagram grew from 31,500 to 37,200 followers, with videos averaging 9,000–11,000 organic views and 13 comments each. Comments consistently highlighted appreciation for the human protagonists, confirming that authentic, people-centered institutional communication outperforms traditional formal channels—even without paid promotion.","es":"La iniciativa de Comunicación Visual, Humana y Accesible de FIEBTECH intensificó la producción de videos explicativos protagonizados por miembros reales de la comunidad escolar —estudiantes, empleados y voluntariado— para hacer que los procesos institucionales sean genuinamente accesibles para el estudiantado, las familias y la comunidad. Entre abril y noviembre de 2025, la cuenta de Instagram de FIEBTECH pasó de 31.500 a 37.200 seguidores, con videos que promediaron entre 9.000 y 11.000 visualizaciones orgánicas y 13 comentarios cada uno. Los comentarios destacaron de manera constante el aprecio por los protagonistas humanos, lo que confirma que la comunicación institucional auténtica y centrada en las personas supera a los canales formales tradicionales, incluso sin promoción pagada."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c051","tier":"Noteworthy","category":"Trust Catalysts","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Relatório de Gestão Integrado 2024 (RGI 2024 do MGI)","org":"Ministério da Gestão e da Inovação em Serviços Públicos (MGI)","desc":{"en":"The Integrated Management Report (RGI 2024) of Brazil's Ministry of Management and Innovation (MGI) innovated on three fronts: adopting plain and inclusive language, integrating screen reader accessibility features with a dedicated version, and applying graphic design techniques. While RGI production is a legal obligation for all federal accountability units, the MGI version repositioned mandatory reporting as an opportunity for genuine institutional communication with diverse audiences. The document is available in multiple accessible formats on gov.br, demonstrating how compliance obligations can be transformed into meaningful public transparency acts through user-centered communication design.","es":"El Informe de Gestión Integrado (RGI 2024) del Ministerio de Gestión e Innovación (MGI) de Brasil innovó en tres frentes: la adopción de un lenguaje claro e inclusivo, la integración de funciones de accesibilidad para lectores de pantalla con una versión dedicada y la aplicación de técnicas de diseño gráfico. Si bien la elaboración del RGI es una obligación legal para todas las unidades federales de rendición de cuentas, la versión del MGI reposicionó el informe obligatorio como una oportunidad de comunicación institucional genuina con audiencias diversas. El documento está disponible en múltiples formatos accesibles en gov.br, demostrando cómo las obligaciones de cumplimiento pueden transformarse en actos significativos de transparencia pública mediante un diseño de comunicación centrado en las personas usuarias."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c052","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Edital de Processo Seletivo de Estágio em Linguagem Simples","org":"Prefeitura de Caxias do Sul","desc":{"en":"The Internship Selection Notice in Plain Language is a pioneering initiative by Caxias do Sul municipality—the first city in Brazil to apply plain language to public competitive selection processes. Developed by the Secretariat of Administration, Technology and Innovation, the redesigned notice transformed a traditional bureaucratic document into an inclusive, empathetic tool. The impact was immediate: from historically low engagement to 737 applicants—a 700% increase in participation. The initiative received national institutional recognition and demonstrates that low-cost plain language redesign can produce transformative social impact in public communication.","es":"La Convocatoria de Selección de Pasantías en Lenguaje Claro es una iniciativa pionera del municipio de Caxias do Sul, la primera ciudad de Brasil en aplicar el lenguaje claro a los procesos públicos de selección competitiva. Desarrollada por la Secretaría de Administración, Tecnología e Innovación, la convocatoria rediseñada transformó un documento burocrático tradicional en una herramienta inclusiva y empática. El impacto fue inmediato: de una participación históricamente baja se pasó a 737 postulantes, un aumento del 700 %. La iniciativa recibió reconocimiento institucional nacional y demuestra que un rediseño de bajo costo basado en lenguaje claro puede producir un impacto social transformador en la comunicación pública."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c053","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Lições da Caatinga","org":"Sudene","desc":{"en":"Lições da Caatinga (Lessons from the Caatinga) is a transmedia public communication ecosystem developed by Sudene (Northeast Brazil Development Agency) as part of a creative industries master's dissertation, designed to strengthen public understanding of the Caatinga biome. Coordinated content was distributed across multiple platforms including investigative journalism, documentary, podcast, and social media. The main article achieved an average reading time nearly six times higher than comparable institutional content (2'22\" vs. 24 seconds), indicating significantly deeper audience engagement. The initiative demonstrates how public institutions can use transmedia storytelling—grounded in academic research—to increase reach, retention, and depth of public environmental communication.","es":"Lições da Caatinga (Lecciones de la Caatinga) es un ecosistema de comunicación pública transmedia desarrollado por la Sudene (Superintendencia de Desarrollo del Nordeste de Brasil) como parte de una tesis de maestría en industrias creativas, diseñado para fortalecer la comprensión pública del bioma de la Caatinga. El contenido coordinado se distribuyó a través de múltiples plataformas, incluidos el periodismo de investigación, el documental, el pódcast y las redes sociales. El artículo principal alcanzó un tiempo promedio de lectura casi seis veces superior al de contenidos institucionales comparables (2'22\" frente a 24 segundos), lo que indica un compromiso de la audiencia significativamente más profundo. La iniciativa demuestra cómo las instituciones públicas pueden utilizar la narrativa transmedia —fundamentada en la investigación académica— para aumentar el alcance, la retención y la profundidad de la comunicación pública ambiental."},"details":{"en":null,"es":null},"links":[],"hasPhotos":false,"drive":null},{"id":"c054","tier":"Noteworthy","category":"Clarity in Action","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Editais para todos: simplificando o acesso a direitos","org":"Fundação Oswaldo Cruz","desc":{"en":"Editais para Todos (Notices for Everyone) by Fiocruz addresses the incomprehensibility of public selection notices that regulate access to policies and programs. In a country where most of the population has limited schooling, traditional notices—technical and poorly user-oriented—produce exclusions. Fiocruz redesigned notices using plain language, user-centered design, and Libras accessibility. Usability tests with residents of the Manguinhos community showed approximately 75% improvement in comprehension among those with primary and secondary education. The initiative has since influenced institutiona
