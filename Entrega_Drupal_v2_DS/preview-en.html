window.ATLAS_CASES = [{"id":"c001","tier":"Spotlight","category":"Inclusive Voices","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"E eu, sou o que?","org":"Defensoria do Ceará","desc":{"en":"E eu, sou o que? (And What Am I?) is a racial literacy guide created by Ceará's Public Defender's Office Ethnic-Racial Equality Committee. The accessible plain-language booklet equips defenders and public servants to understand and confront structural racism—helping staff correctly identify their racial identity and strengthening respect in interpersonal relations. Launched at units across the state with participation from defenders and technical teams, it functions as an official institutional training instrument shaping administrative practices, public service delivery, and policy formulation toward racial equality and human rights protection.","es":"E eu, sou o que? (¿Y yo, qué soy?) es una guía de alfabetización racial creada por el Comité de Igualdad Étnico-Racial de la Defensoría Pública de Ceará. Esta cartilla accesible, redactada en lenguaje claro, prepara a defensores y servidores públicos para comprender y confrontar el racismo estructural, ayudando al personal a identificar correctamente su identidad racial y fortaleciendo el respeto en las relaciones interpersonales. Lanzada en unidades de todo el estado con la participación de defensores y equipos técnicos, funciona como un instrumento oficial de formación institucional que orienta las prácticas administrativas, la prestación de servicios públicos y la formulación de políticas hacia la igualdad racial y la protección de los derechos humanos."},"details":{"en":"The Ethnic-Racial Equality Committee of the Ceará Public Defender's Office was established in December 2024 as part of an institutional policy focused on racial literacy and anti-racist practices. The Committee’s first concrete action took place in April 2025 with the launch of the booklet \"And what am I? A short guide on (your) race.\" The material aims to equip public defenders and staff members to understand and confront structural racism, drawing on reliable references, accessible language, and an approach sensitive to everyday experiences. The booklet serves as a tool for internal transformation. It encourages teams to engage in self-recognition, correctly identify their race, and strengthen their sense of belonging, thereby fostering more respectful interpersonal relationships. Thus, the booklet establishes itself as a guide for promoting inclusivity and strengthening an institutional culture that is attentive to racial inequalities. The relevance of the material is underscored by the recurring questions that arise in the institution's daily operations. Questions such as \"negro or preto?\" (terms for Black individuals), \"if my mother is Black, am I Black too?\", and \"is it appropriate to call someone *moreno*?\" highlight the importance of providing guidance to teams with clarity, conceptual accuracy, and responsibility. The initiative is directly linked to a public institution, as it originates, is coordinated, and is implemented within the Public Defender's Office of the State of Ceará. The Communications Department, at the initiative of the Ethnic-Racial Equality Committee, is responsible for developing and managing the booklet. Furthermore, the booklet is part of an internal public policy on racial literacy and anti-racist practices, formalized by the institution's leadership.","es":"El Comité de Igualdad Étnico-Racial de la Defensoría Pública de Ceará fue creado en diciembre de 2024 como parte de una política institucional centrada en la alfabetización racial y las prácticas antirracistas. La primera acción concreta del Comité tuvo lugar en abril de 2025 con el lanzamiento de la cartilla \"¿Y yo, qué soy? Una breve guía sobre (tu) raza\". El material busca preparar a los defensores públicos y a los miembros del personal para comprender y confrontar el racismo estructural, apoyándose en referencias confiables, un lenguaje accesible y un enfoque sensible a las experiencias cotidianas. La cartilla funciona como una herramienta de transformación interna. Anima a los equipos a ejercitar el autorreconocimiento, identificar correctamente su raza y fortalecer su sentido de pertenencia, propiciando así relaciones interpersonales más respetuosas. De este modo, la cartilla se consolida como una guía para promover la inclusión y fortalecer una cultura institucional atenta a las desigualdades raciales. La relevancia del material queda de manifiesto en las preguntas recurrentes que surgen en el quehacer diario de la institución. Preguntas como \"¿negro o preto?\" (términos para referirse a las personas negras), \"si mi madre es negra, ¿yo también lo soy?\" o \"¿es apropiado llamar a alguien *moreno*?\" evidencian la importancia de orientar a los equipos con claridad, precisión conceptual y responsabilidad. La iniciativa está directamente vinculada a una institución pública, ya que se origina, se coordina y se implementa dentro de la Defensoría Pública del Estado de Ceará. El Departamento de Comunicaciones, por iniciativa del Comité de Igualdad Étnico-Racial, es responsable de elaborar y gestionar la cartilla. Además, la cartilla forma parte de una política pública interna de alfabetización racial y prácticas antirracistas, formalizada por la dirección de la institución."},"links":["www.defensoria.ce.def.br"],"hasPhotos":true,"drive":"We'll leave this PDF here to see if we can upload it to the atlas: https://drive.google.com/file/d/1q0VlaYRuC5Iux_OTVaVXqqTxUqv5EkSs/view?usp=sharing","prod":{"material":"NO","files":"CARPETA VACÍA — no llegó ningún archivo","pieces":"Ninguno por ahora.","gap":"Carpeta vacía. Según hoja de contactos: \"yes, but cannot be delivered\" → usar los documentos cargados en la postulación original (portada de la guía + una página interior)."}},{"id":"c002","tier":"Spotlight","category":"Inclusive Voices","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Saúde e direitos humanos das pessoas com deficiência: disseminando conhecimento para fortalecer a cidadania","org":"Escola Nacional de Saúde Pública Sergio Arouca da Fundação Oswaldo Cruz","desc":{"en":"This initiative, led by Fiocruz since 2020, promotes human rights and health literacy for people with disabilities through accessible educational materials developed in partnership with civil society. Available in multiple formats, languages (English, Spanish, French, and accessible Portuguese), and distributed both digitally and in print, the resources use simple language and culturally relevant formats such as cordel literature to reach diverse audiences. By addressing the historical exclusion of people with disabilities, fostering social participation, and combating ableism, the initiative has become a nationally recognized model for inclusive education and communication, influencing public policies, strengthening partnerships across Brazil, and supporting professional training and disability rights advocacy.","es":"Esta iniciativa, liderada por Fiocruz desde 2020, promueve la alfabetización en derechos humanos y salud de las personas con discapacidad mediante materiales educativos accesibles elaborados en alianza con la sociedad civil. Disponibles en múltiples formatos e idiomas (inglés, español, francés y portugués accesible), y distribuidos tanto en versión digital como impresa, los recursos emplean un lenguaje sencillo y formatos culturalmente pertinentes, como la literatura de cordel, para llegar a públicos diversos. Al abordar la exclusión histórica de las personas con discapacidad, fomentar la participación social y combatir el capacitismo, la iniciativa se ha convertido en un modelo reconocido a nivel nacional de educación y comunicación inclusivas, que incide en las políticas públicas, fortalece alianzas en todo Brasil y apoya la formación profesional y la defensa de los derechos de las personas con discapacidad."},"details":{"en":"\"The initiative aims to disseminate educational communication content for literacy on human rights and the health of people with disabilities, as well as to raise awareness of the issue. The material, unprecedented in the country, is created in a participatory manner and brings together knowledge mobilized by the rights of people with disabilities, made available in an accessible way. Its relevance stems from the historical violation of the human rights of people with disabilities, evidenced by various social indicators (unequal access to education, work, health, income, as well as greater vulnerability to violence and food insecurity). In health, although a universal right in Brazil, the needs of this population remain invisible in universal actions and in the production of knowledge.\nThe target audience includes: people with disabilities and their families; civil society movements; workers and managers in social areas; researchers and professors from postgraduate programs; and public policy makers.\nThe production consists of various communication pieces, disseminated in simple language and in cordel literature. The booklets and posters were printed for distribution and are also available in digital version in the Arca repository.\" Fiocruz, in English, Spanish, and French, and with accessibility features in the Portuguese version (subtitles, audio description, and sign language). Its free availability in various formats and languages ​​allows for adaptation to different audiences and territories, enhancing its replicability in other contexts, institutions, and countries.\nDeveloped since 2020, the initiative has been consolidated through continuous interdisciplinary practices and processes, expressing the institutional commitment to knowledge production, professional training, and the promotion of the rights of people with disabilities. Its viability is evidenced by the growing adoption by civil society, facilitated by its availability in a public repository; in addition, municipal, state, and federal actors have been establishing partnerships for printing the booklets and working in their territories.\nBecause it is developed in partnership with civil society and brings together historically separated social groups, the initiative strengthens social participation, dialogue, active listening, and the sharing of knowledge. It is innovative in several aspects: 1) In its format, by presenting synthetic content, grounded in rights, and in different formats, expanding accessibility and reach; 2) In the process of Production, which promotes collective appropriation, enhances the feedback system, integrates the audiences of the subject matter, and favors dissemination; 3) Dissemination in varied spaces: scientific events, postgraduate programs, basic education schools, libraries, museums, and cultural events, such as Carnival; 4) Commitment to an emancipatory education that values ​​autonomy, protagonism, and social justice. The initiative is developed within a public teaching and research institution, the Sérgio Arouca National School of Public Health, Fiocruz, aligned with its commitment to knowledge production, professional training, and actions of social interest. It also engages with the national normative framework, such as the Brazilian Inclusion Law (Law 13.146/2015), which guarantees the right to communicational accessibility, and the National Policy for Comprehensive Health Care for People with Disabilities, from 2023, which reaffirms the right to participation, information, communicational accessibility, and the importance of the necessary fight against ableism, also highlighted in the \"New Living Without Limits\" program, which uniquely focuses on the importance of confronting this system of oppression (ableism). Furthermore, it converges with the School's institutional commitment to valuing participation, diversity, social justice, and emancipatory education. And her success led to an invitation from the Ministry of Health, through the Secretariat of Specialized Care, to coordinate the Specialization Course on \"Qualifying the Care Network for People with Disabilities.\" It also led to an invitation from the Ministry of Human Rights and Citizenship to coordinate Axis 2 (combating ableism and other forms of violence) of the New Living Without Limits program. The initiative is also aligned with a recently enacted law in the country that established the National Plain Language Policy (Law 15.263/2025).","es":"\"La iniciativa tiene como objetivo difundir contenidos de comunicación educativa para la alfabetización en derechos humanos y salud de las personas con discapacidad, así como sensibilizar sobre el tema. El material, inédito en el país, se crea de manera participativa y reúne saberes movilizados por los derechos de las personas con discapacidad, puestos a disposición de forma accesible. Su relevancia se deriva de la histórica violación de los derechos humanos de las personas con discapacidad, evidenciada por diversos indicadores sociales (acceso desigual a la educación, el trabajo, la salud y el ingreso, así como mayor vulnerabilidad frente a la violencia y la inseguridad alimentaria). En materia de salud, aunque se trata de un derecho universal en Brasil, las necesidades de esta población permanecen invisibilizadas en las acciones universales y en la producción de conocimiento.\nEl público objetivo incluye: personas con discapacidad y sus familias; movimientos de la sociedad civil; trabajadores y gestores de las áreas sociales; investigadores y docentes de programas de posgrado; y formuladores de políticas públicas.\nLa producción consiste en diversas piezas de comunicación, difundidas en lenguaje sencillo y en literatura de cordel. Las cartillas y afiches se imprimieron para su distribución y también están disponibles en versión digital en el repositorio Arca\" de Fiocruz, en inglés, español y francés, y con recursos de accesibilidad en la versión en portugués (subtítulos, audiodescripción y lengua de señas). Su disponibilidad gratuita en diversos formatos e idiomas permite adaptarla a diferentes públicos y territorios, potenciando su replicabilidad en otros contextos, instituciones y países.\nDesarrollada desde 2020, la iniciativa se ha consolidado a través de prácticas y procesos interdisciplinarios continuos, expresando el compromiso institucional con la producción de conocimiento, la formación profesional y la promoción de los derechos de las personas con discapacidad. Su viabilidad se evidencia en la creciente adopción por parte de la sociedad civil, facilitada por su disponibilidad en un repositorio público; además, actores municipales, estatales y federales han venido estableciendo alianzas para imprimir las cartillas y trabajar en sus territorios.\nAl desarrollarse en alianza con la sociedad civil y reunir a grupos sociales históricamente separados, la iniciativa fortalece la participación social, el diálogo, la escucha activa y el intercambio de saberes. Es innovadora en varios aspectos: 1) en su formato, al presentar contenidos sintéticos, fundamentados en derechos y en distintos formatos, ampliando la accesibilidad y el alcance; 2) en el proceso de producción, que promueve la apropiación colectiva, potencia el sistema de retroalimentación, integra a los públicos destinatarios del tema y favorece la difusión; 3) en la difusión en espacios variados: eventos científicos, programas de posgrado, escuelas de educación básica, bibliotecas, museos y eventos culturales, como el Carnaval; 4) en el compromiso con una educación emancipadora que valora la autonomía, el protagonismo y la justicia social. La iniciativa se desarrolla dentro de una institución pública de enseñanza e investigación, la Escuela Nacional de Salud Pública Sérgio Arouca, de Fiocruz, en consonancia con su compromiso con la producción de conocimiento, la formación profesional y las acciones de interés social. También dialoga con el marco normativo nacional, como la Ley Brasileña de Inclusión (Ley 13.146/2015), que garantiza el derecho a la accesibilidad comunicacional, y la Política Nacional de Atención Integral a la Salud de las Personas con Discapacidad, de 2023, que reafirma el derecho a la participación, la información y la accesibilidad comunicacional, así como la importancia de la necesaria lucha contra el capacitismo, también destacada en el programa \"Novo Viver sem Limite\" (Nuevo Vivir sin Límites), que pone un énfasis singular en la importancia de confrontar este sistema de opresión (el capacitismo). Asimismo, converge con el compromiso institucional de la Escuela de valorar la participación, la diversidad, la justicia social y la educación emancipadora. Su éxito dio lugar a una invitación del Ministerio de Salud, a través de la Secretaría de Atención Especializada, para coordinar el Curso de Especialización \"Calificando la Red de Atención a las Personas con Discapacidad\". También motivó una invitación del Ministerio de Derechos Humanos y Ciudadanía para coordinar el Eje 2 (lucha contra el capacitismo y otras formas de violencia) del programa Novo Viver sem Limite. La iniciativa también está alineada con una ley recientemente promulgada en el país, que estableció la Política Nacional de Lenguaje Claro (Ley 15.263/2025)."},"links":["@ensp_fiocruz","@acolhepcd"],"hasPhotos":true,"drive":"Check to see if both photos can be uploaded: https://drive.google.com/file/d/1vnanXT_pkBQ4rB8mCvdvVPg74vTv6hWL/view?usp=sharing , https://drive.google.com/file/d/1k_wcZkq0SiSXZd7wuK7lGtv2E6XeFRjM/view?usp=sharing","prod":{"material":"PARCIAL","files":"• IMG_115746512_Alta.jpg — 5,4 MB · 3780x2480 px · Foto en alta resolución","pieces":"1) IMG_115746512_Alta.jpg (imagen principal).","gap":"Solo llegó 1 archivo. Sugerencia para 2ª pieza: captura de las redes @ensp_fiocruz / @acolhepcd o portada del material de divulgación. OJO: falta la Description corta en el Excel."}},{"id":"c003","tier":"Spotlight","category":"Clarity in Action","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Coleção Olhares Plurais","org":"Conselho Nacional de Justiça (CNJ) - Programa Justiça Plural","desc":{"en":"Olhares Plurais (Plural Perspectives) is an analytical bulletin collection by the Plural Justice Programme—a partnership between Brazil's National Council of Justice (CNJ) and UNDP. It democratizes qualified information on human rights and judicial access by translating complex research and institutional experiences into short, high-impact content with innovative visual design inspired by Brazilian culture. In 2025, the collection generated 16 news articles across CNJ and 12 partner courts, reached 38,857 users through 4 social media publications, and generated 31,726 interactions. Featured at four high-level events, it exemplifies how institutional communication can move beyond bureaucratic reporting to become an effective public education and legal literacy tool.","es":"Olhares Plurais (Miradas Plurales) es una colección de boletines analíticos del programa Justiça Plural, una alianza entre el Consejo Nacional de Justicia (CNJ) de Brasil y el PNUD. Democratiza información calificada sobre derechos humanos y acceso a la justicia al traducir investigaciones complejas y experiencias institucionales en contenidos breves y de alto impacto, con un diseño visual innovador inspirado en la cultura brasileña. En 2025, la colección generó 16 notas periodísticas en el CNJ y en 12 tribunales asociados, alcanzó a 38.857 usuarios mediante 4 publicaciones en redes sociales y generó 31.726 interacciones. Presentada en cuatro eventos de alto nivel, ejemplifica cómo la comunicación institucional puede ir más allá del informe burocrático para convertirse en una herramienta eficaz de educación pública y alfabetización jurídica."},"details":{"en":"\"Plural Perspectives\" is a collection of analytical bulletins from the Plural Justice Program, a partnership between the National Council of Justice (CNJ) and the United Nations Development Programme (UNDP). The collection democratizes qualified information on human rights and access to justice.\nBy translating complex research and institutional experiences into short, impactful content, it broadens public understanding of the challenges and solutions of the justice system. Its guiding principle is to make visible the structuring agendas of the Judiciary, organizing data and diagnoses of public utility in clear language and with an innovative visual identity.\nThe visual identity, inspired by Brazilian culture, combines institutional standardization and strategic language, making complex themes more accessible and representative. In this way, it facilitates reading, expands social reach, and transforms technical content into more effective instruments of public communication, strengthening institutional didactics.\nThe collection currently has five editions, published in print and digital versions, available on the Program's official page on the CNJ portal.\n- The 1st edition analyzes how the Judiciary institutionalizes - The 1st edition focuses on LGBTQIA+ issues, identifying commissions, policies, and actions to combat discrimination. Its visual identity communicates peace, freedom, and plurality, inspired by the woodcuts of J. Borges.\n- The 2nd edition outlines the landscape of human rights structures in the courts and highlights institutional arrangements, gaps, and opportunities for strengthening. Its visual identity reflects sensitivity, uniqueness, and networking.\n- The 3rd edition offers an initial diagnosis of the Specialized Centers for Victim Assistance (Ceavs), addressing multidisciplinary teams, services, and challenges of humanized care. Its visual identity incorporates welcoming features and warming colors.\n- The 4th edition presents the unprecedented affirmative action of Justiça Plural to recruit professionals from socially vulnerable groups, highlighting diversity, qualification, and institutional innovation in the selection process. Its visual identity reinterprets symbols and reimagines the country, inspired by the work Okê Oxóssi, by Abdias do Nascimento.\n- The 5th edition analyzes court initiatives in the context of the Award. Racial Equity, emphasizing progress, commitments, and mechanisms to address racism in the justice system. Its visual identity proposes a green light for racial justice, inspired by the work Efrain Bocabalístico: Oxóssi-Xangô-Ogum, by Abdias do Nascimento.\nThe Plural Perspectives collection offers a replicable model to strengthen equity in justice systems. The initiative demonstrates how strategic, accessible, and evidence-based content can drive institutional transformations, amplify social change, and bring the Judiciary closer to society, aligning with the United Nations' commitment to \"leave no one behind.\" \"The Plural Justice Program is an initiative of the CNJ (National Council of Justice), in partnership with UNDP (United Nations Development Programme) and with the support of the Brazilian Cooperation Agency (ABC/MRE), aimed at promoting human rights, socio-environmental rights, and access to justice for structurally vulnerable populations.\nBy translating complex research, data, and institutional practices into clear and accessible content, the collection democratizes knowledge and improves evidence-based decision-making.\nIt also strengthens the articulation between public institutions by offering inputs for the formulation of judicial policies: it transforms institutional initiatives and practices into useful analyses for courts, public bodies, and technical teams.\nIn addition, it offers diagnoses, guidelines, and thematic summaries that promote the institutionalization of priority agendas and contribute to harmonizing practices and guiding coordinated responses to structural inequalities.\nIn this way, it acts as a bridge between institutional knowledge, public policies, and society itself, fostering democratic governance and the State's capacity to guarantee rights more effectively, especially to structurally vulnerable populations.\nBased on its targeted dissemination strategy...\" Targeting high-impact audiences, the collection expands these dialogues to include other strategic actors such as opinion leaders and civil society organizations, promoting transparency, participation, and institutional innovation.","es":"\"Olhares Plurais\" (Miradas Plurales) es una colección de boletines analíticos del Programa Justiça Plural, una alianza entre el Consejo Nacional de Justicia (CNJ) y el Programa de las Naciones Unidas para el Desarrollo (PNUD). La colección democratiza información calificada sobre derechos humanos y acceso a la justicia.\nAl traducir investigaciones complejas y experiencias institucionales en contenidos breves y de gran impacto, amplía la comprensión pública de los desafíos y las soluciones del sistema de justicia. Su principio rector es visibilizar las agendas estructurantes del Poder Judicial, organizando datos y diagnósticos de utilidad pública en un lenguaje claro y con una identidad visual innovadora.\nLa identidad visual, inspirada en la cultura brasileña, combina estandarización institucional y lenguaje estratégico, haciendo más accesibles y representativos los temas complejos. De este modo, facilita la lectura, amplía el alcance social y transforma los contenidos técnicos en instrumentos más eficaces de comunicación pública, fortaleciendo la didáctica institucional.\nLa colección cuenta actualmente con cinco ediciones, publicadas en versión impresa y digital, disponibles en la página oficial del Programa en el portal del CNJ.\n- La 1.ª edición analiza cómo el Poder Judicial institucionaliza las agendas LGBTQIA+, identificando comisiones, políticas y acciones para combatir la discriminación. Su identidad visual comunica paz, libertad y pluralidad, inspirada en las xilografías de J. Borges.\n- La 2.ª edición traza el panorama de las estructuras de derechos humanos en los tribunales y destaca arreglos institucionales, brechas y oportunidades de fortalecimiento. Su identidad visual refleja sensibilidad, singularidad y trabajo en red.\n- La 3.ª edición ofrece un diagnóstico inicial de los Centros Especializados de Atención a Víctimas (Ceavs), abordando los equipos multidisciplinarios, los servicios y los desafíos de la atención humanizada. Su identidad visual incorpora rasgos acogedores y colores cálidos.\n- La 4.ª edición presenta la acción afirmativa inédita de Justiça Plural para reclutar profesionales de grupos socialmente vulnerables, destacando la diversidad, la calificación y la innovación institucional en el proceso de selección. Su identidad visual reinterpreta símbolos y reimagina el país, inspirada en la obra Okê Oxóssi, de Abdias do Nascimento.\n- La 5.ª edición analiza las iniciativas de los tribunales en el contexto del Premio Equidad Racial, con énfasis en los avances, los compromisos y los mecanismos para enfrentar el racismo en el sistema de justicia. Su identidad visual propone una luz verde para la justicia racial, inspirada en la obra Efrain Bocabalístico: Oxóssi-Xangô-Ogum, de Abdias do Nascimento.\nLa colección Olhares Plurais ofrece un modelo replicable para fortalecer la equidad en los sistemas de justicia. La iniciativa demuestra cómo los contenidos estratégicos, accesibles y basados en evidencia pueden impulsar transformaciones institucionales, amplificar el cambio social y acercar el Poder Judicial a la sociedad, en consonancia con el compromiso de las Naciones Unidas de \"no dejar a nadie atrás\". El Programa Justiça Plural es una iniciativa del CNJ (Consejo Nacional de Justicia), en alianza con el PNUD (Programa de las Naciones Unidas para el Desarrollo) y con el apoyo de la Agencia Brasileña de Cooperación (ABC/MRE), orientada a promover los derechos humanos, los derechos socioambientales y el acceso a la justicia de las poblaciones estructuralmente vulnerabilizadas.\nAl traducir investigaciones, datos y prácticas institucionales complejas en contenidos claros y accesibles, la colección democratiza el conocimiento y mejora la toma de decisiones basada en evidencia.\nTambién fortalece la articulación entre instituciones públicas al ofrecer insumos para la formulación de políticas judiciales: transforma iniciativas y prácticas institucionales en análisis útiles para tribunales, organismos públicos y equipos técnicos.\nAdemás, ofrece diagnósticos, directrices y síntesis temáticas que promueven la institucionalización de agendas prioritarias y contribuyen a armonizar prácticas y orientar respuestas coordinadas frente a las desigualdades estructurales.\nDe esta manera, actúa como un puente entre el conocimiento institucional, las políticas públicas y la propia sociedad, fomentando la gobernanza democrática y la capacidad del Estado para garantizar derechos de manera más eficaz, especialmente a las poblaciones estructuralmente vulnerabilizadas.\nA partir de su estrategia de difusión focalizada, dirigida a audiencias de alto impacto, la colección amplía estos diálogos para incluir a otros actores estratégicos, como líderes de opinión y organizaciones de la sociedad civil, promoviendo la transparencia, la participación y la innovación institucional."},"links":["https://www.cnj.jus.br/programas-e-acoes/direitos-humanos/justica-plural/"],"hasPhotos":true,"drive":"Check to see if both photos can be uploaded: https://drive.google.com/file/d/17HVGkgB4dG0fl-rLWMIBan1ia-KM1cys/view?usp=sharing , https://drive.google.com/file/d/1wuSPQXT03qC3Cvzv03l-ZHBFd2yykmWb/view?usp=sharing","prod":{"material":"NO","files":"CARPETA VACÍA — no llegó ningún archivo","pieces":"Ninguno por ahora.","gap":"Carpeta vacía. Sugerencia: portadas de los boletines \"Olhares Plurais\" (descargables en cnj.jus.br/…/justica-plural) — servirían 2 portadas como piezas."}},{"id":"c004","tier":"Spotlight","category":"Dialogue Builders","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Portal de Participação Cidadã","org":"Tribunal de Contas da União (TCU)","desc":{"en":"The Portal de Participação Cidadã of Brazil's Federal Court of Accounts (TCU) repositions the institution as the 'Citizens' Court' by placing citizens at the center of public resource oversight decisions. The portal operationalizes citizen participation through public consultations where any Brazilian can vote on social problems and share personal experiences. The first consultation (April–June 2025) attracted 1,341 citizens, 3,360 votes, and 407 narratives, generating five actual audits judged in plenary sessions with participants present. A second consultation gathered 10,359 votes—demonstrating rapid scaling. The initiative combines digital voting, plain language, audiovisual resources, and in-person outreach as a replicable model for meaningful public participation in government accountability.","es":"El Portal de Participação Cidadã del Tribunal de Cuentas Federal de Brasil (TCU) reposiciona a la institución como el 'Tribunal del Ciudadano', al colocar a la ciudadanía en el centro de las decisiones sobre la fiscalización de los recursos públicos. El portal hace operativa la participación ciudadana mediante consultas públicas en las que cualquier persona brasileña puede votar sobre problemas sociales y compartir experiencias personales. La primera consulta (abril–junio de 2025) convocó a 1.341 ciudadanos, 3.360 votos y 407 relatos, y dio origen a cinco auditorías reales juzgadas en sesiones plenarias con la presencia de los participantes. Una segunda consulta reunió 10.359 votos, lo que demuestra una rápida escalabilidad. La iniciativa combina votación digital, lenguaje claro, recursos audiovisuales y actividades presenciales de acercamiento, como modelo replicable de participación pública significativa en la rendición de cuentas gubernamental."},"details":{"en":"\"The Citizen Participation Portal (cidadao.tcu.gov.br) seeks to position the Federal Court of Accounts (TCU) as the \"Citizen's Court,\" placing the citizen at the center of decisions regarding the oversight of public resources.\nOverview and Objectives:\nThe initiative operationalizes citizen participation through public consultations in which all citizens can vote on social issues and share personal experiences. The main objective is to bring external control closer to society, aligning oversight priorities with real demands, strengthening institutional transparency, and consolidating a model of citizen participation.\nTarget Audience and Methodology:\nEvery Brazilian citizen. The inclusive approach combines digital voting, simplified language, audiovisual resources, and in-person mobilizations.\nHistory:\nConceived in January 2025 by President Vital do Rêgo, after a visit to the Court of Accounts of France. First consultation: April 23 to June 30, 2025.\" 2025. Second consultation: November 19, 2025 to February 1, 2026.\nStakeholders: Civil society, social control advisors, and citizens. At the TCU (Brazilian Federal Court of Accounts), the Secretariats of Institutional Relations (coordinator), External Control, Communication, IT and Digital Evolution, and state secretaries of the TCU.\nProven Results\nFirst consultation: 1,341 citizens, 3,360 votes, 407 qualitative reports. Five themes converted into effective audits (health works, idle properties, INSS [Brazilian Social Security Institute] queues, climate change, highways). Presentation in plenary session with citizen participation.\nSecond consultation (until January 29): 10,359 votes, 1,259 reports, 2,073 registered participants. 18 problems in 5 themes. Results in plenary session, November 2025. 2026.\nInnovation:\nUnique integration: digital voting + qualitative reports as equivalent sources.\nConcrete actions: voting linked to effective, not symbolic, audits.\nScalability: 206% growth between consultations.\nInclusion: translates technical problems into accessible language.\nReplicability: scalable model for Courts of Accounts.\nComplete cycle: voting → implementation → public presentation\nParticipatory democracy: citizen as a legitimate producer of knowledge.\nTransformative impact: Transcends communication tool, functioning as an instrument of democratization. Growing numbers suggest that citizens recognize that their voices have an effect. Strengthens institutional legitimacy in a context of crisis of confidence in public structures, seeking to consolidate the TCU (Brazilian Federal Court of Accounts) as a reference in citizen participation in external control. \"Institutional Link\nThe Portal is an activity inherent to the TCU (Brazilian Federal Court of Accounts), the body that oversees federal public resources, transforming citizen participation into a permanent policy integrated into audit planning.\nAlignment with Public Policies\nOECD Recommendation - Public Integrity: international recommendations to deepen participatory democracy.\nOpen Government: exemplifies active transparency, invites citizens to participate, and reports results publicly.\nPublic Modernization: consolidates a state-society model based on genuine listening.\nPublic Policy Cycle\nCitizens vote on issues → TCU conducts audits based on votes and reports → Results in plenary session.\nInstitutional Collaboration\nTCU Units: Secretariats of Institutional Relations, External Control, Communication, IT, State Secretaries and audit teams. State and municipal Courts of Accounts, various public bodies and civil society.\nResults\nFirst Consultation:\" 1,341 citizens, 3,360 votes, 407 reports. Five themes generated five audits judged in Plenary Session.\nSecond Consultation (until 01/29/2026): 10,359 votes, 1,259 reports, 2,073 citizens registered to follow the results.\nTransformation in Governance\nThe portal changes how the TCU (Brazilian Federal Court of Accounts) defines its agenda. The technical definition now incorporates citizen participation, reflecting popular demands. Citizens choose themes that affect Brazilians and the resources allocated to issues of high social relevance.","es":"El Portal de Participación Ciudadana (cidadao.tcu.gov.br) busca posicionar al Tribunal de Cuentas Federal de Brasil (TCU) como el \"Tribunal del Ciudadano\", colocando a la ciudadanía en el centro de las decisiones sobre la fiscalización de los recursos públicos.\nPanorama y objetivos:\nLa iniciativa hace operativa la participación ciudadana mediante consultas públicas en las que todos los ciudadanos pueden votar sobre problemas sociales y compartir experiencias personales. El objetivo principal es acercar el control externo a la sociedad, alineando las prioridades de fiscalización con las demandas reales, fortaleciendo la transparencia institucional y consolidando un modelo de participación ciudadana.\nPúblico objetivo y metodología:\nToda la ciudadanía brasileña. El enfoque inclusivo combina votación digital, lenguaje simplificado, recursos audiovisuales y movilizaciones presenciales.\nHistoria:\nConcebido en enero de 2025 por el presidente Vital do Rêgo, tras una visita al Tribunal de Cuentas de Francia. Primera consulta: del 23 de abril al 30 de junio de 2025. Segunda consulta: del 19 de noviembre de 2025 al 1 de febrero de 2026.\nActores involucrados: la sociedad civil, los consejeros de control social y la ciudadanía. En el TCU (Tribunal de Cuentas Federal de Brasil), las Secretarías de Relaciones Institucionales (coordinadora), de Control Externo, de Comunicación, de TI y Evolución Digital, y las secretarías estaduales del TCU.\nResultados comprobados:\nPrimera consulta: 1.341 ciudadanos, 3.360 votos y 407 relatos cualitativos. Cinco temas convertidos en auditorías efectivas (obras de salud, inmuebles ociosos, filas del INSS [Instituto Nacional del Seguro Social de Brasil], cambio climático y carreteras). Presentación en sesión plenaria con participación ciudadana.\nSegunda consulta (hasta el 29 de enero): 10.359 votos, 1.259 relatos y 2.073 participantes registrados. 18 problemas en 5 temas. Resultados en sesión plenaria, noviembre de 2025 y 2026.\nInnovación:\nIntegración única: votación digital + relatos cualitativos como fuentes equivalentes.\nAcciones concretas: votación vinculada a auditorías efectivas, no simbólicas.\nEscalabilidad: crecimiento del 206% entre consultas.\nInclusión: traduce problemas técnicos a un lenguaje accesible.\nReplicabilidad: modelo escalable para los Tribunales de Cuentas.\nCiclo completo: votación → implementación → presentación pública.\nDemocracia participativa: el ciudadano como productor legítimo de conocimiento.\nImpacto transformador: trasciende la herramienta de comunicación y funciona como instrumento de democratización. Las cifras crecientes sugieren que la ciudadanía reconoce que su voz tiene efecto. Fortalece la legitimidad institucional en un contexto de crisis de confianza en las estructuras públicas, buscando consolidar al TCU (Tribunal de Cuentas Federal de Brasil) como referente de la participación ciudadana en el control externo.\nVínculo institucional:\nEl Portal es una actividad inherente al TCU (Tribunal de Cuentas Federal de Brasil), órgano que fiscaliza los recursos públicos federales, transformando la participación ciudadana en una política permanente integrada a la planificación de auditorías.\nAlineación con políticas públicas:\nRecomendación de la OCDE sobre Integridad Pública: recomendaciones internacionales para profundizar la democracia participativa.\nGobierno Abierto: ejemplifica la transparencia activa, invita a la ciudadanía a participar e informa públicamente los resultados.\nModernización pública: consolida un modelo Estado-sociedad basado en la escucha genuina.\nCiclo de políticas públicas:\nLa ciudadanía vota los temas → el TCU realiza auditorías con base en los votos y relatos → los resultados se presentan en sesión plenaria.\nColaboración institucional:\nUnidades del TCU: Secretarías de Relaciones Institucionales, Control Externo, Comunicación, TI, secretarías estaduales y equipos de auditoría. Tribunales de Cuentas estaduales y municipales, diversos organismos públicos y la sociedad civil.\nResultados:\nPrimera consulta: 1.341 ciudadanos, 3.360 votos y 407 relatos. Cinco temas generaron cinco auditorías juzgadas en sesión plenaria.\nSegunda consulta (hasta el 29/01/2026): 10.359 votos, 1.259 relatos y 2.073 ciudadanos registrados para seguir los resultados.\nTransformación en la gobernanza:\nEl portal cambia la forma en que el TCU (Tribunal de Cuentas Federal de Brasil) define su agenda. La definición técnica ahora incorpora la participación ciudadana, reflejando las demandas populares. La ciudadanía elige los temas que afectan a los brasileños y los recursos destinados a asuntos de alta relevancia social."},"links":["cidadao.tcu.gov.br"],"hasPhotos":true,"drive":"Oscar, please check to see if there´s a logo is in this folder; if so, we can add it.: https://drive.google.com/drive/folders/1sS6c5krRi4hw2Gz-j1Hc_Y2_cQt9rPpP?usp=sharing","prod":{"material":"NO","files":"CARPETA VACÍA — no llegó ningún archivo","pieces":"Ninguno por ahora.","gap":"Carpeta vacía. Sugerencia: 2 capturas de pantalla del portal cidadao.tcu.gov.br (home + una sección de participación)."}},{"id":"c005","tier":"Spotlight","category":"Dialogue Builders","categorySource":"official","iso":"DE","lang":"English","region":{"en":"Europe","es":"Europa"},"country":{"en":"Germany","es":"Alemania"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Tiny Rathaus / Tiny Town Hall","org":"KielRegion GmbH","desc":{"en":"The Tiny Town Hall is a mobile participation space developed in 2022 by KielRegion GmbH under Germany's Smart Cities federal programme, designed to bring democratic engagement directly to citizens in northern Germany. The mobile unit travels to urban neighborhoods and rural communities, enabling local governments to discuss mobility, climate action, and local development in accessible, face-to-face settings. Since 2022, it has visited 55 locations, hosted approximately 260 events, and been used by the City of Kiel, district administrations, associations, and community organizations—establishing a replicable model for mobile democratic participation that overcomes geographic and institutional barriers to public engagement.","es":"El Tiny Town Hall es un espacio móvil de participación desarrollado en 2022 por KielRegion GmbH en el marco del programa federal alemán Smart Cities, diseñado para llevar la participación democrática directamente a la ciudadanía del norte de Alemania. La unidad móvil recorre barrios urbanos y comunidades rurales, permitiendo a los gobiernos locales dialogar sobre movilidad, acción climática y desarrollo local en entornos accesibles y presenciales. Desde 2022 ha visitado 55 localidades, ha acogido aproximadamente 260 eventos y ha sido utilizado por la Ciudad de Kiel, administraciones distritales, asociaciones y organizaciones comunitarias, consolidando un modelo replicable de participación democrática móvil que supera las barreras geográficas e institucionales a la participación pública."},"details":{"en":"\"The “Tiny Town Hall” as a mobile Participation space\nThe Tiny Town Hall is a mobile participation space designed to bring citizen engagement directly to the people of the KielRegion in northern Germany (including the city of Kiel and the districts Rendsburg-Eckernförde and Plön). Developed in 2022 as part of the federal program Model Projects Smart Cities (funded by the German Federal Ministry for Housing, Urban Development and Building), the initiative aims to strengthen democratic participation and foster dialogue between local administrations and civil society in an open, accessible, and innovative way.\nThe Tiny Town Hall seeks to make participation more inclusive, visible, and flexible by creating a mobile platform for dialogue, co-creation, and information exchange. It enables municipalities to meet citizens where they are, whether in urban neighborhoods or rural communities, and to address local issues collaboratively. The initiative promotes transparency, trust, and creativity in public communication, offering formats such as mayor’s office hours, workshops, consultations, and cultural events.\nThe primary audience includes residents of the KielRegion (urban and rural), local associations, schools, and community organizations. It also serves municipal administrations and decision-makers who want to engage citizens in planning and development processes. Special attention is given to groups that are often underrepresented in traditional participation formats, such as youth and elderly citizens.\nThe project was co-created through a collaborative process involving the KielRegion GmbH, the City of Kiel, and the Anscharcampus Creative Center, supported by additional local actors. The concept was tested in 2021 and officially launched in 2022. Since then, the Tiny Town Hall has toured the region annually, hosting over 260 events at more than 50 locations. Key stakeholders include municipal administrations, civic organizations, and regional networks. Funding comes from the Smart Cities program.\nThe Tiny Town Hall redefines what a “town hall” can be. Instead of expecting citizens to come to administrative buildings, it brings governance and participation into public spaces, e.g. markets, village squares, festivals – using a compact, transportable structure (approx. 8.6 m²) mounted on a trailer. Its mobility allows for rapid deployment and adaptation to diverse contexts, from dense urban quarters to remote rural areas. The initiative combines physical presence with digital tools (e.g., interactive platforms, QR-based surveys, and touch tables) to enhance accessibility and engagement. By creating a welcoming, creative environment for dialogue, the Tiny Town Hall lowers barriers to participation and demonstrates how public communication can be human-centered, flexible, and playful.\n\"\"KielRegion GmbH is a publicly funded regional development company supported by the City of Kiel and the districts of Plön and Rendsburg-Eckernförde, making it a public institution with a clear mandate to foster regional cooperation and innovation. Within this framework, KielRegion GmbH developed the Tiny Rathaus as part of the Model Projects Smart Cities program, funded by the German Federal Ministry for Housing, Urban Development and Building.\nThe Tiny Rathaus is actively used by the City of Kiel and the districts of Plön and Rendsburg-Eckernförde to engage with citizens on a wide range of topics. It serves as a mobile platform for dialogue, enabling municipalities to inform residents, involve them in decision-making processes, and gather feedback on local projects and policies. By bringing participation directly to public spaces, the initiative strengthens democratic engagement and ensures that governance is accessible and inclusive.\"","es":"El \"Tiny Town Hall\" como espacio móvil de participación.\nEl Tiny Town Hall es un espacio móvil de participación diseñado para llevar el involucramiento ciudadano directamente a la población de la KielRegion, en el norte de Alemania (que incluye la ciudad de Kiel y los distritos de Rendsburg-Eckernförde y Plön). Desarrollada en 2022 como parte del programa federal Model Projects Smart Cities (financiado por el Ministerio Federal alemán de Vivienda, Desarrollo Urbano y Construcción), la iniciativa busca fortalecer la participación democrática y fomentar el diálogo entre las administraciones locales y la sociedad civil de manera abierta, accesible e innovadora.\nEl Tiny Town Hall procura hacer la participación más inclusiva, visible y flexible mediante la creación de una plataforma móvil para el diálogo, la cocreación y el intercambio de información. Permite a los municipios encontrarse con la ciudadanía allí donde está, ya sea en barrios urbanos o en comunidades rurales, y abordar los asuntos locales de forma colaborativa. La iniciativa promueve la transparencia, la confianza y la creatividad en la comunicación pública, ofreciendo formatos como horarios de atención de la alcaldía, talleres, consultas y eventos culturales.\nEl público principal incluye a los residentes de la KielRegion (urbanos y rurales), asociaciones locales, escuelas y organizaciones comunitarias. También está al servicio de las administraciones municipales y de los tomadores de decisiones que desean involucrar a la ciudadanía en los procesos de planificación y desarrollo. Se presta especial atención a los grupos frecuentemente subrepresentados en los formatos tradicionales de participación, como la juventud y las personas mayores.\nEl proyecto fue cocreado mediante un proceso colaborativo en el que participaron KielRegion GmbH, la Ciudad de Kiel y el centro creativo Anscharcampus, con el apoyo de otros actores locales. El concepto se puso a prueba en 2021 y se lanzó oficialmente en 2022. Desde entonces, el Tiny Town Hall ha recorrido la región anualmente, acogiendo más de 260 eventos en más de 50 localidades. Entre los actores clave figuran administraciones municipales, organizaciones cívicas y redes regionales. El financiamiento proviene del programa Smart Cities.\nEl Tiny Town Hall redefine lo que puede ser un \"ayuntamiento\". En lugar de esperar que la ciudadanía acuda a los edificios administrativos, lleva la gobernanza y la participación a los espacios públicos —mercados, plazas de los pueblos, festivales— mediante una estructura compacta y transportable (aprox. 8,6 m²) montada sobre un remolque. Su movilidad permite un despliegue rápido y la adaptación a contextos diversos, desde barrios urbanos densos hasta zonas rurales remotas. La iniciativa combina la presencia física con herramientas digitales (por ejemplo, plataformas interactivas, encuestas mediante códigos QR y mesas táctiles) para mejorar la accesibilidad y el involucramiento. Al crear un ambiente acogedor y creativo para el diálogo, el Tiny Town Hall reduce las barreras a la participación y demuestra cómo la comunicación pública puede ser flexible, lúdica y centrada en las personas.\nKielRegion GmbH es una empresa de desarrollo regional con financiamiento público, respaldada por la Ciudad de Kiel y los distritos de Plön y Rendsburg-Eckernförde, lo que la convierte en una institución pública con un mandato claro de fomentar la cooperación regional y la innovación. En este marco, KielRegion GmbH desarrolló el Tiny Rathaus como parte del programa Model Projects Smart Cities, financiado por el Ministerio Federal alemán de Vivienda, Desarrollo Urbano y Construcción.\nEl Tiny Rathaus es utilizado activamente por la Ciudad de Kiel y los distritos de Plön y Rendsburg-Eckernförde para dialogar con la ciudadanía sobre una amplia gama de temas. Funciona como una plataforma móvil de diálogo que permite a los municipios informar a los residentes, involucrarlos en los procesos de toma de decisiones y recoger sus opiniones sobre proyectos y políticas locales. Al llevar la participación directamente a los espacios públicos, la iniciativa fortalece el compromiso democrático y garantiza una gobernanza accesible e inclusiva."},"links":["www.kielregion.de/tinyrathaus"],"hasPhotos":true,"drive":"Check to see if both photos can be uploaded: https://drive.google.com/drive/folders/1JIe1hs--xkfTUCkHdgMrghHk_hs4MVGR?usp=sharing","prod":{"material":"NO","files":"CARPETA VACÍA — no llegó ningún archivo","pieces":"Ninguno por ahora.","gap":"Carpeta vacía. Sugerencia: fotos oficiales del Tiny Rathaus en www.kielregion.de/tinyrathaus (exterior del módulo + foto de uso con ciudadanos); pedir a Sina Kaempfe, quien ya respondió."}},{"id":"c006","tier":"Spotlight","category":"Exploring New Frontiers","categorySource":"official","iso":"BR","lang":"Portuguese","region":{"en":"Latin America & the Caribbean","es":"América Latina y el Caribe"},"country":{"en":"Brazil","es":"Brasil"},"type":{"en":"Media","es":"Medio de comunicación"},"name":"Extra Favelas","org":"Editora Globo","desc":{"en":"Extra Favelas is a journalistic and community-engagement initiative by Rio newspaper EXTRA, developed in partnership with Rio de Janeiro City Council, to strengthen the visibility, dignity, and political voice of favela residents—historically marginalized from decision-making. In 2025, Extra Favelas organized five community debates inside different favelas, an unprecedented step for a major Brazilian media outlet. These events brought together residents, local leaders, and City Council members, creating direct dialogue spaces. The initiative generated over 10 million impressions across print, online, radio, and social media, establishing a model for how established media can recenter public communication around underrepresented communities.","es":"Extra Favelas es una iniciativa periodística y de vinculación comunitaria del periódico carioca EXTRA, desarrollada en alianza con la Cámara Municipal de Río de Janeiro, para fortalecer la visibilidad, la dignidad y la voz política de los habitantes de las favelas, históricamente marginados de la toma de decisiones. En 2025, Extra Favelas organizó cinco debates comunitarios dentro de distintas favelas, un paso sin precedentes para un gran medio de comunicación brasileño. Estos encuentros reunieron a residentes, líderes locales y concejales, creando espacios de diálogo directo. La iniciativa generó más de 10 millones de impresiones en medios impresos, digitales, radio y redes sociales, estableciendo un modelo de cómo los medios consolidados pueden recentrar la comunicación pública en las comunidades subrepresentadas."},"details":{"en":"\"Developed in partnership with the Rio City Council, Extra Favelas is a journalistic and community-engagement initiative created by the Rio newspaper EXTRA to strengthen the visibility, dignity and political voice of residents of Rio de Janeiro’s favelas—historically marginalized communities that are often excluded from decision-making processes.\nLaunched in 2024 with a landmark debate at Editora Globo’s headquarters, the project was conceived as both a media brand and a sustained editorial commitment to covering issues affecting low-income communities. In 2025, Extra Favelas expanded significantly, moving from newsroom-centered debates to direct engagement inside the favelas themselves. The newspaper organized five community debates within different favelas, an unprecedented effort for a major media outlet in Brazil and a demonstration of Extra’s intention to serve as a catalyst for social dialogue and public accountability.\nThese on-the-ground events gathered local leaders, residents, public officials and city council members to discuss priority topics such as public services, health, mobility, safety, education, entrepreneurship and representation. The cycle culminated in the Fórum Extra Favelas, held again at Editora Globo’s auditorium, which brought together experts and community voices to deepen the conversations sparked in the territories. The forum reached millions through print, digital and social-media coverage.\nA central component of the initiative was a hybrid survey, conducted both in person during the community debates and online on Extra’s website, enabling favela residents to identify their most urgent needs and describe aspects of their daily lives. The results of this unprecedented consultation were transformed into a special series of reports and formally delivered to the Rio City Council to help inform discussions on public policy. Council members participated actively in the debates, reinforcing the project’s role as a bridge between institutions and citizens.\nExtra Favelas redefines the role of a media outlet in public communication by bringing institutional debate directly into marginalized territories, rather than asking residents to travel to institutional spaces. It combines journalism, civic participation and policy influence, creating a two-way communication channel: listening to communities, amplifying their voices through large-scale media coverage, and delivering their demands to decision-makers. At a time when trust in institutions is fragile, the project innovates by positioning a newspaper as a connector that fosters inclusion, transparency and collaborative governance.\"\"The Extra Favelas initiative is structurally connected to the Rio de Janeiro City Council, which partnered with Extra from the very beginning of the project. The first debate in 2024 was co-organized with the City Council, establishing an institutional foundation for dialogue between legislators and favela residents. In 2025, council members actively participated in the five debates held inside the communities, engaging directly with citizens on issues such as public services, mobility, safety, health and education.\nA central element of the initiative—the hybrid survey conducted both in person and online—was formally delivered to the City Council as a tool to inform legislative debates and guide future public policies affecting the favelas. By transforming residents’ demands into structured data and widely disseminated journalism, Extra Favelas provides policymakers with evidence-based insights while ensuring that community concerns reach official decision-making arenas.\nThe project thus operates as a bridge between public institutions and historically excluded populations, facilitating communication, improving transparency and strengthening democratic participation. Its design is aligned with the Atlas’s goals: supporting inclusive governance by connecting citizens’ lived experiences to institutional action and policy reform.\"","es":"Desarrollada en alianza con la Cámara Municipal de Río de Janeiro, Extra Favelas es una iniciativa periodística y de vinculación comunitaria creada por el periódico carioca EXTRA para fortalecer la visibilidad, la dignidad y la voz política de los habitantes de las favelas de Río de Janeiro, comunidades históricamente marginadas que suelen quedar excluidas de los procesos de toma de decisiones.\nLanzado en 2024 con un debate emblemático en la sede de Editora Globo, el proyecto fue concebido a la vez como una marca mediática y como un compromiso editorial sostenido con la cobertura de los temas que afectan a las comunidades de bajos ingresos. En 2025, Extra Favelas se expandió de manera significativa, pasando de debates centrados en la redacción al involucramiento directo dentro de las propias favelas. El periódico organizó cinco debates comunitarios en distintas favelas, un esfuerzo sin precedentes para un gran medio de comunicación en Brasil y una demostración de la intención de EXTRA de actuar como catalizador del diálogo social y de la rendición de cuentas pública.\nEstos eventos en el territorio reunieron a líderes locales, residentes, funcionarios públicos y concejales para debatir temas prioritarios como servicios públicos, salud, movilidad, seguridad, educación, emprendimiento y representación. El ciclo culminó con el Fórum Extra Favelas, celebrado nuevamente en el auditorio de Editora Globo, que congregó a especialistas y voces comunitarias para profundizar las conversaciones iniciadas en los territorios. El foro llegó a millones de personas a través de la cobertura impresa, digital y en redes sociales.\nUn componente central de la iniciativa fue una encuesta híbrida, realizada tanto de manera presencial durante los debates comunitarios como en línea en el sitio web de EXTRA, que permitió a los habitantes de las favelas identificar sus necesidades más urgentes y describir aspectos de su vida cotidiana. Los resultados de esta consulta sin precedentes se transformaron en una serie especial de reportajes y se entregaron formalmente a la Cámara Municipal de Río de Janeiro para contribuir a las discusiones sobre políticas públicas. Los concejales participaron activamente en los debates, reforzando el papel del proyecto como puente entre las instituciones y la ciudadanía.\nExtra Favelas redefine el papel de un medio de comunicación en la comunicación pública al llevar el debate institucional directamente a los territorios marginados, en lugar de pedir a los residentes que se trasladen a los espacios institucionales. Combina periodismo, participación cívica e incidencia en las políticas, creando un canal de comunicación de doble vía: escuchar a las comunidades, amplificar sus voces mediante una cobertura mediática a gran escala y hacer llegar sus demandas a los tomadores de decisiones. En un momento en que la confianza en las instituciones es frágil, el proyecto innova al posicionar a un periódico como un conector que fomenta la inclusión, la transparencia y la gobernanza colaborativa.\nLa iniciativa Extra Favelas está estructuralmente vinculada a la Cámara Municipal de Río de Janeiro, que se asoció con EXTRA desde el inicio mismo del proyecto. El primer debate, en 2024, fue coorganizado con la Cámara Municipal, estableciendo una base institucional para el diálogo entre legisladores y habitantes de las favelas. En 2025, los concejales participaron activamente en los cinco debates realizados dentro de las comunidades, dialogando directamente con la ciudadanía sobre temas como servicios públicos, movilidad, seguridad, salud y educación.\nUn elemento central de la iniciativa —la encuesta híbrida realizada de manera presencial y en línea— fue entregado formalmente a la Cámara Municipal como herramienta para informar los debates legislativos y orientar las futuras políticas públicas que afectan a las favelas. Al transformar las demandas de los residentes en datos estructurados y en periodismo de amplia difusión, Extra Favelas brinda a los responsables de políticas información basada en evidencia, al tiempo que garantiza que las preocupaciones de las comunidades lleguen a los ámbitos oficiales de decisión.\nEl proyecto opera así como un puente entre las instituciones públicas y las poblaciones históricamente excluidas, facilitando la comunicación, mejorando la transparencia y fortaleciendo la participación democrática. Su diseño está alineado con los objetivos del Atlas: apoyar una gobernanza inclusiva conectando las experiencias vividas de la ciudadanía con la acción institucional y la reforma de las políticas."},"links":["https://extra.globo.com  | instragram.com/jornalextra"],"hasPhotos":true,"drive":"Check to see if both photos can be uploaded: https://drive.google.com/file/d/1lZD3KTj1nQ_OZcTa89bHBfIQCVaetrIZ/view?usp=sharing , https://drive.google.com/file/d/1X5gEjTMTJJjOzk8rvLHZd-9p06BYaMDV/view?usp=sharing","prod":{"material":"PARCIAL","files":"• 112527368_RI Rio de Janeiro RJ 29-09-2025 - _Extra Favelas_ O PAPO AGORA É EM CASA Urbanismo e.jpg — 6,6 MB · 6720x4480 px · Foto profesional en alta resolución","pieces":"1) 112527368_RI…Extra Favelas….jpg (imagen principal, excelente calidad).","gap":"Solo llegó 1 archivo. Sugerencia para 2ª pieza: captura del especial en extra.globo.com o del Instagram @jornalextra."}},{"id":"c007","tier":"Spotlight","category":"Trust Catalysts","categorySource":"official","iso":"UA","lang":"English","region":{"en":"Europe","es":"Europa"},"country":{"en":"Ukraine","es":"Ucrania"},"type":{"en":"Public institution","es":"Institución pública"},"name":"Voices of Resilience: An Interactive Dialogue Between the Public and Local Authorities","org":"Department of Strategic and Socio-Economic Development of Sumy City Council","desc":{"en":"Voices of Resilience is a public communication initiative by Sumy City Council, Ukraine, addressing management burnout and trust erosion caused by war and instability in this border community. The initiative combines motivational training, the UPGRADE transformational management game, and analytical tools to rebuild internal resilience in local government teams and restore bilateral dialogue with residents. The UPGRADE game addresses team motivation, resilience building, and adaptive leadership in conditions of uncertainty—equipping managers to communicate with constituents during ongoing crisis. The initiative demonstrates how internal communication and leadership development directly affect the quality of public governance in conflict contexts.","es":"Voices of Resilience es una iniciativa de comunicación pública del Concejo Municipal de Sumy, Ucrania, que aborda el agotamiento de los equipos directivos y la erosión de la confianza causados por la guerra y la inestabilidad en esta comunidad fronteriza. La iniciativa combina capacitaciones motivacionales, el juego de gestión transformacional UPGRADE y herramientas analíticas para reconstruir la resiliencia interna de los equipos de gobierno local y restablecer el diálogo bilateral con los residentes. El juego UPGRADE aborda la motivación de los equipos, el desarrollo de la resiliencia y el liderazgo adaptativo en condiciones de incertidumbre, preparando a los directivos para comunicarse con la ciudadanía durante una crisis en curso. La iniciativa demuestra cómo la comunicación interna y el desarrollo del liderazgo inciden directamente en la calidad de la gobernanza pública en contextos de conflicto."},"details":{"en":"\"The Voices of Resilience: Interactive Dialogue between the Public and Local Self-Government initiative aims to introduce a new approach to public communication, addressing a critical issue in the border community of Sumy. Here, war and constant instability have led to a loss of motivation and emotional burnout among management teams, which undermines team cohesion and reduces the effectiveness of recovery processes. This creates a crisis of trust both within teams and in relations with residents.\nThe main task is not only to restore the internal psychological resilience and adaptability of LSM specialists, but also to transform their internal resources into a powerful mechanism for bilateral dialogue that strengthens public trust and social cohesion. The target audiences include LSM specialists, heads of KP/KU, OGS, and community residents.\nThe essence of the innovation: The project uses a comprehensive approach that combines motivational training, transformational games, and analytical reflection. This methodology is uniquely adapted to the challenges of the border region, focusing on mobilizing internal resources on the ground.\nThe result is an Analytical Document. Unlike a regular report, this document summarizes the insights, requests, and management dilemmas developed by experts during the games. It becomes the basis for public consultation.\nThis allows the OMS to transparently present the complexity of decisions, and the OGS to participate in the formulation of joint recovery strategies, integrating public experience into strategic recommendations. The next step is to present the results in a form that is accessible and open to the public: conclusions from the games are converted into visual content for use on community web platforms. Complex management dilemmas are presented with the aim of showing the public the logic behind the decisions taken, rather than just the outcome. This creates safe spaces for sharing information resources, dispels rumors, and builds trust, as the community sees that the authorities also work in conditions of uncertainty and do everything openly out of concern for the well-being of citizens.\nThis integrated approach ensures that the internal development of local self-government becomes an innovative, open tool for creating dialogue and strengthening social cohesion in the community.\"\"The project is directly aimed at strengthening the human resources and psychological resilience of OMS specialists and managers of municipal enterprises in the Sumy community. They are the main target audience for training (transformational games and workshops). The project is being implemented by the Department of Strategic and Socio-Economic Development of the Sumy City Council. The Department performs a number of tasks related to the direct implementation of the project, such as:\nproviding analysis of the results of the activities carried out (results of transformation games, participants' reflections after the training, which will subsequently ensure thorough preparation for the formation of the Analytical Document)\n planning events (developing a schedule of events, forming the most optimal combinations of activities for the best assimilation of material by participants), selecting participants. The Department also provides premises for sessions, trainings, and transformational games, namely the Office of Recovery and Development. After the event, it is also responsible for disseminating information on web resources for the public and further publishing the Analytical Document for a wider audience in the community.\"","es":"La iniciativa Voices of Resilience: Diálogo Interactivo entre el Público y el Autogobierno Local tiene como objetivo introducir un nuevo enfoque de comunicación pública, abordando un problema crítico en la comunidad fronteriza de Sumy. Allí, la guerra y la inestabilidad constante han provocado pérdida de motivación y agotamiento emocional en los equipos directivos, lo que socava la cohesión de los equipos y reduce la eficacia de los procesos de recuperación. Esto genera una crisis de confianza tanto dentro de los equipos como en las relaciones con los residentes.\nLa tarea principal no es solo restablecer la resiliencia psicológica interna y la adaptabilidad de los especialistas de los LSM, sino también transformar sus recursos internos en un poderoso mecanismo de diálogo bilateral que fortalezca la confianza pública y la cohesión social. Los públicos objetivo incluyen a los especialistas de los LSM, los directores de KP/KU, las OGS y los residentes de la comunidad.\nLa esencia de la innovación: el proyecto utiliza un enfoque integral que combina capacitación motivacional, juegos transformacionales y reflexión analítica. Esta metodología está adaptada de manera singular a los desafíos de la región fronteriza, centrándose en la movilización de los recursos internos en el territorio.\nEl resultado es un Documento Analítico. A diferencia de un informe común, este documento sintetiza las conclusiones, las solicitudes y los dilemas de gestión elaborados por los expertos durante los juegos. Se convierte en la base para la consulta pública.\nEsto permite a los OMS presentar con transparencia la complejidad de las decisiones, y a las OGS participar en la formulación de estrategias conjuntas de recuperación, integrando la experiencia pública en las recomendaciones estratégicas. El siguiente paso es presentar los resultados en una forma accesible y abierta al público: las conclusiones de los juegos se convierten en contenido visual para su uso en las plataformas web de la comunidad. Los dilemas de gestión complejos se presentan con el objetivo de mostrar al público la lógica detrás de las decisiones adoptadas, y no solo el resultado. Esto crea espacios seguros para compartir recursos de información, disipa rumores y genera confianza, ya que la comunidad ve que las autoridades también trabajan en condiciones de incertidumbre y actúan con total apertura por el bienestar de la ciudadanía.\nEste enfoque integrado garantiza que el desarrollo interno del autogobierno local se convierta en una herramienta innovadora y abierta para crear diálogo y fortalecer la cohesión social en la comunidad.\nEl proyecto está directamente orientado a fortalecer los recursos humanos y la resiliencia psicológica de los especialistas de los OMS y de los directores de las empresas municipales de la comunidad de Sumy. Ellos constituyen el principal público objetivo de las capacitaciones (juegos transformacionales y talleres). El proyecto es implementado por el Departamento de Desarrollo Estratégico y Socioeconómico del Concejo Municipal de Sumy. El Departamento realiza una serie de tareas vinculadas a la implementación directa del proyecto, tales como:\nproporcionar el análisis de los resultados de las actividades realizadas (resultados de los juegos transformacionales y reflexiones de los participantes después de las capacitaciones, lo que posteriormente asegurará una preparación rigurosa para la elaboración del Documento Analítico);\nplanificar los eventos (elaborar el calendario de actividades, conformar las combinaciones más óptimas de actividades para la mejor asimilación del material por parte de los participantes) y seleccionar a los participantes. El Departamento también facilita las instalaciones para las sesiones, capacitaciones y juegos transformacionales, a saber, la Oficina de Recuperación y Desarrollo. Después de cada evento, también se encarga de difundir la información en los recursos web para el público y de la posterior publicación del Documento Analítico para una audiencia más amplia de la comunidad."},"links":["https://www.facebook.com/pmo.smr"],"hasPhotos":true,"drive":"Check to see if both photos can be uploaded: https://drive.google.com/file/d/12sTbrzbRQks5G1lXQK5DMgl9uIlpNnZY/view?usp=sharing , https://drive.google.com/file/d/1IiS4QoZN6Nn8uBcRCgHE8xzPPGcGSMEs/view?usp=sharing","prod":{"material":"NO","files":"CARPETA VACÍA — no llegó ningún archivo","pieces":"Ninguno por ahora.","gap":"Carpeta vacía (\"Ukraine\"). Sugerencia: 2 fotos/publicaciones de la página de Facebook oficial (facebook.com/pmo.smr); la contacto Valeria Lyuta ya respondió."}},{"id":"c008","tier":"Spotlight","category":"Dialogue Builders","categorySource":"official","iso":"KE","lang":"English","region":{"en":"Africa","es":"África"},"country":{"en":"Kenya","es":"Kenia"},"type":{"en":"Social innovation organization","es":"Organización de innovación social"},"name":"From Portals to Conversations: Reimagining Public Communication Through Messaging","org":"Chat Nation","desc":{"en":"Chat Nation reimagines public communication by enabling governments to engage citizens through conversational interactions on WhatsApp and USSD platforms. Rather than requiring citizens to navigate complex digital portals, Chat Nation converts government language into plain two-way conversations accessible without smartphones or internet data. In partnership with Kenya Revenue Authority, Chat Nation has enabled over 200,000 citizen transactions per day via conversational interfaces, contributing to onboarding approximately 300,000 new taxpayers. The initiative demonstrates how messaging platforms can serve as primary government communication channels, particularly in low-connectivity and informal-sector environments across Africa.","es":"Chat Nation reinventa la comunicación pública al permitir que los gobiernos se relacionen con la ciudadanía mediante interacciones conversacionales en las plataformas WhatsApp y USSD. En lugar de exigir a la ciudadanía navegar por portales digitales complejos, Chat Nation convierte el lenguaje gubernamental en conversaciones bidireccionales sencillas, accesibles sin teléfonos inteligentes ni datos de internet. En alianza con la Kenya Revenue Authority, Chat Nation ha posibilitado más de 200.000 transacciones ciudadanas al día a través de interfaces conversacionales, contribuyendo a la incorporación de aproximadamente 300.000 nuevos contribuyentes. La iniciativa demuestra cómo las plataformas de mensajería pueden servir como canales primarios de comunicación gubernamental, particularmente en entornos de baja conectividad y del sector informal en África."},"details":{"en":"\"Chat Nation reimagines public communication by enabling governments to engage citizens through simple, conversational interactions on widely used messaging channels such as WhatsApp and USSD. The initiative transforms complex public policies, administrative procedures and service requirements into simplified, accessible, two-way conversations that people can understand and act on, without needing smartphones, data-intensive portals or digital literacy.\nThe core objective of Chat Nation is to strengthen inclusion, trust and participation in public service delivery by meeting people where they already are and communicating in ways that reflect their everyday realities. By converting technical government language into plain, conversational guidance, the initiative reduces friction between citizens and institutions while improving compliance, access and responsiveness.\nChat Nation primarily targets populations that are often excluded from traditional digital government systems, including informal sector workers, small businesses, women, youth, rural communities and low-connectivity users. At the same time, it supports public institutions, such as revenue authorities and government digital service teams, by providing a scalable, interoperable interface that complements existing systems rather than replacing them.\nThe initiative was developed in 2024 in response to persistent gaps observed in public communication and service access, particularly in contexts where digital transformation has relied heavily on portals and forms that unintentionally exclude large segments of society. Since its development, Chat Nation has been deployed in collaboration with public authorities and ecosystem partners to support policy implementation in areas such as registration, compliance and access to public services.\nKey stakeholders include public institutions responsible for policy implementation, technology and digital government teams, civil society and innovation partners and end users who interact directly with the platform through messaging channels. The initiative is designed to align with national digital transformation strategies and Digital Public Infrastructure (DPI) principles, ensuring interoperability, institutional ownership, data protection and sustainability.\nWhat makes Chat Nation innovative is its shift from broadcast-based public communication to dialogue-driven engagement at scale. Instead of requiring citizens to navigate complex systems, the system listens, responds and guides users step by step in real time. By combining human-centred design, conversational interfaces and low-bandwidth technology, Chat Nation demonstrates how public communication can become more inclusive, ethical and effective, strengthening governance while ensuring that no one is left behind.\"\"Chat Nation is a social innovation organization that works in close partnership with public institutions to strengthen how governments communicate with and serve citizens. The initiative is directly linked to public policy implementation by translating statutory requirements, administrative procedures and public service obligations into accessible, two-way conversational interactions delivered through widely used messaging channels such as WhatsApp and USSD.\nThe platform is deployed in collaboration with public authorities, including revenue administrations and government digital service teams, to support the execution of national policies related to taxation, registration, compliance and access to public services. By embedding public rules, guidance and service logic into conversational flows, Chat Nation operationalizes policy in ways that are understandable, inclusive and actionable for citizens, particularly those in informal, low-connectivity or underserved contexts.\nChat Nation aligns with government digital transformation strategies and Dig
